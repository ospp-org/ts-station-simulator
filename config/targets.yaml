targets:
  local:
    mqtt_url: "mqtt://localhost:1883"
    mqtt_tls: false
    csms_url: "http://localhost:8080"
    credentials:
      email: "admin@csms.local"
      password: "password"
  # The local stack over mTLS on 8883. `local` is plaintext 1883 and proves
  # nothing about TLS identity — the dev broker now runs verify_peer +
  # peer_cert_as_username like prod, so a proof that must exercise mTLS runs here.
  local-mtls:
    mqtt_url: "mqtts://localhost:8883"
    mqtt_tls: true
    csms_url: "http://localhost:8080"
    credentials:
      email: "admin@csms.local"
      password: "password"
    certs:
      key: "certs/local/{{stationId}}-key.pem"
      cert: "certs/local/{{stationId}}.pem"
      # The broker's server cert is issued by "OneStopPay MQTT CA", which is a
      # DIFFERENT anchor from the Station CA that signs client certs — and the
      # broker presents its leaf ALONE, no intermediate. So a client trusting only
      # the Root CA gets "unable to verify the first certificate". This bundle is
      # MQTT CA + Root CA. Named so a missing file is a missing FILE, not a silent
      # fallback to system roots.
      ca: "certs/local/broker-ca.pem"
      station_ca_chain: "certs/local/{{stationId}}-chain.pem"

  uat:
    mqtt_url: "mqtts://mqtt-uat.onestoppay.ro:8883"
    mqtt_tls: true
    csms_url: "https://api-uat.onestoppay.ro"
    credentials:
      email: "${UAT_EMAIL}"
      password: "${UAT_PASSWORD}"
    certs:
      key: "certs/uat/{{stationId}}-key.pem"
      cert: "certs/uat/{{stationId}}.pem"
      station_ca_chain: "certs/uat/{{stationId}}-chain.pem"
  sandbox:
    mqtt_url: "mqtts://csms-sandbox.ospp-standard.org:8883"
    mqtt_tls: true
    csms_url: "https://csms-sandbox.ospp-standard.org"
    credentials:
      email: "dev@ospp-standard.org"
      password: "password"
    mqtt_credentials:
      username_template: "sandbox_stn_{{stationIdHex}}"
      password_template: "sim-{{stationId}}"
    certs:
      key: "certs/sandbox/{{stationId}}-key.pem"
      cert: "certs/sandbox/{{stationId}}.pem"
      ca: "certs/sandbox/ca.pem"
      # Present the full chain, not the leaf alone (CONS-133). ConnectMqttStep
      # fs.access-checks this and falls back to leaf-only if the file is absent,
      # so naming it here is safe before the chain files are written — and the
      # naming is what makes writing them the obvious next step rather than a
      # thing nobody notices is missing.
      station_ca_chain: "certs/sandbox/{{stationId}}-chain.pem"
    station_pool:
      - stn_00000001
      - stn_00000002
      - stn_00000003
      - stn_00000004
      - stn_00000005
      - stn_00000006
      - stn_00000007
      - stn_00000008
      - stn_00000009
      - stn_0000000a
      - stn_0000000b
      - stn_0000000c
      - stn_0000000d
      - stn_0000000e
      - stn_0000000f
      - stn_00000010
      - stn_00000011
      - stn_00000012
      - stn_00000013
      - stn_00000014
      - stn_00000015
      - stn_00000016
      - stn_00000017
      - stn_00000018
      - stn_00000019
      - stn_0000001a
      - stn_0000001b
      - stn_0000001c
  sandbox-gm:
    mqtt_url: "mqtts://csms-sandbox.ospp-standard.org:8883"
    mqtt_tls: true
    csms_url: "https://csms-sandbox.ospp-standard.org"
    credentials:
      email: "${SANDBOX_GM_EMAIL}"
      password: "${SANDBOX_GM_PASSWORD}"
    mqtt_credentials:
      username_template: "${SANDBOX_GM_MQTT_USER}"
      password_template: "${SANDBOX_GM_MQTT_PASS}"
    certs:
      key: "certs/sandbox-gm/{{stationId}}-key.pem"
      cert: "certs/sandbox-gm/{{stationId}}.pem"
      # See the sandbox target: named so a leaf-only presentation is a missing
      # FILE rather than a missing line nobody looks for.
      station_ca_chain: "certs/sandbox-gm/{{stationId}}-chain.pem"
    station_pool:
      - stn_00000021
