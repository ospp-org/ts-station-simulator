name: "Disconnect During Boot"
description: "Disconnect immediately after sending BootNotification, before receiving a response. Tests server handling of incomplete boot handshake."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Send boot and immediately disconnect ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: delay
    ms: 100

  # --- Disconnect before response arrives ---
  - action: fault
    type: disconnect

  - action: delay
    ms: 1500

  # THE ASSERTION — and this file was not a ceiling either.
  # The claim is that the server handles an incomplete boot handshake: the station
  # publishes BootNotification and drops the link before the Response can reach
  # it. What that must NOT do is lose the boot — the server processed a valid
  # message, and the station's failure to hear the answer is not the server's
  # business.
  #
  # data.bootReason proves it committed. On a fresh pool station the column starts
  # NULL — this file sends exactly ONE BootNotification and no other scenario has
  # touched the station — so reading `PowerOn` cannot be inherited from an earlier
  # boot and cannot be satisfied by the initial state. Before this the file
  # disconnected mid-handshake and asserted nothing at all about the outcome.
  #
  # The api_call is plain HTTP and is unaffected by the MQTT link being gone.
  #
  # NOT asserted: data.isOnline. The station is deliberately disconnected here, so
  # its value depends on whether the broker published the Last Will and whether
  # the server consumed it in time — the same race connection-lost-lwt.yaml
  # measured and could not close. Asserting it would import that flakiness into a
  # file about something else.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bootReason: "PowerOn"
