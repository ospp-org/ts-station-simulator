name: "Malformed Messages"
description: "Send messages with minimal and unusual payloads to test server robustness against edge-case message formats."
# NO SERVER-STATE ASSERTION IS POSSIBLE — THE OBSERVABLE IS THE DLQ, AND THE DLQ
# HAS NO SURFACE. Established 2026-08-10 rather than assumed.
#
# This file publishes deliberately schema-invalid frames (its sends carry
# expect_invalid: true). The server rejects them at validation and routes them to
# the dead-letter queue — which is the correct behaviour and the whole subject.
#
# Where that is observable, and where it is not:
#   - No REST route reads the DLQ. There is no admin endpoint for it.
#   - No Prometheus metric either. /metrics was swept for a dlq series on
#     2026-08-10 and carries none, so expect_body_text does not reach it despite
#     unlocking /metrics generally.
#   - Nothing comes back on the wire: a rejected EVENT is answered with silence.
#
# So the DLQ depth this file moves can only be read by querying the queue out of
# band — which is how the +2 it contributes to a full run has always been
# attributed. This file is also WHY that residue accumulates, and that is by
# design, not a leak to fix.
#
# Closing it needs a DLQ surface (a metric or an admin read), not a scenario edit.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    # Aligned with global default bump (5s → 15s, commit 9e57ce2). Sprint B2
    # timeout sweep — sister scenario from Sprint B P5.1/P5.11 fix (commit
    # 3fdc7a6). UAT first-round-trip can exceed 5s.
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Minimal valid StatusNotification (only bayId + status) ---
  # Deliberately omits required `bayNumber`/`services` — probes server
  # robustness against an edge-case payload shape, not a schema-conformant
  # one. expect_invalid: true tells PayloadSchemaCheck to skip validation
  # for this step (the malformedness IS the test).
  - action: send
    message: StatusNotification
    messageType: Event
    expect_invalid: true
    payload:
      bayId: "{{bayId_1}}"
      status: "Available"

  - action: delay
    ms: 500

  # --- StatusNotification with empty services array ---
  # Deliberately violates `services` minItems:1 — same intent as above.
  - action: send
    message: StatusNotification
    messageType: Event
    expect_invalid: true
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      services: []
