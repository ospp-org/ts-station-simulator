name: "Malformed Messages"
description: "Send messages with minimal and unusual payloads to test server robustness against edge-case message formats."
# NO SERVER-STATE ASSERTION IS POSSIBLE — THE OBSERVABLE IS THE DLQ, AND THE DLQ
# HAS NO SURFACE. Established 2026-08-10 rather than assumed.
#
# This file publishes deliberately schema-invalid frames (its sends carry
# expect_invalid: true). The server rejects them at validation and routes them to
# the dead-letter queue — which is the correct behaviour and the whole subject.
#
# Where that is observable, and where it is not — RE-MEASURED 2026-08-11, and the
# reason recorded here on 2026-08-10 was WRONG:
#   - No REST route reads the DLQ. Still true: routes/ carries the four
#     mqtt:dlq:* artisan commands' backing class (App\Shared\Protocol\
#     DeadLetterQueue, which already has all()/at()/count()) and no HTTP route.
#   - "No Prometheus metric either" was FALSE. UAT /metrics carries three DLQ
#     series right now — csms_mqtt_queue_depth{queue="dlq"}, and
#     csms_mqtt_worker_processed_total{outcome="dlq"} / {outcome="hard_fail"}.
#     The gauge is set by MqttConsume.php:503 on the worker's poll cadence. The
#     earlier sweep concluded absence; the series were there to be found.
#   - Nothing comes back on the wire: a rejected EVENT is answered with silence.
#
# THE CEILING STANDS, FOR A DIFFERENT REASON, and this is the one that matters:
# all three series are FLEET-WIDE CUMULATIVE with no station or run dimension.
# `csms_mqtt_queue_depth{queue="dlq"} 25` is every dead letter the deployment has
# accumulated since the last purge, from every station and every concurrent run.
# A scenario asserting it is non-zero asserts something that was already true
# before the scenario started — an assertion that cannot fail, which is what this
# file exists to avoid. expect_body_text matches substrings; it cannot capture a
# number, subtract, or compare across two scrapes, so there is no delta form
# either.
#
# So the DLQ movement this file causes can still only be attributed out of band —
# which is how the +2 it contributes to a full run has always been accounted. This
# file is also WHY that residue accumulates, and that is by design, not a leak to
# fix (docs/DLQ-INVENTORY-20260810.md in csms-server: the records are evidence
# for four defects and are explicitly not to be drained).
#
# Closing it needs a DLQ read SCOPED TO A STATION — the dead-letter wrapper
# already carries envelope.stationId, so the filter exists in the data. A wider
# metric does not close it; a narrower read does.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    # Aligned with global default bump (5s → 15s, commit 9e57ce2). Sprint B2
    # timeout sweep — sister scenario from Sprint B P5.1/P5.11 fix (commit
    # 3fdc7a6). UAT first-round-trip can exceed 5s.
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Minimal valid StatusNotification (only bayId + status) ---
  # Deliberately omits required `bayNumber`/`services` — probes server
  # robustness against an edge-case payload shape, not a schema-conformant
  # one. expect_invalid: true tells PayloadSchemaCheck to skip validation
  # for this step (the malformedness IS the test).
  - action: send
    message: StatusNotification
    messageType: Event
    expect_invalid: true
    payload:
      bayId: "{{bayId_1}}"
      status: "Available"

  - action: delay
    ms: 500

  # --- StatusNotification with empty services array ---
  # Deliberately violates `services` minItems:1 — same intent as above.
  - action: send
    message: StatusNotification
    messageType: Event
    expect_invalid: true
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      services: []
