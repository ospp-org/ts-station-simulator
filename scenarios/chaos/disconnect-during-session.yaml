name: "Disconnect During Session"
description: >
  Disconnect in the middle of an active session: losing the MQTT link ends nothing, so the
  session reads ACTIVE while the station is away. The station then does what a conforming
  station does after a blip - reconnects, boots again with `Reconnect` and its uptime running
  on (a reboot ends nothing either) - and ends the wash with its own SessionEnded, which
  settles it. Until 2026-10-13 the file stopped at the disconnect and left the session open;
  under the session-end rule only the sweep would ever close such a session, holding the bay
  for the next scenario on this station.
# THE SESSION-END RULE (2026-10-13). A session is ended only by the station's end record; a
# disconnection, the will it publishes and the reconnect boot are none of them, and the
# server's only fallback is the sweep (booked end + 60 s, plus the grace period while the
# station is away). Under the corpus default `clean_session: true` the reconnect publishes
# the will (MqttConnection's LIVE_RECONNECT_PERIOD_MS docblock), so the server marks the
# station offline and discards its session key: the station has to boot again before
# anything it signs is accepted (connection-lost.md §6 step 1), and only then can it send
# the SessionEnded.
#
# WHAT THE ASSERTIONS ATTRIBUTE. `active` after the disconnect and again after the reconnect
# boot: neither ended the session. `completed` after the SessionEnded: the station's record
# did. Under the session-end rule nothing else could have, short of the sweep, which a 300 s
# booking keeps minutes away.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # --- Trigger StartService via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 201

  # --- Wait for StartService from server ---
  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"
      serviceId: "payload.serviceId"

  # --- Accept StartService ---
  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  # --- StatusNotification Occupied ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  # --- Simulate mid-session activity ---
  - action: delay
    ms: 2000

  # --- Disconnect abruptly mid-session ---
  - action: fault
    type: disconnect

  - action: delay
    ms: 1000

  # THE FIRST ASSERTION — the session survived the loss of the link. data.status active
  # is server-derived: losing the MQTT link must NOT terminate a running session — the
  # wash is still running on real hardware, and only the station's end record may end it.
  # If this ever reads `failed` or `completed`, the server ended a session on a
  # disconnection, which the session-end rule forbids.
  #
  # The api_call is plain HTTP and is unaffected by the disconnect.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"

  # --- The link comes back on the client's own reconnect, and the station boots again:
  #     `Reconnect`, because the firmware did not restart, with the uptime running on from
  #     the first boot (boot-notification.md §5.2 rule 1). ---
  - action: wait_for_connect
    timeout_ms: 20000

  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 10
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "Reconnect"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # The post-boot report: the wash ran on through the blip, so the bay is still Occupied.
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      programs:
        - programNumber: 1
          available: false

  - action: delay
    ms: 1500

  # The reconnect boot ended nothing either.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"

  # --- THE END RECORD. The customer stops the wash at the bay: SessionEnded `Local`, with
  #     the seconds it ran. It, and nothing before it, ends the session. ---
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "Local"
      actualDurationSeconds: 12
      creditsCharged: 20

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true

  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "completed"
