name: "Out-of-Order Messages"
description: "Send messages in unexpected order - orphaned MeterValues and SessionEnded for a nonexistent session. Tests server resilience to protocol violations."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 5000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Orphaned MeterValues (no active session) ---
  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      sessionId: "sess_deadbeef"
      timestamp: "2026-03-22T10:00:00.000Z"
      values:
        liquidMl: 100

  - action: delay
    ms: 500

  # --- SessionEnded for nonexistent session ---
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "sess_deadbeef"
      bayId: "{{bayId_1}}"
      reason: "TimerExpired"
      actualDurationSeconds: 60
      creditsCharged: 100

  - action: delay
    ms: 1000

  # THE ASSERTION — and this file was not a ceiling, though it looked like one.
  # The claim is that the server is resilient to protocol violations: an orphaned
  # MeterValues and a SessionEnded for a session that never existed. "Resilient"
  # was previously proven only by the run not crashing, which is indistinguishable
  # from the messages never having been published.
  #
  # The observable is the session that MUST NOT have been created. sess_deadbeef
  # is the id those orphaned Events name; a server that auto-created a row on an
  # unknown sessionId — the actual failure mode a protocol-violation test is for —
  # would leave it fetchable. 404 with ospp_code 3006 SESSION_NOT_FOUND says it
  # did not.
  #
  # Note this is the inverse of the usual read-back: the proof is that a specific
  # id resolves to NOTHING, and it works because the id is a fixed literal the
  # scenario chose rather than a server-generated one. A fixed id is safe HERE
  # precisely because nothing must ever create it — the opposite of the offline
  # transaction ids, where a literal poisons itself on first use.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/sess_deadbeef"
    expect_status: 404
    expect_body:
      errorCode: 3006
