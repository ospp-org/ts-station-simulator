name: "Slow Responses"
description: >
  A station that takes ~3.5s to answer StartService is still served: the server holds the
  pending command, accepts the late Response, and the session reaches `active`.
  The slowness is produced by explicit `action: delay` steps before each Response — NOT by
  `behavior.response_delay_ms`, which is inert. That field's only reader is
  src/auto-responder/AutoResponder.ts, which has zero production importers, and scenario mode
  registers no auto-responder at all (ScenarioRunner.ts:766-769, BootNotificationHandler with
  autoReact=false); SendStep publishes immediately (SendStep.ts:368). Until 2026-08-10 this
  file rested on that field and therefore measured an ordinary round-trip while claiming to
  test a slow station. It is left declared below only because every scenario declares it.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [3000, 5000]
steps:
  # --- Boot with slow behavior ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay Available (required so api_call doesn't 409 BAY_NOT_READY) ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  - action: delay
    ms: 500

  # --- Trigger StartService via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 201

  # --- Wait for StartService. NOTE: no delay is applied — see the KNOWN GAP in the
  # description. `response_delay_ms` is dead config; this Response is immediate. ---
  # Per C-017: response_delay_ms [3000, 5000] applies to multiple round-trips;
  # bump timeout to 30s to absorb chaos-induced latency.
  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 30000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"
      serviceId: "payload.serviceId"

  # --- THE SLOW RESPONSE. 3.5s sits inside the [3000,5000] band this file always claimed
  #     to apply, and is produced by a step rather than by inert config. ---
  - action: delay
    ms: 3500

  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  # --- THE ASSERTION, server-produced. If the server had timed out the pending StartService
  #     or refused the late Response, the session would not be `active`. Reading it back off
  #     GET /sessions/{id} is what makes the delay above load-bearing: remove the delay and
  #     this still passes, but remove the SERVER's tolerance and it does not. ---
  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"

  # --- Pool-hygiene teardown: end the session this scenario started so the reused
  #     pooled station is returned clean. Appended after all assertions — does not
  #     change what the scenario tests. (Class: session-leak.)
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "Local"
      actualDurationSeconds: 1
      creditsCharged: 0
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
