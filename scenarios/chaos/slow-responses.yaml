name: "Slow Responses"
description: >
  KNOWN GAP — does NOT currently test what its name says. `behavior.response_delay_ms`
  is inert: its only reader is src/auto-responder/AutoResponder.ts:20,26, which has zero
  production importers (scenario mode registers only BootNotificationHandler, autoReact=false,
  ScenarioRunner.ts:766-769). SendStep.execute publishes immediately (SendStep.ts:368), so every
  Response below goes out in ~0ms and the server never sees a slow station. What this file
  actually exercises is an ordinary round-trip. To make it real the delays must be explicit
  `action: delay` steps BEFORE each Response send. Not done here because it needs a wire run
  to confirm the server-side timeout it is supposed to probe.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [3000, 5000]
steps:
  # --- Boot with slow behavior ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay Available (required so api_call doesn't 409 BAY_NOT_READY) ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  - action: delay
    ms: 500

  # --- Trigger StartService via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 201

  # --- Wait for StartService. NOTE: no delay is applied — see the KNOWN GAP in the
  # description. `response_delay_ms` is dead config; this Response is immediate. ---
  # Per C-017: response_delay_ms [3000, 5000] applies to multiple round-trips;
  # bump timeout to 30s to absorb chaos-induced latency.
  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 30000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"
      serviceId: "payload.serviceId"

  # --- Accept StartService. NOT delayed (response_delay_ms is inert — see description). ---
  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  # --- Pool-hygiene teardown: end the session this scenario started so the reused
  #     pooled station is returned clean. Appended after all assertions — does not
  #     change what the scenario tests. (Class: session-leak.)
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "Local"
      actualDurationSeconds: 1
      creditsCharged: 0
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
