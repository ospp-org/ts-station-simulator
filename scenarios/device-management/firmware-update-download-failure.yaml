# WHAT DISTINGUISHES THIS FILE FROM ITS SIBLINGS — measured on the wire 2026-08-10
#   The three firmware-update files asserted the same two things (boot Accepted, POST 202)
#   and nothing about the outcome. Each now reads the server's own record back off
#   GET /api/v1/admin/stations/{stationId}/firmware, which is a COLLECTION — hence the
#   [firmware_version=2.0.0] selector rather than an index (data.bays taught that lesson).
#
#   MEASURED, all three on fresh single-station pools:
#     success           status "rebooting"  error_text null   completed_at unset
#     download-failure  status "failed"     error_text "Download failed: network error"
#     install-failure   status "failed"     error_text "Installation failed: checksum mismatch"
#
#   `status` is genuinely SERVER-DERIVED and separates success from failure: the station
#   reports "Installed" and the handler stores REBOOTING
#   (FirmwareStatusNotificationHandler.php:147), so asserting "rebooting" pins a
#   transformation the server performs rather than a value it was handed.
#
#   THE TWO FAILURE VARIANTS ARE NOT SEPARATED BY ANY SERVER-DERIVED VALUE, and that is
#   recorded rather than papered over. FirmwareUpdateStatus has ONE failure state — `failed`
#   (vendor/ospp/protocol/src/Enums/FirmwareUpdateStatus.php:18); there is no DownloadFailed
#   vs InstallationFailed. Measured, download-failure and install-failure agree on status,
#   progress AND completed_at. The only difference is `error_text`, which is ECHOED from the
#   station's own payload (`$updates['error_text'] = $errorText ?? 'Unknown error'`, :135).
#   Asserting it proves the report round-tripped and persisted — real, but persistence, not
#   server judgement. It is the same category as the security-event severity assertions.
name: "Firmware Update Download Failure"
description: "Firmware update fails during download phase due to network error"
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/firmware"
    body:
      firmwareUrl: "https://cdn.example.com/firmware/v2.0.0.bin"
      firmwareVersion: "2.0.0"
      checksum: "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      signature: "MEUCIQDexample"
    expect_status: 202

  - action: wait_for
    message: UpdateFirmware
    messageType: Request
    timeout_ms: 15000
    capture:
      firmwareVersion: "payload.firmwareVersion"

  - action: send
    message: UpdateFirmware
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: FirmwareStatusNotification
    messageType: Event
    payload:
      status: "Downloading"
      firmwareVersion: "{{captured.firmwareVersion}}"
      progress: 0

  - action: delay
    ms: 500

  - action: send
    message: FirmwareStatusNotification
    messageType: Event
    payload:
      status: "Failed"
      firmwareVersion: "{{captured.firmwareVersion}}"
      errorText: "Download failed: network error"

  # THE ASSERTION — the server's own firmware record, not the notifications this file sent.
  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/firmware"
    expect_status: 200
    expect_body:
      data[firmware_version=2.0.0].status: "failed"
      data[firmware_version=2.0.0].error_text: "Download failed: network error"
