# WHAT DISTINGUISHES THIS FILE FROM ITS SIBLINGS — measured on the wire 2026-08-10
#   The three firmware-update files asserted the same two things (boot Accepted, POST 202)
#   and nothing about the outcome. Each now reads the server's own record back off
#   GET /api/v1/admin/stations/{stationId}/firmware, which is a COLLECTION — hence the
#   [firmware_version=2.0.0] selector rather than an index (data.bays taught that lesson).
#
#   MEASURED, all three on fresh single-station pools:
#     success           status "rebooting"  error_text null   completed_at unset
#     download-failure  status "failed"     error_text "Download failed: network error"
#     install-failure   status "failed"     error_text "Installation failed: checksum mismatch"
#
#   `status` is genuinely SERVER-DERIVED and separates success from failure: the station
#   reports "Installed" and the handler stores REBOOTING
#   (FirmwareStatusNotificationHandler.php:147), so asserting "rebooting" pins a
#   transformation the server performs rather than a value it was handed.
#
#   THE TWO FAILURE VARIANTS ARE NOT SEPARATED BY ANY SERVER-DERIVED VALUE, and that is
#   recorded rather than papered over. FirmwareUpdateStatus has ONE failure state — `failed`
#   (vendor/ospp/protocol/src/Enums/FirmwareUpdateStatus.php:18); there is no DownloadFailed
#   vs InstallationFailed. Measured, download-failure and install-failure agree on status,
#   progress AND completed_at. The only difference is `error_text`, which is ECHOED from the
#   station's own payload (`$updates['error_text'] = $errorText ?? 'Unknown error'`, :135).
#   Asserting it proves the report round-tripped and persisted — real, but persistence, not
#   server judgement. It is the same category as the security-event severity assertions.
#
# RE-MEASURED 2026-08-17 against csms-server 9896108, and the paragraph above SURVIVES —
# which is the opposite of what the intervening commits made it look like.
#
#   csms-server 0fd0150 added a `failure_reason` column precisely to end the era where
#   every firmware failure looked identical, and the enum behind it now carries EIGHT
#   causes (app/Shared/Enums/FirmwareFailureReason.php; its own docblock still says
#   "seven" and is wrong — FirmwareFailureReasonTest.php:334-353 asserts eight and names
#   `unexpected_version` as the extra). Six of those eight are separable on the wire and
#   now have a scenario each in this directory.
#
#   THIS PAIR IS NOT AMONG THEM. Anything a station reports as `Failed` on a
#   FirmwareStatusNotification is written `reported_by_station` by ONE line —
#   FirmwareStatusNotificationHandler.php:133-144 — regardless of which phase it was in.
#   So download-failure, install-failure AND the new firmware-signature-invalid.yaml all
#   land the same status AND the same failure_reason. The new column separates the SERVER's
#   judgements from each other (stalled / command_timeout / rollback_detected /
#   unexpected_version / superseded / rejected_by_station); it does not, and was never
#   built to, separate the station's own account of itself into phases.
#
#   `failure_reason` is asserted below anyway. Not because it discriminates within this
#   pair, but because it discriminates against the six that are NOT this: a row that
#   reached `failed` by a stall, a reboot sweep or a supersede carries a different token,
#   and those are exactly the confusions the column was added to end. It is the assertion
#   that stops this file passing on the wrong failure.
#
#   WHAT WOULD ACTUALLY SEPARATE THE PAIR, since it is worth naming rather than shrugging
#   at: nothing on this row, because the row holds current state and no history. The phase
#   at which a station failed is only recoverable from the notification SEQUENCE, and the
#   server keeps no per-update event log. The one place a phase distinction does survive is
#   firmware-signature-invalid.yaml — not through the firmware row at all, but through the
#   FirmwareIntegrityFailure SecurityEvent the spec requires alongside it, which is a
#   separate table this file has no equivalent of.
# ── THE CEILING: EVERY FIRMWARE FAILURE HERE IS REPORTED, NEVER DISCOVERED ─────────────────
# This file's description claimed a download that failed "due to network error". Read as a
# claim about the STATION it is false, and it was read that way (audit A1-133). Each phase
# below is a `send` step this file scripts.
# Nothing in this repo fetches an image, computes a hash, verifies an ECDSA image signature,
# or writes a partition — and the ceiling is STRUCTURAL, in two independent places:
#
#   1. `src/handlers/UpdateFirmwareHandler.ts`, the only code that could stage anything,
#      imports `@ospp/protocol` and `./Handler.js` and nothing else — zero `fetch`, zero
#      `node:fs`, zero `node:crypto`. It answers Accepted and emits the four phases off a
#      `setTimeout(1000)` loop. 1 of the 20 handlers imports any I/O at all and it is
#      TriggerMessageHandler, not this one.
#   2. THAT HANDLER IS NOT IN THIS LOOP EITHER, which is the half A1-133 named the wrong site
#      for. Scenario mode registers exactly ONE handler — `BootNotificationHandler(false)`,
#      for the sessionKey (`ScenarioRunner.ts:1226-1241`) — against the 20 the interactive
#      `connect` command registers (`cli/index.ts:848`). Even the timer is absent here.
#
# WHAT IS STILL PROVEN is on the SERVER side and is worth the file: that the command reaches
# the wire, that the reports round-trip, and that the row the server derives from them says
# what it should. `FirmwareIntegrityCeiling.test.ts` pins both facts above, so this note goes
# RED if it ever becomes an understatement.
#
name: "Firmware Update Download Failure"
description: "The station REPORTS Failed at progress 45 and the server records `failed` + `reported_by_station`, echoing the station's own error_text. No download is attempted — 'network error' is a string this file sends."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/firmware"
    body:
      firmwareUrl: "https://cdn.example.com/firmware/v2.0.0.bin"
      firmwareVersion: "2.0.0"
      checksum: "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      signature: "MEUCIQDexample"
    expect_status: 202

  - action: wait_for
    message: UpdateFirmware
    messageType: Request
    timeout_ms: 15000
    capture:
      firmwareVersion: "payload.firmwareVersion"

  - action: send
    message: UpdateFirmware
    messageType: Response
    payload:
      status: "Accepted"

  # PROGRESS CADENCE — added 2026-08-17. This file used to send exactly one
  # `Downloading` with `progress: 0` and then fail, which satisfies the MUST
  # (one notification per transition, firmware-status.md §6 rule 1) and none of
  # the SHOULD (a mark every 10%, :39). It also never entered the handler's
  # progress-only short-circuit (FirmwareStatusNotificationHandler.php:93-107),
  # which fires only when the mapped status EQUALS the row's current status — so
  # a download that reported once exercised a different code path from every real
  # one. The marks below make the failure land mid-transfer, which is what a
  # network error actually looks like.
  - action: send
    message: FirmwareStatusNotification
    messageType: Event
    payload:
      status: "Downloading"
      firmwareVersion: "{{captured.firmwareVersion}}"
      progress: 0
  - action: delay
    ms: 300
  - action: send
    message: FirmwareStatusNotification
    messageType: Event
    payload:
      status: "Downloading"
      firmwareVersion: "{{captured.firmwareVersion}}"
      progress: 20
  - action: delay
    ms: 300
  # 45, matching the spec's own worked failure form (firmware-status.md:44-65:
  # "Downloading (45%) -> Failed (errorText: ...)"). Not a round 10% mark on
  # purpose: a transfer dies where it dies, and the 10% rule is a reporting
  # cadence, not a grid the failure has to land on.
  - action: send
    message: FirmwareStatusNotification
    messageType: Event
    payload:
      status: "Downloading"
      firmwareVersion: "{{captured.firmwareVersion}}"
      progress: 45

  - action: delay
    ms: 500

  # `progress` OMITTED on Failed — firmware-status.md:41 requires it omitted or 0.
  # Omitting also leaves the row holding 45, which is what the read below pins.
  - action: send
    message: FirmwareStatusNotification
    messageType: Event
    payload:
      status: "Failed"
      firmwareVersion: "{{captured.firmwareVersion}}"
      errorText: "Download failed: network error"

  # THE ASSERTION — the server's own firmware record, not the notifications this file sent.
  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/firmware"
    expect_status: 200
    expect_body:
      data[firmware_version=2.0.0].status: "failed"
      data[firmware_version=2.0.0].error_text: "Download failed: network error"
      # Added 2026-08-17. Shared with install-failure and signature-invalid — see
      # the header for why that is correct rather than a gap, and for what it
      # DOES rule out.
      data[firmware_version=2.0.0].failure_reason: "reported_by_station"
      # The row still holds where the transfer died. Echoed rather than derived,
      # but it is the one field that says this failure happened mid-download and
      # not before a byte moved: the rejected-by-station sibling asserts 0 here
      # for exactly that contrast.
      data[firmware_version=2.0.0].progress: 45
