# WHAT DISTINGUISHES THIS FILE FROM ITS SIBLINGS — nothing, and that is a SERVER DEFECT
#   change-configuration-{accepted,reboot-required,rejected} send the SAME key and value and
#   differ only in the status the station reports. On the server that difference is currently
#   inert, so no observable separates the three. Marked rather than dressed up.
#
#   THE DEFECT (csms-server, reported not fixed — outside this repo):
#     ChangeConfigurationHandler.php:43-47 reads the response as
#         $status = $envelope->payload['status'] ?? ChangeConfigResultStatus::REJECTED->value;
#         $errorCode = $envelope->payload['errorCode'] ?? null;
#         $errorText = $envelope->payload['errorText'] ?? null;
#     but mqtt/change-configuration-response.schema.json is
#         required: ['results'], properties: ['results'], additionalProperties: FALSE
#     — a top-level `status` is schema-FORBIDDEN. So on any schema-valid response the read
#     misses, $status defaults to REJECTED, and handleAccepted() — the branch that does
#     StationConfiguration::updateOrCreate and dispatches ConfigurationChanged — is
#     UNREACHABLE. The per-key results[] array the station actually sends is never read.
#
#   MEASURED 2026-08-10, which is how this was found rather than assumed: after
#   change-configuration-accepted ran green against UAT, station_configurations for that
#   station held ZERO rows — identical to the rejected variant. Had the accepted branch
#   worked, the read-back would also have distinguished accepted from reboot-required:
#   handleAccepted stores mutability 'static' for RebootRequired and 'dynamic' otherwise
#   (:128), and StationConfigurationResource exposes `mutability`.
#
#   WHEN THE SERVER IS FIXED, the assertion to add here is
#     GET /api/v1/admin/stations/{{stationId}}/config
#     accepted        -> data[key=HeartbeatIntervalSeconds].value "30", mutability "dynamic"
#     reboot-required -> same value, mutability "static"
#     rejected        -> the key absent (no row is ever written on a rejection)
#
# WHAT IS ASSERTED BELOW, and it is real: the server pushed the key and value the REST call
#   asked for. That is server-resolved and on the wire — it fails if the request/push
#   translation breaks — but it is identical in all three files and does NOT separate them.
#   payload.keys has exactly one element here because the PUT sends one key, so index 0 is
#   deterministic (unlike data.bays, which is unordered — see maintenance-mode-on.yaml).
name: "Change Configuration Accepted"
description: "Change a configuration key and receive Accepted status"
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: api_call
    method: PUT
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/config"
    body:
      key: "HeartbeatIntervalSeconds"
      value: "30"
    expect_status: 202

  - action: wait_for
    message: ChangeConfiguration
    messageType: Request
    timeout_ms: 15000

  # The pushed Request carries what the REST call asked for.
  - action: assert
    field: "payload.keys.0.key"
    equals: "HeartbeatIntervalSeconds"

  - action: assert
    field: "payload.keys.0.value"
    equals: "30"

  - action: send
    message: ChangeConfiguration
    messageType: Response
    payload:
      results:
        - key: "HeartbeatIntervalSeconds"
          status: "Accepted"

  # THE DISCRIMINATOR — the server's own persisted record, not the response this file sent.
  # Live since csms-server fixed ChangeConfigurationHandler to read results[] (2026-08-10).
  # `mutability: dynamic` is what separates this file from change-configuration-reboot-required,
  # which sends the identical key and value and differs only in the status reported.
  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/config"
    expect_status: 200
    expect_body:
      data[key=HeartbeatIntervalSeconds].value: "30"
      data[key=HeartbeatIntervalSeconds].mutability: "dynamic"
