name: "Firmware Update — Device Management Not Declared (6008 pre-empt, wouldBe 2007)"
description: >
  OBSERVATION INSTRUMENT (not RED-first). A station boots advertising
  deviceManagementSupported:false. When the operator triggers UpdateFirmware via the
  admin REST API, csms pre-flight check 3 (InitiateFirmwareUpdateAction.php:86-95) rejects
  the request SERVER-SIDE before any MQTT command is dispatched, returning HTTP 409 to the
  OPERATOR (server->operator). Nothing reaches the station on the wire.
  CORRECTED 2026-08-13 — the file's SECOND correction, and the first is what makes this one
  legible. It once claimed 6008 in prose beside an unasserted capture; measured on UAT
  2026-08-10 the server answered 2007 COMMAND_NOT_SUPPORTED, and that was pinned by
  expect_body. Measured again 2026-08-13 the server answers 6008 — which does NOT vindicate
  the original comment. That comment read 6008 as CAPABILITY_NOT_SUPPORTED, a name the spec
  does not carry. Today's 6008 is COMMAND_PRE_EMPTED, the code for a command the SERVER
  stopped locally: 07-errors.md:456 makes it a MUST here and forbids the server to answer
  with the station's own code instead. The 2007 was not withdrawn — it moved into
  details.wouldBe, which is where this file now asserts it.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # 1. Boot DECLARING deviceManagementSupported:false (see the payload below) — csms
  #    persists device_management_supported=false.
  #    The distinction is load-bearing and is NOT "boot without the capability":
  #    OSPP §5.1 rule 2 leaves an UNSTATED capability out of the update entirely, so a
  #    previously declared `true` would SURVIVE an omitting boot
  #    (BootNotificationHandler.php:184-190). On a shared pool station where a sibling
  #    scenario declared true, omitting would leave the gate OPEN and the command would
  #    dispatch — this file would then fail expecting its 422. Declaring false explicitly
  #    is what makes it deterministic regardless of what ran on the station before.
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        deviceManagementSupported: false   # <-- station does NOT support device management
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # 2. Operator triggers UpdateFirmware via admin REST API.
  #    Pre-flight checks: 1 exists (pass), 2 online (pass — just booted), 3 capability
  #    (FAIL: device_management_supported is not `true`) -> throw COMMAND_PRE_EMPTED.
  #    Global OsppException render handler -> HTTP 409 JSON. Measured verbatim on UAT
  #    2026-08-13, csms-server 32b7c6a:
  #      {"error":{"code":"COMMAND_PRE_EMPTED","ospp_code":6008,
  #                "message":"Station does not support device management",
  #                "details":{"wouldBe":2007,"reason":"device_management_not_declared"}},
  #       "meta":{"timestamp":"2026-08-13T04:29:44.335995Z"}}
  #    The MQTT sendCommand (InitiateFirmwareUpdateAction.php:186) is NEVER reached.
  #
  #    NOT `=== false`: the column is nullable and NULL is "not stated", which the gate
  #    also withholds on (:86). This boot declares false explicitly anyway — see step 1.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/firmware"
    body:
      firmwareUrl: "https://cdn.example.com/firmware/v2.0.0.bin"
      firmwareVersion: "2.0.0"
      checksum: "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      signature: "MEUCIQDexample"
    expect_status: 409                     # <-- the operator-facing pre-flight rejection (NOT 202)
    # WHY THREE ASSERTED KEYS AND NOT ONE.
    #
    # 409 alone proves nothing. It is the status for every pre-empt on this API,
    # and it is not even the status this step used to expect — the route answered
    # 422 until the pre-empt landed, so a file pinning only the status would have
    # gone red for a reason that says nothing about the gate.
    #
    # 6008 alone is barely better. COMMAND_PRE_EMPTED is the code for ANY command
    # the server stopped locally, so it names the CLASS of refusal and never the
    # gate that produced it — see the sibling reset-graceful-refused file, where
    # ONE action emits 6008 from two different pre-flights.
    #
    # `details.wouldBe` is the discriminator. It carries the code the STATION would
    # have answered had the command been dispatched: 2007, the blanket-implicit
    # Server->Station code for an action this firmware does not implement. It is
    # also the field with operational meaning the class code cannot carry — 2007 is
    # a refusal no operator can force past, because nothing about the request is
    # what the server objects to.
    #
    # `details.reason` pins which gate. Seven of the eight 6008 sites across the
    # DeviceManagement actions share this token, so it does not identify the route;
    # what it separates is the capability gate from the OTHER pre-flights on the
    # same action, which is what a reordering would silently change.
    #
    # And asserting inside `details` at all is not decorative bookkeeping: an
    # earlier measurement recorded `details` as DROPPED by this REST error shape.
    # These two scenarios are what proved it now reaches the client — they failed
    # in the proving, which is how the carrier got observed at all.
    expect_body:
      error.ospp_code: 6008
      error.details.wouldBe: 2007
      error.details.reason: "device_management_not_declared"
    capture:
      ospp_code: "error.ospp_code"
      error_code: "error.code"             # COMMAND_PRE_EMPTED (measured)
      would_be: "error.details.wouldBe"    # 2007 (measured)
      error_message: "error.message"       # expect "Station does not support device management"

  # 3. NO wait_for UpdateFirmware on the wire: csms dispatched nothing for a
  #    capability-unsupported station. The absence of a wire command IS the proof of
  #    direction. (A wait_for here would correctly time out.)
