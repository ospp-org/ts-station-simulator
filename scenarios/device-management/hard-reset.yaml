name: "Hard Reset"
description: >
  Hard reset: the server publishes Reset REQUEST and this scenario observes it.
  KNOWN GAP — no Reset RESPONSE is ever sent and the station never disconnects.
  Scenario mode registers no ResetHandler (ScenarioRunner.ts:766-769). What IS proven:
  the server dispatches Reset to a station that declared the profile.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/reset"
    body:
      type: "Hard"
    expect_status: 202

  # No handler answers this — scenario mode registers none. The Reset REQUEST is observed
  # and left unanswered (see the KNOWN GAP in the description).
  - action: wait_for
    message: Reset
    messageType: Request
    timeout_ms: 15000

  # A plain wait on a still-connected station. Nothing disconnects or reconnects here.
  - action: delay
    ms: 13000

  # Per spec reset.md §5.4-5, station MUST send BootNotification post-reset.
  # autoBoot was removed from sim (commit ac9b2e8) — scenarios must send explicitly.
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "ManualReset"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 20000

  - action: assert
    field: "payload.status"
    equals: "Accepted"
