# WHAT IS COVERABLE HERE, AND WHAT IS NOT — established 2026-08-10
#   COVERABLE, and asserted below: the server published a TriggerMessage carrying the
#   requestedMessage the REST call asked for. That value is server-resolved (POST body ->
#   TriggerMessageDto -> the pushed Request), and it is what SEPARATES the three
#   trigger-message files: swap two of their POST bodies and both assertions break. Before
#   this, all three asserted only that the boot was Accepted and the POST returned 202, so
#   they were interchangeable.
#
#   NOT COVERABLE, and deliberately not faked: that the station's SUBSEQUENT message was
#   CAUSED by the trigger. Nothing server-side links the two — `requestedMessage` appears
#   only in the request DTO/validation and TriggerMessageResponseHandler; no correlation id
#   is stored and the resulting Heartbeat/StatusNotification/BootNotification carries no
#   "triggered" marker. The reply this scenario sends is its OWN scripted literal, so
#   asserting the server ingested it (last_seen_at moves for a Heartbeat, bays.status for a
#   StatusNotification, boot_reason for a BootNotification) would prove ingestion and NOT
#   causation — an unsolicited message updates exactly the same state. Closing that gap needs
#   the server to correlate the reply to the pending TriggerMessage; until then the trigger's
#   EFFECT is unobservable from a scenario and only its DISPATCH is proven.
name: "Trigger Message Heartbeat"
description: "Server triggers a Heartbeat message from the station"
# NO SERVER-STATE ASSERTION — THE EFFECT IS NOT EQUALITY-ASSERTABLE. Marked, not asserted.
#
# The triggered message is a Heartbeat, and its entire server effect is two
# writes (HeartbeatHandler:29-33): stationRepository->updateLastSeen(), which
# moves stations.last_seen_at, and heartbeatTracker->recordHeartbeat(), which
# writes Redis.
#
# CORRECTED 2026-08-11 — one of the two reasons recorded here has expired, and
# the ceiling stands anyway. The runner now HAS an is-recent form (`is_recent`,
# used in heartbeat-cycle.yaml), so "the timestamp cannot be bounded" is no
# longer true. It was never the load-bearing reason:
#   - last_seen_at is exposed as data.lastSeenAt and is now bound-able. Asserting
#     it here would prove the Heartbeat was INGESTED, which is not what this file
#     is about — an UNSOLICITED Heartbeat moves the identical column, so a green
#     bound would say nothing about the trigger. That is the objection recorded
#     above, and closing the is-recent gap does not touch it.
#   - the heartbeat tracker state lives in Redis and no REST route reads it back.
#     Unchanged.
#
# There is also no derived flag to lean on: data.isOnline is already true from
# the boot at the top of this file, so a Heartbeat cannot move it, and asserting
# it would be an assertion that cannot fail.
#
# What IS asserted, on the wire and already present: TriggerMessage carries
# requestedMessage Heartbeat and is Accepted. Closing the REMAINING gap needs the
# server to correlate a reply to the pending TriggerMessage — a server change,
# not a runner capability and not a scenario edit. `is_recent` does not give it.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/trigger-message"
    body:
      requestedMessage: "Heartbeat"
    expect_status: 202

  - action: wait_for
    message: TriggerMessage
    messageType: Request
    timeout_ms: 15000

  # Server-resolved from the POST body — and the only thing separating these three files.
  - action: assert
    field: "payload.requestedMessage"
    equals: "Heartbeat"

  - action: send
    message: TriggerMessage
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: Heartbeat
    payload: {}
