# WHAT DISTINGUISHES THIS FILE FROM ITS SIBLINGS — nothing, and that is a SERVER DEFECT
#   change-configuration-{accepted,reboot-required,rejected} send the SAME key and value and
#   differ only in the status the station reports. On the server that difference is currently
#   inert, so no observable separates the three. Marked rather than dressed up.
#
#   THE DEFECT (csms-server, reported not fixed — outside this repo):
#     ChangeConfigurationHandler.php:43-47 reads the response as
#         $status = $envelope->payload['status'] ?? ChangeConfigResultStatus::REJECTED->value;
#         $errorCode = $envelope->payload['errorCode'] ?? null;
#         $errorText = $envelope->payload['errorText'] ?? null;
#     but mqtt/change-configuration-response.schema.json is
#         required: ['results'], properties: ['results'], additionalProperties: FALSE
#     — a top-level `status` is schema-FORBIDDEN. So on any schema-valid response the read
#     misses, $status defaults to REJECTED, and handleAccepted() — the branch that does
#     StationConfiguration::updateOrCreate and dispatches ConfigurationChanged — is
#     UNREACHABLE. The per-key results[] array the station actually sends is never read.
#
#   MEASURED 2026-08-10, which is how this was found rather than assumed: after
#   change-configuration-accepted ran green against UAT, station_configurations for that
#   station held ZERO rows — identical to the rejected variant. Had the accepted branch
#   worked, the read-back would also have distinguished accepted from reboot-required:
#   handleAccepted stores mutability 'static' for RebootRequired and 'dynamic' otherwise
#   (:128), and StationConfigurationResource exposes `mutability`.
#
#   WHEN THE SERVER IS FIXED, the assertion to add here is
#     GET /api/v1/admin/stations/{{stationId}}/config
#     accepted        -> data[key=HeartbeatIntervalSeconds].value "30", mutability "dynamic"
#     reboot-required -> same value, mutability "static"
#     rejected        -> the key absent (no row is ever written on a rejection)
#
#   THE `rejected` LINE ABOVE IS NO LONGER TRUE — csms-server `13bee28` made a refused change
#   record itself, so the row EXISTS and carries `desired_status: "rejected"`. Kept in place
#   rather than edited because it dates the change: this file asserted the absence for as long
#   as the absence was the behaviour. The live assertion is at the foot of the file.
#
# WHAT IS ASSERTED BELOW, and it is real: the server pushed the key and value the REST call
#   asked for. That is server-resolved and on the wire — it fails if the request/push
#   translation breaks — but it is identical in all three files and does NOT separate them.
#   payload.keys has exactly one element here because the PUT sends one key, so index 0 is
#   deterministic (unlike data.bays, which is unordered — see maintenance-mode-on.yaml).
name: "Change Configuration Rejected"
description: "On a station this file registers, provisions and connects: change a readonly configuration key and receive Rejected status; the server records the refusal and applies nothing."
# ── A STATION OF ITS OWN, and why a pool station cannot hold this file's precondition ─────────
#
# The discriminator at the foot of this file reads the station's APPLIED configuration:
# `value: ""` and `changed_by: null`, i.e. "nothing was ever adopted on this key". That is a
# property of the STATION, not of this run of the file, and a pool station is leased to one
# scenario after another without being reset (StationPoolAllocator, ScenarioRunner.ts:1663-1694,
# is mutual exclusion and nothing more). change-configuration-accepted.yaml and
# change-configuration-reboot-required.yaml PUT the same key and value and answer Accepted /
# RebootRequired, and ChangeConfigurationHandler's accepted path writes `value` and `changed_by`
# (:288, :292), while a rejection only closes the request (`resolveDesired`, called at :200,
# updates desired_status and desired_resolved_at and nothing else).
#
# MEASURED on UAT, corpus run results/uat-25a89fd7-20260928T055130Z: Accepted leased stn_506a54dd
# at 05:52:46.840Z and this file leased the SAME station at 05:52:49.681Z (their frame journals,
# tests/artifacts/journal/change-configuration-{accepted,rejected}--stn-506a54dd--*), so step [9]
# read `value: "30"` with `changed_by: sim-worker-…-35` (Accepted's identity) beside this file's
# own `desired_by: sim-worker-…-37` and `desired_status: "rejected"`. The server was right: a
# rejected change applies nothing, and what was applied before stays. Of the 24 kept result files
# (results/*.json) that contain this scenario, 21 passed; of the 3 reds this is the only one at
# step [9] (the other two are a 401 login and a missing certificate). Whether it passed depended on
# which station the siblings had been handed — order, not construction.
#
# `owns_station` makes the precondition true by construction: the runner takes no pool lease and
# resolves {{stationId}} to a fresh per-scenario id, which this file registers, provisions,
# connects and boots, so no other file has ever written its configuration. It sits in the run's
# organization, so the ephemeral tenant_owner (SIM_POOL_OWNER_*) is the identity: registering a
# station and minting its provisioning token ask stations.create and
# stations.manage_provisioning_tokens, which tenant_operator does not hold. Same recipe as
# catalog-publish-refused-two-ways-under-one-code.yaml; the station and location are declared in
# `creates:` and removed by the scenario's own teardown.
requires_pool: >-
  Registering a station of its own and minting its provisioning token ask stations.create and
  stations.manage_provisioning_tokens, which the pool's per-scenario tenant_operator does not hold;
  the only identity that does is the ephemeral tenant_owner a bootstrapped run mints and deletes.
owns_station: >-
  The assertions read the station's APPLIED configuration (value "" and changed_by null), which on a
  pool station is whatever the last lessee applied: change-configuration-accepted and
  -reboot-required write the same key and value, and on 2026-09-28 Accepted leased the station this
  file got three seconds before it.
auth:
  email_env: SIM_POOL_OWNER_EMAIL
  password_env: SIM_POOL_OWNER_PASSWORD
defer_mqtt_connect: true
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # ── A station of this file's own: the org, a location, the station, its provisioning ──────
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/organizations"
    expect_status: 200
    capture:
      org_id: "data.0.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/locations"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    body:
      name: "Change configuration rejected {{stationId}}"
      address: "Strada Simulare 1, Bucuresti"
      latitude: 44.4268
      longitude: 26.1025
      city: "Bucharest"
      country: "RO"
    expect_status: 201
    creates:
      location: "data.id"
    capture:
      location_id: "data.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    body:
      stationId: "{{stationId}}"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      locationId: "{{captured.location_id}}"
      bays:
        - bayNumber: 1
        - bayNumber: 2
    expect_status: 201
    creates:
      station: "data.station_id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/provisioning-tokens"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    body:
      note: "change configuration rejected"
    expect_status: 201
    capture:
      provisioning_token: "data.rawToken"

  - action: provision
    token_var: "provisioning_token"
    serial_number: "{{serialNumber}}"
    bay_count: 2

  - action: connect_mqtt

  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        # Required: WriteConfigurationAction.php:86 refuses with COMMAND_NOT_SUPPORTED
        # (2007) unless device_management_supported === true. NULL is "not stated" and
        # is withheld too (OSPP §5.1 rule 3), so this must be declared, not omitted.
        # Declared at boot like the other device-management scenarios (e.g.
        # change-configuration-accepted.yaml:68) — there is no admin call for it here.
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: api_call
    method: PUT
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/config"
    body:
      key: "HeartbeatIntervalSeconds"
      value: "30"
    expect_status: 202

  - action: wait_for
    message: ChangeConfiguration
    messageType: Request
    timeout_ms: 15000

  # The pushed Request carries what the REST call asked for.
  - action: assert
    field: "payload.keys.0.key"
    equals: "HeartbeatIntervalSeconds"

  - action: assert
    field: "payload.keys.0.value"
    equals: "30"

  - action: send
    message: ChangeConfiguration
    messageType: Response
    payload:
      results:
        - key: "HeartbeatIntervalSeconds"
          status: "Rejected"
          errorCode: 5108
          errorText: "CONFIGURATION_KEY_READONLY"

  # THE DISCRIMINATOR — CORRECTED 2026-08-14.
  #
  # This block used to assert `data: []` on the reasoning that "no row is ever written on a
  # rejection". That was true when it was written and csms-server `13bee28` ended it: a
  # refused change now RECORDS itself. The row exists, and what makes it a refusal rather
  # than an applied change is `desired_status: "rejected"` with `desired_resolved_at`
  # populated, against an `value` (applied) side the station never confirmed.
  #
  # The stale assertion had been failing since that deploy and was masked in one earlier run
  # by an unrelated 429, which is the more expensive half of the story: a standing red line
  # teaches everyone to skim the failure list.
  #
  # WHY THE NEW ASSERTION IS STRONGER THAN THE OLD ONE. `data: []` could only ever say
  # "nothing happened", which a station that never answered would also satisfy. These fields
  # say the server heard the Rejected result and recorded WHICH key was refused, WHAT was
  # asked for, and that the request is closed rather than still in flight — the distinction
  # `desired_status` exists to make (StationConfigurationResource.php:37-43).
  #
  # THE PRECONDITION, AND BOTH HALVES OF WHAT THIS PARAGRAPH USED TO SAY WERE FALSE. It read:
  # "a station with no prior station_configurations rows — i.e. run this with
  # `--bootstrap-pool`, or on a station that has not run the accepted / reboot-required
  # variants. `data.0.*` is the only row on such a station."
  #   - `--bootstrap-pool` does not give it: pool stations are shared in turn, and on
  #     2026-09-28 Accepted had applied "30" to this file's station three seconds earlier.
  #     `owns_station` (header) is what gives it now.
  #   - it is not the only row: every boot of a station declaring device management replays
  #     the organization's epoch as ChangeConfiguration RevocationEpoch
  #     (IncludeEpochInBootListener), which records a `RevocationEpoch` row desired by
  #     `system` — the second row of the failing body. The list is ordered by key
  #     (ReadConfigurationAction.php:105), so index 0 was right by the alphabet rather than
  #     by construction; the row is addressed by its key below, as the two siblings address it.
  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/config"
    expect_status: 200
    expect_body:
      data[key=HeartbeatIntervalSeconds].key: "HeartbeatIntervalSeconds"
      # What was ASKED. Echoes the PUT above, so on its own it proves only that the request
      # was recorded.
      data[key=HeartbeatIntervalSeconds].desired_value: "30"
      # THE REFUSAL. Reachable only from ChangeConfigurationHandler reading a `Rejected`
      # result out of the station's Response — the half this scenario sends nothing to
      # produce, and the one field that separates a refused change from one still pending.
      data[key=HeartbeatIntervalSeconds].desired_status: "rejected"
      # APPLIED state, and it must stay empty: the station rejected the key, so nothing was
      # ever adopted. `''` rather than null is the resource's compatibility coalesce
      # (StationConfigurationResource.php:23-30), not a value.
      data[key=HeartbeatIntervalSeconds].value: ""
      # The applied-side discriminator. `changed_by` has NO column default and is written in
      # exactly one place — `ChangeConfigurationHandler.php:292`, the ACCEPTED path, together
      # with the real value. Null here therefore means that path never ran ON THIS STATION,
      # which only a station of this file's own can promise.
      data[key=HeartbeatIntervalSeconds].changed_by: null
      # Bounded rather than pinned — the timestamp is server-generated. Its PRESENCE is the
      # claim ("the request left pending"); 300s is slack for a loaded UAT, not a measurement.
      data[key=HeartbeatIntervalSeconds].desired_resolved_at:
        is_recent: 300
  #
  # TWO FIELDS DELIBERATELY NOT ASSERTED, measured 2026-08-14 rather than reasoned about.
  #
  # The first draft of this block also pinned `last_changed_at: null` and would have pinned
  # `mutability: "dynamic"`. Both are wrong, for the same reason, and the isolated run caught
  # the first one on the wire:
  #
  #     expected body "data.0.last_changed_at" to equal null,
  #     but got "2026-08-14T20:27:07+00:00"
  #
  # `last_changed_at TIMESTAMPTZ DEFAULT NOW()` and `mutability VARCHAR(10) NOT NULL DEFAULT
  # 'dynamic'` (create_station_configurations_table:20-21). Neither `recordDesired` nor
  # `resolveDesired` writes either column, so on a row born from a desired-push both are
  # filled by POSTGRES at INSERT. `last_changed_at` is populated on a row where nothing was
  # ever changed, and `mutability` reads 'dynamic' whether or not anything decided it was.
  #
  # A column default is the most convincing kind of non-evidence: it is always present, it
  # always looks plausible, and it is identical on every path — so an assertion on it passes
  # for a reason that has nothing to do with the subject. `mutability` would have been the
  # worse of the two, because it would have PASSED and read like a discriminator against
  # change-configuration-reboot-required, which is precisely the arm it cannot separate.
