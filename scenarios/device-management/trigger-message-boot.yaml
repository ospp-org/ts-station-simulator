# WHAT IS COVERABLE HERE, AND WHAT IS NOT — established 2026-08-10
#   COVERABLE, and asserted below: the server published a TriggerMessage carrying the
#   requestedMessage the REST call asked for. That value is server-resolved (POST body ->
#   TriggerMessageDto -> the pushed Request), and it is what SEPARATES the three
#   trigger-message files: swap two of their POST bodies and both assertions break. Before
#   this, all three asserted only that the boot was Accepted and the POST returned 202, so
#   they were interchangeable.
#
#   NOT COVERABLE, and deliberately not faked: that the station's SUBSEQUENT message was
#   CAUSED by the trigger. Nothing server-side links the two — `requestedMessage` appears
#   only in the request DTO/validation and TriggerMessageResponseHandler; no correlation id
#   is stored and the resulting Heartbeat/StatusNotification/BootNotification carries no
#   "triggered" marker. The reply this scenario sends is its OWN scripted literal, so
#   asserting the server ingested it (last_seen_at moves for a Heartbeat, bays.status for a
#   StatusNotification, boot_reason for a BootNotification) would prove ingestion and NOT
#   causation — an unsolicited message updates exactly the same state. Closing that gap needs
#   the server to correlate the reply to the pending TriggerMessage; until then the trigger's
#   EFFECT is unobservable from a scenario and only its DISPATCH is proven.
name: "Trigger Message BootNotification"
description: >
  Server triggers a BootNotification from the station via TriggerMessage. The station
  side is scripted explicitly by this file — scenario mode registers no TriggerMessageHandler
  (see the note at the TriggerMessage wait_for below), so nothing auto-responds and nothing
  auto-sends the BootNotification.
# NO SERVER-STATE ASSERTION — IT WOULD PROVE INGESTION, NOT CAUSATION. Marked, not asserted.
#
# The triggered message here is a BootNotification, and its server effect is
# stations.boot_reason. The FIRST boot at the top of this file writes `PowerOn`
# and the triggered boot writes `Reconnect` (see the note at the send below), so a
# read-back of data.bootReason would now tell the two apart. It is still not
# asserted, for the reason the header gives: an unsolicited `Reconnect` boot — a
# station re-dialling — moves the identical column, so the read would prove the
# boot was INGESTED, not that the trigger CAUSED it.
#
# The other column that moves is stations.last_boot_at. CORRECTED 2026-08-11:
# the stated reason it was unassertable — "expect_body compares by equality with
# no changed-since or is-recent form" — has expired. The runner now has
# `is_recent`. The column is still not assertable HERE, for two reasons that
# outlive it:
#   - Recency alone cannot fail. This file boots at the top, so last_boot_at is
#     already current before the triggered boot is ever sent.
#   - The `not_before` form that WOULD discriminate needs a server instant issued
#     at least a second after the first boot and before the triggered one. This
#     file has no such instant: its only server times are the two boot Responses,
#     and each is issued AFTER the write it would have to bound. Manufacturing
#     one (a Heartbeat inserted purely as a clock source) would buy an INGESTION
#     proof, which is the thing the header above already declines — an
#     unsolicited boot moves the identical column.
#
# THE TRIGGERED BOOT SAID `PowerOn` UNTIL 2026-10-13, with uptimeSeconds 3600, and
# this block refused a different bootReason as "a difference the protocol does not
# have". The protocol has it: boot-notification.md §5.2 names the triggered case,
# and `Reconnect` "covers both cases of no boot occurred: a re-dialled session, and
# a Boot the server asked for". The `PowerOn` reading — bootReason as the boot
# episode that is running (docs/RECORD-triggered-boot-deferred-20260730T050809Z.md)
# — predates that text. And the pair contradicted this file itself: a restart an
# hour old, sent about a second after the same station reported a `PowerOn` at
# uptime 0. That is the claim rule 3 makes the server refuse, and it did on every
# run, logging the contradiction and not acting on the reason.
#
# What IS asserted, on the wire and already present: TriggerMessage carries
# requestedMessage BootNotification, and the subsequent BootNotification Response
# is Accepted. Dispatch is proven; causation is not, for the same reason as
# trigger-message-status.yaml — no correlation is stored and the resulting
# message carries no marker.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/trigger-message"
    body:
      requestedMessage: "BootNotification"
    expect_status: 202

  - action: wait_for
    message: TriggerMessage
    messageType: Request
    timeout_ms: 15000

  # Server-resolved from the POST body — and the only thing separating these three files.
  - action: assert
    field: "payload.requestedMessage"
    equals: "BootNotification"

  # Scenario mode registers no TriggerMessageHandler (ScenarioRunner registers
  # only BootNotificationHandler, to capture the sessionKey) — the scenario
  # scripts every outbound message itself, the way trigger-message-heartbeat
  # does. This file used to stop at the wait_for above under a comment claiming
  # a handler auto-responded, so it proved only that the trigger was DELIVERED
  # and never that the station answers it correctly.
  - action: send
    message: TriggerMessage
    messageType: Response
    payload:
      status: "Accepted"

  # The triggered re-announce, and the point of the scenario. A trigger is not a
  # restart: nothing boots, the station composes the message on the connection it
  # already has. So bootReason is `Reconnect` (boot-notification.md §5.2), and
  # uptimeSeconds is the uptime the station already had (rule 2), running on from
  # the PowerOn at 0 above: the two boots go out about a second apart (0.8 s on
  # UAT, 2026-10-13), so 1. It said `PowerOn` with 3600 until 2026-10-13 (see the
  # note near the top). deviceManagementSupported is declared so one station does not
  # advertise two capability sets. Connect mode's TriggerMessageHandler answers a
  # triggered boot the same way, `Reconnect` with the uptime running on; the
  # offline pin on that is src/__tests__/handlers/TriggerMessageHandler.bootTruthful.test.ts.
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 1
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "Reconnect"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"
