# WHAT IS COVERABLE HERE, AND WHAT IS NOT — established 2026-08-10
#   COVERABLE, and asserted below: the server published a TriggerMessage carrying the
#   requestedMessage the REST call asked for. That value is server-resolved (POST body ->
#   TriggerMessageDto -> the pushed Request), and it is what SEPARATES the three
#   trigger-message files: swap two of their POST bodies and both assertions break. Before
#   this, all three asserted only that the boot was Accepted and the POST returned 202, so
#   they were interchangeable.
#
#   NOT COVERABLE, and deliberately not faked: that the station's SUBSEQUENT message was
#   CAUSED by the trigger. Nothing server-side links the two — `requestedMessage` appears
#   only in the request DTO/validation and TriggerMessageResponseHandler; no correlation id
#   is stored and the resulting Heartbeat/StatusNotification/BootNotification carries no
#   "triggered" marker. The reply this scenario sends is its OWN scripted literal, so
#   asserting the server ingested it (last_seen_at moves for a Heartbeat, bays.status for a
#   StatusNotification, boot_reason for a BootNotification) would prove ingestion and NOT
#   causation — an unsolicited message updates exactly the same state. Closing that gap needs
#   the server to correlate the reply to the pending TriggerMessage; until then the trigger's
#   EFFECT is unobservable from a scenario and only its DISPATCH is proven.
name: "Trigger Message BootNotification"
description: >
  Server triggers a BootNotification from the station via TriggerMessage. The station
  side is scripted explicitly by this file — scenario mode registers no TriggerMessageHandler
  (see the note at the TriggerMessage wait_for below), so nothing auto-responds and nothing
  auto-sends the BootNotification.
# NO SERVER-STATE ASSERTION — THE EFFECT IS INDISTINGUISHABLE. Marked, not asserted.
#
# The triggered message here is a BootNotification, and its server effect is
# stations.boot_reason. That column is already `PowerOn` from the FIRST boot at
# the top of this file, and the triggered boot writes `PowerOn` again — see the
# note at the send below, which explains why that is correct and deliberate:
# bootReason means "why the station booted", not "why it is sending now". So a
# read-back of data.bootReason would return the same value whether the triggered
# boot landed, or landed as something else, or never happened at all. It is an
# assertion that cannot fail, which is worse than none.
#
# The one column that DOES move is stations.last_boot_at. It is not assertable:
# its value is a timestamp the scenario cannot predict, and expect_body compares
# by equality with no changed-since or is-recent form.
#
# Changing the triggered boot to a different bootReason WOULD make it
# distinguishable, and is refused on purpose: it would manufacture a difference
# the protocol does not have, and encode a wrong reading of bootReason into the
# corpus to buy a green assertion.
#
# What IS asserted, on the wire and already present: TriggerMessage carries
# requestedMessage BootNotification, and the subsequent BootNotification Response
# is Accepted. Dispatch is proven; causation is not, for the same reason as
# trigger-message-status.yaml — no correlation is stored and the resulting
# message carries no marker.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/trigger-message"
    body:
      requestedMessage: "BootNotification"
    expect_status: 202

  - action: wait_for
    message: TriggerMessage
    messageType: Request
    timeout_ms: 15000

  # Server-resolved from the POST body — and the only thing separating these three files.
  - action: assert
    field: "payload.requestedMessage"
    equals: "BootNotification"

  # Scenario mode registers no TriggerMessageHandler (ScenarioRunner registers
  # only BootNotificationHandler, to capture the sessionKey) — the scenario
  # scripts every outbound message itself, the way trigger-message-heartbeat
  # does. This file used to stop at the wait_for above under a comment claiming
  # a handler auto-responded, so it proved only that the trigger was DELIVERED
  # and never that the station answers it correctly.
  - action: send
    message: TriggerMessage
    messageType: Response
    payload:
      status: "Accepted"

  # The triggered re-announce, and the point of the scenario. A trigger is not a
  # power-cycle: the station has been up for an hour and says so. Reporting
  # uptimeSeconds: 0 here would make the server derive bootTime ≈ now and
  # force-fail + refund every live wash on the station. bootReason stays PowerOn
  # because that is still the episode that is running — the field is "reason the
  # station booted", not "reason for this send" — and deviceManagementSupported
  # is declared so one station does not advertise two capability sets.
  # These are the values TriggerMessageHandler now emits via Station.retryBoot();
  # the offline pin on that is src/__tests__/handlers/TriggerMessageHandler.bootTruthful.test.ts.
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 3600
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"
