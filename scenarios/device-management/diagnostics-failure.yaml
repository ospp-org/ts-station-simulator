# WHAT DISTINGUISHES THIS FILE FROM ITS SIBLING — measured on the wire 2026-08-10
#   diagnostics-upload and diagnostics-failure both asserted only the boot and a 202. Each now
#   reads GET /admin/stations/{stationId}/diagnostics — a COLLECTION, selected by upload_url
#   (which this file supplies in the POST, so it is a key the scenario owns) rather than by an
#   index.
#
#   MEASURED, on fresh single-station pools:
#     diagnostics-upload   status "uploaded"  progress 100  error_text null
#     diagnostics-failure  status "failed"    progress 0    error_text "Upload failed: connection refused"
#
#   Unlike the firmware triplet, this pair DOES separate on a server-derived value.
#   DiagnosticsStatus carries a single FAILED state (protocol enum:13) — but because this
#   cluster is two files rather than three, success-vs-failure IS the distinction, and
#   `status` is the FSM state the handler maps from the station's notification, not a value
#   echoed off the payload. `error_text` IS echoed (:160, with a default) and is asserted only
#   as round-trip persistence.
#
#   Swap the two files' notification payloads and both assertions break — the variant is real.
#
#   TEARDOWN: diagnostics_uploads held 4 rows before these runs and 4 after, so the
#   station-scoped sweep covers it. No residue.
name: "Diagnostics Upload Failure"
description: "Diagnostics collection succeeds but upload fails due to connection refused"
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/diagnostics"
    body:
      uploadUrl: "https://diagnostics.example.com/upload"
    expect_status: 202

  - action: wait_for
    message: GetDiagnostics
    messageType: Request
    timeout_ms: 15000
    capture:
      uploadUrl: "payload.uploadUrl"

  - action: send
    message: GetDiagnostics
    messageType: Response
    payload:
      status: "Accepted"
      fileName: "diag_{{stationId}}.tar.gz"

  - action: send
    message: DiagnosticsNotification
    messageType: Event
    payload:
      # No `progress` on Collecting: diagnostics-status.md rule 4 makes its absence
      # a MUST, and since spec 0.23.0 the schema enforces it. Collection has no
      # denominator the station knows in advance, which is why the rule forbids the
      # field rather than merely not requiring it.
      status: "Collecting"

  - action: delay
    ms: 500

  - action: send
    message: DiagnosticsNotification
    messageType: Event
    payload:
      status: "Uploading"
      progress: 0

  - action: delay
    ms: 500

  - action: send
    message: DiagnosticsNotification
    messageType: Event
    payload:
      status: "Failed"
      errorText: "Upload failed: connection refused"

  # THE ASSERTION — the server's own diagnostics record, not the notifications this file sent.
  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/diagnostics"
    expect_status: 200
    expect_body:
      data[upload_url=https://diagnostics.example.com/upload].status: "failed"
      data[upload_url=https://diagnostics.example.com/upload].error_text: "Upload failed: connection refused"
