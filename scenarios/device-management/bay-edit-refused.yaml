name: "Bay Edit Refused — the state-conflict refusals both new routes own"
description: "A bay number already in use, and a bay number that does not exist: both answer 409 with the reason named, and neither writes anything."

# THE REFUSAL SIDE of POST /admin/stations/{stationId}/bays and
# POST /admin/stations/{stationId}/bays/{bayNumber}/retire. `bay-edit-releases-a-blocked
# -station.yaml` drives the happy path and the whole mismatch→blocked→retire→released chain;
# this file drives the two refusals that need no state to reach and leave none behind.
#
# 409 AND NOT 422, WHICH IS THE POINT OF ASSERTING THE CODE AT ALL. Both requests below are
# well-formed and the caller is entitled to make them — what refuses is the CURRENT STATE of
# the station. A 422 would send an operator to re-read their JSON, which is exactly the wrong
# place to look when the JSON is fine and the bay number is taken.
#
# AND 409 IS NOT ENOUGH, WHICH IS WHY `details.reason` IS PINNED BELOW (added 2026-08-30).
# This file's own description has said "with the reason named" since it was written, and until
# now nothing here asserted a reason — the refusal body was `{"message": "<prose>"}`, one field
# for seven reachable causes, so there was nothing to assert. csms-server `a3014a4b` added the
# machine-readable slug: `{"message": "<same prose, unchanged, still first>",
# "details": {"reason": "<slug>"}}`, still 409, additive
# (StationManagementController::bayEditRefusal:1119-1125).
#
# It is worth pinning because NEITHER of these routes has one 409. `AddBayAction` throws three
# (`programs_required`, `bay_number_taken`/`bay_number_taken_retired`, `bay_ceiling_reached`)
# and `RetireBayAction` five (`bay_not_found`, `bay_already_retired`, `live_session`,
# `unit_batch_in_progress`, `bay_reserved`). A bare 409 on step 2 passes if bay 97 exists and
# is reserved, or exists and has a live session — states this file does not create and cannot
# see. The slug is what makes each step name the cause it was written for.
#
# NOTE THE PATH: `details.reason`, not `error.details.reason`. These three doors answer with a
# bare `{message, details}` envelope rather than the OSPP `{error: {...}, meta: {...}}` one the
# reservation and session doors use — deliberately, so the SPA's existing prose matching keeps
# working. Two envelopes, one spelling of the field; the prefix is the difference.
#
# NOTHING HERE MUTATES. Both calls are refused before any write, so this file can run on a
# shared pool station in any order relative to any other scenario. That is deliberate:
# retirement has no inverse at the API, so a refusal file that accidentally succeeded would
# strip a bay from a station every later scenario still has to use.
requires_pool: >-
  Both routes authorize `bays.update` (StationPolicy::manageBays), held by tenant_owner and
  tenant_admin and NOT by tenant_operator since 2026_08_27_000003 — and tenant_operator is
  what a pooled run hands a scenario with no `auth:` block. The pool's ephemeral owner is
  minted per run, so there is no account to seed.
auth:
  email_env: SIM_POOL_OWNER_EMAIL
  password_env: SIM_POOL_OWNER_PASSWORD

station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]

steps:
  # A NUMBER ALREADY IN USE. Bay 1 exists on every pool station, so this needs no setup.
  #
  # The refusal is not about tidiness. `bays_station_bay_number_unique` is left in place
  # deliberately so a number can never be re-issued — `bay_number` is what the station
  # declares on the wire and what `bay_programs` binds, so a second bay 1 would make every
  # historical row that says "bay 1" ambiguous about which physical bay it meant.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/bays"
    body:
      bayNumber: 1
      programs:
        - programNumber: 1
          label: "Basic Wash"
    expect_status: 409
    # `bay_number_taken` and NOT `bay_number_taken_retired`: one cause, two slugs, and the
    # branch is `$existing->isRetired()` (AddBayAction:94). Bay 1 is in service on every pool
    # station, so the live form is the one this step must meet — and if it ever reads the
    # retired form, a previous scenario retired bay 1 and left the pool station short, which is
    # a far more useful thing to learn here than "something answered 409".
    expect_body:
      details.reason: "bay_number_taken"

  # A BAY THAT DOES NOT EXIST. 97 is inside the route's `[0-9]+` constraint and inside the
  # request-validation ceiling, so this reaches the ACTION and is refused there — which is
  # what makes it a 409 about state rather than a 404 about routing or a 422 about shape.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/bays/97/retire"
    expect_status: 409
    # THE FIRST of RetireBayAction's five refusals, and the only one reachable without state.
    # The other four (`bay_already_retired`, `live_session`, `unit_batch_in_progress`,
    # `bay_reserved`) all require a bay that EXISTS, so pinning this slug is what says the
    # route was refused for absence rather than for something this file left behind.
    expect_body:
      details.reason: "bay_not_found"

  # AND THE STATION IS UNTOUCHED. Two refusals, and the bay set is exactly what it was:
  # bays 1 and 2, both in service, and no bay 97. Without this the file proves the server
  # answered 409 and not that it declined to WRITE — a refusal that returns the right code
  # after mutating is the failure mode worth catching, and the status code alone cannot see
  # it.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bays[bayNumber=1].retiredAt: null
      data.bays[bayNumber=2].retiredAt: null
    expect_body_absent:
      - "data.bays[bayNumber=97]"
