name: "Service Catalog Update"
description: "Publish the station's catalog through the only door that exists, and answer it carrying previousCatalogVersion"

# THE DOOR THIS FILE USED TO KNOCK ON IS GONE. It called
# `PUT /api/v1/admin/stations/{id}/catalog` — the legacy push, which csms-server RETIRED at
# bf35637. Measured against the local stack 2026-08-25: **404**, "The route
# api/v1/admin/stations/stn_.../catalog could not be found." The failure had nothing to do
# with the catalog and everything to do with the route no longer existing, so on a UAT run it
# would have read as a deploy breaking device management when it is a corpus/server divergence
# that predates the deploy by weeks.
#
# `POST .../catalog/publish` is the ONLY catalog route on the server today
# (`artisan route:list --path=catalog` returns exactly one row). It takes NO body: everything
# it sends is read from `station_services` JOIN `service_definitions`, which is why the
# request below carries no `services:` array and cannot. That is the same door the three
# `e2e/*` parcours already use.
#
# ── AND IT IS UNDER A PERMISSION NO IDENTITY THIS CORPUS CAN OBTAIN ─────────────────────
#
# THE FILE IS SKIPPED. Not because the door is missing — it is the only one that exists and
# the steps below are the right ones for it — but because `publish` authorizes
# `catalog.manage` and nothing a scenario can authenticate as holds it.
#
# WHAT THE PREVIOUS REVISION CLAIMED, AND WHY IT WAS WRONG. It added the `auth:` block below
# on the premise that `UAT_E2E_PLATFORM_ADMIN_*` names a `platform_super_admin`, which
# `StationPolicy::checkTenantPermission` admits through its platform-tier override. The
# override is real; the premise about the account is not. `E2EBootstrapSeeder` assigns
# `E2E_PLATFORM_ROLE`, DEFAULT `platform_admin`, and that is the role the account carries —
# `~/.config/osp-e2e-secrets.env` says so in its own header, and UAT confirms it:
#
#   GET /api/v1/me/permissions  ->  200, exactly 13 entries, all `platform.*`
#                                   (the `platform_admin` grant list verbatim,
#                                    RolesAndPermissionsSeeder.php:323-337)
#
# `catalog.manage` is not among them, and csms-server's own comment on that override names
# this exact case: "Super-admin's enumerated grants land here; platform_admin /
# platform_support remain REJECTED because tenant-prefixed permissions are not on their
# roles." Two different roles with adjacent names, and only one of them passes.
#
# MEASURED ON UAT 2026-08-25, without publishing anything, on the READ half of the same gate:
#
#   GET  /api/v1/admin/stations/stn_68e67283/services   ->  403 "This action is unauthorized"
#   GET  /api/v1/admin/stations/stn_68e67283            ->  200
#
# Same token, same station, one step apart. `index` and `publish` both call
# `$this->authorize('manageCatalog', …)`; the second route is gated on
# `stations.view`/`platform.support.read_any`, which this account does hold. So the refusal
# is the PERMISSION and not the identity, the token, or the station.
#
# EVERY IDENTITY A SCENARIO CAN REACH, AND WHAT EACH HOLDS. `catalog.manage` is granted to
# `platform_super_admin`, `tenant_owner` and `tenant_admin` (RolesAndPermissionsSeeder:196,
# 372, 419) and to nothing else:
#
#   `auth:` env override            platform_admin      NO   — measured above
#   pool per-scenario identity      tenant_operator     NO   — holds no catalog permission at
#                                                              all; "the principled non-owner
#                                                              role", uatPrivileged.ts:678
#   `UAT_EMAIL` / `UAT_PASSWORD`    —                   —    — 401 on UAT (stale, as
#                                                              RUNNING-AGAINST-UAT.md §1 says),
#                                                              and structurally unreachable
#                                                              while the allocator is active
#   pool ephemeral owner            tenant_owner        YES  — but `ownerPassword` never
#                                                              leaves PoolBootstrap and no
#                                                              scenario can ask for it
#
# AND THE ONE THAT LOOKS LIKE A WAY THROUGH IS NOT. The three `e2e/*` parcours DO publish a
# catalog with these very credentials in their `auth:` block — but not AS them. Each logs in
# as the customer it registered first and `set_auth_token` replaces the context JWT, and
# their own comment says why: "running tenant ops as the platform admin would 403 even
# though the platform admin is omnipotent at the platform layer"
# (e2e-new-customer-onboarding.yaml:161-170). That customer is `tenant_owner` OF THE ORG IT
# JUST CREATED, and `checkTenantPermission` resolves the STATION's organisation — so the
# same trick against a POOL station fails membership and falls through to a NULL-team grant
# a tenant role does not have. Self-provisioning the station too is what makes those three
# files `skip_when_pooled`; it would make this one a fourth copy of them, not a
# device-management scenario.
#
# SO THE FINDING IS THE ROUTE, NOT THE FILE: the only catalog door on the server sits behind
# a role this corpus cannot obtain. Recorded rather than worked around — the alternatives are
# re-seeding the UAT account at `platform_super_admin`, or teaching the runner to hand a
# scenario the pool owner's password. Both are identity changes made to get a green line,
# which is the reason a refusal proof is worth having in the first place.
#
# ── THE SKIP IS LIFTED, 2026-08-26 — BY THE CHANGE THIS HEADER ASKED FOR ────────────────
#
# The paragraph that stood here said: "WHAT LIFTS THE SKIP: any identity holding
# `catalog.manage` over the station's own organisation that a scenario can name. The cheapest
# is the pool's ephemeral `tenant_owner`, which already exists on every pooled run and is one
# runner change away from being declarable. That change is not made here."
#
# It is made now. `PoolBootstrap` publishes the owner it already mints — and already deletes
# at teardown — to `SIM_POOL_OWNER_EMAIL` / `SIM_POOL_OWNER_PASSWORD`, and the `auth:` block
# below names them. Nothing in the permission model moved: no account was re-seeded, no grant
# widened, no role changed. The identity that always held `catalog.manage`
# (RolesAndPermissionsSeeder:372) is now reachable by the run that creates it. The two
# alternatives this header rejected — re-seeding the UAT account at `platform_super_admin`,
# or working around the gate — are still rejected and were not taken.
#
# THE SAME REPAIR UNBLOCKED A SECOND AREA, which is why it was worth making rather than
# working around: `stations.manage_provisioning_tokens` sits on the same role
# (RolesAndPermissionsSeeder:369), and its absence was the reason five of the eight
# provisioning refusals could not be provoked at all. See scenarios/provisioning/.
#
# `requires_pool` REPLACES `skip: true` + `skip_kind: inconclusive`, and the change of kind
# is deliberate. `inconclusive` was right while the property was OWED and unprovable — it
# made `--require-conclusive` refuse to call such a run successful. Outside a pooled run the
# identity does not exist to be published, so nothing about the server is in question and the
# skip is honestly `not-applicable`. Inside one — which is every unattended run — the file
# now RUNS, so the property is proven rather than excused.
#
# It was proven once before, on the wire, against the local stack at `cc92bfc` — 7/7 steps,
# `catalogVersion "2"`, `previousCatalogVersion "1"`, `serviceCount 4` — which is what made
# those steps worth keeping rather than deleting. They are kept for what they prove, not for
# those numbers: since 2026-09-29 they run on a station this file owns, where the first
# version is "1" and the version it replaced is "" (next section).
#
# ── IT OWNS ITS STATION, 2026-09-29 — A POOL STATION'S VERSION IS SHARED STATE ───────────
#
# UNTIL THIS CHANGE the file ran on a POOL station and asserted `catalogVersion "2"`: the
# bootstrap seeds `current_catalog_version = '1'` on every pool station and the first publish
# increments it. That is true only of a pool station no other file has published to, and one
# other file does publish to pool stations: catalog-refused-keeps-the-previous-one.yaml, whose
# second publish is answered Accepted and so advances the same column. The release corpus of
# 2026-09-29 (csms-server 387ebe1f on UAT, 150 passed / 1 failed / 8 skipped) failed exactly
# here — `expected body "catalogVersion" to equal "2", but got "3"` on stn_e60fd49a, the pool
# station that file had run on less than two minutes earlier. Two controls placed the cause
# in the fixture and not in the catalog: this file alone, `--bootstrap-pool --pool-size 1`,
# passed; the pair in that order, `--workers 1` on `--pool-size 1`, reproduced "3".
#
# THE SHARED STATE IS REMOVED, NOT THE ASSERTION. Capturing the version, as the refusal twin
# does, would have tolerated the sharing and given up what an absolute number proves: that
# the server starts a station's sequence where it should. `owns_station` keeps
# the number knowable instead — the station below is registered, provisioned, connected and
# booted by this file inside the run's organisation, so no other file has published to it.
#
# WHAT IS TRUE ON A STATION OF ITS OWN, each read off the server rather than chosen:
#   - `stations.current_catalog_version` starts NULL. Registration does not write it, the
#     bootstrap seeds pool stations only, and the one writer on this path is the Accepted arm
#     of `UpdateServiceCatalogResponseHandler`. So the first publish claims "1" — the NULL arm
#     of `UpdateServiceCatalogAction::dispatch`.
#   - The station answering it has never held a catalog, so the version it replaced is "".
#     update-service-catalog-response.schema.json names the empty string "the legitimate value
#     for a station that has never held a catalog".
#   - The services are this file's own. The pool's seeded services are put onto pool stations
#     only, and they cannot be created here under their own ids either: service ids are unique
#     per ORGANISATION, the run's organisation already holds them, and a second create answers
#     422 SERVICE_ID_TAKEN. So the two services below carry ids scoped to this station, and
#     each is bound to the program its bay declared at provisioning.
#
# THE ORDER IS LOAD-BEARING: boot first, services after. `PublishFirstCatalogOnBoot` sends a
# station its first catalog when it boots with `current_catalog_version` NULL and something
# publishable. Bound before the boot, the services would go out as catalog "1" by that
# listener, and the publish below would claim "1" again while that request was still
# unanswered — two requests carrying one version. Booted with no service, the station is sent
# nothing, and the only UpdateServiceCatalog it receives is the one the publish below sends.
#
# NOT THE e2e SHAPE that "AND IT IS UNDER A PERMISSION" above rejected: no customer is
# registered and no organisation is created. The station is registered inside the run's organisation by the
# run's own tenant_owner, the identity the `auth:` block below already names.
requires_pool: >-
  POST .../catalog/publish, creating a service and binding it authorize `catalog.manage`;
  a new service's price also asks `pricing.manage`, and minting this file's provisioning
  token asks `stations.manage_provisioning_tokens`. All three are held by tenant_owner and by
  no identity that exists outside a bootstrapped run — the pool's ephemeral owner is minted
  and deleted per run, so there is no account to seed or to source from a secrets file.
owns_station: >-
  The catalog version is per station and only moves forward, so the absolute version this
  file asserts is true only of a station no other file has published to. Pool stations are
  shared, and catalog-refused-keeps-the-previous-one.yaml leaves the one it runs on a version
  ahead: on 2026-09-29 the two met on one pool station and this file read "3" where it
  asserted "2". A station this file registers itself has been published to by no one else.
auth:
  email_env: SIM_POOL_OWNER_EMAIL
  password_env: SIM_POOL_OWNER_PASSWORD
defer_mqtt_connect: true

station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- THE STATION THIS FILE OWNS. Registered in the run's organisation, provisioned, connected
  #     and booted before anything is published — every step up to the boot is precondition. ---
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/organizations"
    expect_status: 200
    capture:
      org_id: "data.0.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/locations"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    body:
      name: "Catalog update {{stationId}}"
      address: "Strada Simulare 1, Bucuresti"
      latitude: 44.4268
      longitude: 26.1025
      city: "Bucharest"
      country: "RO"
    expect_status: 201
    creates:
      location: "data.id"
    capture:
      location_id: "data.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    body:
      stationId: "{{stationId}}"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      locationId: "{{captured.location_id}}"
      bays:
        - bayNumber: 1
        - bayNumber: 2
    expect_status: 201
    creates:
      station: "data.station_id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/provisioning-tokens"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    body:
      note: "service catalog update"
    expect_status: 201
    capture:
      provisioning_token: "data.rawToken"

  # `bay_count: 2` declares program 1 on each bay — the ordinal both bindings below name.
  # `bindProgram` refuses an ordinal the bay never declared, so this is what makes them bindable.
  - action: provision
    token_var: "provisioning_token"
    serial_number: "{{serialNumber}}"
    bay_count: 2

  - action: connect_mqtt

  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        # Required: the publish below is a capability-gated Device Management action, and
        # `UpdateServiceCatalogAction::publish` pre-empts it — 409 COMMAND_PRE_EMPTED / 6008,
        # `wouldBe` 2007, reason `device_management_not_declared` — unless
        # device_management_supported === true. NULL is "not stated" and withheld too
        # (boot-notification.md §5.1, "Capability Semantics — absence means NOT STATED"). The
        # station is new, so this boot is the only thing that has ever declared it.
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- TWO SERVICES, EACH BOUND, AFTER THE BOOT (the header says why after). The ids carry the
  #     station id because service ids are unique per organisation. The prices differ, so each
  #     by-name assertion further down can only be met by the service it names. ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    body:
      serviceId: "svc_wash_{{stationId}}"
      serviceName: "Basic Wash"
      serviceKind: "UserDuration"
      pricingType: "PerMinute"
      priceCreditsPerMinute: 100
      available: true
    expect_status: 201
    expect_body:
      data.serviceId: "svc_wash_{{stationId}}"
    capture:
      wash_service_id: "data.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services/{{captured.wash_service_id}}/binding"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    body:
      bayId: "{{captured.bayId_1}}"
      programNumber: 1
    expect_status: 201
    expect_body:
      binding.bayNumber: 1
      binding.programNumber: 1

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    body:
      serviceId: "svc_dry_{{stationId}}"
      serviceName: "Dry"
      serviceKind: "UserDuration"
      pricingType: "PerMinute"
      priceCreditsPerMinute: 50
      available: true
    expect_status: 201
    expect_body:
      data.serviceId: "svc_dry_{{stationId}}"
    capture:
      dry_service_id: "data.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services/{{captured.dry_service_id}}/binding"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    body:
      bayId: "{{captured.bayId_2}}"
      programNumber: 1
    expect_status: 201
    expect_body:
      binding.bayNumber: 2
      binding.programNumber: 1

  # NO BODY — the route takes none and would ignore one. The catalog it ships is the one the
  # server holds for this station: the two services created and bound just above.
  #
  # `withheld: []` is the assertion `expect_status: 202` cannot make. Publish does not refuse a
  # catalog over one service it cannot describe — it ships what is sellable and NAMES the rest —
  # so a 202 alone would not notice that one of the two bindings above had been dropped.
  #
  # ASSERTION 1 — the version is SERVER-GENERATED, and that is established rather than
  # assumed. `UpdateServiceCatalogAction::dispatch`, under a lock on the station row:
  #
  #   $nextVersion = ($current === null) ? '1' : (string) ((int) $current + 1);
  #
  # monotonic integer-as-string, per station, derived from the row. This request sends no
  # version and CANNOT send one, so the value is genuinely derived and not a restatement.
  #
  # Why "1": this station's `current_catalog_version` is NULL (header, last section), so this
  # publish is its first version. "2" or higher would mean an Accepted catalog had been
  # persisted for this station before this step, which nothing in this file does.
  #
  # The key is `catalogVersion`, camelCase — this response is
  # `StationServiceCatalogController::publish`, NOT the retired route's flat snake_case
  # `catalog_version`. Two doors, two spellings; the assertion moved with the door.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/catalog/publish"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    expect_status: 202
    expect_body:
      catalogVersion: "1"
      withheld: []

  - action: wait_for
    message: UpdateServiceCatalog
    messageType: Request
    timeout_ms: 15000
    capture:
      catalogVersion: "payload.catalogVersion"
      catalog_msg_id: "messageId"

  # ASSERTION 2 — the same server-generated version CROSSES THE WIRE. The REST response above
  # proves the server computed it; this proves it reached the station in the published
  # Request, which is the half that actually matters to a fleet. Two surfaces, one value,
  # neither supplied by this scenario.
  - action: assert
    field: "payload.catalogVersion"
    equals: "1"

  # ASSERTION 3 — the services this file created are on the wire, BY NAME AND NOT BY COUNT.
  #
  # Each entry is selected out of `payload.services` by its own `serviceId`, so the assertion
  # is blind to how many other services the array carries and to what order the server put
  # them in. A missing service resolves to `undefined` and fails naming itself.
  #
  # A count was the assertion once — `serviceCount: 4`, on a pool station — and it was
  # withdrawn on 2026-08-27, when a pool station carrying a fifth service another file had
  # asked for read 5. No other file can add a service to this station, but the by-name form is
  # still the stronger one: it names WHICH service is missing where a count says only that one is.
  #
  # `pricingType` and the price rather than a restatement of the id: matching on `serviceId`
  # and then asserting `serviceId` would pass on anything the selector found, which is only the
  # selector agreeing with itself. The two prices differ, so an item carrying the other
  # service's price fails.
  #
  # The array selector reaches `assert` because AssertStep shares ApiCallStep's resolver; its
  # own copy split on `.` and could only index arrays by POSITION, which for an unordered
  # collection pins whichever element the database returned first.
  - action: assert
    field: "payload.services[serviceId=svc_wash_{{stationId}}].pricingType"
    equals: "PerMinute"

  - action: assert
    field: "payload.services[serviceId=svc_wash_{{stationId}}].priceCreditsPerMinute"
    equals: 100

  - action: assert
    field: "payload.services[serviceId=svc_dry_{{stationId}}].pricingType"
    equals: "PerMinute"

  - action: assert
    field: "payload.services[serviceId=svc_dry_{{stationId}}].priceCreditsPerMinute"
    equals: 50

  # `correlationId` is what makes this a ROUND TRIP rather than a message shouted at a server
  # that will drop it. UpdateServiceCatalogResponseHandler:32 resolves the pending command by
  # (stationId, messageId) and returns early with "no pending command found" when it cannot —
  # so without this the catalog is never persisted and every assertion above still passes.
  # The three e2e parcours have always correlated; this file did not.
  - action: send
    message: UpdateServiceCatalog
    messageType: Response
    correlationId: "{{captured.catalog_msg_id}}"
    payload:
      status: "Accepted"
      # REQUIRED on the Accepted arm (the schema's allOf), and "" is the value that is TRUE
      # here: this station has never held a catalog, and the schema names the empty string as
      # the value for exactly that. `UpdateServiceCatalogResponseHandler` reads it as a value,
      # not as an absence, and compares it against its own tracked version with NULL read as
      # "" — so the two agree and no disagreement is logged. On the pool station this file
      # used to run on, "1" was the true answer, because the bootstrap had seeded it.
      previousCatalogVersion: ""
