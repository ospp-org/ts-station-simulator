# WHAT IS COVERABLE HERE, AND WHAT IS NOT — established 2026-08-10
#   COVERABLE, and asserted below: the server published a TriggerMessage carrying the
#   requestedMessage the REST call asked for. That value is server-resolved (POST body ->
#   TriggerMessageDto -> the pushed Request), and it is what SEPARATES the three
#   trigger-message files: swap two of their POST bodies and both assertions break. Before
#   this, all three asserted only that the boot was Accepted and the POST returned 202, so
#   they were interchangeable.
#
#   NOT COVERABLE, and deliberately not faked: that the station's SUBSEQUENT message was
#   CAUSED by the trigger. Nothing server-side links the two — `requestedMessage` appears
#   only in the request DTO/validation and TriggerMessageResponseHandler; no correlation id
#   is stored and the resulting Heartbeat/StatusNotification/BootNotification carries no
#   "triggered" marker. The reply this scenario sends is its OWN scripted literal, so
#   asserting the server ingested it (last_seen_at moves for a Heartbeat, bays.status for a
#   StatusNotification, boot_reason for a BootNotification) would prove ingestion and NOT
#   causation — an unsolicited message updates exactly the same state. Closing that gap needs
#   the server to correlate the reply to the pending TriggerMessage; until then the trigger's
#   EFFECT is unobservable from a scenario and only its DISPATCH is proven.
name: "Trigger Message StatusNotification"
description: "Server triggers StatusNotification messages for each bay"
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/trigger-message"
    body:
      requestedMessage: "StatusNotification"
    expect_status: 202

  - action: wait_for
    message: TriggerMessage
    messageType: Request
    timeout_ms: 15000

  # Server-resolved from the POST body — and the only thing separating these three files.
  - action: assert
    field: "payload.requestedMessage"
    equals: "StatusNotification"

  - action: send
    message: TriggerMessage
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_2}}"
      bayNumber: 2
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  # 1000ms: StatusNotification is an EVENT with no Response to synchronise on,
  # and 300ms was measured INSIDE the consumer race on UAT (2026-08-10).
  - action: delay
    ms: 1000

  # THE ASSERTION PROVES THE EFFECT, NOT THE TRIGGER. Stated plainly because the
  # distinction is the whole subject of this file.
  #
  # What it proves: the two StatusNotification Events above LANDED and moved
  # bays.status. Both bays start at `unknown` (create_bays_table:18) on a fresh
  # pool station, and `unknown` is a value no station may put on the wire, so
  # reading `available` cannot be satisfied by the initial state — it has a real
  # failure mode. Until now this file asserted only that the TriggerMessage
  # round-tripped, so a StatusNotification that was schema-rejected and dropped to
  # the DLQ would have changed nothing about the result.
  #
  # What it does NOT prove: that the TRIGGER caused them. A bay row written by a
  # solicited StatusNotification is byte-identical to one written by an
  # unsolicited one — the server stores no correlation between the TriggerMessage
  # and the message that follows, and the StatusNotification carries no marker
  # saying it was requested. This is the same ceiling the trigger-message pattern
  # already documented one level up: dispatch is provable, causation is not.
  #
  # So the honest reading is: TriggerMessage was dispatched and accepted (asserted
  # above, on the wire), AND a StatusNotification subsequently landed (asserted
  # here, server-side). The arrow between them is inferred, not measured, and no
  # assertion available on this server can close it.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bays[bayNumber=1].status: "available"
      data.bays[bayNumber=2].status: "available"
