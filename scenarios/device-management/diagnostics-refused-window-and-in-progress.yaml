name: "Diagnostics Refused — an equal window at the door, then the one already running"
description: "Request diagnostics with startTime EQUAL to endTime: the door refuses it (after:startTime since csms-server d1b89feb), 422 with Laravel's validation error on endTime and no ospp code, and nothing reaches the wire. Widen the window by one hour and the identical request is 202 and reaches the station. Then, with that upload still unfinished, a second request is refused 409 + 5107 OPERATION_IN_PROGRESS."
# ARM 1 — AN EQUAL WINDOW, REFUSED AT THE DOOR.
#
#   GetDiagnosticsRequest.php:55      'endTime' => ['nullable', new IsoDate, 'after:startTime']
#   RequestDiagnosticsAction.php:108  if ($startTime !== null && $endTime !== null && $startTime >= $endTime)
#                                     -> 5020 INVALID_TIME_WINDOW (:111)
#
# UNTIL csms-server d1b89feb (2026-09-25) THIS ARM STOOD ON A DISAGREEMENT BETWEEN THOSE TWO LINES.
# The request rule was `after_or_equal:startTime`, which ADMITTED equality while the action's `>=`
# refused it, so `startTime == endTime` was the one input that reached the action's own 5020, answered
# 422 with `error.ospp_code: 5020` / `error.code: INVALID_TIME_WINDOW`. The scenario's name described
# that instant ("the one instant the validator allows and the action does not") and changes with it.
#
# d1b89feb made the door strict, so the equal window is now refused by the FormRequest, before the
# controller runs, as Laravel's validation error on `endTime`:
#
#   422 {"message":"The end time field must be a date after start time.",
#        "errors":{"endTime":["The end time field must be a date after start time."]}}
#
# Laravel's shape and not an OSPP Error Object, because this route carries no OsppErrorSurface
# (bootstrap/app.php:176-179 hands an uncovered route's ValidationException back to Laravel).
# MEASURED on UAT: the corpus run results/uat-25a89fd7-20260928T055130Z and a single re-run of this
# file against csms-server 25a89fd7 both failed the old assertion with exactly that body.
#
# THE ACTION'S 5020 IS NO LONGER REACHABLE OVER HTTP for an equal or inverted window. The fleet door
# moved in the same commit (DashboardDeviceController.php:313, `after:start_time`), and the two doors
# are the action's only callers. So arm 1 now proves the DOOR's refusal, not the action's guard.
#
# WHAT ARM 1 ASSERTS, AND WHY NOT THE MESSAGE. The status, exactly one validation message on `endTime`,
# and the ABSENCE of `error` (the envelope the action's 5020 was answered in) and of
# `errors.startTime` / `errors.uploadUrl`. The message itself is a Laravel translation string, and
# pinning it would make a message-catalogue change read as a server regression — the same choice
# firmware-nonconformant-command-reaches-the-wire.yaml makes for its 422s. What attributes the refusal
# to the WINDOW rather than to the date FORMAT (IsoDate sits on the same field) is the control: it
# changes only the hour of `endTime`, and the same door accepts it.
#
# ARM 2 IS THE ONE THAT WOULD HAVE BITTEN A LATER SCENARIO. `5107 OPERATION_IN_PROGRESS` needs
# an unfinished diagnostics upload — and creating one is exactly how a file leaves a station
# wedged: `diagnostics-upload.yaml` and `diagnostics-failure.yaml` both request diagnostics and
# would meet a 409 from a leftover row rather than the 202 they expect. The upload this file
# opens is therefore DRIVEN TO `Uploaded` before the file ends, and the closing GET asserts it
# — which both frees the station and proves arm 2's precondition was real rather than assumed.
#
# THREE OF THE SEVEN EXITS ARE DEAD AND ARE NOT ATTEMPTED, measured rather than skipped quietly
# (RequestDiagnosticsAction.php line numbers at csms-server 25a89fd7):
#   :54  STATION_NOT_REGISTERED — every caller resolves the station and 404s first
#                                 (findStationByOsppIdOrFail, StationManagementController.php:703,
#                                 on the per-station route; resolveAndAuthorizeTargets on the fleet one).
#   :101 VALIDATION_ERROR       — `url:https` in the FormRequest pre-empts the action's own
#                                 uploadUrl check on both routes.
#   :111 INVALID_TIME_WINDOW    — `after:startTime` / `after:start_time` pre-empt it on both routes
#                                 since d1b89feb; arm 1 below is where that is measured.
# The capability gate (:80) is proved at a different site by
# maintenance-refused-capability-not-declared.yaml; the seven copies are indistinguishable on
# the wire, so a second proof of the same triple here would add a site and no discrimination.
# `6003 STATION_OFFLINE` (:62) is left to a file whose subject is being offline.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        # Load-bearing: without it the capability gate at :71 answers 6008 and neither exit
        # under test is ever reached.
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- ARM 1 — THE ZERO-WIDTH WINDOW. Identical timestamps: refused by the door's
  # `after:startTime` (GetDiagnosticsRequest.php:55) before the controller runs, so the answer is
  # Laravel's validation error on `endTime` and the action's 5020 is never reached. See the header.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/diagnostics"
    body:
      uploadUrl: "https://diagnostics.example.com/upload"
      startTime: "2026-01-01T00:00:00Z"
      endTime: "2026-01-01T00:00:00Z"
    expect_status: 422
    expect_body:
      # ONE message, on the end of the window. The field has no `bail`, so Laravel runs every rule
      # on it (Validator::shouldStopValidating): a malformed date would fail IsoDate AND `after`
      # (two messages), while an equal, well-formed one fails `after` alone.
      errors.endTime.length: 1
    expect_body_absent:
      # The OSPP envelope the action's own 5020 was answered in — present until d1b89feb.
      - "error"
      # The other two fields are conformant, so they carry no message: the refusal is the window's.
      - "errors.startTime"
      - "errors.uploadUrl"

  # NOTHING WAS PUBLISHED. The guard runs before the command is built, so a GetDiagnostics
  # arriving here would mean the station was asked to collect over a window the server had
  # already decided it would refuse.
  - action: wait_for
    message: GetDiagnostics
    messageType: Request
    timeout_ms: 6000
    expect_silence: true

  # --- THE CONTROL. One field changes: `endTime` moves an hour later. Everything else —
  # route, uploadUrl, startTime, station, connection — is identical. This is also the clean
  # same-action wait the silence above requires.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/diagnostics"
    body:
      uploadUrl: "https://diagnostics.example.com/upload"
      startTime: "2026-01-01T00:00:00Z"
      endTime: "2026-01-01T01:00:00Z"
    expect_status: 202

  - action: wait_for
    message: GetDiagnostics
    messageType: Request
    timeout_ms: 15000

  - action: send
    message: GetDiagnostics
    messageType: Response
    payload:
      status: "Accepted"
      fileName: "diag_{{stationId}}.tar.gz"

  - action: delay
    ms: 1000

  # --- ARM 2 — ONE IS ALREADY RUNNING. The row the control just created is unfinished, so the
  # in-transaction recheck refuses a second. Note this is NOT the same guard as the DB unique
  # index below it (:199), which is the backstop for the case where the lock was bypassed;
  # the two answer the same code and the same message shape, and nothing on the wire tells
  # them apart — recorded, not asserted, because a scenario cannot bypass the lock to reach
  # the second one.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/diagnostics"
    body:
      uploadUrl: "https://diagnostics.example.com/upload-second"
    expect_status: 409
    expect_body:
      error.ospp_code: 5107
      error.code: "OPERATION_IN_PROGRESS"

  # --- DRIVE THE UPLOAD TO A TERMINAL STATE. Not teardown politeness: an unfinished row is
  # what arm 2 stands on, so leaving it would hand the next scenario that requests diagnostics
  # the 409 this file just proved — a red far from here, for a reason nobody would connect to
  # this file.
  - action: send
    message: DiagnosticsNotification
    messageType: Event
    payload:
      status: "Collecting"

  - action: delay
    ms: 500

  - action: send
    message: DiagnosticsNotification
    messageType: Event
    payload:
      status: "Uploading"
      progress: 100

  - action: send
    message: DiagnosticsNotification
    messageType: Event
    payload:
      status: "Uploaded"
      fileName: "diag_{{stationId}}.tar.gz"

  - action: delay
    ms: 1500

  # THE STATION IS FREE, PROVEN. `uploaded` is terminal, so the row no longer counts as
  # unfinished — which is the same fact arm 2 relied on, read from the server rather than
  # assumed from the notifications this file sent.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/diagnostics"
    expect_status: 200
    expect_body:
      data[upload_url=https://diagnostics.example.com/upload].status: "uploaded"
