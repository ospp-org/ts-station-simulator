# WHAT DISTINGUISHES THIS FILE FROM ITS SIBLINGS — measured on the wire 2026-08-10
#   The three firmware-update files asserted the same two things (boot Accepted, POST 202)
#   and nothing about the outcome. Each now reads the server's own record back off
#   GET /api/v1/admin/stations/{stationId}/firmware, which is a COLLECTION — hence the
#   [firmware_version=2.0.0] selector rather than an index (data.bays taught that lesson).
#
#   MEASURED, all three on fresh single-station pools:
#     success           status "rebooting"  error_text null   completed_at unset
#     download-failure  status "failed"     error_text "Download failed: network error"
#     install-failure   status "failed"     error_text "Installation failed: checksum mismatch"
#
#   `status` is genuinely SERVER-DERIVED and separates success from failure: the station
#   reports "Installed" and the handler stores REBOOTING
#   (FirmwareStatusNotificationHandler.php:147), so asserting "rebooting" pins a
#   transformation the server performs rather than a value it was handed.
#
#   THE TWO FAILURE VARIANTS ARE NOT SEPARATED BY ANY SERVER-DERIVED VALUE, and that is
#   recorded rather than papered over. FirmwareUpdateStatus has ONE failure state — `failed`
#   (vendor/ospp/protocol/src/Enums/FirmwareUpdateStatus.php:18); there is no DownloadFailed
#   vs InstallationFailed. Measured, download-failure and install-failure agree on status,
#   progress AND completed_at. The only difference is `error_text`, which is ECHOED from the
#   station's own payload (`$updates['error_text'] = $errorText ?? 'Unknown error'`, :135).
#   Asserting it proves the report round-tripped and persisted — real, but persistence, not
#   server judgement. It is the same category as the security-event severity assertions.
# ── THE CEILING: EVERY FIRMWARE FAILURE HERE IS REPORTED, NEVER DISCOVERED ─────────────────
# This file's description claimed a "Full firmware update lifecycle". Read as a claim about
# the STATION it is false, and it was read that way (audit A1-133). Each phase below is a
# `send` step this file scripts.
# Nothing in this repo fetches an image, computes a hash, verifies an ECDSA image signature,
# or writes a partition — and the ceiling is STRUCTURAL, in two independent places:
#
#   1. `src/handlers/UpdateFirmwareHandler.ts`, the only code that could stage anything,
#      imports `@ospp/protocol` and `./Handler.js` and nothing else — zero `fetch`, zero
#      `node:fs`, zero `node:crypto`. It answers Accepted and emits the four phases off a
#      `setTimeout(1000)` loop. 1 of the 20 handlers imports any I/O at all and it is
#      TriggerMessageHandler, not this one.
#   2. THAT HANDLER IS NOT IN THIS LOOP EITHER, which is the half A1-133 named the wrong site
#      for. Scenario mode registers exactly ONE handler — `BootNotificationHandler(false)`,
#      for the sessionKey (`ScenarioRunner.ts:1226-1241`) — against the 20 the interactive
#      `connect` command registers (`cli/index.ts:848`). Even the timer is absent here.
#
# WHAT IS STILL PROVEN is on the SERVER side and is worth the file: that the command reaches
# the wire, that the reports round-trip, and that the row the server derives from them says
# what it should. `FirmwareIntegrityCeiling.test.ts` pins both facts above, so this note goes
# RED if it ever becomes an understatement.
#
name: "Firmware Update Success"
description: "The station REPORTS the four firmware phases — Downloading, Downloaded, Installing, Installed — and the server derives `rebooting` from the last of them. Nothing is downloaded, hashed or verified: see the ceiling above."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/firmware"
    body:
      firmwareUrl: "https://cdn.example.com/firmware/v2.0.0.bin"
      firmwareVersion: "2.0.0"
      checksum: "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      signature: "MEUCIQDexample"
    expect_status: 202

  - action: wait_for
    message: UpdateFirmware
    messageType: Request
    timeout_ms: 15000
    capture:
      firmwareVersion: "payload.firmwareVersion"

  - action: send
    message: UpdateFirmware
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: FirmwareStatusNotification
    messageType: Event
    payload:
      status: "Downloading"
      firmwareVersion: "{{captured.firmwareVersion}}"
      progress: 0

  - action: delay
    ms: 500

  - action: send
    message: FirmwareStatusNotification
    messageType: Event
    payload:
      status: "Downloaded"
      firmwareVersion: "{{captured.firmwareVersion}}"

  - action: delay
    ms: 500

  - action: send
    message: FirmwareStatusNotification
    messageType: Event
    payload:
      status: "Installing"
      firmwareVersion: "{{captured.firmwareVersion}}"
      progress: 0

  - action: delay
    ms: 500

  - action: send
    message: FirmwareStatusNotification
    messageType: Event
    payload:
      status: "Installed"
      firmwareVersion: "{{captured.firmwareVersion}}"

  # THE ASSERTION — the server's own firmware record, not the notifications this file sent.
  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/firmware"
    expect_status: 200
    expect_body:
      data[firmware_version=2.0.0].status: "rebooting"
