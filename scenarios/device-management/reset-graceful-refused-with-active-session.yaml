# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
#
# REQUIRES TESTING_TRIGGER_COMMAND_ENABLED=true on the target (default false —
#   app/Http/Middleware/TestingEnabledMiddleware.php, config/testing.php:12).
#
# SERVER BRANCH REACHED
#   csms-server app/Modules/DeviceManagement/Actions/ResetStationAction.php:125-134
#     $bayUuids = $this->stationQuery->resolveBayUuidsForStation($stationId);
#     if (! $dto->force && count($bayUuids) > 0
#         && $this->sessionQuery->hasActiveSessionsForBays($bayUuids)) {
#         throw new OsppException(OsppError::from(
#             OsppErrorCode::COMMAND_PRE_EMPTED,
#             "Cannot reset station {$stationId}: active sessions in progress",
#             ['wouldBe' => OsppErrorCode::ACTIVE_SESSIONS_PRESENT->value,
#              'reason'  => 'active_sessions_present'],
#         ));
#     }
#
#   This is a SERVER-side pre-flight, and the thing worth pinning about it is
#   what it does NOT do: no Reset REQUEST is published, and no pending command is
#   registered. The station is never asked.
#
# CORRECTED 2026-08-13 — the header used to end: "The spec gives the STATION the
#   refusal here (3016 ACTIVE_SESSIONS_PRESENT) and the server pre-empts it with
#   6005 instead — a documented fidelity gap." One half of that was a misreading
#   at the wrong altitude. 07-errors.md:332 does not OFFER 3016 to a pre-empting
#   server, it FORBIDS it: a server that stops the command locally "MUST NOT
#   answer with this code — it answers 6008 COMMAND_PRE_EMPTED carrying
#   details.wouldBe: 3016". So the gap was real and 6005 was wrong, but the fix
#   was never "let the station answer" — the pre-empt itself is expressly allowed
#   (:456 calls it "an OPTIMISATION … never required"). What was never allowed is
#   the code it answered with.
#
#   Why 6005 was the worse of the two available wrongs, and worth recording: it is
#   defined as "The user already has an active session" and addresses its recovery
#   to that user — "must stop or wait for the current session". Here the
#   precondition belongs to the STATION, the session on the bay may be a
#   stranger's, and the reader is an operator who cannot act on that instruction
#   at all. It named the wrong subject and shipped an inapplicable remedy with it.
#
# THE FILE THIS REPLACED — resolved 2026-08-10
#   device-management/reset-rejected-active-sessions.yaml drove the SAME endpoint
#   with an active session and `expect_status: 202`, then waited for a Reset
#   REQUEST and answered 3016. Both could not be right. Its payload was
#   `{type: "Soft"}` — `type` is not a member of the Reset validator
#   (TriggerCommandController.php:135-139 accepts only `force`) and Laravel's
#   validate() returns only validated keys, so it was dropped and `force`
#   defaulted to false. That is the graceful path, which this pre-flight refuses,
#   so it failed 409/6005 on every run — 6005 being what the route answered then;
#   it is 6008 now, see the correction above.
#   It was DELETED, on the precedent of 32714b3 (which deleted boot-rejected.yaml
#   when it wrote the replacement rather than leaving two files disagreeing).
#   Nothing it covered is now uncovered: its intent — proving the STATION's 3016 —
#   has no reachable path while the server pre-empts at :125, and the Reset DISPATCH
#   path it walked is covered by soft-reset.yaml, hard-reset.yaml and
#   reset-forced-settles-session-as-operator-stop.yaml. Note what changed and what
#   did not: the STATION's 3016 is still unreachable here, but it is no longer
#   invisible — the pre-empt now names it in details.wouldBe, which is the closest
#   thing to that deleted file's intent that a conforming server can offer.
#
# WHAT IS ASSERTED — all server-produced
#   1. HTTP 409 + error.ospp_code 6008 COMMAND_PRE_EMPTED from the trigger
#      endpoint. This is the CLASS of refusal: a command the server stopped
#      locally. It is not yet the gate.
#   2. error.details.wouldBe 3016 — THE discriminator, and on this route it is not
#      optional decoration. ResetStationAction emits 6008 from TWO pre-flights:
#      :74-75, the device-management capability gate, with wouldBe 2007; and
#      :130-131, this one, with wouldBe 3016. Same code, same status, same
#      endpoint, adjacent in the same method. A file asserting only 6008 passes on
#      either — including on the run where this scenario's boot stops landing its
#      deviceManagementSupported:true and the capability gate answers first. That
#      is not hypothetical: the comment at the boot step below records it happening
#      (measured 2026-08-10), and it is the failure this file was hardened against.
#      Asserting the class code alone would quietly give that hardening back.
#      The two also differ for the operator, which is the point of carrying the
#      station's code at all: 3016 is a refusal that CAN be forced past — :456
#      requires a Reset with force:true to be dispatched however many sessions run
#      — while 2007 is one no override reaches.
#   3. error.details.reason "active_sessions_present" — the same discrimination by
#      name rather than by number.
#   4. SILENCE on the wire. A pre-flight that threw but had already published
#      would satisfy 1-3 and fail this — which is the whole point of checking both.
name: "Reset Graceful Refused With Active Session"
description: "Trigger an unforced Reset while a session is active. The server must pre-empt it with 6008 (details.wouldBe 3016) before publishing anything, so no Reset ever reaches the station."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        # Required: this file drives a capability-gated Device Management action, whose
        # FIRST pre-flight (ResetStationAction.php:86) refuses unless
        # device_management_supported is `true` — NULL is "not stated" and withheld too
        # (OSPP §5.1 rule 3). Measured 2026-08-10: without this the file fails on a FRESH
        # pool station; it only ever passed by inheriting the flag from a sibling scenario
        # on a reused station. That refusal used to be a plainly different code (2007) and
        # is now the SAME 6008 this file expects, separated only by details.wouldBe 2007 vs
        # 3016 — so the assertion below is what still tells the two apart.
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay available, then the active session that arms the pre-flight ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 600
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"

  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false

  - action: delay
    ms: 1500

  # The pre-flight reads sessions in {pending, authorized, active, stopping}, so
  # any of those arms it. Pinning `active` makes the refusal below attributable
  # to a genuinely delivering session rather than to a start that never landed.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"

  # ASSERTION 1 — the refusal. `force` is omitted, which IS the graceful path:
  # the validator has it as `sometimes`, and ResetRequestDto is built with
  # `(bool) ($data['force'] ?? false)`. Omitting it is also what keeps this branch
  # reachable at all: :456 forbids pre-empting a command carrying an override the
  # station would honour, so `force: true` must be dispatched and never lands here.
  #
  # Measured verbatim on UAT 2026-08-13, csms-server 32b7c6a:
  #   {"error":{"code":"COMMAND_PRE_EMPTED","ospp_code":6008,
  #             "message":"Cannot reset station stn_30b659d6: active sessions in progress",
  #             "details":{"wouldBe":3016,"reason":"active_sessions_present"}},
  #    "meta":{"timestamp":"2026-08-13T04:30:07.700593Z"}}
  #
  # `message` is deliberately NOT asserted: it interpolates the stationId, which
  # the pool allocates per run.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/testing/trigger-command/{{stationId}}"
    body:
      command: "Reset"
      payload: {}
    expect_status: 409
    expect_body:
      error.ospp_code: 6008
      error.details.wouldBe: 3016
      error.details.reason: "active_sessions_present"

  # ASSERTION 2 — nothing was published. The station is never asked, so a Reset
  # REQUEST arriving here would mean the pre-flight ran too late to prevent the
  # side effect it exists to prevent.
  #
  # THE WEAKEST OF THE SIX SILENCES IN THIS CORPUS, and it needs saying here. No
  # clean control follows it — WaitForStep's docblock requires one — and unlike
  # the two firmware cases there is no control in EITHER direction: this file
  # never once shows a Reset Request arriving on this connection. Its only
  # `wait_for`s are BootNotification and StartService. A station that could never
  # receive a Reset at all passes this step exactly as a correct pre-flight does.
  #
  # Reset delivery IS proven elsewhere — soft-reset.yaml, hard-reset.yaml,
  # reset-forced-settles-session-as-operator-stop.yaml — but those are separate
  # runs on separate connections, and a different process's success cannot
  # attribute this process's silence.
  #
  # REPAIRED 2026-08-26 — the control is the five steps at the end of this file. Read them
  # before trusting this one: they issue the IDENTICAL command on the IDENTICAL route over
  # this same connection once the session is gone, and a Reset Request arrives. So the
  # silence below is now attributable — a station that could not receive a Reset at all
  # fails at the bottom of the file, which is exactly what it used to pass.
  - action: wait_for
    message: Reset
    messageType: Request
    timeout_ms: 6000
    expect_silence: true

  # --- Pool-hygiene teardown. (Class: session-leak.)
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "Local"
      actualDurationSeconds: 3
      creditsCharged: 5
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true

  # ═══ THE CLEAN CONTROL — the thing this file lacked in EITHER direction ═══
  #
  # WaitForStep's docblock makes it a MUST: "every scenario using this MUST follow it with
  # an ordinary wait_for on a CLEAN message of the same action", because a dead link, a
  # wedged worker and a correct pre-flight produce identical silence. This file used to have
  # no control at all — its only `wait_for`s were BootNotification and StartService, so it
  # never once showed a Reset arriving on this connection and a station that could not
  # receive one passed it identically.
  #
  # WHY THIS IS A STRONGER CONTROL THAN THE ONE THE DOCTRINE ASKS FOR. It is not merely "a
  # clean message of the same action" — it is the SAME COMMAND on the SAME ROUTE with the
  # SAME BODY, differing from the refused call in exactly one thing: the session that was
  # active then has been settled by the two Events above. So the pair below does not just
  # prove the link is alive; it proves the pre-flight's PREDICATE, by exercising both of its
  # positions on one connection within seconds.
  #
  # The settle is needed because the SessionEnded above is an EVENT: the server has
  # acknowledged the publish, not applied it, and the pre-flight reads the session table.
  - action: delay
    ms: 2000

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/testing/trigger-command/{{stationId}}"
    body:
      command: "Reset"
      payload: {}
    expect_status: 202

  - action: wait_for
    message: Reset
    messageType: Request
    timeout_ms: 15000

  # ANSWER IT, for the reason soft-reset.yaml gives at its own Response: scenario mode
  # registers no ResetHandler, so an unanswered command is left for its Redis TTL to expire
  # and this file would hand the pool a station with a command still in flight.
  # ResetResponseHandler resolves the pending command and dispatches StationReset, which has
  # zero listeners — so the Response writes nothing queryable and disturbs no later scenario.
  - action: send
    message: Reset
    messageType: Response
    payload:
      status: "Accepted"
