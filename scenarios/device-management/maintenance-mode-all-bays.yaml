# WHAT DISTINGUISHES THIS FILE FROM ITS SIBLINGS — verified on the wire 2026-08-10
#   The three maintenance-mode files used to assert the SAME two things: the boot was
#   Accepted, and the POST returned 202. Swapping any two of their bodies left both passing,
#   so the variant was decoration. Each now reads the server's own bay state back.
#   Where that state comes from matters: SetMaintenanceModeAction does NOT write bays.status
#   — it only validates (it refuses a bay that is Occupied/Finishing) and publishes
#   SetMaintenanceMode. The status is written by the STATION's StatusNotification. So this
#   assertion proves the full round trip landed and persisted, not merely that the REST call
#   was accepted.
#   Measured directly after this scenario on a fresh pool: bay 1 `unavailable`, bays 2-4
#   `unknown` (never reported), which is what makes the per-bay assertion discriminating.
#   NOTE `{{bayId_N}}` is the REAL persisted bay id in a pooled run (ScenarioRunner hydrates
#   it from <stationId>-bays.json — the "hydrated provisioning" log line). The older comment
#   about a random bayId applies only to non-pooled runs.
#   ORDERING: data.bays comes back UNORDERED — three consecutive runs on 2026-08-10 gave
#   [2,3,4,1], [2,3,4,1] and [3,4,1,2]. The assertion selects by bayNumber, never by index;
#   an index form would pin whichever row the database happened to return first. The same
#   fact is why the maintenance POST below targets {{bayId_1}} rather than data.bays.0.bayId:
#   capturing index 0 requested maintenance on an arbitrary bay while the StatusNotification
#   reported bay 1, so the two halves of the file addressed different bays.
name: "Maintenance Mode All Bays"
description: "Enable maintenance mode on all bays (no bayId specified) and report Unavailable for each"
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        # Required: this file drives a capability-gated Device Management action, which
        # refuses COMMAND_NOT_SUPPORTED (2007) unless device_management_supported === true.
        # NULL is "not stated" and withheld too (OSPP §5.1 rule 3). Measured 2026-08-10:
        # without this the file fails 2007 on a FRESH pool station — it only ever passed by
        # inheriting the flag from a sibling scenario on a reused station.
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # ── ARM EVERY BAY BEFORE COMMANDING THEM ALL ────────────────────────────────
  #
  # This file omits `bayId`, which means ALL bays, and `SetMaintenanceModeAction` takes that
  # literally: it loops `getBaysForStation()` and validates each one, so a SINGLE bay left at
  # `Unknown` refuses the whole command with 3002 BAY_NOT_READY. The boot above put every bay
  # there — `BootNotificationHandler` calls `resetBaysToUnknown()` on every accepted Boot,
  # unconditionally — and only an accepted StatusNotification clears it.
  #
  # THE RULE IS NOT NEW, ONLY ITS ENFORCEMENT. `set-maintenance-mode.md` §6 has carried
  # `Unknown -> Rejected, 3002 BAY_NOT_READY` in both columns since spec `7eb6acb`
  # (2026-08-05); csms-server started applying it at `e9fa3fc4` (2026-08-18).
  #
  # TWO REPORTS BECAUSE THERE ARE TWO BAYS, and the count is not a coincidence: `fbb131a`
  # moved `DEFAULT_POOL_BAYS` to 2 naming THIS file — provisioning bays it never asserts on
  # made "all bays" read as complete while covering a subset. `PoolBaysCoversScenarios` now
  # pins the two numbers together, so a third bay cannot appear without this arm growing too.
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_2}}"
      bayNumber: 2
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  # NO `delay` HERE ON PURPOSE — the runner holds the ordering after an unacknowledged Event
  # (`UNACKED_EVENT_SETTLE_MS`), measured from the last publish, so both reports above are
  # covered by one floor. See the read-back note at the foot of this file.
  #
  # AND THE ARM IS PROVEN, NOT ASSUMED. Without this read the POST below would be the first
  # thing to notice a report that had not landed, and it would say 409 BAY_NOT_READY — which
  # reads as the maintenance gate refusing rather than as an arm that never arrived. Both
  # bays are asserted because the command below refuses on ANY of them.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bays[bayNumber=1].status: "available"
      data.bays[bayNumber=2].status: "available"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/maintenance"
    body:
      enabled: true
      reason: "Scheduled cleaning"
    expect_status: 202

  - action: wait_for
    message: SetMaintenanceMode
    messageType: Request
    timeout_ms: 15000

  - action: send
    message: SetMaintenanceMode
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Unavailable"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_2}}"
      bayNumber: 2
      status: "Unavailable"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false

  # THE ASSERTION — the server's own bay state, not the message this scenario authored.
  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bays[bayNumber=1].status: "unavailable"
      data.bays[bayNumber=2].status: "unavailable"
