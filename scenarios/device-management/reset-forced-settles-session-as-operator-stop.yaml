# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
#
# REQUIRES TESTING_TRIGGER_COMMAND_ENABLED=true on the target (default false).
#
# SERVER BRANCHES REACHED — four, in order
#   1. app/Modules/DeviceManagement/Actions/ResetStationAction.php,
#      `ResetStationAction::execute`
#        $message = MessageBuilder::request('Reset')->withPayload($dto->toPayload())->build();
#      `force: true` short-circuits the active-session pre-flight in the same method
#      (`! $dto->force`), so the command actually reaches the wire.
#      ResetRequestDto::toPayload() is `['force' => $this->force]` — where the forced-ness
#      reaches the wire; what it leaves once the station accepts is under WHAT THE
#      FORCED-NESS DOES below.
#
#   2. app/Modules/DeviceManagement/Handlers/ResetResponseHandler.php, the Accepted arm of
#      `ResetResponseHandler::handle`, and app/Listeners/SettleSessionsOnForcedReset.php,
#      `SettleSessionsOnForcedReset::handle`, the one listener of the StationReset that arm
#      dispatches. Reached by the Reset RESPONSE below; the journal row, the StopService and
#      the `stopping` state they leave are asserted, see WHAT THE FORCED-NESS DOES.
#
#   3. app/Modules/Session/Handlers/SessionEndedHandler.php, the OPERATOR_STOPPED arm of the
#      reason match in `SessionEndedHandler::handle`
#        SessionEndReason::OPERATOR_STOPPED => $this->autonomousComplete($dto, TerminalReason::OperatorDisabled),
#      No scenario in the corpus sends this reason. The 30 SessionEnded events across
#      107 files are Local (12), TimerExpired (10), LocalOutOfCredit (2), Fault (2),
#      Deauthorized (2), UnexpectedDisconnect (1), EXPIRED (1). The arm that settles a
#      wash an operator cut short (OperatorDisabled, by service kind) had never been
#      exercised.
#
#   4. app/Modules/Station/Handlers/BootNotificationHandler.php,
#      `BootNotificationHandler::failStuckSessions` — the post-reset
#      boot, which force-fails every session still in {pending, authorized, active,
#      stopping}. Reached here deliberately as a NEGATIVE: by then the session is
#      terminal, so that method's live-status predicate must no longer match it.
#
# WHAT THIS IS ACTUALLY ABOUT — the money, not the reboot
#   reset-request.schema.json: "True: the station settles every active session under
#   the operator-disable policy FIRST … and only then reboots." The two routes to the
#   same fact settle DIFFERENTLY: the settle-first arrives as SessionEnded/OperatorStopped
#   and completes the session, which the server settles by service kind — for the
#   service this file books, `{{serviceId_1}}` (the pool seeds svc_wash_basic with no
#   service_kind, which the server resolves to UserDuration), pro-rata on the delivered
#   time the station reports; a FixedDuration or MultiUnit session would be refunded in
#   full (04-flows.md §6 "Settlement by Service Kind"). If the settle-first is skipped
#   or lost, the RemoteReset boot force-fails it as ForceFailedReboot instead. So the
#   ordering IS the invariant, and the last assertion is what pins it — the session
#   must survive the reboot as `completed`, not be rewritten to `failed`.
#
# WHAT THE FORCED-NESS DOES, once the station accepts
#   `ResetResponseHandler::handle` reads `force` back from the pending command it resolves
#   (`ResetStationAction::execute` registered it from the same `$dto->force` it put on the
#   wire) and writes a `station_reset` row to the station journal, readable at
#   GET /api/v1/admin/stations/{stationId}/journal, whose reason and `details.forced`
#   differ between a forced and an unforced reboot. It then dispatches
#   StationReset(stationId, forced). The event's one listener, SettleSessionsOnForcedReset,
#   returns on an unforced reset; on a forced one it runs StopAllStationSessionsAction,
#   which stops every ACTIVE session on the station as an operator stop:
#   `StopSessionAction::execute` moves the session to `stopping` with stop_origin Operator
#   and only then publishes a StopService naming it, so a StopService on the wire means the
#   row already reads `stopping`. This file waits for that StopService before it sends the
#   SessionEnded below, so the session is `stopping` when that SessionEnded/OperatorStopped
#   arrives, and `SessionEndedHandler::handle` completes it on the same OperatorDisabled arm
#   it uses for an `active` one.
#
#   THE STOPSERVICE IS NOT ANSWERED. Scenario mode registers no StopService handler and no step
#   here answers it: an answer would be settled by StopServiceResponseHandler, a path this file
#   is not about. Unanswered, it stays `pending` until its timeout (10 s for StopService in
#   csms-server's `ospp.command_timeouts`); the scheduled command:check-timeouts
#   (CommandTimeoutScanner) then journals a `command_expired` row for it and runs its StopService
#   arm, `FailSessionAction::execute`, which writes nothing to a session already terminal. The
#   steps between the StopService and the SessionEnded are one assert and one GET, so the session
#   is `completed` well inside those 10 s.
#
#   What this file asserts of all that: `force` on the REQUEST (ASSERTION 1), the StopService
#   naming this session (ASSERTION 1a) and the session `stopping` (ASSERTION 1b), both before
#   the station's own SessionEnded, and this Reset's `station_reset` row with `details.forced`
#   true (ASSERTION 2a). The two `completed` assertions do not pin the listener: the station's
#   own settle-first completes the session whether or not the listener ran, because `active` to
#   `completed` is a valid transition too. csms-server pins the listener in
#   tests/Feature/Session/ForcedResetSettlesAsOperatorStopTest.php.
name: "Reset Forced Settles Session As Operator Stop"
description: "Forced Reset with a live session: the server must send force:true, stop the session as an operator stop once the station accepts (a StopService naming it, the session stopping) and journal a forced station_reset row; the settle-first SessionEnded/OperatorStopped must complete the session, and the post-reset RemoteReset boot must not rewrite it to failed."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        # Required: `ResetStationAction::execute` refuses the command unless
        # device_management_supported === true, and that gate runs BEFORE the same method's
        # active-session pre-flight — so without this the file dies at the wrong
        # gate and never reaches the forced-reset branch it exists to test. NULL is "not
        # stated" and is withheld too (boot-notification.md, "Capability Semantics —
        # absence means NOT STATED"). Declared at boot, as change-configuration-accepted.yaml's
        # boot declares it; no admin call sets it in this corpus.
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay available, then the live session the reset must settle ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 600
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"

  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false

  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"

  # --- The forced Reset. 202, unlike the graceful twin's 409, because `force`
  #     short-circuits the active-session pre-flight. ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/testing/trigger-command/{{stationId}}"
    body:
      command: "Reset"
      payload:
        force: true
    expect_status: 202

  - action: wait_for
    message: Reset
    messageType: Request
    timeout_ms: 15000
    capture:
      resetMessageId: "messageId"

  # ASSERTION 1 — server-produced. `force` on the wire comes from
  # ResetRequestDto::toPayload(); nothing in this scenario's MQTT payloads carries
  # it. It is the trigger route's `force: true` arriving intact:
  # `TriggerCommandController::dispatchReset` validates `force` alone and builds the DTO
  # from what it validated, as the admin and dashboard doors do through ResetStationRequest
  # (`StationManagementController::resetStation`, `DashboardStationController::reset`).
  # `ResetStationAction::execute` registers the pending command from the same `$dto->force`,
  # and every consequence asserted below is keyed on that value.
  - action: assert
    field: "payload.force"
    equals: true

  - action: send
    message: Reset
    messageType: Response
    payload:
      status: "Accepted"

  # ASSERTION 1a — the forced reset's operator stop reaches the wire. Accepting the forced
  # Reset makes `ResetResponseHandler::handle` dispatch StationReset, and its listener,
  # SettleSessionsOnForcedReset, stops the active session through StopAllStationSessionsAction
  # and `StopSessionAction::execute`, which publishes a StopService naming it. Waited for HERE,
  # before the SessionEnded below, so the order of the two is fixed: the Response has been
  # handled and the listener has run before the station reports its own settle.
  - action: wait_for
    message: StopService
    messageType: Request
    timeout_ms: 15000

  - action: assert
    field: "payload.sessionId"
    equals: "{{captured.sessionId}}"

  # ASSERTION 1b — server-written status. `StopSessionAction::execute` commits `stopping` with
  # stop_origin Operator before it publishes, so the StopService above means this row already
  # reads `stopping`. Had the pending command been registered unforced, the listener would have
  # returned and the row would still read `active`.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "stopping"

  # --- The settle-first the schema mandates: every active session ends under the
  #     operator-disable policy BEFORE the reboot. ---
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "OperatorStopped"
      actualDurationSeconds: 120
      creditsCharged: 200

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true

  - action: delay
    ms: 2000

  # ASSERTION 2 — server-written status. `completed` is the autonomousComplete arm;
  # the Fault arm would write `failed`, and a reason the handler did not recognise
  # would leave it live: `stopping`, once the forced reset's operator stop has run (see
  # WHAT THE FORCED-NESS DOES in the header). (It does NOT discriminate OperatorStopped
  # from Local — both complete, and on this file's UserDuration service both settle
  # pro-rata on delivered time with no low-delivery floor, so even the amount would not
  # tell them apart. They diverge only on the all-or-nothing kinds: Local is a full
  # charge, OperatorStopped a full refund. Once that operator stop has run they do not
  # diverge even there, because its stop_origin Operator makes
  # `Session::resolveTerminalReason` turn a Local into OperatorDisabled too. Assertion 3
  # is what makes this file about OperatorStopped specifically.)
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "completed"

  # ASSERTION 2a — the journal row of this Reset. `ResetResponseHandler::handle` writes one
  # `station_reset` row per Accepted Reset, after resolving the pending command, with the
  # Reset's messageId and the `forced` that command was registered with. The journal route
  # lists a station's rows newest first, and a pool station is leased to one scenario after
  # another with their rows kept, so the row is pinned by this Reset's messageId (the
  # Response carries the Request's) before `details.forced` is read off it.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/journal?kind=station_reset"
    expect_status: 200
    expect_body:
      data[kind=station_reset].details.messageId: "{{captured.resetMessageId}}"
      data[kind=station_reset].details.forced: true

  # --- The reboot itself. RemoteReset is NOT in the preserve list
  #     (`BootNotificationHandler::SESSION_PRESERVING_BOOT_REASONS`),
  #     and uptimeSeconds 0 puts every earlier session inside the force-fail
  #     window — the same setup core/boot-remote-reset-fails-live-session.yaml uses to
  #     prove a live session DOES get failed here. ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "RemoteReset"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        # Restated on the post-reset boot. Not strictly required — boot-notification.md
        # §5.1, "Capability Semantics — absence means NOT STATED", leaves an unstated
        # capability OUT of the update, so the value from the PowerOn boot above survives
        # (`BootNotificationHandler::handle`) — but a real station declares its
        # capabilities on every boot, and restating it keeps this file independent of that
        # rule rather than silently relying on it.
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: delay
    ms: 1500

  # ASSERTION 3 — the ordering invariant, and the money. The force-fail UPDATE
  # selects `whereIn('status', ['pending','authorized','active','stopping'])`, so a
  # session the settle-first already completed is out of its reach. If the settle
  # had been skipped or lost, this same boot would have rewritten the row to
  # `failed` / 1010 and settled it as ForceFailedReboot instead — a different
  # amount of money for the same wash. `completed` surviving the reboot is that
  # invariant, read back off the server.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "completed"

  # --- Pool-hygiene teardown: the session is terminal and the bay was returned to
  #     Available before the reboot; the boot reset bay state to unknown
  #     server-side, so restate it for the next scenario on this station. ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
