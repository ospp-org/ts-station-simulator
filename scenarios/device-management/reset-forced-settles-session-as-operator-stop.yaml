# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
#
# REQUIRES TESTING_TRIGGER_COMMAND_ENABLED=true on the target (default false).
#
# THE STATION'S SETTLE-FIRST IS THE END RECORD (the session-end rule, 2026-10-13).
#   reset-request.schema.json: "True: the station settles every active session under the
#   operator-disable policy FIRST … and only then reboots" (reset.md §5 rule 3, unchanged).
#   A session is ended only by the station's end record, so that SessionEnded
#   `OperatorStopped` is the forced reset's end of the session, and nothing else is: the
#   server no longer stops the sessions itself when the station accepts a forced Reset,
#   and the reboot's BootNotification ends nothing.
#
# SERVER BRANCHES REACHED — three, in order
#   1. app/Modules/DeviceManagement/Actions/ResetStationAction.php,
#      `ResetStationAction::execute`
#        $message = MessageBuilder::request('Reset')->withPayload($dto->toPayload())->build();
#      `force: true` short-circuits the active-session pre-flight in the same method
#      (`! $dto->force`), so the command actually reaches the wire.
#      ResetRequestDto::toPayload() is `['force' => $this->force]`.
#
#   2. app/Modules/DeviceManagement/Handlers/ResetResponseHandler.php, the Accepted arm of
#      `ResetResponseHandler::handle`: the `station_reset` journal row with `details.forced`.
#
#   3. app/Modules/Session/Handlers/SessionEndedHandler.php, the OPERATOR_STOPPED arm,
#        SessionEndReason::OPERATOR_STOPPED => $this->autonomousComplete($dto, TerminalReason::OperatorDisabled),
#      the settlement of a wash an operator cut short, by service kind — for the service
#      this file books, `{{serviceId_1}}` (svc_wash_basic, resolved to UserDuration),
#      pro-rata on the delivered time the station reports; a FixedDuration or MultiUnit
#      session would be refunded in full (04-flows.md §6 "Settlement by Service Kind").
#
# WHAT THE SERVER NO LONGER DOES, AND WHAT THIS FILE NOW READS INSTEAD
#   Until the rule, the Accepted Reset dispatched StationReset, whose listener
#   SettleSessionsOnForcedReset stopped every active session itself — `stopping`, then a
#   StopService naming it — and this file waited for that StopService (ASSERTION 1a) and
#   read `stopping` (1b) before the station's own SessionEnded. The listener is removed:
#   the station's SessionEnded `OperatorStopped` is the record (DESIGN-A2 R-STOP). So after
#   the Accepted Reset this file reads the session still `active` (ASSERTION 1a) — had the
#   listener run, it would read `stopping` — and then the station settles it.
#
#   And the reboot. The post-reset boot used to force-fail every session still live
#   (`BootNotificationHandler::failStuckSessions`), so `completed` surviving it was a
#   NEGATIVE: the settle-first had moved the session out of that predicate's reach. No boot
#   ends a session any more; `completed` after the RemoteReset boot (ASSERTION 3) now says
#   only that the boot changed nothing, which is the rule. core/boot-remote-reset-ends-nothing.yaml
#   is the file that carries a LIVE session into a RemoteReset boot.
#
#   What this file asserts: `force` on the REQUEST (ASSERTION 1), the session still `active`
#   after the station accepted (1a), `completed` on the station's SessionEnded (2), this
#   Reset's `station_reset` row with `details.forced` true (2a), and `completed` after the
#   RemoteReset boot (3).
#
# NEEDS THE SERVER OF THE SESSION-END RULE. Against csms-server f413256f and earlier the
# listener stops the session and ASSERTION 1a reads `stopping`.
name: "Reset Forced Settles Session As Operator Stop"
description: "Forced Reset with a live session: the server must send force:true and journal a forced station_reset row, and must not stop the session itself - it stays active until the station's settle-first SessionEnded/OperatorStopped completes it, and the post-reset RemoteReset boot changes nothing."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        # Required: `ResetStationAction::execute` refuses the command unless
        # device_management_supported === true, and that gate runs BEFORE the same method's
        # active-session pre-flight — so without this the file dies at the wrong
        # gate and never reaches the forced-reset branch it exists to test. NULL is "not
        # stated" and is withheld too (boot-notification.md, "Capability Semantics —
        # absence means NOT STATED"). Declared at boot, as change-configuration-accepted.yaml's
        # boot declares it; no admin call sets it in this corpus.
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay available, then the live session the reset must settle ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 600
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"

  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false

  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"

  # --- The forced Reset. 202, unlike the graceful twin's 409, because `force`
  #     short-circuits the active-session pre-flight. ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/testing/trigger-command/{{stationId}}"
    body:
      command: "Reset"
      payload:
        force: true
    expect_status: 202

  - action: wait_for
    message: Reset
    messageType: Request
    timeout_ms: 15000
    capture:
      resetMessageId: "messageId"

  # ASSERTION 1 — server-produced. `force` on the wire comes from
  # ResetRequestDto::toPayload(); nothing in this scenario's MQTT payloads carries
  # it. It is the trigger route's `force: true` arriving intact:
  # `TriggerCommandController::dispatchReset` validates `force` alone and builds the DTO
  # from what it validated, as the admin and dashboard doors do through ResetStationRequest
  # (`StationManagementController::resetStation`, `DashboardStationController::reset`).
  # `ResetStationAction::execute` registers the pending command from the same `$dto->force`,
  # and every consequence asserted below is keyed on that value.
  - action: assert
    field: "payload.force"
    equals: true

  - action: send
    message: Reset
    messageType: Response
    payload:
      status: "Accepted"

  # ASSERTION 1a — server-written status: the Accepted Reset stopped nothing. The server
  # used to stop every active session itself here (SettleSessionsOnForcedReset, a
  # StopService naming the session and the row `stopping`); the station's settle-first is
  # the record now, so the row reads `active` until it arrives.
  - action: delay
    ms: 2000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"

  # --- The settle-first the schema mandates: every active session ends under the
  #     operator-disable policy BEFORE the reboot, metered from the time actually
  #     delivered - the few seconds the wash had run when the Reset came. ---
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "OperatorStopped"
      actualDurationSeconds: 6
      creditsCharged: 10

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true

  - action: delay
    ms: 2000

  # ASSERTION 2 — server-written status. `completed` is the autonomousComplete arm;
  # the Fault arm would write `failed`, and a reason the handler did not recognise would
  # leave it `active`. (It does NOT discriminate OperatorStopped from Local — both
  # complete, and on this file's UserDuration service both settle pro-rata on delivered
  # time with no low-delivery floor, so even the amount would not tell them apart. They
  # diverge only on the all-or-nothing kinds: Local is a full charge, OperatorStopped a
  # full refund.)
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "completed"

  # ASSERTION 2a — the journal row of this Reset. `ResetResponseHandler::handle` writes one
  # `station_reset` row per Accepted Reset, after resolving the pending command, with the
  # Reset's messageId and the `forced` that command was registered with. The journal route
  # lists a station's rows newest first, and a pool station is leased to one scenario after
  # another with their rows kept, so the row is pinned by this Reset's messageId (the
  # Response carries the Request's) before `details.forced` is read off it.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/journal?kind=station_reset"
    expect_status: 200
    expect_body:
      data[kind=station_reset].details.messageId: "{{captured.resetMessageId}}"
      data[kind=station_reset].details.forced: true

  # --- The reboot itself (reset.md §5 rule 6): BootNotification RemoteReset, uptime 0.
  #     It ends nothing - the settle-first already did - and no session is live at it. ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "RemoteReset"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        # Restated on the post-reset boot. Not strictly required — boot-notification.md
        # §5.1, "Capability Semantics — absence means NOT STATED", leaves an unstated
        # capability OUT of the update, so the value from the PowerOn boot above survives
        # (`BootNotificationHandler::handle`) — but a real station declares its
        # capabilities on every boot, and restating it keeps this file independent of that
        # rule rather than silently relying on it.
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: delay
    ms: 1500

  # ASSERTION 3 — the boot changed nothing. Until the session-end rule this was the
  # ordering invariant: the boot force-failed every live session, and `completed` surviving
  # it proved the settle-first had come first. No boot ends a session now; had the
  # settle-first been lost, the session would still read `active` here and wait for its
  # record or the sweep (core/boot-remote-reset-ends-nothing.yaml).
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "completed"

  # --- Pool-hygiene teardown: the session is terminal and the bay was returned to
  #     Available before the reboot; the boot reset bay state to unknown
  #     server-side, so restate it for the next scenario on this station. ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
