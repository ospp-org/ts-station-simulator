# WHAT DISTINGUISHES THIS FILE FROM ITS SIBLINGS — measured on the wire 2026-08-10
#   The three firmware-update files asserted the same two things (boot Accepted, POST 202)
#   and nothing about the outcome. Each now reads the server's own record back off
#   GET /api/v1/admin/stations/{stationId}/firmware, which is a COLLECTION — hence the
#   [firmware_version=2.0.0] selector rather than an index (data.bays taught that lesson).
#
#   MEASURED, all three on fresh single-station pools:
#     success           status "rebooting"  error_text null   completed_at unset
#     download-failure  status "failed"     error_text "Download failed: network error"
#     install-failure   status "failed"     error_text "Installation failed: checksum mismatch"
#
#   `status` is genuinely SERVER-DERIVED and separates success from failure: the station
#   reports "Installed" and the handler stores REBOOTING
#   (FirmwareStatusNotificationHandler.php:147), so asserting "rebooting" pins a
#   transformation the server performs rather than a value it was handed.
#
#   THE TWO FAILURE VARIANTS ARE NOT SEPARATED BY ANY SERVER-DERIVED VALUE, and that is
#   recorded rather than papered over. FirmwareUpdateStatus has ONE failure state — `failed`
#   (vendor/ospp/protocol/src/Enums/FirmwareUpdateStatus.php:18); there is no DownloadFailed
#   vs InstallationFailed. Measured, download-failure and install-failure agree on status,
#   progress AND completed_at. The only difference is `error_text`, which is ECHOED from the
#   station's own payload (`$updates['error_text'] = $errorText ?? 'Unknown error'`, :135).
#   Asserting it proves the report round-tripped and persisted — real, but persistence, not
#   server judgement. It is the same category as the security-event severity assertions.
#
# RE-MEASURED 2026-08-17 against csms-server 9896108, and the paragraph above SURVIVES.
# csms-server 0fd0150 added a `failure_reason` column with EIGHT causes behind it, six of
# which are separable on the wire and now have a scenario each here — but ANY failure a
# station reports on a FirmwareStatusNotification is written `reported_by_station` by one
# line (FirmwareStatusNotificationHandler.php:133-144), whatever phase it was in. So this
# file, firmware-update-download-failure.yaml and firmware-signature-invalid.yaml share
# both status and failure_reason. The column separates the SERVER's own judgements from
# each other; it does not separate the station's account of itself into phases. Full
# reasoning, and what would be needed to separate them, in the download-failure sibling's
# header — not duplicated here.
#
# WHAT THIS FILE HAS THAT ITS SIBLING DOES NOT, and it is the one real distinction
# available: the row passed THROUGH `downloaded` and `installing` before failing, which
# means a completed transfer and a verified signature (0.20.0 made `Downloaded` assert the
# ECDSA signature, not just the checksum). The intermediate read added below pins that
# passage while it is still true — the final row cannot show it, because the row holds
# current state and there is no per-update history anywhere.
name: "Firmware Update Install Failure"
description: "Firmware update fails during installation due to checksum mismatch"
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/firmware"
    body:
      firmwareUrl: "https://cdn.example.com/firmware/v2.0.0.bin"
      firmwareVersion: "2.0.0"
      checksum: "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      signature: "MEUCIQDexample"
    expect_status: 202

  - action: wait_for
    message: UpdateFirmware
    messageType: Request
    timeout_ms: 15000
    capture:
      firmwareVersion: "payload.firmwareVersion"

  - action: send
    message: UpdateFirmware
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: FirmwareStatusNotification
    messageType: Event
    payload:
      status: "Downloading"
      firmwareVersion: "{{captured.firmwareVersion}}"
      progress: 0

  - action: delay
    ms: 500

  - action: send
    message: FirmwareStatusNotification
    messageType: Event
    payload:
      status: "Downloaded"
      firmwareVersion: "{{captured.firmwareVersion}}"

  - action: delay
    ms: 500

  # THE PASSAGE, READ WHILE IT IS STILL TRUE. `downloaded` is a state the final
  # row can never show — it holds current state, and there is no per-update
  # history table anywhere — so if this file is to distinguish itself from a
  # download that died mid-transfer, the distinction has to be captured here, in
  # flight. This read is the only place in the corpus that observes `downloaded`
  # at all.
  - action: delay
    ms: 800
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/firmware"
    expect_status: 200
    expect_body:
      data[firmware_version=2.0.0].status: "downloaded"
      data[firmware_version=2.0.0].failure_reason: null

  - action: send
    message: FirmwareStatusNotification
    messageType: Event
    payload:
      status: "Installing"
      firmwareVersion: "{{captured.firmwareVersion}}"
      progress: 0

  - action: delay
    ms: 300

  # Install milestones per firmware-status.md:40 (25/50/75/100). The write dies at
  # 50 — the spec's own worked install failure is "Downloaded -> Installing (50%)
  # -> Failed (errorText: 'Write error on partition B')" (:44-65).
  - action: send
    message: FirmwareStatusNotification
    messageType: Event
    payload:
      status: "Installing"
      firmwareVersion: "{{captured.firmwareVersion}}"
      progress: 25
  - action: delay
    ms: 300
  - action: send
    message: FirmwareStatusNotification
    messageType: Event
    payload:
      status: "Installing"
      firmwareVersion: "{{captured.firmwareVersion}}"
      progress: 50

  - action: delay
    ms: 500

  # `progress` omitted on Failed (firmware-status.md:41), leaving the row at 50.
  - action: send
    message: FirmwareStatusNotification
    messageType: Event
    payload:
      status: "Failed"
      firmwareVersion: "{{captured.firmwareVersion}}"
      errorText: "Installation failed: checksum mismatch"

  # THE ASSERTION — the server's own firmware record, not the notifications this file sent.
  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/firmware"
    expect_status: 200
    expect_body:
      data[firmware_version=2.0.0].status: "failed"
      data[firmware_version=2.0.0].error_text: "Installation failed: checksum mismatch"
      # Added 2026-08-17. Shared with download-failure and signature-invalid — see
      # the header. It rules out the six causes this is NOT, which is the whole
      # of what it can do here.
      data[firmware_version=2.0.0].failure_reason: "reported_by_station"
      # 50, the install milestone the write died on. The download-failure sibling
      # reads 45 here and the rejected sibling reads 0 — three files, three
      # values, none of them server-derived, all of them the row's record of how
      # far the update actually got.
      data[firmware_version=2.0.0].progress: 50
