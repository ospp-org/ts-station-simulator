name: "Soft Reset"
description: >
  The unforced reset, on a station this file gives no session: the admin reset route is asked for
  force: false, the station answers the Reset Accepted and boots again with bootReason
  RemoteReset. OSPP has one reset operation, a reboot, and force is its only choice
  (reset-request.schema.json has no other member); Hard and Soft are gone from the protocol, and
  the file keeps its name so corpus results compare across runs. Asserted: the station_reset
  journal row the Response writes, carrying this Reset's messageId and details.forced false, and
  the post-reset boot recorded as RemoteReset. Unforced, the reset is one the server refuses to
  dispatch while the station has a live session (6008, details.wouldBe 3016), and its listener
  settles nothing.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        # Required: `ResetStationAction::execute` refuses the Reset with 6008 COMMAND_PRE_EMPTED,
        # details.wouldBe 2007, unless device_management_supported === true, and NULL is "not
        # stated" and withheld too (boot-notification.md, "Capability Semantics — absence means
        # NOT STATED"). Declared at boot like every other device-management scenario.
        # Measured 2026-08-10, when that refusal was still a bare 2007: without this, this file
        # failed on a FRESH pool station — it only ever passed by inheriting the flag from a
        # sibling on a reused station.
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/reset"
    body:
      force: false
    expect_status: 202

  - action: wait_for
    message: Reset
    messageType: Request
    timeout_ms: 15000
    capture:
      resetMessageId: "messageId"

  # ANSWER IT. Scenario mode registers no Reset handler (createStationFromScenario registers
  # BootNotificationHandler alone), so if this file does not send the Response nobody does. An
  # unanswered Reset stays `pending` in csms-server's `pending_commands` until, past its timeout
  # (30 s for Reset in `ospp.command_timeouts`), the scheduled command:check-timeouts
  # (CommandTimeoutScanner) expires it, journals it as `command_expired` and compensates
  # nothing; for those 30 s StartSessionAction refuses a start on this station with 3002
  # (`PendingCommandRegistry::hasOutstanding`). The Reset round trip would never complete.
  # Answered, the Response is what `ResetResponseHandler::handle` resolves: it writes a
  # `station_reset` row to the station journal with this Reset's messageId and `details.forced`
  # false, read back at the end of this file, and dispatches StationReset. The event's one
  # listener, SettleSessionsOnForcedReset, returns on an unforced reset.
  - action: send
    message: Reset
    messageType: Response
    payload:
      status: "Accepted"

  # Brief settle only. The old 10s here was budgeted for a handler delay + disconnect +
  # reconnect that scenario mode never performs; the station stays connected throughout.
  - action: delay
    ms: 500

  # reset.md, "Processing Rules": after restarting, the station MUST send a BootNotification
  # with bootReason RemoteReset.
  # autoBoot was removed from sim (commit ac9b2e8) — scenarios must send explicitly.
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "RemoteReset"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        # Required: `ResetStationAction::execute` refuses the Reset with 6008 COMMAND_PRE_EMPTED,
        # details.wouldBe 2007, unless device_management_supported === true, and NULL is "not
        # stated" and withheld too (boot-notification.md, "Capability Semantics — absence means
        # NOT STATED"). Declared at boot like every other device-management scenario.
        # Measured 2026-08-10, when that refusal was still a bare 2007: without this, this file
        # failed on a FRESH pool station — it only ever passed by inheriting the flag from a
        # sibling on a reused station.
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 20000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # THE REBOOT, server-recorded. The post-reset boot must be attributed to the reset:
  # `BootNotificationHandler::handle` persists boot_reason and
  # `StationManagementController::showStation` returns it as data.bootReason. Had the station
  # not booted again, this would read the PowerOn above. The value is what the station
  # reported; the journal row read after it is what shows the server handled the Response.
  - action: delay
    ms: 1000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bootReason: "RemoteReset"

  # THE ROUND TRIP, server-recorded. `ResetResponseHandler::handle` writes one `station_reset`
  # row per Accepted Reset, and only after it has resolved the pending command, so this row
  # exists only if the Response above reached the server and matched this Reset. The journal
  # route lists a station's rows newest first, and a pool station is leased to one scenario
  # after another with their rows kept, so the row is pinned by this Reset's messageId (the
  # Response carries the Request's) before `details.forced` is read off it: false, because the
  # pending command was registered with the force the route was given.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/journal?kind=station_reset"
    expect_status: 200
    expect_body:
      data[kind=station_reset].details.messageId: "{{captured.resetMessageId}}"
      data[kind=station_reset].details.forced: false
