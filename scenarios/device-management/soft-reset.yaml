name: "Soft Reset"
description: >
  Soft reset: the server publishes Reset REQUEST and this scenario observes it.
  KNOWN GAP — no Reset RESPONSE is ever sent and the station never disconnects.
  Scenario mode registers no ResetHandler (ScenarioRunner.ts:766-769), so the prior
  "handler accepts, disconnects, reconnects, auto-boots" was describing a handler that
  does not run. The server-side pendingCommand for this Reset is therefore never resolved.
  What IS proven: the server dispatches Reset to a station that declared the profile.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        # Required: ResetStationAction.php:59 refuses COMMAND_NOT_SUPPORTED (2007) unless
        # device_management_supported === true, and NULL is "not stated" and withheld too
        # (OSPP §5.1 rule 3). Declared at boot like every other device-management scenario.
        # Measured 2026-08-10: without this, this file fails 2007 on a FRESH pool station —
        # it only ever passed by inheriting the flag from a sibling on a reused station.
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/reset"
    body:
      type: "Soft"
    expect_status: 202

  - action: wait_for
    message: Reset
    messageType: Request
    timeout_ms: 15000

  # ANSWER IT. Scenario mode registers no ResetHandler, so if this file does not send the
  # Response nobody does: the server's pending command is left to expire on its Redis TTL
  # and the round trip the file is named for never completes.
  # Note what this Response does and does not leave behind — ResetResponseHandler resolves
  # the pending command, logs, and dispatches StationReset, which has ZERO listeners. So the
  # Response itself writes NOTHING queryable; what is assertable is the post-reset boot below.
  - action: send
    message: Reset
    messageType: Response
    payload:
      status: "Accepted"

  # Brief settle only. The old 10s here was budgeted for a handler delay + disconnect +
  # reconnect that scenario mode never performs; the station stays connected throughout.
  - action: delay
    ms: 500

  # Per spec reset.md §5.4-5, station MUST send BootNotification post-reset.
  # autoBoot was removed from sim (commit ac9b2e8) — scenarios must send explicitly.
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "RemoteReset"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        # Required: ResetStationAction.php:59 refuses COMMAND_NOT_SUPPORTED (2007) unless
        # device_management_supported === true, and NULL is "not stated" and withheld too
        # (OSPP §5.1 rule 3). Declared at boot like every other device-management scenario.
        # Measured 2026-08-10: without this, this file fails 2007 on a FRESH pool station —
        # it only ever passed by inheriting the flag from a sibling on a reused station.
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 20000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # THE ASSERTION, server-recorded. The post-reset boot must be attributed to the reset:
  # BootNotificationHandler persists boot_reason, and Admin\StationResource:32-33 /
  # StationManagementController:264-265 expose it. If the Reset round trip above had not
  # completed, or the station had not re-booted, this reads the earlier PowerOn instead.
  - action: delay
    ms: 1000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bootReason: "RemoteReset"
