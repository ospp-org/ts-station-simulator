# TLS-floor conformance — S7 (the PORTABLE revocation proof; S5 is the UAT one)
#
# Client presents a WELL-FORMED, correctly-chained leaf whose ONLY defect is that
# its serial is on the CRL the verifier reads. The verifier MUST reject it AT THE
# TLS HANDSHAKE — expect_connect_failure: true — and the refusal MUST be
# attributed to the revocation check (expect_refusal_reason:
# broker-certificate-revoked), not merely "it failed".
#
# WHY A SECOND REVOCATION SCENARIO RATHER THAN A REPLACEMENT FOR S5.
# They prove different things and both are worth having. S5 proves that UAT's
# broker enforces a revocation UAT performed — real CRL, real CA, real fleet
# posture — and it can only run where that specific revoked UAT identity sits on
# disk, because `certs/` is gitignored and the fixture never travels. S7 proves
# the claim the scenario actually makes: **a revoked certificate is refused.**
# That needs no UAT, no privileged account and no committed key material, so it
# runs anywhere, for anyone, every time.
#
# The two repairs that would have made S5 portable were both refused, and the
# reasons are worth keeping: committing the revoked leaf's private key is wrong
# even though its only capability is to be refused, and re-seeding the simulator's
# UAT account as platform_super_admin so it could call the revoke route is a
# security change made for convenience. An authority of our own costs neither.
#
# WHERE THE AUTHORITY COMES FROM. ./scripts/local-crl-verifier.sh mints a
# throwaway CA, signs this leaf and its control with it, passes THIS serial to
# `openssl ca -revoke`, generates the CRL, and starts a broker configured with
# `enable_crl_check` on plus an HTTP host serving that CRL. Revocation happens at
# mint time; nothing is committed and nothing persists between runs.
#
# WHY IT BRINGS ITS OWN BROKER. The dev stack's CRL check cannot be turned on:
# every dev leaf carries `crlDistributionPoints = http://localhost:8080/pki/
# station-ca.crl`, and `localhost` inside the broker container IS the broker, so
# the flag fails closed on the entire fleet. The shared listener also carries
# other people's connections. See the script header for the measurements.
#
# ONE-VARIABLE DISCIPLINE (S4/S5/S6 pattern): the control
# (s7b-accepts-nonrevoked-cert-local.yaml) presents a leaf from the SAME CA, the
# SAME run, the SAME profile and the SAME ten-year validity — differing only in
# whether its serial was revoked before the CRL was generated. A revocation proof
# without a positive control is not acceptable: a verifier that cannot fetch the
# CRL refuses EVERYTHING under the fail-closed posture, and would satisfy this
# file while enforcing nothing. (The script also refuses to report success unless
# the verifier can fetch the CRL, so that failure mode is caught twice.)
#
# WHY PIN TLS 1.2 (min == max): the artifact S5 documents. Under TLS 1.3 the
# broker validates the client cert after the handshake summary and the alert
# arrives post-handshake, which some client stacks surface without the alert
# text, leaving the classifier nothing to attribute. Pinning 1.2 delivers alert
# 44 in-handshake. Held CONSTANT with the control, so revocation stays the only
# variable.
#
#   ./scripts/local-crl-verifier.sh up
#   simulator run --scenario scenarios/tls-floor/s7-rejects-revoked-cert-local.yaml \
#     --target local-crl
#   ./scripts/local-crl-verifier.sh down
name: "TLS floor S7 — rejects a revoked client certificate (portable, local CRL)"
description: "Client presents a REVOKED but otherwise-valid leaf against a verifier with enable_crl_check on, using a throwaway CA and CRL minted locally. The handshake MUST be refused and the refusal MUST classify as broker-certificate-revoked. Portable: no UAT, no privileged account, no committed key material."
# Regenerated by the script on every `up`, never committed. Absent them the
# scenario SKIPS naming the missing file; present and no longer refused, it FAILS.
requires_files:
  - "certs/local-crl/stn_r0000001.pem"
  - "certs/local-crl/stn_r0000001-key.pem"
  - "certs/local-crl/stn_r0000001-chain.pem"
requires_files_hint: >-
  Run ./scripts/local-crl-verifier.sh up — it mints the CA, the revoked leaf and
  its control, revokes this serial, generates the CRL and starts the verifier on
  mqtts://localhost:8885. Tear down afterwards with `down`.
# The verifier is a local container pair; a pooled run targets UAT, where this
# throwaway CA has no standing and the leaf is refused for an untrusted chain.
skip_when_pooled: "S7 runs against the local throwaway CRL verifier (target local-crl); a pooled run targets UAT, where this CA is unknown and the refusal would be an untrusted-chain one."
tls:
  min_version: "TLSv1.2"
  max_version: "TLSv1.2"
  # The revoked leaf, named explicitly — the defect that makes a proof possible
  # is never something a provisioning path will hand you.
  cert: "certs/local-crl/stn_r0000001.pem"
  key: "certs/local-crl/stn_r0000001-key.pem"
  chain: "certs/local-crl/stn_r0000001-chain.pem"
expect_connect_failure: true
expect_refusal_reason: broker-certificate-revoked
# NO SERVER-STATE ASSERTION IS POSSIBLE — THE PROOF IS THE TLS HANDSHAKE.
# Whether the verifier completes or refuses is decided before any OSPP message
# exists; a refused handshake never reaches an application, so no row is written
# and expect_body has nothing to attach to. The runner's own instruments are the
# assertions: expect_connect_failure for the refusal, expect_refusal_reason to
# pin WHY — which is what stops a fail-closed blanket refusal, an untrusted
# chain, or a bounded timeout from satisfying a revocation proof.
station:
  # Pinned to the fixture's CN, as in S6: a scenario bound to a named certificate
  # should not also depend on a generated identity.
  stationId: "stn_r0000001"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
# No steps: the connection never completes — the revoked leaf is refused at the
# TLS handshake, exactly like S3/S4/S5/S6's negative-path shape.
steps: []
