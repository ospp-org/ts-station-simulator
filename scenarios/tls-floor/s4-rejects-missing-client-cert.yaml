# TLS-1.2-floor conformance — S4
#
# Client presents NO client certificate at all (`tls.no_client_cert: true`
# strips whatever key/cert the --target would otherwise supply for this
# scenario only — see ScenarioRunner's ScenarioDefinition.tls doc). No TLS
# version override here: deliberately isolate ONE variable (the missing
# client cert) from the S1/S3 version-floor variable, so a rejection here
# can only be attributed to mTLS enforcement, not an unrelated TLS-version
# mismatch. The server CA the target supplies is left in place (server-cert
# verification still succeeds) — only the CLIENT side of mTLS is missing.
#
# The broker enforces mTLS regardless of the version-floor change — this
# scenario proves that lowering the floor from 1.3-only to 1.2+ did NOT
# also loosen client-certificate enforcement. Connection MUST be REJECTED.
#
# `expect_connect_failure: true` — see s3-rejects-tls11-below-floor.yaml for
# the full doc. Note the "OR a bounded timeout" latitude it describes no longer
# applies HERE: `expect_refusal_reason` below narrows the pass to a broker
# certificate alert, so a bare reset classified `timeout` is now a FAILURE for
# this scenario. That is deliberate — a control that accepts a hang as proof of
# enforcement is not a control.
#
# Run against a live broker, e.g.:
#   simulator run --scenario scenarios/tls-floor/s4-rejects-missing-client-cert.yaml \
#     --target uat
# stationId does not need to resolve to a real provisioned identity — the
# client never gets far enough to present one.
#
# NEEDS A LIVE BROKER — not run in this authoring piece (C3). Deferred to
# the deploy step.
name: "TLS floor S4 — rejects a connection with no client certificate"
description: "Client omits the client certificate entirely (tls.no_client_cert: true). mTLS enforcement MUST still reject the connection — expect_connect_failure: true."
tls:
  no_client_cert: true
expect_connect_failure: true
# WHY the connect failed, not merely that it did. This is a security control:
# without this key its pass condition is "anything went wrong", so a wrong port,
# an unreachable host, or the bounded hang this file's own header concedes counts
# as "rejected" would all report PASSED while proving nothing about mTLS.
# `broker-bad-certificate` is the bucket classifyRefusalReason assigns to the
# alerts a broker raises when the peer presents no usable certificate
# ("handshake failure", "peer did not return a certificate", "certificate
# required"), so a refusal at the wrong layer — including `timeout` — now FAILS.
expect_refusal_reason: broker-bad-certificate
# NO SERVER-STATE ASSERTION IS POSSIBLE — THE PROOF IS THE TLS HANDSHAKE.
# This file's subject is whether the BROKER completes or refuses a TLS
# connection, and that is decided before any OSPP message exists. A refused
# handshake never reaches the application: no row is written, no counter moves,
# no REST surface records it. An ACCEPTED one is proven by the negotiated
# protocol version, which is visible only on the client socket.
#
# The runner already carries the right instruments and they are the assertions
# here: expect_connect_failure for the refusal arm, and expect_refusal_reason to
# pin WHY it was refused (ADR-0005 §7 invariant 6) — which is what stops a
# client-side TLS-version error or a bounded timeout from satisfying a
# broker-side mTLS or CRL proof. expect_body has nothing to attach to.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
# No steps: the connection never completes — see s3's doc for why.
steps: []
