# Multi-Unit Batch Drive — server-pushed StartService rounds (MultiUnit / TokenDispenser kind).
#
# WIRE MODEL: in a MULTI-UNIT BATCH the SERVER pushes StartService to the station,
# one round per unit. The simulator does NOT call POST /sessions/start here — the
# parent process kicks the batch off server-side (multi-unit purchase). This scenario
# is purely REACTIVE: for each unit it waits for the server-pushed StartService
# Request, replies Accepted, emits SessionEnded, then re-reports the bay Available so
# the server's next StartService (unit K+1) is not rejected 3002 BAY_NOT_READY.
#
# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}    — set by --station stn_<id> (or --var stationId=...)
#   {{serialNumber}} — auto-generated
#   {{bayId_1}}      — the bay the batch drives. Auto-generated fallback; override with
#                      --var bayId_1=bay_...  (also auto-hydrated from
#                      <stationId>-bays.json when the station is pre-provisioned).
#   {{serviceId_1}}  — the multi-unit service. Auto-generated fallback; override with
#                      --var serviceId_1=svc_...
#   {{reason}}       — REQUIRED --var (no auto-generated default → substitution throws
#                      if omitted). SessionEnded reason for the FINAL round (unit 3):
#                        TimerExpired        = unit delivered fully (whole batch delivered)
#                        Fault | Deauthorized = jam/fault at unit 3 (batch stops there)
#
# Example:
#   node dist/cli/index.js run \
#     --scenario scenarios/multiunit-e2e/multiunit-batch-drive.yaml \
#     --target uat --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_token_dispenser \
#     --var reason=TimerExpired
#
# LOOP SUPPORT: the DSL has NO loop/repeat construct (STEP_REGISTRY in
# src/scenarios/ScenarioRunner.ts:153-165 registers only send/wait_for/
# wait_for_connect/assert/api_call/delay/start_heartbeat/fault/provision/
# provision_station_pool/connect_mqtt — no loop). The batch is therefore UNROLLED
# for exactly 3 rounds. Units 1 and 2 are hardcoded reason=TimerExpired so the batch
# always advances to the next unit (a Fault/Deauthorized there would stop the batch
# server-side and starve the next wait_for). Only the final round (3) takes the
# parameterized {{reason}}. `{{units}}` and `{{jam_at}}` are NOT expressible without a
# loop — the count is fixed at 3 and the jam point is fixed at the final round.
name: "Multi-Unit Batch Drive (server-pushed StartService x3)"
description: "Boot single-bay station, report Available, then reactively drive 3 server-pushed StartService rounds: units 1-2 TimerExpired (full delivery), unit 3 uses {{reason}}. Re-reports Available after each unit so unit K+1 is not rejected 3002."
# BLOCKED ON THE CARD LEG — the server-side batch driver EXISTS.
#
# This file is REACTIVE by design (see the wire model above): it waits for the
# SERVER to push StartService, one round per unit.
#
# CORRECTION, 2026-08-10. This header previously said "nothing in the server can
# start this batch" and told the next reader to un-skip "when a batch driver
# exists". That was wrong, and wrong in a way worth recording: the search behind it
# was scoped to `routes/api/v1`, and the entry point lives in `routes/web.php`,
# because webpay is the card-landing flow rather than an API flow. Verified on
# csms-server master:
#
#   - THE ENTRY EXISTS: POST /w/{slug}/process (routes/web.php:29,
#     PaymentLandingController::process) takes `unit_count: N`
#     (WebPaymentRequest:27), charges N x the per-unit quote, and stamps
#     metadata.unit_count only when N > 1 (PaymentLandingController:167,:179,:226).
#   - THE DRIVER EXISTS: on capture, WebPaymentOrchestrator:82-90 branches on
#     unit_count > 1 into initiateUnitBatch, inserts the batch (:167) and drives
#     unit 1 (:196); UnitBatchCoordinator:239 drives units 2..N, with
#     `units:resume-stalled` as the crash backstop.
#   - IT IS TESTED: csms-server tests/Feature/Web/WebPaymentMultiUnitTest.php:65
#     posts unit_count: 3 and asserts amount_cents 600 = 3 x 200.
#   - Also corrected: a batch is N SEQUENTIAL UNITS ON ONE BAY, not a fan-out
#     across bays — unit_batches.bay_id is a single NOT NULL column, and bay
#     exclusivity is enforced twice (PaymentLandingController:119,
#     StartSessionAction:106).
#
# WHAT ACTUALLY BLOCKS THIS FILE is the payment leg, not a missing driver. Reaching
# unit_count means completing a real BT iPay round-trip: register.do, the hosted
# form, and a settled capture. The unit test above only gets past it with
# Http::fake, which a live scenario run cannot do. So the batch never starts, the
# reactive wait_for times out at 60s, and an assertion added here would sit behind
# a step that never completes.
#
# skip_when_pooled turns that timeout into a transparent skip in the mode the
# corpus is actually validated in, rather than a failure that reads like a defect.
# It is NOT a claim the file is pooled-specific — it cannot run unattended in any
# mode without a card leg. UN-SKIP WHEN THE HARNESS CAN SETTLE A CARD PAYMENT and
# drive POST /w/{slug}/process with unit_count=N; a webpay card round-trip recipe
# already exists in this programme, so this is affordance, not absence.
#
# Rewriting it to drive N units via repeated POST /sessions/start would make it
# pass and would destroy its subject: client-initiated starts are the opposite of
# the server-pushed batch rounds this file exists to prove.
# THREE units, so the pool seeds a MultiUnit service whose max_unit_quantity reaches 3.
# Declared rather than assumed: `effectiveMax` collapses to 1 for a service that is not
# MultiUnit, and `POST /w/{slug}/process` then answers `invalid_quantity`.
requires_multiunit_service: 3
station:
  stationId: "{{stationId}}"
  # TWO BAYS, AND ONLY BAY 1 IS DRIVEN. The count matches DEFAULT_POOL_BAYS, not the
  # subject: `BootTopologyComparator` compares the DECLARED boot topology against the
  # PROVISIONED one and answers 3018 TOPOLOGY_MISMATCH + Pending when they differ, which
  # holds the station out of service for the rest of the file -- same as its jam-drive twin, which already declares two.
  # Measured 2026-09-21 on this file's first ever run: step 2 got Pending/3018.
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000
    capture:
      bootStatus: "payload.status"

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # Keep the station online for the whole batch. The server marks a station offline
  # after 3.5 x 30s = 105s of application silence (only Heartbeat refreshes the
  # tracker — StatusNotification / SessionEnded do not). A 3-round batch with 30-60s
  # server backoff between units easily crosses that window, which would drop the bay
  # + session-key cache and fail the next StartService. Torn down on disconnect.
  - action: start_heartbeat
    interval_sec: 30

  # --- Bay Available (pre-batch) ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # =========================================================================
  # UNIT 1 — full delivery (TimerExpired). Hardcoded so the batch advances.
  # =========================================================================
  # ── THE PURCHASE, WHICH THIS FILE DID NOT HAVE ────────────────────────────────────────
  #
  # Until 2026-09-22 this scenario was PURELY REACTIVE: it waited for server-pushed
  # StartService rounds that nothing in it had bought, so even with a working card leg it
  # could only ever time out. The steps below are the jam drive's, with unit_count 3 instead
  # of 2 — one buyer for both files, so a change to the webpay contract cannot fix one and
  # leave the other asserting an older shape.
  - action: api_call
    method: GET
    url: "{{webpay_url}}/w/{{baySlug_1}}"
    cookies: true
    follow_redirects: false
    expect_status: 200
    expect_body_text:
      - '<form method="POST"'
      - 'name="unit_count"'
    capture_text:
      csrf: 'name="_token"\s+value="([^"]+)"'

  # unit_count: 3 — the whole subject, and the count this file is unrolled for. Against the pool's default catalog this is
  # `invalid_quantity`, because effectiveMax collapses to 1 for any service that is
  # not MultiUnit with a capacity; `requires_multiunit_service: 2` in the header is
  # what makes 2 legal.
  #
  # duration_seconds is REQUIRED by WebPaymentRequest (min 60) and then IGNORED for
  # this kind: getServicePricing replaces it with the service's own
  # fixed_duration_seconds preset, so the number that reaches StartService is the
  # 5-second pulse the catalog carries, not the 60 posted here. Sending a value the
  # server discards is not sloppiness — omitting it is a 422.
  #
  # NOT FOLLOWING THE REDIRECT is what makes this step able to fail honestly. Both
  # outcomes are 302: away to the processor's hosted form is the armed path, back to
  # payment.error?reason=... is a precondition that did not hold. Followed, the error
  # page answers 200 and the reason survives only as a query string nobody read —
  # and the armed path would issue a real request to the payment host.
  - action: api_call
    method: POST
    url: "{{webpay_url}}/w/{{baySlug_1}}/process"
    cookies: true
    follow_redirects: false
    body:
      _token: "{{captured.csrf}}"
      service_id: "{{serviceId_multiunit}}"
      duration_seconds: 60
      unit_count: 3
    expect_status: 302
    # THE ASSERTION `expect_status` CANNOT MAKE. Both outcomes here are 302, so the
    # code alone proves the request was accepted and nothing more. Naming the host
    # makes the refusal path — 302 to payment.error?reason=... — fail AT THIS STEP,
    # reporting the reason it carries, instead of sixty seconds later as a wait_for
    # timeout blaming a StartService that was never going to be sent.
    #
    # The host is the same whether BT's real sandbox answers or the double does:
    # the double is a DNS+TLS interception of exactly this name, which is why one
    # assertion covers both and why it is not written as "not payment.error".
    expect_header:
      location: "ecclients-sandbox.btrl.ro"
    capture_header:
      payUrl: "location"

  # FIND THE INTENT THIS PURCHASE CREATED. It is not observable from the purchase:
  # the 302 above goes to the processor's hosted form, which carries the PROCESSOR's
  # order id, not ours. It is discovered instead through the ordinary operator read
  # — the same list the dashboard's Payments page renders — matched on reference_id,
  # which for a session payment IS the bay.
  #
  # `data[referenceId=...]` selects by FIELD rather than by index because this
  # collection has no ORDER BY the scenario can rely on, and "the most recent row"
  # is the assertion that passes on someone else's.
  #
  # The expect_body is not decoration: `capture` on a selector that matches nothing
  # stores undefined SILENTLY, and the failure would then surface one step later as
  # a substitution error naming a variable rather than naming the intent that was
  # never created.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/payments?status=pending&method=bt_ipay&per_page=50"
    expect_status: 200
    expect_body:
      "data[referenceId={{bayId_1}}].referenceType": "session_payment"
    capture:
      intentId: "data[referenceId={{bayId_1}}].id"

  # SETTLE IT. This is the door the customer's browser lands on coming back from the
  # processor — unauthenticated by design — and it calls settleIntent() IN THE
  # REQUEST: no queue, no callback wait, no webhook. BT iPay has no webhook channel
  # at all (BtIpayProcessor::verifyWebhook always throws), so redirect-and-poll is
  # the whole settlement design, and this is its synchronous half.
  #
  # WHY THE SYNCHRONOUS HALF AND NOT THE ASYNC ONE — and the first version of this
  # comment got the reason wrong, so both are recorded. It claimed the async half
  # does not exist on this stack because csms-server's compose defines no scheduler
  # service. The compose half of that is true and the conclusion is FALSE: the app
  # IMAGE runs one. Measured in the running container — `php artisan schedule:work`
  # is PID 24 under supervisord — so `payment:poll-webpay` does fire every minute.
  #
  # The real reason is the THRESHOLD, and it survives the correction. `pollPending`
  # reads `findStalePending(config('payment.intent.webpay_poll_threshold_minutes'))`,
  # which is 2, so the poller does not look at an order until two minutes after it
  # was bought. Every wait_for below is 60s. The net is there; it is slower than the
  # thing it would be catching, and a scenario that waited for it would be asserting
  # on a timeout rather than on a settlement.
  - action: api_call
    method: GET
    url: "{{webpay_url}}/pay/callback?intent={{captured.intentId}}"
    expect_status: 200

  # DID THE PAYMENT ACTUALLY SETTLE — asked HERE, where the answer is, instead of inferred
  # sixty seconds later from a StartService that never comes.
  #
  # THE CALLBACK'S 200 PROVES NOTHING, and that is a property of the handler rather than a
  # suspicion: `PaymentLandingController::callback` returns the SAME view with the SAME
  # literal `'status' => 'processing'` on every path. It calls `settleIntent`, which
  # "swallows its own errors and is idempotent", and then renders that constant regardless.
  # There is no header and no body field on that response that differs between a settled
  # payment and an unsettled one, so no assertion on step [8] can discriminate — the read
  # has to be of the INTENT, not of the page.
  #
  # `settleIntent` asks the processor: `$processor->getStatus($merchant, $transactionId)`.
  # Nothing in this scenario can make a real acquirer report a paid order — settling one
  # means a card typed into BT's hosted form — so until `tools/bt-ipay-double/` is stood up
  # this step is where the run stops, naming the payment.
  #
  # WHAT IT COSTS TODAY AND WHY IT IS STILL RIGHT: the file already failed, at [9], with
  # "Timeout waiting for StartService Request after 60000ms" — a message pointing at the
  # station and the MQTT path, three steps and one subsystem from the intent that never
  # left `pending`. Measured 2026-08-27: `unit_batches` held ZERO rows and the newest
  # `payment_intents` row on UAT was from 2026-07-02. This fails in 100ms and says so.
  # THE LIST AND NOT `GET /admin/payments/{id}`, MEASURED: the single-payment show answers
  # 403 to the per-scenario `tenant_operator` this file runs as, while the index — the same
  # route prefix, the same middleware — answers 200, because it scopes by organisation
  # rather than authorising the row. Step [7] above already proves the identity can read
  # this door. Asking the wrong one would have turned a payment assertion into a
  # permissions one.
  #
  # NO `status=` FILTER, deliberately. Filtering to `succeeded` and finding nothing reports
  # `undefined`, which says only that the row is not in a list it may never have been in.
  # Reading the row and asserting its status reports "expected succeeded, but got pending" —
  # the actual state of the actual intent, which is the sentence worth having.
  #
  # POLLED, AND THIS IS THE STEP THE CARD LEG IS DRIVEN THROUGH. The read above is not
  # wrong on its first attempt, it is early: between the purchase POST and the settlement
  # the intent is `pending`, truthfully. What ends the wait is an EVENT — the customer's
  # browser coming back from BT's hosted form to `/pay/callback?intent=…`, which settles
  # the intent IN THAT REQUEST — and nothing in this file controls when that happens.
  # The 600s budget is the human leg: reading the intent's `metadata.payment_url`, opening
  # BT's form, typing the sandbox card. Unattended, this file still goes red at the same
  # assertion, with the same sentence: "expected succeeded, but got pending".
  #
  # THE STEP ABOVE IS THE BELT, NOT THE BRACE. `/pay/callback` is idempotent and settles
  # whatever BT already reports as paid, so it covers the browser that was closed before
  # it returned; the poll covers the browser that returns. Neither replaces the other.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/payments?method=bt_ipay&per_page=50"
    expect_status: 200
    expect_body:
      data[id={{captured.intentId}}].status: "succeeded"
    poll:
      # A REQUIRED --var, and nothing generates it — which is what turns an unattended run
      # into a SKIP that names the instrument instead of a ten-minute red. The variable is
      # not a permission: supplying it only opens the window, and a window in which nobody
      # types a card ends in the same assertion with the same sentence. Attended:
      #   --var cardSettleTimeoutMs=600000
      timeout_ms: "{{cardSettleTimeoutMs}}"
      interval_ms: 5000

  - action: wait_for
    message: StartService
    messageType: Request
    # Generous — the server retries StartService with backoff between units.
    timeout_ms: 60000
    capture:
      session_id_1: "payload.sessionId"
      start_msg_id_1: "messageId"
      duration_seconds_1: "payload.durationSeconds"

  - action: send
    message: StartService
    messageType: Response
    correlationId: "{{captured.start_msg_id_1}}"
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 500

  # SessionEnded EVENT — station-autonomous. seqNo/finalSeqNo are NOT injected in
  # scenario mode (SendStep.ts:236) and are absent from the wire;
  # creditsCharged is informational only — the server's settlement policy decides the
  # actual per-unit charge/refund for the batch.
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.session_id_1}}"
      bayId: "{{bayId_1}}"
      reason: "TimerExpired"
      actualDurationSeconds: 5
      creditsCharged: 10

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
  # =========================================================================
  # UNIT 2 — full delivery (TimerExpired). Hardcoded so the batch advances.
  # =========================================================================
  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 60000
    capture:
      session_id_2: "payload.sessionId"
      start_msg_id_2: "messageId"
      duration_seconds_2: "payload.durationSeconds"

  - action: send
    message: StartService
    messageType: Response
    correlationId: "{{captured.start_msg_id_2}}"
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 500

  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.session_id_2}}"
      bayId: "{{bayId_1}}"
      reason: "TimerExpired"
      actualDurationSeconds: 5
      creditsCharged: 10

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
  # =========================================================================
  # UNIT 3 — final unit, parameterized {{reason}}:
  #   TimerExpired         -> whole 3-unit batch delivered
  #   Fault | Deauthorized -> jam/fault at unit 3 (batch stops here)
  # =========================================================================
  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 60000
    capture:
      session_id_3: "payload.sessionId"
      start_msg_id_3: "messageId"
      duration_seconds_3: "payload.durationSeconds"

  - action: send
    message: StartService
    messageType: Response
    correlationId: "{{captured.start_msg_id_3}}"
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 500

  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.session_id_3}}"
      bayId: "{{bayId_1}}"
      reason: "{{reason}}"
      actualDurationSeconds: 5
      creditsCharged: 10

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
  # --- Trailing wait so the server-side batch finalizer can run (per-unit settlement
  #     + tail-refund sweep). The DSL calls this step `delay` (there is no `wait`). ---
  - action: delay
    ms: 30000
