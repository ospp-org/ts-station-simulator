# Multi-Unit Batch Drive — server-pushed StartService rounds (MultiUnit / TokenDispenser kind).
#
# WIRE MODEL: in a MULTI-UNIT BATCH the SERVER pushes StartService to the station,
# one round per unit. The simulator does NOT call POST /sessions/start here — the
# parent process kicks the batch off server-side (multi-unit purchase). This scenario
# is purely REACTIVE: for each unit it waits for the server-pushed StartService
# Request, replies Accepted, emits SessionEnded, then re-reports the bay Available so
# the server's next StartService (unit K+1) is not rejected 3002 BAY_NOT_READY.
#
# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}    — set by --station stn_<id> (or --var stationId=...)
#   {{serialNumber}} — auto-generated
#   {{bayId_1}}      — the bay the batch drives. Auto-generated fallback; override with
#                      --var bayId_1=bay_...  (also auto-hydrated from
#                      <stationId>-bays.json when the station is pre-provisioned).
#   {{serviceId_1}}  — the multi-unit service. Auto-generated fallback; override with
#                      --var serviceId_1=svc_...
#   {{reason}}       — REQUIRED --var (no auto-generated default → substitution throws
#                      if omitted). SessionEnded reason for the FINAL round (unit 3):
#                        TimerExpired        = unit delivered fully (whole batch delivered)
#                        Fault | Deauthorized = jam/fault at unit 3 (batch stops there)
#
# Example:
#   node dist/cli/index.js run \
#     --scenario scenarios/multiunit-e2e/multiunit-batch-drive.yaml \
#     --target uat --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_token_dispenser \
#     --var reason=TimerExpired
#
# LOOP SUPPORT: the DSL has NO loop/repeat construct (STEP_REGISTRY in
# src/scenarios/ScenarioRunner.ts:153-165 registers only send/wait_for/
# wait_for_connect/assert/api_call/delay/start_heartbeat/fault/provision/
# provision_station_pool/connect_mqtt — no loop). The batch is therefore UNROLLED
# for exactly 3 rounds. Units 1 and 2 are hardcoded reason=TimerExpired so the batch
# always advances to the next unit (a Fault/Deauthorized there would stop the batch
# server-side and starve the next wait_for). Only the final round (3) takes the
# parameterized {{reason}}. `{{units}}` and `{{jam_at}}` are NOT expressible without a
# loop — the count is fixed at 3 and the jam point is fixed at the final round.
name: "Multi-Unit Batch Drive (server-pushed StartService x3)"
description: "Boot single-bay station, report Available, then reactively drive 3 server-pushed StartService rounds: units 1-2 TimerExpired (full delivery), unit 3 uses {{reason}}. Re-reports Available after each unit so unit K+1 is not rejected 3002."
# BLOCKED ON THE CARD LEG — the server-side batch driver EXISTS.
#
# This file is REACTIVE by design (see the wire model above): it waits for the
# SERVER to push StartService, one round per unit.
#
# CORRECTION, 2026-08-10. This header previously said "nothing in the server can
# start this batch" and told the next reader to un-skip "when a batch driver
# exists". That was wrong, and wrong in a way worth recording: the search behind it
# was scoped to `routes/api/v1`, and the entry point lives in `routes/web.php`,
# because webpay is the card-landing flow rather than an API flow. Verified on
# csms-server master:
#
#   - THE ENTRY EXISTS: POST /w/{slug}/process (routes/web.php:29,
#     PaymentLandingController::process) takes `unit_count: N`
#     (WebPaymentRequest:27), charges N x the per-unit quote, and stamps
#     metadata.unit_count only when N > 1 (PaymentLandingController:167,:179,:226).
#   - THE DRIVER EXISTS: on capture, WebPaymentOrchestrator:82-90 branches on
#     unit_count > 1 into initiateUnitBatch, inserts the batch (:167) and drives
#     unit 1 (:196); UnitBatchCoordinator:239 drives units 2..N, with
#     `units:resume-stalled` as the crash backstop.
#   - IT IS TESTED: csms-server tests/Feature/Web/WebPaymentMultiUnitTest.php:65
#     posts unit_count: 3 and asserts amount_cents 600 = 3 x 200.
#   - Also corrected: a batch is N SEQUENTIAL UNITS ON ONE BAY, not a fan-out
#     across bays — unit_batches.bay_id is a single NOT NULL column, and bay
#     exclusivity is enforced twice (PaymentLandingController:119,
#     StartSessionAction:106).
#
# WHAT ACTUALLY BLOCKS THIS FILE is the payment leg, not a missing driver. Reaching
# unit_count means completing a real BT iPay round-trip: register.do, the hosted
# form, and a settled capture. The unit test above only gets past it with
# Http::fake, which a live scenario run cannot do. So the batch never starts, the
# reactive wait_for times out at 60s, and an assertion added here would sit behind
# a step that never completes.
#
# skip_when_pooled turns that timeout into a transparent skip in the mode the
# corpus is actually validated in, rather than a failure that reads like a defect.
# It is NOT a claim the file is pooled-specific — it cannot run unattended in any
# mode without a card leg. UN-SKIP WHEN THE HARNESS CAN SETTLE A CARD PAYMENT and
# drive POST /w/{slug}/process with unit_count=N; a webpay card round-trip recipe
# already exists in this programme, so this is affordance, not absence.
#
# Rewriting it to drive N units via repeated POST /sessions/start would make it
# pass and would destroy its subject: client-initiated starts are the opposite of
# the server-pushed batch rounds this file exists to prove.
skip_when_pooled: "Blocked on the CARD LEG, not on a missing driver — the earlier reason here was wrong. The batch entry is POST /w/{slug}/process with unit_count=N (routes/web.php:29; the old search was scoped to routes/api/v1), and WebPaymentOrchestrator drives the units. Reaching it needs a settled BT iPay round-trip, which a live scenario run cannot fake. Times out at wait_for in every unattended mode. Un-skip when the harness can settle a card payment."
station:
  stationId: "{{stationId}}"
  bayCount: 1
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000
    capture:
      bootStatus: "payload.status"

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # Keep the station online for the whole batch. The server marks a station offline
  # after 3.5 x 30s = 105s of application silence (only Heartbeat refreshes the
  # tracker — StatusNotification / SessionEnded do not). A 3-round batch with 30-60s
  # server backoff between units easily crosses that window, which would drop the bay
  # + session-key cache and fail the next StartService. Torn down on disconnect.
  - action: start_heartbeat
    interval_sec: 30

  # --- Bay Available (pre-batch) ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # =========================================================================
  # UNIT 1 — full delivery (TimerExpired). Hardcoded so the batch advances.
  # =========================================================================
  - action: wait_for
    message: StartService
    messageType: Request
    # Generous — the server retries StartService with backoff between units.
    timeout_ms: 60000
    capture:
      session_id_1: "payload.sessionId"
      start_msg_id_1: "messageId"
      duration_seconds_1: "payload.durationSeconds"

  - action: send
    message: StartService
    messageType: Response
    correlationId: "{{captured.start_msg_id_1}}"
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 500

  # SessionEnded EVENT — station-autonomous. seqNo/finalSeqNo are NOT injected in
  # scenario mode (SendStep.ts:236) and are absent from the wire;
  # creditsCharged is informational only — the server's settlement policy decides the
  # actual per-unit charge/refund for the batch.
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.session_id_1}}"
      bayId: "{{bayId_1}}"
      reason: "TimerExpired"
      actualDurationSeconds: 5
      creditsCharged: 10

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
  # =========================================================================
  # UNIT 2 — full delivery (TimerExpired). Hardcoded so the batch advances.
  # =========================================================================
  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 60000
    capture:
      session_id_2: "payload.sessionId"
      start_msg_id_2: "messageId"
      duration_seconds_2: "payload.durationSeconds"

  - action: send
    message: StartService
    messageType: Response
    correlationId: "{{captured.start_msg_id_2}}"
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 500

  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.session_id_2}}"
      bayId: "{{bayId_1}}"
      reason: "TimerExpired"
      actualDurationSeconds: 5
      creditsCharged: 10

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
  # =========================================================================
  # UNIT 3 — final unit, parameterized {{reason}}:
  #   TimerExpired         -> whole 3-unit batch delivered
  #   Fault | Deauthorized -> jam/fault at unit 3 (batch stops here)
  # =========================================================================
  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 60000
    capture:
      session_id_3: "payload.sessionId"
      start_msg_id_3: "messageId"
      duration_seconds_3: "payload.durationSeconds"

  - action: send
    message: StartService
    messageType: Response
    correlationId: "{{captured.start_msg_id_3}}"
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 500

  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.session_id_3}}"
      bayId: "{{bayId_1}}"
      reason: "{{reason}}"
      actualDurationSeconds: 5
      creditsCharged: 10

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
  # --- Trailing wait so the server-side batch finalizer can run (per-unit settlement
  #     + tail-refund sweep). The DSL calls this step `delay` (there is no `wait`). ---
  - action: delay
    ms: 30000
