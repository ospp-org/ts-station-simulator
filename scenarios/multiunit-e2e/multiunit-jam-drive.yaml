name: "Multi-Unit Jam Drive (unit 1 delivered, unit 2 jams)"
description: "Boot single-bay station, report Available, then answer 2 server-pushed StartService rounds: unit 1 TimerExpired (delivered), unit 2 Fault (jam → batch stops, unit 3 never started → tail refund of the undelivered units)."
# BLOCKED, NOT MERELY UNASSERTED — nothing in the server can start this batch.
#
# This file is REACTIVE by design (see the wire model above): it waits for the
# SERVER to push StartService, one round per unit. Establishing whether that is
# fixable, 2026-08-10:
#
#   - There is NO batch/multi-unit purchase endpoint. Nothing in routes/api/v1
#     matches batch, multi, purchase or units, and no `MultiUnit`/`TokenDispenser`
#     route exists at all.
#   - NO CONTROLLER DISPATCHES StartService. Grepping StartService across
#     app/Http/Controllers returns nothing — the only server-side push path is
#     StartSessionAction, reached from POST /sessions/start, which starts ONE
#     session and is what multiunit-e2e/single-session-drive calls (and passes).
#
# So the trigger this file waits for cannot be produced over HTTP by any caller,
# test or otherwise. It times out at wait_for after 60s in every unattended mode,
# and an assertion added here would sit behind a step that never completes.
#
# skip_when_pooled turns that 60s timeout into a transparent skip in the mode the
# corpus is actually validated in, rather than a failure that reads like a defect.
# It is NOT a claim the file is pooled-specific — it cannot run unattended in any
# mode. Un-skip it when a batch driver exists.
#
# Rewriting it to drive N units via repeated POST /sessions/start would make it
# pass and would destroy its subject: client-initiated starts are the opposite of
# the server-pushed batch rounds this file exists to prove.
skip_when_pooled: "No server-side batch driver exists: no batch/multi-unit endpoint in routes/api/v1 and no controller dispatches StartService, so the server-pushed StartService this file waits for cannot be triggered by any HTTP caller. Times out at wait_for in every unattended mode. Un-skip when a batch driver exists."
station:
  stationId: "{{stationId}}"
  bayCount: 1
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"
  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000
    capture:
      bootStatus: "payload.status"
  - action: assert
    field: "payload.status"
    equals: "Accepted"
  - action: start_heartbeat
    interval_sec: 30
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # UNIT 1 — TimerExpired (delivered)
  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 60000
    capture:
      session_id_1: "payload.sessionId"
      start_msg_id_1: "messageId"
  - action: send
    message: StartService
    messageType: Response
    correlationId: "{{captured.start_msg_id_1}}"
    payload:
      status: "Accepted"
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 500
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.session_id_1}}"
      bayId: "{{bayId_1}}"
      reason: "TimerExpired"
      actualDurationSeconds: 5
      creditsCharged: 25
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
  # UNIT 2 — Fault (JAM → batch stops, unit 3 never dispatched)
  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 60000
    capture:
      session_id_2: "payload.sessionId"
      start_msg_id_2: "messageId"
  - action: send
    message: StartService
    messageType: Response
    correlationId: "{{captured.start_msg_id_2}}"
    payload:
      status: "Accepted"
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 500
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.session_id_2}}"
      bayId: "{{bayId_1}}"
      reason: "Fault"
      actualDurationSeconds: 1
      creditsCharged: 0
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
  - action: delay
    ms: 20000
