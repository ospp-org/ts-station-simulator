name: "Status All Bay States"
description: "Boot and send StatusNotification for every REPORTABLE bay status: Available, Occupied, Reserved, Finishing, Faulted, Unavailable — then read each one back. FIVE of the six persist. Occupied is session-bound and is DISCARDED without an active session (the StartService race the gate exists for), which this scenario proves by asserting the retained value instead; Finishing, the state after a session, is written as the bay's state since csms-server 2026-10-21 (session-ended.md section 5 rule 6), and Reserved -> Finishing is journaled as an invalid transition. `Unknown` is the FSM's seventh state and is deliberately absent — no station may put it on the wire (spec v0.10.0, 05-state-machines.md 1.2)."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    # Aligned with global default bump (5s → 15s, commit 9e57ce2). Sprint B2
    # timeout sweep — sister scenario from Sprint B P5.1/P5.11 fix (commit
    # 3fdc7a6). UAT first-round-trip can exceed 5s.
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # Status: Available
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # THE ASSERTIONS: one read-back per state, not one at the end.
  #
  # WHY EACH, AND NOT JUST THE TERMINAL STATE. StatusNotificationHandler
  # validates the transition and then accepts it ANYWAY — :149 logs "invalid bay
  # transition (accepting as authoritative)" and records the anomaly in
  # bay_transition_anomalies, but :216 writes the new status regardless. So the
  # server has no transition gate that a terminal-state assertion could lean on:
  # reading `unavailable` at the end would prove only that the LAST report
  # landed, and all five earlier ones could have been dropped without changing
  # it. For a file whose name claims every reportable status, that is not enough.
  #
  # Server-produced: `status` here is the bays.status column the handler wrote,
  # lowercased by the enum (`available`, not the wire's `Available`). The
  # scenario supplies the wire literal; the server supplies the persisted form,
  # the bay identity resolution, and the decision to accept the report at all.
  #
  # `[bayNumber=1]` and never an index: bays come back in no guaranteed order —
  # measured on UAT 2026-08-10, a 4-bay station returned bayNumber 3 and 4 first.
  #
  # WHY 1000ms AND NOT THE 300ms THIS FILE ALREADY USED BETWEEN SENDS. Measured,
  # not guessed: with 300ms the FIRST read (available) passed and the SECOND
  # (occupied) read back `available` — the Event had not been consumed yet.
  # StatusNotification is fire-and-forget over MQTT, so there is no Response to
  # synchronise on and the read races the consumer. 300ms is inside that race on
  # UAT; 1000ms is outside it. This is also why the failure mode matters: a read
  # that races the consumer reports the PREVIOUS state, which looks exactly like
  # a dropped report rather than a slow one.
  - action: delay
    ms: 1000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bays[bayNumber=1].status: "available"

  # Status: Occupied
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 1000

  # NOT "occupied" — and this is the scenario's most valuable assertion.
  #
  # MEASURED ON UAT 2026-08-10: the bay is still `available` here. Occupied is
  # DISCARDED. StatusNotificationHandler.php:87-100 gates the two session-bound
  # states on an active session for the bay:
  #
  #   if (in_array($newStatus, [BayStatus::OCCUPIED, BayStatus::FINISHING], true)) {
  #       $activeSession = $this->sessionRepository->findActiveByBayId($bay->id);
  #       if ($activeSession === null) { Log::warning('… (discarding)'); return null; }
  #
  # This scenario never starts a session, so the Occupied report above is dropped
  # before the transition check, before the timestamp floor, and before any write.
  # `return null` — no Response (it is an Event), no error, nothing on the wire.
  #
  # So this file's own name was half untrue for as long as it asserted nothing:
  # it claims every REPORTABLE status, and two of its six are unreachable in the
  # shape it is written in. Asserting `available` here is not settling for less —
  # it PROVES the gate fired, which is a server rule with no other coverage in
  # the corpus. A future edit that gives this scenario a live session would flip
  # this assertion to "occupied", and that is the correct way to cover the other
  # arm; it should not be done by deleting this one.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bays[bayNumber=1].status: "available"

  # Status: Reserved
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Reserved"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 1000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bays[bayNumber=1].status: "reserved"

  # Status: Finishing
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Finishing"
      previousStatus: "Reserved"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 1000

  # "finishing" — NOT the gate above. Finishing is the state AFTER a session, and since
  # csms-server 2026-10-21 the gate covers Occupied only: session-ended.md section 5 rule 6
  # has the server process a wash's SessionEnded before the Finishing that follows it,
  # "which reports the bay's new state", so a gate asking a live session of Finishing could
  # only ever refuse it. The report is written; `Reserved -> Finishing` is not in the
  # Station half of 05 section 2.3, so the server also journals it as an invalid transition
  # (section 2.5 rules 1 and 2). Until then this asserted the retained `reserved`.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bays[bayNumber=1].status: "finishing"

  # Status: Faulted
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Faulted"
      previousStatus: "Finishing"
      errorCode: 5001
      errorText: "PUMP_SYSTEM"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 1000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bays[bayNumber=1].status: "faulted"

  # Status: Unavailable
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Unavailable"
      previousStatus: "Faulted"
      programs:
        - programNumber: 1
          available: false

  - action: delay
    ms: 1000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bays[bayNumber=1].status: "unavailable"
