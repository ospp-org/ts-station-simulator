name: "Boot Scheduled Reset"
description: "Boot after scheduled daily reset with 24h uptime, assert Accepted."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 86400
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "ScheduledReset"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    # Aligned with global default bump (5s → 15s, commit 9e57ce2). Sprint B2
    # timeout sweep — sister scenario from Sprint B P5.1/P5.11 fix (commit
    # 3fdc7a6). UAT first-round-trip can exceed 5s.
    timeout_ms: 15000
    capture:
      heartbeatInterval: "payload.heartbeatIntervalSec"
      bootStatus: "payload.status"

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # Server-recorded, and ECHOED rather than derived — see boot-watchdog.yaml for
  # the full statement of what this does and does not prove. In short: it proves
  # the boot was persisted onto stations.boot_reason rather than merely answered,
  # and it does NOT prove any behaviour, because nothing branches on the column.
  # `ScheduledReset` is in the force-fail class at BootNotificationHandler.php:343.
  #
  # Note this file boots with uptimeSeconds 86400. That is NOT inert: the
  # force-fail arm calls failStuckSessions(now()->subSeconds(uptimeSeconds)), so
  # a 24h window would spare any session started inside it. There is no live
  # session here, so nothing is spared and nothing is failed — but a future edit
  # that adds one to this file would be proving the uptime layer, not the reason.
  - action: delay
    ms: 1000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bootReason: "ScheduledReset"
      # Bounded, not equated — see happy-boot.yaml. Worth one extra note here: the
      # boot reports uptimeSeconds 86400, and last_boot_at is `now()` regardless
      # (BootNotificationHandler.php:217). The server does not derive the column
      # from the station's self-reported uptime, so a 24h uptime does NOT make
      # this timestamp a day old — if it ever does, this bound is what says so.
      data.lastBootAt:
        is_recent: 300
