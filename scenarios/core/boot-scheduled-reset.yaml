name: "Boot Scheduled Reset"
description: "Boot after the station's scheduled daily reset, its uptime counted from that reset, assert Accepted."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "ScheduledReset"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    # Aligned with global default bump (5s → 15s, commit 9e57ce2). Sprint B2
    # timeout sweep — sister scenario from Sprint B P5.1/P5.11 fix (commit
    # 3fdc7a6). UAT first-round-trip can exceed 5s.
    timeout_ms: 15000
    capture:
      heartbeatInterval: "payload.heartbeatIntervalSec"
      bootStatus: "payload.status"

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # Server-recorded, and ECHOED rather than derived — see boot-watchdog.yaml for
  # the full statement of what this does and does not prove. In short: it proves
  # the boot was persisted onto stations.boot_reason rather than merely answered,
  # and it does NOT prove any behaviour, because nothing branches on the column.
  # `ScheduledReset` was in the force-fail class at BootNotificationHandler.php:343
  # until csms-server bd7f7135 moved it to the preserving side, and since the
  # session-end rule (2026-10-13) no boot ends a session at all: `ScheduledReset` is
  # one of the six reasons after which the station may resume a wash it held.
  #
  # uptimeSeconds is 0: boot-notification.md §5.2 rule 2 has a restart reason carry
  # the uptime measured FROM the restart it names, and the boot goes out right after
  # the reset. Until 2026-10-13 this file sent 86400, the day the station had run
  # BEFORE the reset ("with 24h uptime", its description said). On a pooled station
  # an earlier lease had booted minutes before, the server's cross-check (rule 3)
  # found that claim contradicted — a restart a day older than the previous boot —
  # and did not act on the reason this file is about; the read-back below passed all
  # the same, because stations.boot_reason is written either way. Before the
  # session-end rule the 86400 also opened a 24 h window in which the force-fail
  # spared any session; both went with the force-fail, and a live session added here
  # would read `active` after this boot at any uptime.
  - action: delay
    ms: 1000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bootReason: "ScheduledReset"
      # Bounded, not equated — see happy-boot.yaml. BootNotificationHandler writes
      # last_boot_at as `now()`, not from the station's self-reported uptime. While
      # this file reported 86400 the bound also showed that (a column derived from
      # the uptime would have been a day old); at uptime 0 the two coincide.
      data.lastBootAt:
        is_recent: 300
