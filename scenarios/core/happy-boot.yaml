name: "Happy Boot"
description: "Complete boot flow - send BootNotification with PowerOn reason, wait for response, assert Accepted, send StatusNotification for each bay."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    # Aligned with global default bump (5s → 15s, commit 9e57ce2). Sprint B2
    # timeout sweep — sister scenario from Sprint B P5.1/P5.11 fix (commit
    # 3fdc7a6). UAT first-round-trip can exceed 5s.
    timeout_ms: 15000
    capture:
      heartbeatInterval: "payload.heartbeatIntervalSec"
      bootStatus: "payload.status"

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_2}}"
      bayNumber: 2
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  - action: delay
    ms: 1000

  # THE ASSERTION. This is the corpus's baseline boot, and until now it asserted
  # only that a Response came back saying Accepted — a property of the envelope,
  # which holds whether or not the handler committed anything.
  #
  #   data.isOnline    — SERVER-DERIVED, and the load-bearing half. Nothing this
  #                      scenario sends carries an online flag; the server decides
  #                      it on the boot it just accepted. A fresh pool station is
  #                      provisioned offline, so `true` here cannot be inherited
  #                      from the initial state.
  #   data.bootReason  — ECHOED, not derived (see boot-watchdog.yaml for the full
  #                      statement). It proves the boot was PERSISTED rather than
  #                      merely answered, and separates this boot from a stale row
  #                      left by an earlier one on a reused pooled station. It
  #                      proves nothing behavioural: nothing in the server
  #                      branches on the persisted column.
  #
  #   data.lastBootAt  — BOUNDED, not equated, and weaker than the two above; the
  #   data.lastSeenAt    runner's `is_recent` closes half of what this file used
  #                      to record as out of reach. Both columns are written by
  #                      this boot (BootNotificationHandler.php:216-217, two
  #                      `now()` calls in one update), and both are compared
  #                      against the response's own Date header rather than the
  #                      runner's clock.
  #
  # WHAT THE BOUND HERE PROVES, AND WHAT IT DOES NOT. It proves the timestamp
  # columns were written and carry a current value — a null, a never-written
  # column or a frozen clock is red. It does NOT prove the write came from THIS
  # boot rather than from a run of the pool a minute earlier, and it is not
  # dressed up as if it did. Closing that needs a `not_before` anchor, and this
  # file has nowhere to get one: the only server instant it sees is its own boot
  # Response, which is issued AFTER the write it would have to bound, so it
  # cannot reject the value it is meant to reject. heartbeat-cycle.yaml has the
  # anchor because it has two `delay: 1000` steps and three Heartbeat Responses;
  # a single-boot file has neither. The window is 300s rather than something
  # tight because a 429 retry can legitimately hold this step for minutes
  # (Retry-After honoured, cap 3), and a bound that goes red on the server
  # throttling us is measuring the wrong thing.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.isOnline: true
      data.bootReason: "PowerOn"
      data.lastBootAt:
        is_recent: 300
      data.lastSeenAt:
        is_recent: 300
