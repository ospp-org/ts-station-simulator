name: "Heartbeat Timeout"
description: "Boot, send heartbeat, and wait with a very short timeout to test timeout handling. Expected to fail if server is slow."
# NO SERVER-STATE ASSERTION IS POSSIBLE — THE SUBJECT IS THE CLIENT.
# This file sends a Heartbeat and waits with a deliberately short timeout. What
# it exercises is the SIMULATOR own wait_for budget, not anything the server
# does: the server answers a Heartbeat identically whether or not the client is
# still listening. Its sibling chaos/connection-timeout.yaml is the same test and
# already carries skip: true for the same reason.
#
# The server-side effect of a Heartbeat is exactly two writes
# (HeartbeatHandler:29-33): updateLastSeen(), and a Redis recordHeartbeat() no
# route reads. data.isOnline is already true from the boot above, so it cannot
# move either, and asserting it would be an assertion that cannot fail.
#
# CORRECTED 2026-08-11: this used to add "a timestamp no scenario can predict" as
# a reason. The runner now has `is_recent` and heartbeat-cycle.yaml bounds that
# exact column, so the reason is gone — and it changes nothing here, because the
# reason below is the real one. This file's subject is the client's own wait
# budget; the server's write is not what it is testing, and a scenario that
# asserted it would be a duplicate of heartbeat-cycle.yaml wearing this file's
# name.
#
# Note this is a DIFFERENT ceiling from trigger-message-heartbeat.yaml, which
# also cannot assert its effect: there the message is real and the effect is
# merely unreadable; here the subject is not a server behaviour at all.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    # Aligned with global default bump (5s → 15s, commit 9e57ce2). Sprint B2
    # timeout sweep — sister scenario from Sprint B P5.1/P5.11 fix (commit
    # 3fdc7a6). UAT first-round-trip can exceed 5s.
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: send
    message: Heartbeat
    payload: {}

  - action: wait_for
    message: Heartbeat
    messageType: Response
    # Aligned with global default bump (5s → 15s, commit 9e57ce2). Sprint B2
    # timeout sweep — Heartbeat round-trip can exceed 5s under UAT latency.
    timeout_ms: 15000
    capture:
      serverTime: "payload.serverTime"
