# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
#
# SERVER BRANCH REACHED (csms-server master 6d220530)
#   app/Modules/Station/Handlers/BootNotificationHandler.php:741
#     $preservesSession = in_array($dto->bootReason, self::SESSION_PRESERVING_BOOT_REASONS, true);
#   and, when it is false, the sweep at :771-773 and the bulk UPDATE it performs at :860-876
#     ->update(['status' => 'failed', 'fail_reason' => 'Station rebooted',
#               'fail_error_code' => 1010, 'stopped_at' => now(), ...])
#   followed by one SessionForceFailed per killed session (:782-784) ->
#   HandleSessionForceFailed.php:44 -> FailSessionAction::settleForceFailed ->
#   SettlementService::settle(ForceFailedReboot) (FailSessionAction.php:239).
#
# THIS IS THE CONTROL FOR THE PRESERVE PROOFS, AND IT HAS HAD TO MOVE TWICE.
#   core/boot-reconnect-preserves-live-session.yaml is this file with ONE literal
#   changed, the second boot's bootReason: same station, same uptimeSeconds 0, same live
#   session, same steps in the same order up to the assertion. That file asserts
#   `active` and this one `failed` + 1010, so the opposite server-written outcome is
#   attributable to the bootReason string and to nothing else. core/boot-error-recovery.yaml
#   is a sibling rather than a twin: besides the bootReason it also differs in the
#   station's response delays, offlineModeSupported, connectionType and
#   pendingOfflineTransactions, none of which the outcome reads (:741 reads bootReason
#   alone, and the sweep reads uptimeSeconds). A control on the same side of the
#   partition as the files it controls proves nothing: a server that preserved EVERY
#   session would pass all of them.
#
#     sent         moved to PRESERVE by           re-pointed by
#     PowerOn      csms-server daae2492 (X3)      0c31dff, from boot-poweron-fails-live-session
#     ManualReset  csms-server bd7f7135           2026-09-24, from boot-manual-reset-fails-live-session
#
#   At master the partition is six of the enum's eight
#   (SESSION_PRESERVING_BOOT_REASONS, BootNotificationHandler.php:131-138):
#
#     PRESERVE  PowerOn  Watchdog  ErrorRecovery  Reconnect  ManualReset  ScheduledReset
#     END       RemoteReset  FirmwareUpdate
#
#   The server's own suite pins the same split reason by reason:
#   tests/Integration/Modules/Station/Handlers/BootPreservesTheSessionTheStationMustResumeTest.php,
#   x3PreservingReasons() -> `active`, x3EndingReasons() -> `failed`.
#
# WHY RemoteReset, OF THE TWO THAT STILL END A SESSION.
#   NEITHER reaches this file's precondition -- a live session on the server's books
#   when the boot lands -- with every party conformant. 05-state-machines.md §2.3, in
#   the paragraph "`Unknown` has six exits, not three.", says so of both: "A commanded
#   Reset cannot reach this state (it is refused with `3016`, or settles the session
#   first ...), and a firmware update cannot either (§7.4)". The ending arm is the
#   server's answer to such a boot arriving anyway, so the fixture is a boot one of
#   those two rules should have prevented, and the choice is which rule.
#
#     RemoteReset     "Reboot the server commanded via Reset [MSG-015]" (03-messages.md
#                     §1.1, "REQUEST Payload"). reset.md §5 rule 3: under `force: true`
#                     the station "MUST complete that settlement before rebooting", and
#                     "`force` is not a licence to drop a session on the floor". A live
#                     session at this boot is that settle-first skipped or lost. Nothing
#                     else in the payload has to move: a Reset return carries unchanged
#                     firmware (conformance TC-DM-003, "Expected Results" item 1).
#     FirmwareUpdate  "Reboot after firmware update" (same table). Sent with this
#                     fixture's unchanged firmwareVersion "1.0.0" it reports an update
#                     that changed nothing, so a coherent FirmwareUpdate boot needs a
#                     SECOND literal moved, and the one-literal attribution is lost.
#
#   csms-server made the same choice for its own fixtures in the commit that moved
#   ManualReset: bd7f7135 re-pointed tests/MoneyE2E/RebootStuckSessionRefundTest.php
#   (four boots) and the uptime-0 wire test
#   tests/MqttIntegration/CertRenewalDuringSessionWireTest.php from ManualReset to
#   RemoteReset, and moved no other field.
#
#   The server reads neither value beyond the partition. The one reason-keyed branch
#   outside the handler, HandleBootAfterFirmwareUpdate.php:155, tests ErrorRecovery
#   alone, and no server code correlates a RemoteReset boot with a Reset it sent. So no
#   Reset goes on the wire before the boot: it would move this file away from its
#   preserve twin without changing what the server decides.
#
#   IT IS ALSO THE CONTROL device-management/reset-forced-settles-session-as-operator-stop.yaml
#   CITES. That file's last assertion -- `completed` surviving a RemoteReset boot -- is a
#   negative: same boot literal, same uptimeSeconds 0, but the session is settled first.
#   Were RemoteReset ever moved onto the preserving side, that file would stay green for
#   the wrong reason and this one would go red. While this file sent ManualReset, no
#   scenario carried a live session into a RemoteReset boot.
#
#   It does not duplicate device-management/soft-reset.yaml or hard-reset.yaml. Those
#   hold no session and assert the PERSISTED column (`data.bootReason: "RemoteReset"`),
#   an echo of the wire literal; this one asserts the SESSION CONSEQUENCE, which is
#   derived. Same value, two different facts.
#
# uptimeSeconds 0 IS STILL LOAD-BEARING.
#   failStuckSessions only fails sessions whose `started_at` precedes the power-on
#   instant `now() - uptimeSeconds` (BootNotificationHandler.php:745, predicate at
#   :830-840). uptime 0 puts that instant at `now`, so every started_at precedes it and
#   the bootReason is the only thing left deciding the outcome. It is also what
#   boot-notification.md §5.2 rule 2 requires of a RemoteReset: the seven real-boot
#   reasons "carry an uptime measured from the restart they name", and rule 3 makes a
#   reason whose uptime did NOT reset the inconsistent report a server must refuse to
#   act on.
#
# WHAT THE CORPUS NO LONGER PROVES
#   No scenario now carries a live session across a ManualReset or a ScheduledReset
#   boot. core/boot-manual-reset.yaml and core/boot-scheduled-reset.yaml hold no
#   session and assert only the echoed column, so the side bd7f7135 moved those two
#   onto is proven by the server's suite and not by this corpus.
name: "Boot RemoteReset Fails Live Session"
description: "Control for the preserve proofs. Identical to the Reconnect proof except the second boot's bootReason, RemoteReset instead of Reconnect: RemoteReset is not in SESSION_PRESERVING_BOOT_REASONS, so the server force-fails the live session with fail_error_code 1010."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay available, then a live session ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 600
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"

  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false

  # Same pre-condition assertion as the Reconnect twin, so the two start from a
  # state the server agrees on.
  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"

  # --- The re-boot under test. RemoteReset + uptime 0 -- the only changed literal
  #     against the Reconnect proof, which sends Reconnect here (the ErrorRecovery
  #     sibling sends ErrorRecovery). ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "RemoteReset"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: delay
    ms: 1500

  # THE ASSERTION. Both fields are server-written and neither appears anywhere in
  # this scenario's own payloads:
  #   data.status = "failed"    -- the bulk UPDATE at BootNotificationHandler.php:865
  #   data.fail_error_code 1010 -- a literal in that same UPDATE (:867); the field is
  #                               only serialised at all when the status IS failed
  #                               (SessionResource.php:107-110). Four other writes put
  #                               1010 on a session (SessionTimeoutService.php:88,109,
  #                               CommandTimeoutScanner.php:286,311), and each is a
  #                               PENDING or STOPPING session whose command went
  #                               unanswered. This one was asserted `active` above with
  #                               its StartService answered, so on it the pair is
  #                               reachable only through the reboot sweep.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "failed"
      data.fail_error_code: 1010

  # --- Pool-hygiene teardown: the session is already terminal (the server failed
  #     it), so only the bay needs returning to Available. ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
