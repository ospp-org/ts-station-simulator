name: "Boot Resets Bays To Unknown — On A Restart, Not On A Reconnect"
description: "Drive both bays to `available`, then Boot twice from the same state: a PowerOn reads them back `unknown`, a Reconnect reads them back `available`. Proves the server's boot-time bay reset FIRES (rather than that bays happen to start unknown) AND that it fires only on a genuine restart — the two Boots differ in `bootReason` alone."
# WHY THIS FILE EXISTS. `unknown` is the one bay state the whole corpus names and
# nothing asserts. Sixteen bay-status assertions cover `available`, `reserved`,
# `faulted` and `unavailable`; fourteen files mention `unknown` in a comment, and
# every one of them mentions it as the ANTI-value — the baseline an assertion must
# not be satisfiable by (status-notification.yaml:89, 10-station-parallel-boot:81,
# trigger-message-status:116). That reasoning is correct and it is exactly why the
# transition INTO `unknown` was never covered: on a fresh pool station the bays are
# already `unknown` (RegisterStationAction.php:45, create_bays_table:18), so a file
# that booted and read `unknown` back would assert the initial state and could not
# fail.
#
# THE SUBJECT IS A WRITE, NOT A DEFAULT. BootNotificationHandler.php:396 calls
# resetBaysToUnknown() on every accepted Boot, and it sits OUTSIDE the
# reconnect/reboot branch above it (:387-395) — every Boot, whatever the reason.
# `unknown` is the seventh FSM state and is not a wire value: bay-status.schema.json
# lists six, ReportableBayStatus excludes it, and the SDK's own docblock says "a
# server enters it on connection loss and leaves it on the next accepted
# StatusNotification. Both parties hold it, neither transmits it." So the simulator
# CANNOT put a bay into `unknown` — only the server can. That is what makes reading
# it back a server-derived fact rather than an echo of what we sent.
#
# HOW IT IS MADE FALSIFIABLE. Each proof is preceded by an ARM step that drives the
# bays away from `unknown` and asserts they got there. Without the arm, the proof
# read is vacuous; with it, the value read back can only be the server's own doing.
# Delete the status wipe from BootNotificationHandler::resetBaysToUnknown() and
# PROOF 1 goes red at the read. Take the `if (! $isReconnect)` guard back off it and
# PROOF 2 goes red on its own while PROOF 1 still passes — that pair, in that
# asymmetry, is the discrimination this file is for.
#
# THE SERVER BIT WAS NAMED HERE, THEN MOVED — AND THE FILE SAID SO BOTH TIMES. This
# block used to close: "Neither mutation above has been executed against a running
# server." One of them since has: csms-server f8f3af2b put the wipe under
# `if (! $isReconnect)`, which is precisely the mutation named two paragraphs up as
# the one that reds PROOF 2 alone. PROOF 2 is inverted to match, and the prediction
# held — PROOF 1 was untouched by it.
#
# What WAS measured on UAT (2026-08-14), before that change, is the scenario-side
# mutation: PROOF 2's expected value changed from `unknown` to `available` gave rc=1
# at step [18] alone, "expected available, got unknown", with steps 0-17 untouched.
# That measurement is kept deliberately, because it is now the RECORD OF THE OLD
# BEHAVIOUR: the same read that returned `unknown` under the old server is asserted
# to return `available` under the new one, and the two are one commit apart.
#
# WHAT CARRIES THAT SECOND HALF IS THE SCHEMA, AND IT CARRIES IT BY CONSTRUCTION.
# bay-status.schema.json enumerates six values and states in its own description that
# `Unknown` is "deliberately absent here, because no party transmits it", with the
# added rule that a generated type "MUST NOT gain `Unknown` back". The simulator
# therefore cannot put a bay into `unknown` — there is no message it can send that
# would. The ARM read two seconds earlier proves the value was `available`. Between
# those two reads something wrote, and the only party that can write that value is
# the server. So the discrimination is real without the code mutation; executing it
# would confirm the argument, not create it.
#
# THE EXPERIMENT THIS FILE ASKED FOR HAS NOW BEEN PERFORMED — BY THE SERVER.
# Until 2026-09-03 this block read: "WHAT IS STILL ONLY READ, NOT MEASURED: that the
# reset is UNCONDITIONAL ... Moving the line is the only thing that would demonstrate
# it, and that has not been done." It has been done. csms-server f8f3af2b moved
# `'status' => 'unknown'` inside `if (! $isReconnect)` in resetBaysToUnknown(), and
# PROOF 2 is inverted here to match — the mutation this file named as its own
# discriminator, executed, with PROOF 1 still passing exactly as predicted.
#
# The paragraph that stood here also said: "A future decision to reset only on a
# genuine reboot would be a behaviour change, and this file going red is the correct
# report of one." That is what happened, and this edit is the report — not a repair
# of a broken scenario. The old expectation was true of the old server.
#
# WHY THE NEW EXPECTATION IS THE RIGHT ONE. §5.2 defines `Reconnect` as "the only
# member that does not name a boot", sent when the station re-establishes MQTT
# WITHOUT having restarted. A station that never restarted did not lose its bays, so
# the server's knowledge of them is no staler after the reconnect than before it —
# and `unknown` is not cosmetic, it refuses money with 3002 BAY_NOT_READY. The three
# sweeps beside the reset (failStuckSessions, failStuckFirmwareUpdates,
# failStuckDiagnosticsUploads) all preserve on this branch; the bay wipe was the
# fourth call and the only one that did not, which is what f8f3af2b closed.
#
# WHAT WOULD MAKE THIS FILE GO RED AGAIN, IN EITHER DIRECTION. PROOF 1 red = the
# reset stopped firing at all. PROOF 2 red = the wipe escaped the guard and a
# reconnect is wiping bays again. Both are real reports; neither is a flake.
#
# NO SETTLE DELAY AFTER A BOOT, AND ONE AFTER EVERY StatusNotification. Asymmetric
# on purpose. resetBaysToUnknown() runs at :396, before `return $response` at :400,
# so the UPDATE is committed before the Response this file waits on is even built —
# the same argument heartbeat-cycle.yaml makes for last_seen_at. StatusNotification
# is fire-and-forget with no Response to synchronise on, so the read races the
# consumer; 1000ms is the value status-all-bay-states.yaml measured on UAT after
# 300ms read back the PREVIOUS state.
#
# NOT RACING THE SWEEP. `bays:resolve-unknown` asks a station to re-report bays that
# have been `unknown` for longer than ospp.unknown_bay_timeout_seconds — measured 30
# on UAT. Every read here lands within ~2s of the Boot that wrote the value, so the
# sweep cannot have moved it. This file is deliberately fast for that reason.
#
# POOL-SAFE. No exclusive station needed. The allocator (ScenarioRunner.ts:1159)
# already holds one station per scenario, and this file leaves it online with both
# bays `unknown` — the same state any Boot leaves behind, and one the next
# scenario's own Boot re-establishes.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  # --- Boot 1: bring the station up. NOTHING is asserted about the bays here.
  # They are `unknown` at this point, and saying so would be the vacuous assertion
  # this file exists to avoid.
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- ARM 1: drive both bays out of `unknown` and prove they left. -----------
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_2}}"
      bayNumber: 2
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  - action: delay
    ms: 1000

  # Both bays pinned: the two Events are independent writes, and arming only one
  # would leave the other's proof read exactly as unfalsifiable as before.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bays[bayNumber=1].status: "available"
      data.bays[bayNumber=2].status: "available"

  # --- PROOF 1: a genuine reboot resets both bays. ---------------------------
  # uptimeSeconds 0 with PowerOn is the unambiguous reboot: the station is telling
  # the server it just power-cycled, so nothing it previously reported about its
  # bays survives.
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bays[bayNumber=1].status: "unknown"
      data.bays[bayNumber=2].status: "unknown"

  # --- ARM 2: drive them back out, so PROOF 2 reads a value it had to move. ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_2}}"
      bayNumber: 2
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  - action: delay
    ms: 1000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bays[bayNumber=1].status: "available"
      data.bays[bayNumber=2].status: "available"

  # --- PROOF 2: a Reconnect Boot does NOT reset them — the reset is a RESTART's.
  # uptimeSeconds is ~25h and the reason is `Reconnect`: the station is telling the
  # server it never restarted, only re-established MQTT. That is the branch at
  # BootNotificationHandler.php:387 which PRESERVES in-flight sessions — and as of
  # csms-server f8f3af2b the status wipe is INSIDE that preservation, so the bays
  # survive. This step is what distinguishes "the reset fires on a reboot" from "the
  # reset fires on every Boot", and it now reads the FIRST of those.
  #
  # INVERTED, NOT DELETED, AND THE ARM IS WHY IT IS STILL A PROOF. Reading a value
  # that was already there proves nothing — which is the trap this file was built to
  # avoid, and the reason ARM 2 exists. ARM 2 drove both bays to `available` and
  # asserted they got there; PROOF 1 proved a PowerOn Boot wipes that same value
  # two steps earlier, in this same run, on this same station. So `available` here
  # is not "nothing happened": it is the server declining a write it demonstrably
  # performs on the other branch, with the branch selector as the only variable.
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 90000
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "Reconnect"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bays[bayNumber=1].status: "available"
      data.bays[bayNumber=2].status: "available"
