name: "Connection Lost LWT"
description: >
  KNOWN GAP — asserts nothing, and the automatic behaviour it names is contested.
  The will IS configured (MqttConnection.ts:342-358) but with willDelayInterval:10, while
  the sim auto-reconnects on a fixed 5s period — sessions/arc8-reconnect-preserve.yaml:7-10
  records from a live UAT run that "the 5s auto-reconnect cancels the real 10s-delayed will",
  which is exactly why THAT file injects ConnectionLost as an explicit send step instead.
  Here `fault: disconnect` is also the LAST step, so ScenarioRunner.ts:1333 immediately
  issues a clean station.disconnect(); and there is no wait_for, api_call or assert after it.
  So whether or not the broker publishes the will, this file cannot observe it and passes
  either way. To make it real: inject ConnectionLost explicitly (arc8 pattern) or assert
  server-side state after the fault.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    # Aligned with global default bump (5s → 15s, commit 9e57ce2). Sprint B2
    # timeout sweep — sister scenario from Sprint B P5.1/P5.11 fix (commit
    # 3fdc7a6). UAT first-round-trip can exceed 5s.
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: delay
    ms: 1000

  - action: fault
    type: disconnect

# NO SERVER-STATE ASSERTION — THE LWT EFFECT IS NOT OBSERVABLE IN THIS WINDOW.
# Attempted, measured, and reverted rather than reshaped into a green.
#
# The intended assertion was data.isOnline false after the disconnect:
# ConnectionLostHandler:69 calls StationOfflineService::markOffline on the Last
# Will, broker-driven, and an api_call still works after the MQTT link is gone
# because it is plain HTTP. Measured on UAT 2026-08-10 with a 3000ms settle:
# isOnline was still TRUE. The station-side close is ungraceful — FaultStep
# disconnect calls destroyConnection() — so the will should not be suppressed by
# a clean MQTT DISCONNECT, and two candidate causes remain, neither diagnosable
# from a scenario:
#   - the broker had not yet declared the client gone (EMQX publishes the will on
#     ITS detection, which may wait for keepalive expiry rather than the TCP
#     reset), or
#   - the will was published and REJECTED server-side. A ConnectionLost is an
#     EVENT, and a non-REQUEST that fails version negotiation goes to the DLQ
#     silently, so a will carrying the wrong protocolVersion would vanish exactly
#     like this. That failure mode has bitten this message before.
#
# WHY NOT JUST WAIT LONGER. isOnline WOULD eventually flip: a second detector,
# CheckStationHeartbeatsCommand, sweeps every minute for 3.5 x heartbeatIntervalSec
# of silence (config/ospp.php:163-166, ~105s at 30s) and converges on the same
# markOffline (StationOfflineService:18). A ~170s delay would therefore turn this
# file green — while proving the SLOW SWEEP, which is not what a file named
# connection-lost-lwt is for. It would be a green that asserts the wrong
# mechanism, and it would hide the very regression it looks like it covers.
#
# So: no assertion, and the gap is stated. Closing it needs the LWT path
# diagnosed server-side (is the will published, and does it survive negotiation),
# not a scenario edit. If that is fixed, the assertion to add is
# data.isOnline false after a short settle — and it should stay short on purpose.
