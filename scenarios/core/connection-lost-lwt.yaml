name: "Connection Lost LWT"
description: >
  KNOWN GAP — asserts nothing, and the automatic behaviour it names is contested.
  The will IS configured (MqttConnection.ts:342-358) but with willDelayInterval:10, while
  the sim auto-reconnects on a fixed 5s period — sessions/arc8-reconnect-preserve.yaml:7-10
  records from a live UAT run that "the 5s auto-reconnect cancels the real 10s-delayed will",
  which is exactly why THAT file injects ConnectionLost as an explicit send step instead.
  Here `fault: disconnect` is also the LAST step, so ScenarioRunner.ts:1333 immediately
  issues a clean station.disconnect(); and there is no wait_for, api_call or assert after it.
  So whether or not the broker publishes the will, this file cannot observe it and passes
  either way. To make it real: inject ConnectionLost explicitly (arc8 pattern) or assert
  server-side state after the fault.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    # Aligned with global default bump (5s → 15s, commit 9e57ce2). Sprint B2
    # timeout sweep — sister scenario from Sprint B P5.1/P5.11 fix (commit
    # 3fdc7a6). UAT first-round-trip can exceed 5s.
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: delay
    ms: 1000

  - action: fault
    type: disconnect
