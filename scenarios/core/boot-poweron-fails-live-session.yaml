# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
#
# SERVER BRANCH REACHED
#   csms-server app/Modules/Station/Handlers/BootNotificationHandler.php:355-356
#     } else { $this->failStuckSessions($station->id, now()->subSeconds($dto->uptimeSeconds)); }
#   and the bulk UPDATE it performs at :425-431
#     ->update(['status' => 'failed', 'fail_reason' => 'Station rebooted',
#               'fail_error_code' => 1010, 'stopped_at' => now(), ...])
#   followed by one SessionForceFailed per killed session (:455) ->
#   FailSessionAction::settleForceFailed -> SettlementService::settle(ForceFailedReboot).
#
# THIS IS THE CONTROL FOR core/boot-reconnect-preserves-live-session.yaml.
#   Same station shape, same uptimeSeconds 0, same live session, same steps in the
#   same order. ONE literal differs: bootReason is `PowerOn` instead of
#   `Reconnect`. So the opposite server-written outcome cannot be attributed to
#   anything else — not to the uptime window (identical), not to timing (both
#   assert the session is `active` immediately before the re-boot).
#
#   Without this file the preserve proof is hollow: a server that never failed
#   ANY session would pass the Reconnect scenario perfectly.
#
# WHAT THE SIX "REBOOT" VALUES ACTUALLY COVER
#   PowerOn, Watchdog, FirmwareUpdate, RemoteReset, ManualReset and
#   ScheduledReset all fall into this one `else`. The server does not distinguish
#   them anywhere — `stations.boot_reason` records the string (:203) and nothing
#   branches on the column. core/boot-watchdog, core/boot-manual-reset,
#   core/boot-scheduled-reset and core/boot-firmware-update are therefore four
#   scenarios on ONE branch, and none of them asserts its effect: each ends at
#   `payload.status == "Accepted"`, which is byte-identical to core/happy-boot.
#   This file is the one that actually exercises the arm.
name: "Boot PowerOn Fails Live Session"
description: "Control for the Reconnect preserve proof. Identical scenario, bootReason PowerOn instead of Reconnect: the server MUST force-fail the live session with fail_error_code 1010."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay available, then a live session ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 600
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"

  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false

  # Same pre-condition assertion as the Reconnect twin, so the two start from a
  # state the server agrees on.
  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"

  # --- The re-boot under test. PowerOn + uptime 0 — the only changed literal. ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: delay
    ms: 1500

  # THE ASSERTION. Both fields are server-written and neither appears anywhere in
  # this scenario's own payloads:
  #   data.status = "failed"    — the bulk UPDATE at BootNotificationHandler.php:427
  #   data.fail_error_code 1010 — a literal in that same UPDATE (:429); the field is
  #                               only serialised at all when the status IS failed
  #                               (SessionResource.php:66-69), so pinning it proves
  #                               the reboot path specifically and not some other
  #                               route to `failed`.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "failed"
      data.fail_error_code: 1010

  # --- Pool-hygiene teardown: the session is already terminal (the server failed
  #     it), so only the bay needs returning to Available. ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
