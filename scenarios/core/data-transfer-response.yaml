name: "Data Transfer Response"
description: "Boot, trigger CSMS to send DataTransfer to station via API, wait for request, assert vendorId, send Accepted response."
# NO SERVER-STATE ASSERTION IS POSSIBLE — DataTransfer PERSISTS NOTHING.
# DataTransferHandler writes no row: it Log::info()s the inbound message and
# returns a Response whose status it computes from the vendorId/messageId pair
# (UNKNOWN_VENDOR, UNKNOWN_DATA, or ACCEPTED). There is no table, no column and
# no REST surface behind this message.
#
# So the Response status this file already asserts IS the complete observable,
# and it is a good one: the status is server-computed from a lookup, not echoed.
# Marked so the next sweep does not go hunting for a read-back that cannot exist.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  # Boot first
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.2.3"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: delay
    ms: 2000

  # ── RED SINCE csms-server 430c85f9 (2026-08-17), AND IT IS THE SERVER'S ─────
  #
  # Measured on UAT 2026-08-25: this step answers **400 INVALID_MESSAGE_FORMAT / 1005**,
  # "Outbound DataTransfer request violates its wire schema: /data: The data (array) must
  # match the type: object". LEFT FAILING ON PURPOSE — see below.
  #
  # The body sent here is conformant. `data-transfer-request.schema.json` types `data` as
  # `"object"` and does not require it at all, so `{}` is a valid value.
  #
  # What happens to it: `DataTransferRequest` validates `data` as `nullable|array` and
  # `DataTransferDto::$data` is typed `?array` — and PHP HAS ONE ARRAY TYPE, so an empty
  # JSON object arrives as `[]` and re-serializes as a JSON ARRAY. The server's own outbound
  # rail (`MqttStationGateway::assertOutboundRequestConforms`, added 430c85f9) then refuses
  # the message the server itself built, before publishing, so the operator gets 400 instead
  # of 202.
  #
  # That rail already knows this hazard — its comment reads "PHP has one array type, so
  # `json_encode([])` is `[]` … Without this line the gate would refuse a conformant
  # GetConfiguration" — and normalises `$envelope->payload === [] ? '{}' : …`. The
  # normalisation is TOP-LEVEL ONLY. `DataTransfer.data` is a NESTED field the schema types
  # as `object`, so it never reaches it, and the server cannot send a DataTransfer carrying
  # an empty `data` object at all.
  #
  # WHY `data: {}` STAYS. Dropping the key or sending `{"k":"v"}` makes this line green in a
  # minute and deletes the only coverage the corpus has of the server's OUTBOUND DataTransfer
  # path — the sibling `data-transfer.yaml` drives the station->server direction and never
  # touches it. The fix belongs in csms-server, in the DTO or in the rail's normalisation.
  #
  # Trigger CSMS to send DataTransfer — but start listening FIRST
  # because the message may arrive before api_call returns.
  # Real route per csms-server routes/api/v1/admin.php:43.
  # Body is camelCase (DataTransferRequest) per OSPP wire-protocol field
  # naming.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/data-transfer"
    body:
      vendorId: "TestVendor"
      dataId: "test"
      data: {}
    expect_status: 202

  # Wait for DataTransfer Request from CSMS
  - action: wait_for
    message: DataTransfer
    messageType: Request
    timeout_ms: 15000

  - action: assert
    field: "payload.vendorId"
    exists: true

  # Send DataTransfer Response back
  - action: send
    message: DataTransfer
    messageType: Response
    payload:
      status: "Accepted"
      data: {}
