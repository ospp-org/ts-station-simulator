name: "Data Transfer"
description: "Boot, then send a DataTransfer request from station to server and wait for response."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    # Aligned with global default bump (5s → 15s, commit 9e57ce2). Under UAT
    # TLS + cross-region latency the first BootNotification round-trip can
    # exceed 5s, which surfaced as P5.11 flake in the V2 report.
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: delay
    ms: 500

  - action: send
    message: DataTransfer
    messageType: Request
    payload:
      vendorId: "TestVendor"
      dataId: "diagnostic_v1"
      data:
        metrics: true

  - action: wait_for
    message: DataTransfer
    messageType: Response
    timeout_ms: 10000

  # WHAT THIS USED TO ASSERT, AND WHY IT CHANGED. This said `Accepted` until
  # 2026-08-07. That WAS the server's answer, and the blanket Accept was removed ON
  # PURPOSE as AUDIT-01 F-14 — it is not a regression and must not be restored.
  # DataTransferHandler.php:22-27 records both the rule and the reason:
  #
  #   "The registry (`config('ospp.data_transfer.vendors')`, vendorId => list<dataId>)
  #    is EMPTY by default, so every inbound DataTransfer is answered UnknownVendor.
  #    This server implements no vendor extensions — it only logs the payload — so the
  #    prior blanket Accepted falsely told the vendor its data had been processed."
  #
  # `UnknownVendor` is the CONFORMING answer for an unregistered vendorId and is
  # explicitly NOT an error condition (profiles/core/data-transfer.md §5.1). The
  # three-value rule is UnknownVendor (vendor unknown) / UnknownData (vendor known,
  # dataId not implemented, §5.2) / Accepted (a pair this server really implements).
  #
  # So the assertion below is the one this scenario can honestly make: "TestVendor"
  # is not in the registry and cannot be, since a vendor is registered only alongside
  # real handling for its dataIds. Asserting `Accepted` would be asserting that the
  # server lies. If a vendor is ever registered, THAT is when this expectation moves —
  # and the scenario should then name the registered pair rather than "TestVendor".
  - action: assert
    field: "payload.status"
    equals: "UnknownVendor"
