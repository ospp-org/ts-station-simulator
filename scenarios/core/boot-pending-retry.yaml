name: "Boot Pending Retry"
description: "Force next boot to return Pending via API, send BootNotification, assert Pending, wait retryInterval, retry boot, assert Accepted."
skip: true
skip_reason: "Pending boot status not implemented in csms-server BootNotificationHandler (only Accepted/Rejected branches at BootNotificationHandler.php:56-81). Scenario preserved in-place for discoverability; deferred to a separate feature brief post-K closure. Brief K1 Phase 0 disposition variant (b)."
# SECOND, INDEPENDENT BLOCKER — read this before deleting the skip above.
# `stationId` below is HARDCODED, so this file does not take a pool-provisioned
# identity: it needs cert files that already exist for that exact id. They exist
# only under `certs/sandbox/` (leaf + key, and no `-chain.pem`), and `certs/` is
# gitignored in full — zero cert files are tracked — so on any other machine, or
# against any other target, the resolved path is simply absent. Un-skipping this
# for the server-side reason alone would turn it from an honest skip into a
# machine-dependent failure.
# Fix when the feature lands: either switch to `stationId: "{{stationId}}"` and
# take the pool identity like every other core scenario, or declare the
# dependency with `requires_files` naming the leaf/key actually used.
station:
  stationId: "stn_0000001e"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
    auto_retry_boot: false
steps:
  # Reset sandbox state for this station
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/conformance/reset?station={{stationId}}"
    expect_status: 200

  - action: delay
    ms: 1000

  # Setup: force next boot to return Pending
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/stations/{{stationId}}/force-pending"
    body:
      retry_interval: 10
    expect_status: 200

  - action: delay
    ms: 3000

  # First boot — should be Pending
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.2.3"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000
    capture:
      bootStatus: "payload.status"
      retryInterval: "payload.retryInterval"

  - action: assert
    field: "payload.status"
    equals: "Pending"

  # Wait retryInterval then retry
  - action: delay
    ms: 10000

  # Retry boot — should be Accepted
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.2.3"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 10
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"
