name: "Boot Pending Retry"
description: "Force next boot to return Pending via API, send BootNotification, assert Pending, wait retryInterval, retry boot, assert Accepted."
skip: true
skip_reason: >-
  RE-VERIFIED 2026-08-15 against csms-server e10dc3c — the reason this file carried until today
  was FALSE. It said "Pending boot status not implemented (only Accepted/Rejected branches at
  BootNotificationHandler.php:56-81)". Pending HAS been implemented since c5c6e59/bca8230, the
  silent-dead-letter half was fixed at 0c19afe (2026-08-14), and the response is built at
  BootNotificationHandler.php:315 / pendingResponse():735, carrying sessionKey and 3018 details.
  The cited line range no longer exists. csms-server docs/STATUS.md:652-655 had already recorded
  that this reason was false; nothing propagated it here, because a skipped scenario never runs
  and so nothing ever reads its reason.
  STILL SKIPPED, for three blockers that ARE true today, in the order they would bite.
  (1) The setup routes do not exist. Steps 1 and 3 call POST /api/v1/conformance/reset and
  POST /api/v1/stations/{id}/force-pending with expect_status 200; grep over csms-server routes/
  for "conformance" and "force-pending" returns ZERO hits. This file would fail on its first step.
  (2) IS NO LONGER TRUE — CORRECTED 2026-08-26, and it was measured on the wire, not re-read.
  It said: "Pending is unreachable: the server writes it from exactly one place, the topology
  comparator behind config('ospp.enforce_boot_topology'), which is false on UAT ... With it off
  the server answers Accepted." Both halves died the same day. csms-server 27032a35 established
  that `false` was never an off position — "false is the neutral element of ||", so the flag could
  only ever WIDEN the comparison — and replaced the boolean with a three-position enum
  (Force/Auto/Off) whose historical default, and the value every environment resolves to because
  the key ships absent, is Auto: compare wherever a topology is RECORDED. 483f73e3 established who
  records one: CertificateManager:404-407 writes bay_programs UNCONDITIONALLY on every
  provisioning, so every station this suite bootstraps is armed the moment it is provisioned.
  Measured live in results/uat-refusals-20260826T132926.log — a pool station declaring a bay it never provisioned was answered
  Pending + 3018 with both sides of the comparison in details, and the next conformant boot was
  Accepted. The proof now lives in core/boot-pending-topology-mismatch.yaml, which needs none of
  this file's setup. The remaining sentence of the old text still stands as a warning: arming this
  fleet-wide is not a workaround, and `Off` exists precisely because there is no return edge for a
  station whose real hardware disagrees.
  (3) The hardcoded sandbox identity and its gitignored cert material — declared as requires_files
  below, and unchanged.
  Fixing (1) and (2) is a server question, not a scenario edit. If you need only to prove the
  server accepts a restricted station's SignCertificate, that is already measured without any of
  this — see docs/MEASURED-signcertificate-while-pending-20260815T044900Z.md.
# SECOND, INDEPENDENT BLOCKER — read this before deleting the skip above.
# `stationId` below is HARDCODED, so this file does not take a pool-provisioned
# identity: it needs cert files that already exist for that exact id. They exist
# only under `certs/sandbox/` (leaf + key, and no `-chain.pem`), and `certs/` is
# gitignored in full — zero cert files are tracked — so on any other machine, or
# against any other target, the resolved path is simply absent. Un-skipping this
# for the server-side reason alone would turn it from an honest skip into a
# machine-dependent failure.
# It is DECLARED below rather than only described, so the order of removal cannot
# matter: `skip: true` wins while the feature is missing (not-applicable — nothing
# about the system is in question), and the moment someone deletes it the
# requires_files gate takes over and reports INCONCLUSIVE instead of failing on a
# machine that never had the fixture. Under --require-conclusive that is a
# non-zero exit, which is the honest answer to "did this run prove anything".
# Better fix when the feature lands: switch to `stationId: "{{stationId}}"` and
# take the pool identity like every other core scenario, and drop both.
requires_files:
  - "certs/sandbox/stn_0000001e.pem"
  - "certs/sandbox/stn_0000001e-key.pem"
requires_files_hint: >-
  This file hardcodes stationId stn_0000001e, so it needs that identity's cert
  material to already exist; it is a sandbox identity and certs/ is gitignored.
  Run against --target sandbox on a box that has them, or convert the file to
  `{{stationId}}` and let the pool provide the identity.
station:
  stationId: "stn_0000001e"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
    auto_retry_boot: false
steps:
  # Reset sandbox state for this station
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/conformance/reset?station={{stationId}}"
    expect_status: 200

  - action: delay
    ms: 1000

  # Setup: force next boot to return Pending
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/stations/{{stationId}}/force-pending"
    body:
      retry_interval: 10
    expect_status: 200

  - action: delay
    ms: 3000

  # First boot — should be Pending
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.2.3"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000
    capture:
      bootStatus: "payload.status"
      retryInterval: "payload.retryInterval"

  - action: assert
    field: "payload.status"
    equals: "Pending"

  # Wait retryInterval then retry
  - action: delay
    ms: 10000

  # Retry boot — should be Accepted
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.2.3"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 10
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"
