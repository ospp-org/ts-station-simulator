# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
#
# SERVER BRANCH REACHED — NONE, SINCE THE SESSION-END RULE (2026-10-13)
#   A session is ended ONLY by the station's end record: its SessionEnded, or the
#   StopService RESPONSE of a stop the server asked for. No boot ends one, whatever
#   its bootReason or its uptimeSeconds, so after ANY boot a live session stays
#   `active`. What this file proves now is that a Reconnect boot ended nothing; the
#   session's end record is the station's own SessionEnded at the end (`Local`),
#   which a conforming station sends and this file does not read back.
#
#   Until that rule it reached the PRESERVE arm, first quoted here as csms-server
#   app/Modules/Station/Handlers/BootNotificationHandler.php:343-354 had it:
#     $isReconnect = in_array($dto->bootReason,
#                             [BootReason::RECONNECT->value, BootReason::ERROR_RECOVERY->value], true);
#     if ($isReconnect) { ...log... } else { $this->failStuckSessions(...); }
#
#   `Reconnect` was added to that arm by csms-server 4f2b3f4
#   ("fix: a conforming Reconnect had its live session killed") and, before this
#   file, NO scenario in the corpus had ever put that value on the wire: of 107
#   scenarios, 101 send PowerOn, 4 ErrorRecovery, 3 ManualReset, 1 each
#   Watchdog / ScheduledReset / FirmwareUpdate. Zero send Reconnect.
#
# WHY uptimeSeconds IS 3 — THE UPTIME THE STATION ALREADY HAD (2026-10-13)
#   boot-notification.md §5.2 rule 2: a `Reconnect` "carries the uptime the station
#   already had — it spans the outage". This station booted with PowerOn at uptime 0
#   above, and the re-boot goes out about three seconds later (3.0 s on UAT,
#   2026-10-13, 1.5 s of it the file's own delay), so it carries 3.
#
#   It carried 0 until then, and this paragraph read: TWO layers could save a live
#   session across a boot, the bootReason and the uptime window — failStuckSessions
#   was called with `now()->subSeconds($dto->uptimeSeconds)` and failed only sessions
#   started BEFORE that instant (:402-411) — and uptime 0 disarmed the window, so the
#   bootReason string alone decided the outcome. The session-end rule removed both
#   layers with the force-fail: at a boot, neither the reason nor the uptime decides
#   anything about a session, and sessions/arc8-reconnect-preserve.yaml, cited here as
#   the proof of the UPTIME layer, proves no such layer now either. With nothing left
#   to disarm, the 0 was only a `Reconnect` that did not span the seconds this file
#   had already run: not BACKWARDS against the PowerOn's 0, so not a claim rule 3
#   refuses, but not what a real station sends, and BootClaimCheck refuses it.
#
# THE CONTROL NO LONGER DISCRIMINATES (2026-10-13)
#   core/boot-remote-reset-ends-nothing.yaml (boot-remote-reset-fails-live-session.yaml
#   until 2026-10-13) carries the same live session into a RemoteReset boot at uptime 0,
#   a restart's, where this file's Reconnect runs on. While the server ended a session at
#   that boot it expected `failed` + 1010, and the pair was the attribution: same
#   station, same uptime (both were 0 then), same session, opposite server-written
#   outcome. Under the session-end rule both boots leave the session `active`, so the
#   pair no longer discriminates: a server that ended sessions at a boot would now fail
#   BOTH files, and a server that ends none passes both.
#
#   How that control moved before, kept: it sent `PowerOn` until csms-server X3 replaced
#   the two-value predicate quoted above with SESSION_PRESERVING_BOOT_REASONS -- {PowerOn,
#   Watchdog, ErrorRecovery, Reconnect} (BootNotificationHandler.php:102-107) -- which
#   moved `PowerOn` onto THIS side. Both arms then preserved, and this file was proving
#   nothing: a server that never failed any session would have passed it. The control
#   then sent `ManualReset`, until csms-server bd7f7135 moved it and `ScheduledReset`
#   onto this side too (six of eight, BootNotificationHandler.php:131-138 at master
#   6d220530), and then `RemoteReset`, one of the two that ended a session until the
#   session-end rule.
name: "Boot Reconnect Preserves Live Session"
description: "Start a session, then re-boot with bootReason Reconnect and the uptime running on from the PowerOn boot. The server MUST leave the session active — no boot ends a session, so the station's own SessionEnded at the end is its end record."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay available, then a live session ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 600
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"

  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false

  # The session must be ACTIVE before the re-boot, or the scenario proves nothing:
  # what no boot may end is a session that has STARTED, and one still PENDING is a
  # StartService not yet answered, so an `active` read after the boot could be the
  # start landing late rather than the boot ending nothing. (A pending session used to
  # be failed by a different arm of the boot's force-fail predicate, `status = pending
  # AND created_at < bootTime`, which went with that force-fail under the session-end
  # rule, 2026-10-13.) Asserted, not assumed — `status` here is the server's own
  # sessions.status column, read back.
  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"

  # --- The re-boot under test. Reconnect + the uptime running on (3). ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 3
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "Reconnect"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: delay
    ms: 1500

  # THE ASSERTION. Every field here is written by the server:
  #   data.status          — sessions.status, which the force-fail UPDATE at :425
  #                          set to 'failed' until the session-end rule (2026-10-13);
  #                          no boot ends a session now, so a server that still did
  #                          would turn this read red
  #   data.fail_error_code — absent unless status is FAILED (SessionResource.php:66)
  # Nothing the scenario sent supplies either.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"

  # --- THE END RECORD, not just pool hygiene. The boot ended nothing, so the session
  #     is still `active`, and what ends it is the station's own SessionEnded: `Local`,
  #     the customer stopping the wash at the bay, the record a conforming station sends
  #     (the session-end rule, 2026-10-13). Its settlement is not read back here.
  #     Without it the session would hold the bay until the sweep closed it after its
  #     booked duration, `completed`, charged in full and marked
  #     `full_delivery_no_session_ended` (class: session-leak). The Available report
  #     after it moves only the bay: a StatusNotification ends no session.
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "Local"
      actualDurationSeconds: 3
      creditsCharged: 5
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Finishing"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: false
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Finishing"
      programs:
        - programNumber: 1
          available: true
