name: "Status Notification"
description: "Boot and send StatusNotification for bay Available with services, verifying the full status reporting flow."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    # Aligned with global default bump (5s → 15s, commit 9e57ce2). Sprint B2
    # timeout sweep — sister scenario from Sprint B P5.1/P5.11 fix (commit
    # 3fdc7a6). UAT first-round-trip can exceed 5s.
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  - action: delay
    ms: 500

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_2}}"
      bayNumber: 2
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  - action: delay
    ms: 1000

  # THE ASSERTION, server-recorded. Until now this file sent two StatusNotification
  # Events and asserted nothing about them: StatusNotification is an EVENT, so
  # there is no Response to wait_for and nothing comes back on the wire to check.
  # A rejected report is not visible to the sender at all — a schema-invalid one
  # lands in the DLQ (observed: chaos/malformed-messages.yaml is what moves that
  # counter), and a session-gated one is dropped with a bare `return null`
  # (StatusNotificationHandler.php:87-100). The scenario passed whether or not
  # either report ever reached a bay row.
  #
  # Server-produced: `status` is the bays.status column the handler wrote,
  # lowercased by the enum — the wire literal is `Available`, the persisted form
  # is `available`. Both bays are pinned because the two Events are independent
  # writes; asserting one would leave the other exactly as unproven as before.
  #
  # BOTH bays also start at `unknown` (bays table default), and `unknown` is a
  # value no station may put on the wire — so reading `available` cannot be
  # satisfied by the initial state and the assertion has a real failure mode.
  #
  # `[bayNumber=N]` and never an index: measured on UAT 2026-08-10, a 4-bay
  # station returned bayNumber 3 and 4 first. Order is not guaranteed.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bays[bayNumber=1].status: "available"
      data.bays[bayNumber=2].status: "available"
