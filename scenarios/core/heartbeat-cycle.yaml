name: "Heartbeat Cycle"
description: "Boot and send 3 distinct heartbeats with delay between each, capturing serverTime from every response."
# NO SERVER-STATE ASSERTION — same ceiling as trigger-message-heartbeat.yaml.
# HeartbeatHandler:29-33 does exactly two things: updateLastSeen(), which moves
# stations.last_seen_at, and a Redis recordHeartbeat(). last_seen_at is exposed as
# data.lastSeenAt but is a timestamp no scenario can predict, and expect_body has
# only equality — no changed-since or is-recent form. The tracker state is Redis
# and no route reads it. data.isOnline is already true from the boot above, so a
# Heartbeat cannot move it either, and asserting it would be an assertion that
# cannot fail. The three Heartbeat Responses this file already asserts are the
# ceiling until the runner grows an is-recent comparison.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    # Aligned with global default bump (5s → 15s, commit 9e57ce2). Under UAT
    # TLS + cross-region latency the first BootNotification round-trip can
    # exceed 5s, which surfaced as P5.1 flake in the V2 report.
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # Heartbeat 1
  - action: send
    message: Heartbeat
    payload: {}

  - action: wait_for
    message: Heartbeat
    messageType: Response
    timeout_ms: 10000
    capture:
      serverTime1: "payload.serverTime"

  - action: delay
    ms: 1000

  # Heartbeat 2
  - action: send
    message: Heartbeat
    payload: {}

  - action: wait_for
    message: Heartbeat
    messageType: Response
    timeout_ms: 10000
    capture:
      serverTime2: "payload.serverTime"

  - action: delay
    ms: 1000

  # Heartbeat 3
  - action: send
    message: Heartbeat
    payload: {}

  - action: wait_for
    message: Heartbeat
    messageType: Response
    timeout_ms: 10000
    capture:
      serverTime3: "payload.serverTime"
