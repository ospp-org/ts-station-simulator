name: "Boot Firmware Update"
description: "Boot after firmware update with new firmware version 2.0.0, assert Accepted."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "2.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "FirmwareUpdate"
      capabilities:
        bleSupported: true
        offlineModeSupported: true
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    # Aligned with global default bump (5s → 15s, commit 9e57ce2). Sprint B2
    # timeout sweep — sister scenario from Sprint B P5.1/P5.11 fix (commit
    # 3fdc7a6). UAT first-round-trip can exceed 5s.
    timeout_ms: 15000
    capture:
      heartbeatInterval: "payload.heartbeatIntervalSec"
      bootStatus: "payload.status"

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # Server-recorded, and ECHOED rather than derived — see boot-watchdog.yaml for
  # the full statement of what this does and does not prove. In short: it proves
  # the boot was persisted onto stations.boot_reason rather than merely answered,
  # and it does NOT prove any behaviour, because nothing branches on the column.
  # `FirmwareUpdate` is in the force-fail class at BootNotificationHandler.php:343.
  #
  # This file boots firmwareVersion 2.0.0, so it also pins the version the server
  # recorded for the same boot. That IS a second echoed literal, not a derived
  # one — but the pair is what makes the row attributable to THIS boot rather
  # than to any earlier one on a reused pooled station.
  #
  # NOT asserted here, deliberately: the post-firmware-update reconciliation at
  # HandleBootAfterFirmwareUpdate.php compares bootReason against the snake_case
  # literal 'error_recovery', which the schema pins as `ErrorRecovery` — so no
  # conforming station can reach that branch. Asserting anything about it would
  # be asserting a branch that cannot execute; it is recorded in the branch map,
  # not manufactured into a scenario here.
  - action: delay
    ms: 1000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.bootReason: "FirmwareUpdate"
      data.firmwareVersion: "2.0.0"
      # Bounded, not equated — see happy-boot.yaml for what a recency bound proves
      # and what it does not.
      data.lastBootAt:
        is_recent: 300
