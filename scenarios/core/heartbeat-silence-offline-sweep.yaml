name: "Heartbeat Silence Offline Sweep"
description: "Boot, arm the liveness state, send the first Heartbeat after the boot (which ends the replay), then go APPLICATION-silent for 175s on a live socket and read back a station the watchdog sweep has marked offline. The corpus's only test of the detector that needs no disconnection at all."
# THE ONE DETECTOR NOTHING EXERCISED. `station:check-heartbeats` marks a station
# offline after 3.5 x heartbeatIntervalSec of OSPP silence — measured 30 on UAT, so
# 105s — and converges on the same StationOfflineService::markOffline as the Last
# Will. No scenario in the corpus ever asserted the result. Worse, the corpus was
# arranged so it could not fire: the long files call `start_heartbeat` for the
# express purpose of keeping this sweep quiet, and the short ones omitted it — which
# StartHeartbeatStep's docblock used to justify as preserving "the ability to script
# a silence/offline-detection test (impossible if the sim always heartbeated)". The
# capability was preserved and never used. This is that file, and since 2026-09-07
# it is the only one that still holds the capability.
#
# WHY THE SOCKET STAYS UP, AND WHY THAT IS THE POINT. The only traffic during the
# silence is MQTT keepalive PINGREQ, which is transport, not OSPP. So this file
# reproduces the exact condition the cause enum describes — "no heartbeat for 3.5x
# the interval; THE SOCKET MAY STILL BE UP" — and it is the one liveness case in
# the corpus where nothing is ever disconnected.
#
# THE SILENCE IS NOW DECLARED, NOT INHERITED — see `suppress_heartbeat:` below.
# Until 2026-09-07 this file got its silence for free: scenario mode registered
# BootNotificationHandler(autoReact=false) and nothing beat in the background, for
# ANY file. That default was a non-conformance for the other 139 and has been
# inverted, so an accepted boot now arms the Heartbeat at the server's interval.
# This file is the ONE in 148 that must opt out, and the reason is mechanical
# rather than stylistic: one background pulse at t+30 pushes the threshold out past
# the 175s wait and the proof read below comes back isOnline: true. That is the same
# failure the FALSIFICATION note further down describes reaching by hand — the
# default would have reached it by itself, on every run, silently.
#
# WHAT ARMS THE SWEEP — RE-READ FROM THE SERVER 2026-09-07, AND THE PARAGRAPH THIS
# REPLACES NAMED A MECHANISM THAT NO LONGER HAS A READER. It said the sweep SCANs
# `ospp:heartbeat:*` and only considers stations that HAVE a key. csms-server changed
# that on 2026-08-29: CheckStationHeartbeatsCommand now reads the DATABASE —
# `StationRepository::findOnline()` for candidates and `stations.last_seen_at` for the
# clock — precisely because a SCAN could not see a station whose key had been evicted
# under `allkeys-lru`, and such a row stayed `is_online = true` for ever.
# HeartbeatTracker's own docblock now reads "a write and a delete with no reader".
#
# WHAT THE SWEEP COUNTS FROM - RE-READ FROM THE SERVER 2026-10-13, csms-server f413256f
# (the G11 follow-ups). Every message the server accepts now writes `last_seen_at`
# (MessageDispatcher -> StationRepository::recordHeardFrom), not only the Boot and a
# Heartbeat, and the threshold depends on whether the station's replay is open: from a
# boot answered Accepted to the station's first Heartbeat after it, the longer of 3.5 x
# the interval and 360 s (CheckStationHeartbeatsCommand::REPLAY_SILENCE_SECONDS; spec
# connection-lost.md section 4.2 rule 2); from that Heartbeat on, 3.5 x the interval. A
# station sends that Heartbeat as soon as its post-boot reports and its replay are
# acknowledged (connection-lost.md section 6), so this file sends it after its two bay
# reports and measures the silence from it. Without it, the first corpus run against
# f413256f (2026-10-12T23:58Z) read isOnline: true at 175s - the server was holding the
# station in its replay allowance, as the spec now says it must.
#
# WHY 175s. The first Heartbeat after the boot writes last_seen_at and ends the replay,
# and the station's configured interval is 30; the threshold is ceil(30 x 3.5) = 105s;
# the sweep runs every minute under `schedule:work`. So the transition lands between
# t+105 and t+165 after that Heartbeat, depending on where it fell inside the minute,
# and 175s covers the worst case with margin. It cannot
# be shortened without making the file a coin toss, which is why it declares its own timeout —
# the default is 90s (ScenarioRunner.DEFAULT_SCENARIO_TIMEOUT_MS) and this is the
# only legitimate reason to raise it.
#
# WHAT THE lastCloseCause GUARD DOES AND DOES NOT PROVE. It is a guard, not the
# discriminator, and the difference is worth stating because it is easy to overclaim.
# `none` establishes the link was not kicked, not severed, and is not currently
# down — so the run was not disturbed in a way that would confound the reading. It
# does NOT prove the socket never dropped at all: MqttConnection resets the cause to
# `none` on every successful connect (:419), so a drop followed by a reconnect reads
# identically. A drop would matter, because under clean_session the reconnect ends
# the old session and the broker publishes the will, which would mark the station
# offline for the OTHER reason. What actually rules that out is the FALSIFICATION
# below plus the server's own record: this transition logs `cause: heartbeat_timeout`
# from the scheduler in the APP container, where a will logs `cause: broker_will`
# from the MQTT CONSUMER container. Two containers, two causes, and neither is
# readable over REST — StationRepository::markOffline does not persist the cause.
#
# WHAT MAKES IT FALSIFIABLE. Interleave Heartbeats through the silence — the arc8
# pattern, `delay: 28000` plus `send Heartbeat`, which exists precisely to hold a
# station alive past a server deadline. Each one moves `last_seen_at` forward, the
# threshold is never crossed, and the proof read fails with isOnline still true.
# Measured, not assumed. The ARM read is what makes the proof non-vacuous in the
# other direction: a fresh pool station is provisioned offline with bays `unknown`,
# so all three proof values would otherwise be satisfiable by the initial state.
#
# CONTENTION — THIS FILE NEEDS SILENCE, AND SILENCE IS WHAT THE POOL ALREADY GIVES
# IT. The risk the sweep invites is that some other scenario heartbeats the station
# awake mid-wait. It cannot: StationPoolAllocator (ScenarioRunner.ts:1159) holds an
# `inUse` set with a wait queue, so a pooled station belongs to exactly one scenario
# for its whole lifetime even under `--parallel`. No exclusive-station mechanism is
# needed and none is declared. What this file DOES cost the pool is a worker blocked
# for three minutes, which is a scheduling cost, not a correctness one — and it is
# contained the same way arc8-reconnect-preserve.yaml contains its own 347s.
#
# NOT RACING bays:resolve-unknown. That sweep triggers a re-report for bays stuck
# `unknown` beyond 30s, but only for stations that are ONLINE. Through the silence
# the bays are `available` (armed below), and the moment they become `unknown` the
# station is offline, so the guard at ResolveUnknownBaysCommand:64 skips it. Neither
# state is reachable by that sweep.
scenario_timeout_ms: 300000
suppress_heartbeat: >-
  THE SUBJECT IS APPLICATION SILENCE. CheckStationHeartbeatsCommand compares
  `stations.last_seen_at`, which every accepted message writes, against ceil(interval x 3.5)
  once the station's first Heartbeat after its boot has ended its replay - so a single
  background pulse at the server's 30s interval resets the 105s threshold and the 175s proof
  read below comes back isOnline: true. The file sends that first Heartbeat itself, once, and
  nothing after it. This is the one file in the corpus whose property is the ABSENCE of the
  message the default now sends; the header's own FALSIFICATION paragraph describes reaching
  that failure by hand.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  # --- Boot: brings the station online AND writes the `last_seen_at` the sweep reads. ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- ARM: drive both bays off `unknown` so the proof read cannot be satisfied
  # by the state a freshly provisioned station already has.
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_2}}"
      bayNumber: 2
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  # --- THE FIRST HEARTBEAT AFTER THE BOOT, the last message this file sends. A station
  # sends it once its post-boot reports are acknowledged, and it ends the replay
  # (connection-lost.md section 6). Before it csms-server waits the longer of 3.5 x the
  # interval and 360s before it treats a silent station as disconnected; from it, the
  # 3.5 x the interval this file proves (WHAT THE SWEEP COUNTS FROM, above).
  - action: send
    message: Heartbeat
    payload: {}

  - action: wait_for
    message: Heartbeat
    messageType: Response
    timeout_ms: 10000

  # Fire-and-forget with no Response to synchronise on; 1000ms is the value
  # status-all-bay-states.yaml measured on UAT after 300ms read the PREVIOUS state.
  - action: delay
    ms: 1000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.isOnline: true
      data.bays[bayNumber=1].status: "available"
      data.bays[bayNumber=2].status: "available"

  # --- THE SILENCE. Nothing is sent. Nothing is disconnected. The only thing that
  # happens is that no OSPP message arrives after the Heartbeat above - every accepted
  # message re-arms `last_seen_at` - while MQTT keepalive keeps the socket up, which is
  # what makes application silence distinct from silence on the wire.
  - action: delay
    ms: 175000

  # Guard, not the discriminator — see the header for exactly what it rules out.
  - action: assert
    field: "connection.lastCloseCause"
    equals: "none"

  # --- PROOF: the watchdog swept a station that never went anywhere. -----------
  # markOffline writes bays and station in ONE transaction
  # (StationOfflineService:46-49), so isOnline false beside a bay still `available`
  # would be a partial transition rather than a green.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.isOnline: false
      data.bays[bayNumber=1].status: "unknown"
      data.bays[bayNumber=2].status: "unknown"
