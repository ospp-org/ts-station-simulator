# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/sessions/session-with-reservation.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Session With Reservation"
description: "Reserve bay first via ReserveBay trigger-command, then start session with reservationId. Bay transitions: Available -> Reserved -> Occupied."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # --- Trigger ReserveBay via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/reservations"
    body:
      bay_id: "{{bayId_1}}"
      duration_minutes: 5
      session_source: "MobileApp"
    expect_status: 201

  - action: wait_for
    message: ReserveBay
    messageType: Request
    timeout_ms: 15000
    capture:
      reservationId: "payload.reservationId"
      bayId: "payload.bayId"

  # --- Accept ReserveBay ---
  - action: send
    message: ReserveBay
    messageType: Response
    payload:
      status: "Accepted"

  # --- StatusNotification Reserved ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Reserved"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: true
  # --- Trigger StartService with reservationId via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{captured.bayId}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
      reservation_id: "{{captured.reservationId}}"
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      serviceId: "payload.serviceId"
      durationSeconds: "payload.durationSeconds"
      reservationId: "payload.reservationId"

  # --- Accept StartService ---
  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  # --- StatusNotification Occupied ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Reserved"
      programs:
        - programNumber: 1
          available: false
  # --- Pool-hygiene teardown: end the session this scenario started so the reused
  #     pooled station is returned clean. Appended after all assertions — does not
  #     change what the scenario tests. (Class: session-leak.)
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "Local"
      actualDurationSeconds: 1
      creditsCharged: 0
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true

  - action: delay
    ms: 1000

  # THE ASSERTION — on the RESERVATION, not the session, and it turned out to
  # pin a GAP rather than a guarantee. Deliberately not a
  # fifth copy of the settlement rule.
  #
  # This file ends with reason `Local` like session-stop-local,
  # meter-values-streaming, session-web-payment and start-service. Same
  # TerminalReason::VoluntaryStop, same pro-rata rule, and no end_reason field to
  # separate them — so the money is asserted once, in session-stop-local.
  #
  # What is specific here is the CONVERSION: this is the only session in the
  # corpus born from a reservation. The obvious place to look is the session's
  # own `reservation_id`, and that does NOT work — the column is a `uuid` (the
  # internal FK), while everything this scenario captures is the public `rsv_*`
  # id off the wire. The scenario cannot know the uuid, and expect_body has no
  # "is present and not null" form, so the session side of the link is
  # unassertable.
  #
  # The reservation side is where the link would be recorded — and this is where
  # the file stopped being a proof and became a report:
  #
  # THIS ASSERTION PINS A GAP. IT IS NOT AN ENDORSEMENT OF THE VALUE.
  #
  # The intended assertion was `status: active` + `converted_session_id` equal to
  # the captured session. Measured on UAT 2026-08-10, the reservation is still
  # `confirmed`, converted_session_id is ABSENT from the body, and
  # time_remaining_seconds was 298 — the TTL is still counting down on a
  # reservation whose session is already running.
  #
  # The reason is not a race and not this scenario: ConvertReservationAction has
  # ZERO CALL SITES. Nothing in the application ever invokes it. Grep for the
  # class name outside its own declaration and there is nothing;
  # `converted_session_id` is READ in three places (ReservationResource:47,
  # DashboardReservationController:86 and :176) and WRITTEN by nothing. So the
  # `confirmed -> active` edge in ReservationTransitions::TRANSITIONS is
  # unreachable in production, and the reservation->session link the server
  # models is never actually recorded.
  #
  # Asserting `active` here would produce a permanently red file describing a
  # feature that does not exist. Asserting nothing would leave the gap invisible
  # again. So this pins the CURRENT behaviour deliberately, as a tripwire: the
  # day conversion is wired, this file goes red, and the correct fix is to change
  # these two lines to `active` plus a converted_session_id match — not to delete
  # the assertion.
  #
  # NOT assertable either way: that converted_session_id is absent. It is wrapped
  # in $this->when(!== null), so the key does not exist at all rather than being
  # null, and expect_body cannot express absence. The `confirmed` status is the
  # observable that stands in for it.
  #
  # Also not assertable, and worth knowing before anyone tries: the SESSION side
  # of the link. sessions.reservation_id is a `uuid` (the internal FK) while
  # everything this scenario captures is the public `rsv_*` id, so the scenario
  # cannot predict the value, and there is no is-present form.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/reservations/{{captured.reservationId}}"
    expect_status: 200
    expect_body:
      data.status: "confirmed"
