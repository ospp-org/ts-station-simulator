# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/sessions/session-with-reservation.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Session With Reservation"
description: "Reserve bay first via ReserveBay trigger-command, then start session with reservationId. Bay transitions: Available -> Reserved -> Occupied."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # --- Trigger ReserveBay via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/reservations"
    body:
      bay_id: "{{bayId_1}}"
      duration_minutes: 5
      session_source: "MobileApp"
    expect_status: 201

  - action: wait_for
    message: ReserveBay
    messageType: Request
    timeout_ms: 15000
    capture:
      reservationId: "payload.reservationId"
      bayId: "payload.bayId"

  # --- Accept ReserveBay ---
  - action: send
    message: ReserveBay
    messageType: Response
    payload:
      status: "Accepted"

  # --- StatusNotification Reserved ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Reserved"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: true
  # --- Trigger StartService with reservationId via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{captured.bayId}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
      reservation_id: "{{captured.reservationId}}"
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      serviceId: "payload.serviceId"
      durationSeconds: "payload.durationSeconds"
      reservationId: "payload.reservationId"

  # --- Accept StartService ---
  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  # --- StatusNotification Occupied ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Reserved"
      programs:
        - programNumber: 1
          available: false
  # --- Pool-hygiene teardown: end the session this scenario started so the reused
  #     pooled station is returned clean. Appended after all assertions — does not
  #     change what the scenario tests. (Class: session-leak.)
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "Local"
      actualDurationSeconds: 1
      creditsCharged: 0
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true

  - action: delay
    ms: 1000

  # THE ASSERTION — on the RESERVATION, not the session. Deliberately not a
  # fifth copy of the settlement rule.
  #
  # This file ends with reason `Local` like session-stop-local,
  # meter-values-streaming, session-web-payment and start-service. Same
  # TerminalReason::VoluntaryStop, same pro-rata rule, and no end_reason field to
  # separate them — so the money is asserted once, in session-stop-local.
  #
  # What is specific here is the CONVERSION: this is the only session in the
  # corpus born from a reservation. The obvious place to look is the session's
  # own `reservation_id`, and that does NOT work — the column is a `uuid` (the
  # internal FK), while everything this scenario captures is the public `rsv_*`
  # id off the wire. The scenario cannot know the uuid, and expect_body has no
  # "is present and not null" form, so the session side of the link is
  # unassertable.
  #
  # The reservation side is where the link is recorded, and this file spent its
  # first life pinning the ABSENCE of that record as a tripwire:
  # ConvertReservationAction had ZERO CALL SITES, so `confirmed -> active` was
  # unreachable in production and the reservation->session link the server models
  # was never written. Measured on UAT 2026-08-10: status stayed `confirmed`,
  # converted_session_id was absent, and time_remaining_seconds read 298 — a TTL
  # still counting down on a reservation whose session was already running.
  #
  # THE TRIPWIRE FIRED AS DESIGNED. csms-server b68b396 wires the conversion into
  # StartServiceResponseHandler::handleAccepted, this file went red against the
  # deployed UAT stack with `expected "confirmed", but got "active"`, and per its
  # own instruction the assertion is now upgraded rather than deleted.
  #
  # Re-measured on UAT after that deploy, same run that turned this green:
  #   status                "active"
  #   converted_session_id  "sess_98ecfa0d2e21aee6b500d399"  (was absent)
  #   time_remaining_seconds  absent                          (was 298)
  #
  # WHY THE MOMENT MATTERS, and why this scenario is the one that proves it.
  # The conversion is bound to the ACCEPTED StartService RESPONSE, not to the
  # start request: spec 05-state-machines.md:501 guards `Confirmed -> Active` on
  # "reservationId matches; within TTL", a check the STATION performs (§4.5:519),
  # and §4.5:520 converts only "if matched". A rejected start is refunded in full
  # and released via CancelReservation (04-flows.md:670), never converted. This
  # scenario sends `StartService Response Accepted` at step [10]; that send is the
  # trigger for everything asserted below. A sibling asserting the REJECTED arm
  # stays un-converted would be the other half of the pair.
  #
  # converted_session_id is assertable after all, and the earlier note here was
  # wrong about it: the resource resolves the stored uuid back to the PUBLIC
  # session id (ReservationResource::resolveSessionPublicId), which is exactly
  # what step [9] captured off the StartService REQUEST. The two are comparable.
  #
  # Still NOT assertable, unchanged: the SESSION side of the link.
  # sessions.reservation_id is a `uuid` (the internal FK) while everything this
  # scenario captures is the public `rsv_*` id, so the scenario cannot predict
  # the value and expect_body has no is-present form. Likewise the ABSENCE of
  # time_remaining_seconds — it is wrapped in $this->when(status === CONFIRMED),
  # so on an active reservation the key does not exist rather than being null.
  # The `active` status is the observable that stands in for both.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/reservations/{{captured.reservationId}}"
    expect_status: 200
    expect_body:
      data.status: "active"
      data.converted_session_id: "{{captured.sessionId}}"
