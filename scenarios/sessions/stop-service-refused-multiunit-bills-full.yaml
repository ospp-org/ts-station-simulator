# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_multiunit}}
#
# THE ALL-OR-NOTHING HALF OF "A REFUSED STOP ENDS NOTHING" (the session-end rule, 2026-10-13).
#
#   A session is ended only by the station's end record, and a StopService RESPONSE
#   `Rejected` is not one: the server leaves the session `stopping` and waits for the
#   station's SessionEnded or the sweep. stop-service-refused-while-running-bills-full.yaml
#   proves it on a UserDuration booking; this file proves it on a MultiUnit one, where the
#   end record decides the money with no reference to time.
#
#   WHAT THIS FILE USED TO PROVE IS GONE. It was the per-kind half of the refused-stop
#   SETTLEMENT: csms-server `77f9fdd6` settled a refused stop as a delivered session of its
#   kind (TerminalReason::StopRefusedWhileRunning), pro-rata for UserDuration and the whole
#   authorized amount for the all-or-nothing kinds, journalled `settledAs`. The session-end
#   rule removes that settlement, so there is no per-kind arm of it left to reach. The file
#   is kept, rewritten, because what a refusal does to a MultiUnit session is still a
#   question with an answer: nothing, until the unit's own end record.
#
# WHAT MAKES THIS A DIFFERENT KIND, AND IT IS NOT A DIFFERENT CALL
#   The same `POST /api/v1/sessions/start` this corpus uses everywhere. The kind is a
#   property of the CATALOG ROW, resolved server-side (StartSessionAction.php:294-296):
#
#     $serviceKind = $dto->overrideServiceKind          // NULL on every non-batch start
#         ?? ServiceKind::tryFrom($pricing['serviceKind'] ?? '')
#         ?? ServiceKind::UserDuration;
#
#   `svc_multiunit` is seeded `serviceKind: 'MultiUnit'`, `pricingType: 'Fixed'`,
#   `priceCreditsFixed: 200`, `fixedDurationSeconds: 5` (uatPrivileged.ts
#   `multiUnitSeedService`, `MULTIUNIT_UNIT_PRICE_CREDITS`, `MULTIUNIT_PULSE_SECONDS`).
#   MultiUnitStrategy's own docblock settles the shape: "a single MultiUnit session is
#   exactly one unit". No batch, no card, no landing page — `batch_id` is NULL, which
#   StartSessionAction.php:648-652 names as the ordinary case ("NULL for every
#   single-unit start").
#
# THE ARITHMETIC, DERIVED NOT COPIED — AND THE DURATION IS NOT THE ONE POSTED
#   MultiUnit has `hasServerResolvedDuration() === true` (ServiceKind.php:73-79), so
#   StartSessionAction.php:305-324 REPLACES the client's `duration_seconds` with the
#   catalog preset. The 300 this file posts is discarded and 5 is what the session is
#   booked for. Then pricing: the entry is `Fixed`, so the quote is the flat price,
#   duration-independent (:334-338).
#
#     duration_requested   5    the preset, not the 300 posted below
#     credits_authorized   200  priceCreditsFixed, not ceil(seconds/60 * rate)
#
#   The station refuses the stop (3007, a real station obligation, `stop-service.md` §6
#   r3) and the unit's 5 s pulse runs out: SessionEnded `TimerExpired`, the unit delivered.
#   MultiUnitStrategy -> AllOrNothingSettlement::forReason (MultiUnitStrategy.php:35)
#   charges `TimerExpired` whole: 200 charged, 0 refunded.
#
# THE AMOUNT IS STILL THE ATTRIBUTION. Had the kind resolved to UserDuration (the fallback
# when `service_kind` is NULL), the 300 s this file posts would have been the booking and
# 500 the authorization. `duration_requested: 5` with `credits_authorized: 200`, read
# before the refusal, says the server resolved the server-duration kind; 200/0 after the
# unit's end record says it settled that kind on TimerExpired's row.
#
# THREE READS: `active` with the kind's booking before the stop; `stopping` after the
# refusal (the refusal settled nothing - this read was `completed` while it did); and
# `completed` 200/0 within seconds of the SessionEnded, with no anomaly mark - the
# station's record, not the sweep (which could close a 5 s booking no earlier than 65 s
# after its start).
#
# NEITHER ASSERTED AMOUNT IS ECHOED FROM THIS FILE. The SessionEnded's `creditsCharged`
# is advisory; `credits_charged` is written by the settlement strategy and
# `refund_amount` is derived (SessionResource).
#
# HONESTY ABOUT WHAT IS PROVEN. The station is a byte source: it is scripted to refuse,
# not deciding to. This is a proof about the SERVER, not about station conformance.
#
# NOT COVERED: FixedDuration, the third kind - it shares the all-or-nothing table with
# MultiUnit, and no `serviceKind: 'FixedDuration'` row is seeded by this corpus.
#
# NEEDS THE SERVER OF THE SESSION-END RULE. Against csms-server f413256f and earlier the
# refusal settles the session and the `stopping` read fails.
name: "Stop Service Refused While Running - MultiUnit billed whole"
description: "Server dispatches StopService for an active MULTI-UNIT session; the station refuses with 3007 SESSION_MISMATCH. The refusal ends nothing - the session stays stopping - until the unit's own SessionEnded TimerExpired, which the all-or-nothing table charges whole: 200 charged, 0 refunded, no anomaly."
requires_multiunit_service: 1
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  # --- Start a real, funded MULTI-UNIT session. `duration_seconds: 300` is posted and
  #     DISCARDED: MultiUnit resolves its duration from the catalog (5s pulse), and the
  #     Fixed price quotes 200 whatever the duration. The 300 is kept rather than
  #     lowered so the assertion below has something to disprove — a server that ignored
  #     the kind would book 300s here and the pair {5, 200} could not appear. ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_multiunit}}"
      duration_seconds: 300
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"

  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false

  # The StartService Response is processed asynchronously, so the session must be observed
  # ACTIVE before the stop is asked for.
  - action: delay
    ms: 1500

  # READ 1 - PRE-CONDITION, and it is also the KIND assertion. `duration_requested` is 5 because
  # the catalog preset replaced the 300 this file posted, and `credits_authorized` is
  # 200 because the entry is Fixed-priced. Both are read BEFORE the refusal, so the
  # settlement below is measured against a booking already proven to be the multi-unit
  # one — a later reader cannot wonder whether the fixture silently fell back to
  # UserDuration.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"
      data.duration_requested: 5
      data.credits_authorized: 200

  # --- Operator asks for the stop. The server answers 200 and publishes StopService. ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}/stop"
    expect_status: 200

  - action: wait_for
    message: StopService
    messageType: Request
    timeout_ms: 15000

  # --- THE REFUSAL. Schema-required for a Rejected stop: errorCode AND errorText
  #     (stop-service-response.schema.json allOf[1]). ---
  - action: send
    message: StopService
    messageType: Response
    payload:
      status: "Rejected"
      errorCode: 3007
      errorText: "SESSION_MISMATCH"

  - action: delay
    ms: 1000

  # READ 2 - the refusal ended nothing: the session the stop request put in `stopping`
  # stays there. While the refusal settled the wash, this read was `completed` 200/0.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "stopping"

  # --- THE END RECORD. The unit's 5 s pulse has run out: the unit was delivered. ---
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "TimerExpired"
      actualDurationSeconds: 5
      creditsCharged: 200

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true

  - action: delay
    ms: 2000

  # READ 3 - the unit's end record settled it, by kind: the all-or-nothing table charges a
  # TimerExpired unit whole. A server that settled this kind pro-rata would charge a few
  # seconds' worth; one that left the session for the sweep would still read `stopping`.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "completed"
      data.credits_charged: 200
      data.refund_amount: 0

  # And by the record, not the sweep: no anomaly mark on the station's sessions list.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/sessions"
    expect_status: 200
    expect_body:
      data[sessionId={{captured.sessionId}}].status: "completed"
      data[sessionId={{captured.sessionId}}].anomaly: null
