# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/sessions/stop-service.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Stop Service"
description: "Boot, trigger StartService, accept, StatusNotification Occupied, trigger StopService, accept with actualDurationSeconds and creditsCharged, StatusNotification Available. No SessionEnded — the stop was server-initiated."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bays Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # --- Trigger StartService via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"
      serviceId: "payload.serviceId"

  # --- Accept StartService ---
  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  # --- StatusNotification Occupied ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  # Per C-010: server processes StartService Response + StatusNotification Occupied
  # async; session.status transitions authorized → active. Mirror
  # full-session-lifecycle: send a MeterValues then delay to ensure the
  # state transition fires before stop.
  - action: delay
    ms: 500

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-05-27T08:00:00.000Z"
      values:
        liquidMl: 500
        energyWh: 100

  - action: delay
    ms: 1500

  # --- Trigger StopService via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}/stop"
    expect_status: 200

  - action: wait_for
    message: StopService
    messageType: Request
    timeout_ms: 15000

  # --- Accept StopService with duration and credits ---
  - action: send
    message: StopService
    messageType: Response
    payload:
      status: "Accepted"
      actualDurationSeconds: 45
      creditsCharged: 75

  # NO SessionEnded. session-ended.md:57 — "MUST NOT emit it for one that
  # terminates with [a StopService command]". The Accepted Response above is the
  # settlement carrier; this file used to send both, and the paragraph below
  # records what that cost.
  #
  # --- StatusNotification Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true

  - action: delay
    ms: 1000

  # THE ASSERTION — and it CORRECTS the prediction this file was written with.
  #
  # The expectation here was 500: this file used to append a SessionEnded with
  # reason "TimerExpired", and TimerExpired routes to fullCharge($authorized),
  # which on a 300s booking at 100 cr/min is 500. Measured on UAT 2026-08-10 the
  # server charged 75, so the operator-stop path does NOT take the TimerExpired
  # arm at all.
  #
  # The mechanism, and it is the finding: settlement happens on the STOP, not on
  # the SessionEnded. This scenario answers POST /sessions/{id}/stop with a
  # StopService Response carrying actualDurationSeconds 45, and that path settles
  # PRO-RATA on delivered time — ceil(45/60 * 100) = 75, refund 425. The
  # SessionEnded arrived to find the session already terminal, so its reason never
  # got to choose an arm. The wire said TimerExpired and the money said voluntary
  # stop; the money is what happened.
  #
  # THAT IS WHY THE SessionEnded IS GONE. It was never inert — it was a second,
  # DISAGREEING settlement instruction that lost a race it could have won. The
  # only thing standing between it and a 500-credit charge on a 75-credit wash was
  # arrival order, and arrival order is not a guarantee this station can offer:
  # a soft-failed envelope is re-queued at the TAIL (MqttConsume.php:450), which
  # puts the RESPONSE behind the EVENT that followed it on the wire. Sending one
  # message is the fix; the server-side order dependence is reported separately.
  #
  # So this file is NOT a second copy of the fullCharge arm, which is what it
  # looked like from its reason literal. It is the operator-stop arm.
  # session-timeout-timer-expired remains the fullCharge proof — and it is a
  # legal one, because a timer expiry terminates WITHOUT a StopService.
  #
  # HONESTY: 75 is also the creditsCharged this scenario declares in its
  # StopService Response, so the figure alone cannot prove the server computed it.
  # refund_amount 425 is derived (SessionResource:53-56) and appears in no message
  # this scenario sends — that is the non-echoed half.
  #
  # NOT asserted, because it is not exposed: sessions.stop_origin, the column that
  # records that this stop came from an operator rather than the station. It is on
  # the table and absent from SessionResource, so the field that would name this
  # path directly is unreadable.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "completed"
      data.credits_charged: 75
      data.refund_amount: 425
