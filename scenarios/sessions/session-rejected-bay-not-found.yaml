name: "Session Rejected — the bay does not exist (3005)"
description: "POST /api/v1/sessions/start naming a well-formed bay_id no station owns. Server answers 404 + error.ospp_code 3005 BAY_NOT_FOUND. A start on the station's REAL bay, same body otherwise, is accepted — which is what attributes the 404 to the bay id."
# WHY THIS FILE EXISTS. 3005 BAY_NOT_FOUND is the code csms-server constructs from
# more sites than any other — fifteen, across six modules — and until this file it
# appeared NOWHERE in the corpus: `grep '3005\|BAY_NOT_FOUND'` over all scenarios
# returned nothing. The server's most-emitted refusal had zero proof.
#
# THREE THINGS MEASURED WHILE WRITING IT, all of them server findings and none of
# them fixable here (csms-server is another repo):
#
#   1. SEVEN OF THE FIFTEEN SITES DO NOT MEAN "BAY". Every DeviceManagement action
#      that cannot find a STATION throws 3005 with the text "Station {id} not
#      found" — TriggerMessageAction:37, ResetStationAction:40,
#      InstallCertificateAction:37, SendDataTransferAction:37,
#      TriggerCertificateRenewalAction:39, SetMaintenanceModeAction:39,
#      UpdateServiceCatalogAction:236. An integrator who looks up 3005 reads "bay"
#      and goes looking at his bays.
#
#   2. AND THOSE SEVEN ARE UNREACHABLE ANYWAY. Every one of them sits behind
#      StationManagementController::findStationByOsppIdOrFail (:277-288), which
#      returns `{"message": "Station not found", "station_id": ...}` with HTTP 404
#      and NO ospp code at all, before the action runs. So the branch that carries
#      the wrong noun is dead, and what an operator actually receives on that door
#      carries no machine-readable code whatsoever.
#
#   3. AN EIGHTH SITE HAS NO CALLER. GenerateQrCodeAction:52 emits 3005 and
#      `grep -rn 'GenerateQrCodeAction' app/ routes/` finds only its own class
#      declaration.
#
# So of fifteen emission sites, this file can reach the class the code is actually
# NAMED for, and it reaches it through the door an integrator uses first.
#
# WHY THIS DOOR AND NOT /api/v1/reservations, which also emits 3005 for a missing
# bay: the session-start path is the one every other refusal in scenarios/sessions/
# already goes through, so this file is directly comparable with its five siblings
# — same route, same body, same identity, different code. 3001/3002/3004/3011/4001
# are pinned there; 3005 was the hole.
#
# THE ORDER MATTERS AND IS WHY THE ID IS WELL-FORMED. `bay_ffffffff` satisfies
# StartSessionRequest's `regex:/^bay_[a-f0-9]+$/`, so the request passes validation
# (a malformed id would be 422 and prove nothing) and reaches
# SessionController:53-55, which resolves the bay and answers 3005 BEFORE
# SessionStateMachine::validateBayForStart could answer 3002 BAY_NOT_READY. That
# ordering is also why this file is excused from the corpus's "every bay-gated
# command is issued to a bay the scenario has reported" gate: the bay does not
# exist, so reporting it is impossible, and the state that gate is about is never
# reached. The excuse is keyed on this file's own `error.ospp_code: 3005`
# assertion — see BayGatedCommandsAreArmed.test.ts.
#
# THE CONTROL IS THE SECOND CALL. Without it a 404 proves only that the endpoint
# answers 404 to something — a broken route, a wrong base URL and a revoked
# identity all produce a refusal too. The second call differs in ONE field,
# `bay_id`, and must be accepted. It is deliberately placed AFTER the refusal so a
# reader cannot mistake it for setup.
#
# NO SERVER-STATE ASSERTION ON THE REFUSAL — a session that was never created
# writes nothing. The 201 on the control is itself the state assertion, and the
# session it opens is closed below so the file leaves the bay as it found it.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # Bay 1 is reported so the CONTROL below can be accepted — every accepted boot
  # resets bays to `unknown` and only a StatusNotification clears it, which is
  # 3002 BAY_NOT_READY if skipped. The refusal step does not need it and could not
  # use it.
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  - action: delay
    ms: 1000

  # --- THE REFUSAL. Well-formed bay id, owned by nothing.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    body:
      bay_id: "bay_ffffffff"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 404
    expect_body:
      error.ospp_code: 3005
      error.code: "BAY_NOT_FOUND"

  # --- THE CONTROL. Same body, real bay. `background: true` because the endpoint
  # blocks on the station's StartService Response, which the steps below supply —
  # the pattern every other file on this route uses.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      controlSessionId: "payload.sessionId"

  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  - action: delay
    ms: 1000

  # --- LEAVE THE BAY AS IT WAS FOUND. The control opened a real session on a
  # pooled station that is handed back to the allocator; stopping it is not
  # tidiness, it is the difference between the next scenario meeting an Available
  # bay and meeting an Occupied one.
  # Not `background:` — unlike /sessions/start, the stop endpoint does not block on
  # the station's Response (full-session-lifecycle.yaml:157-165 and stop-service.yaml
  # both call it in the foreground and then wait for the command).
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/{{captured.controlSessionId}}/stop"
    expect_status: 200

  - action: wait_for
    message: StopService
    messageType: Request
    timeout_ms: 15000

  - action: send
    message: StopService
    messageType: Response
    payload:
      status: "Accepted"
      actualDurationSeconds: 5
      creditsCharged: 10
