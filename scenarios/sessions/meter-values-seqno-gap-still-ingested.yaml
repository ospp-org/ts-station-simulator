# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
#
# SERVER BRANCH REACHED
#   csms-server app/Modules/Session/Handlers/MeterValuesHandler.php:112-122
#     if ($lastSeq !== null && $dto->seqNo !== $lastSeq + 1) {
#         Log::warning('MeterValues: seqNo gap — reconciliation required', [
#             'expectedSeqNo' => $lastSeq + 1, 'receivedSeqNo' => $dto->seqNo, ...]);
#         if (! $session->requires_reconciliation) {
#             $sessionUpdates['requires_reconciliation'] = true;
#         }
#     }
#
#   Frames go 0 -> 5 -> 6. Frame 0 sets the watermark with no check ($lastSeq is
#   null on the first frame, whatever its value). Frame 5 trips the branch
#   (5 !== 1). Frame 6 does not (6 === 6). Exactly one gap, deliberately placed.
#
# THE SEQUENCE IS SET FROM YAML, AND THAT IS VERIFIED, NOT ASSUMED
#   SendStep::injectSeqNoFields (SendStep.ts:226-255) only stamps a seqNo when
#   `station.sessions` holds the sessionId — and in scenario mode it never does:
#   the runner registers ONE handler, BootNotificationHandler(false)
#   (ScenarioRunner.ts:765), and StartServiceHandler — the only writer of that map
#   — is not among them. So the function returns at its second line and an
#   explicit `seqNo:` here reaches the wire untouched. Even if handlers were
#   registered later the YAML value still wins (`if (payload.seqNo === undefined)`).
#
#   The same fact used to mean sessions/session-seqno-monotonic.yaml and
#   sessions/session-final-seqno-terminal.yaml did NOT do what they said: both
#   described "auto-injected seqNo 0..4" / "0,1,2" and actually published
#   MeterValues with NO seqNo at all, so `if ($dto->seqNo !== null)` skipped the
#   whole block and the server's sequence logic never ran. Both went green for it.
#   RESOLVED 2026-08-10 — both DELETED, for different reasons.
#   session-seqno-monotonic.yaml: its only distinguishing claim was the auto-injection;
#   the clean monotonic ingest it nominally covered is asserted by
#   meter-values-seqno-out-of-order-still-ingested.yaml (indices 0-2, energy_wh 10/20/30).
#   session-final-seqno-terminal.yaml: a rewrite was attempted and RUN on UAT, and the wire
#   disproved it. Writing final_seq_no from a scenario works (an explicit StopService Response
#   carrying finalSeqNo=3 produced sessions.final_seq_no=3, measured). But the DISCARD it
#   exists to prove is not observable from any scenario:
#     - final_seq_no is written ONLY by CompleteSessionAction:137 / FailSessionAction:139,
#       each in the same update that makes the session terminal — it never coexists with an
#       active session;
#     - MeterValueCollector.php:29 refuses to persist for any status outside
#       {AUTHORIZED, ACTIVE, STOPPING}, so once final_seq_no exists EVERY frame is dropped
#       there anyway, discarded-by-seqNo or not. The meter_values row count cannot tell the
#       two apart (measured: the control frame at seqNo == finalSeqNo advanced
#       sessions.last_seq_no to 3 and still wrote NO row);
#     - the only discriminating state — sessions.last_seq_no and requires_reconciliation —
#       is exposed by NO HTTP resource (grep over app/Http returns nothing).
#   So the branch is real server behaviour with no scenario-reachable observable. Testing it
#   would need csms-server to expose last_seq_no (or requires_reconciliation) on the session
#   resource; until then any such file can only decorate.
#
# WHAT IS ASSERTED — and the branch's own effect is NOT assertable
#   The gap branch produces exactly two things: a log line, and
#   `sessions.requires_reconciliation = true`. That column is WRITE-ONLY across
#   the whole server — no API resource, controller, report, job or alert reads it
#   (verified by grep over app/, routes/, resources/). No metric moves, no event
#   fires, and MeterValues is an EVENT so nothing is published back. There is
#   therefore NO way for any scenario to observe that the branch was taken.
#
#   What IS observable, and what this file pins, is the branch's decision: a
#   gapped frame is NOT dropped. Processing continues past the check into
#   $this->collector->ingest() at :139, so all three frames become meter_values
#   rows and settlement proceeds on the incomplete evidence. The assertion reads
#   those rows back off GET /sessions/{id}, which serialises them only on
#   sessions.show (SessionResource.php:73-79). If the server had dropped the
#   post-gap frames, index 2 would not exist and the assertion would fail.
name: "MeterValues seqNo Gap Still Ingested"
description: "Three MeterValues with an explicit seqNo gap (0, 5, 6). The server flags reconciliation internally but must still ingest and bill every frame."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay available, then a live session to hang the frames on ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 600
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"

  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false

  # --- Frame 0. $lastSeq is null, so no check runs; the watermark is set to 0. ---
  - action: delay
    ms: 400

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-08-07T12:00:00.000Z"
      seqNo: 0
      values:
        liquidMl: 200
        energyWh: 50

  # --- Frame 5. THE GAP: expected 1, received 5. requires_reconciliation latches. ---
  - action: delay
    ms: 400

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-08-07T12:00:30.000Z"
      seqNo: 5
      values:
        liquidMl: 400
        energyWh: 111

  # --- Frame 6. Continuous with 5, so the branch is NOT taken again — which is
  #     what proves the watermark advanced to 5 rather than staying at 0. ---
  - action: delay
    ms: 400

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-08-07T12:01:00.000Z"
      seqNo: 6
      values:
        liquidMl: 600
        energyWh: 222

  - action: delay
    ms: 2000

  # THE ASSERTION. `data.meter_values` is the server's own meter_values rows,
  # ordered by sampled_at (SessionResource.php:76). Index 2 existing at all is
  # the proof that neither post-gap frame was dropped; `energy_wh` discriminates
  # WHICH frame landed there, so a re-ordering or a lost middle frame fails too.
  # 222/111 are distinct on purpose.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"
      data.meter_values.0.energy_wh: 50
      data.meter_values.1.energy_wh: 111
      data.meter_values.2.energy_wh: 222

  # --- Pool-hygiene teardown. (Class: session-leak.)
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "Local"
      actualDurationSeconds: 3
      creditsCharged: 5
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
