# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/sessions/session-rejected-invalid-service.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Session Rejected - Invalid Service"
description: "Boot, trigger StartService via API with an unrecognized serviceId. Station rejects with error 3004 INVALID_SERVICE."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # --- Trigger StartService with unknown serviceId via API ---
  # FOREGROUND deliberately. This rejection is decided pre-dispatch, so the
  # endpoint does NOT block on a station MQTT Response and there is nothing for
  # a background call to overlap with. Background mode downgrades an
  # expect_status mismatch to a console.warn (ApiCallStep.ts:439-455), so while
  # this step said "the 404 is the final assertion" it had no assertion at all:
  # a server that answered 201 and started a session on an unknown serviceId
  # passed it.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    body:
      bay_id: "{{bayId_1}}"
      service_id: "svc_nonexistent"
      duration_seconds: 300
    expect_status: 404
    # 3004 INVALID_SERVICE is discriminating here — it is the only code
    # StartSessionAction raises for an unresolvable serviceId, so this cannot be
    # satisfied by an unrelated 404 (wrong route, missing bay).
    expect_body:
      error.ospp_code: 3004
  # Per C-007: server returns 404 INVALID_SERVICE pre-MQTT-dispatch; no
  # StartService Request is published.
