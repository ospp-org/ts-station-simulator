# ARC 8 — away and back: the server is told the link died, the station comes back without
# a restart, and the session is ended by nothing but the station's own SessionEnded.
#
# THE SESSION-END RULE (2026-10-13). A session is ended only by the station's end record. A
# ConnectionLost, the away period it opens and the boot that closes it end nothing; the only
# fallback is the sweep, at the booked end + 60 s plus the grace period for the time the
# station was away. So a session carried across "the server marked the station offline,
# then it came back" is still `active` when it comes back, whenever that is, and settles on
# its record.
#
# WHAT THIS FILE USED TO PROVE, AND WHY IT IS GONE. It was the slowest file in the corpus
# (347.8 s, its own 600 s budget): it held a heartbeating connection past the server's 300 s
# offline-recovery deadline to prove two layers that each spared the session - the
# reconnect boot's uptime-continuity preserve (a boot no longer ends any session, whatever
# its uptime) and the offline-recovery job skipping a station back online at execution
# (FailOfflineSessionJob is removed; the sweep's away deadline replaces it, and it cannot
# fall before the booked end + 60 s). Holding past 300 s proves nothing any more, so the
# hold is gone and the file ends its session the way a conforming station does.
#
# THE ConnectionLost BELOW IS FABRICATED BY THE STATION. THIS FILE IS NOT LWT COVERAGE, AND
# ANYONE COUNTING IT AS SUCH IS COUNTING A MESSAGE THE SIMULATOR WROTE. It is a `send` step
# publishing onto `toServerTopic(stationId)` over the LIVE connection — the same topic the
# real will uses — so at the topic level it is indistinguishable from a broker-published
# will. Two things do distinguish it, and both are absent here: `messageId` has no `lwt-`
# prefix (MqttConnection stamps that at CONNECT) and `source` is the station's, not
# `Server`. The linter permits it because ConnectionLost is whitelisted station->server
# (MessageDirectionCheck) and it is MAC-exempt. The BROKER's will path is owned by
# core/connection-lost-lwt.yaml. The injection is the right instrument HERE because the
# subject is what happens AFTER the server is told the link died, and it needs that
# message at a controlled instant with the connection still usable for the steps that
# follow; a genuine sever would take the link with it.
#
# THE BOOTS ARE `Reconnect`, WITH THE UPTIME RUNNING ON. The station has been up ~25 h and
# re-establishes its MQTT session twice without restarting, which is what `Reconnect` says
# (boot-notification.md §5.2 rule 1). This file sent `PowerOn` with a 25 h uptime while the
# uptime layer decided the session; neither field decides anything about a session now.
#
# NEEDS THE SERVER OF THE SESSION-END RULE only in that nothing else could end the session:
# the reads are `active` across the away period and the boot, then `completed` on the
# station's `Local`, charged pro-rata on the 18 s it reports.
name: "ARC8 reconnect preserve (away and back, ended by its SessionEnded)"
description: "Boot(Reconnect, uptime 25h) -> start session -> inject ConnectionLost -> the station reads offline and the session stays active -> reconnect Boot(Reconnect, uptime continues) -> the session is still active -> the station's SessionEnded Local ends it, settled pro-rata."
tls:
  min_version: "TLSv1.2"
  max_version: "TLSv1.2"
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 150]
steps:
  # --- Boot: station has been UP for ~25h (network blip, not a reboot) ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 90000
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "Reconnect"
      capabilities: { bleSupported: false, offlineModeSupported: false, meterValuesSupported: true }
      networkInfo: { connectionType: "Ethernet" }
  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000
  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay available, then a long (10-min) session, so neither its timer nor the sweep can
  #     reach it while the file runs ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs: [ { programNumber: 1, available: true } ]

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body: { bay_id: "{{bayId_1}}", service_id: "{{serviceId_1}}", duration_seconds: 600 }
    expect_status: 201
  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"
      serviceId: "payload.serviceId"
  - action: send
    message: StartService
    messageType: Response
    payload: { status: "Accepted" }
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs: [ { programNumber: 1, available: false } ]

  # ---- MARKER: session is now ACTIVE (external DB snapshot #1) ----
  - action: delay
    ms: 3000

  # --- FABRICATED WILL (see header). The STATION publishes this, on the live
  # connection, onto the server topic. The broker is not involved and no will path is
  # under test; it marks the station offline - the away period the steps below are about.
  - action: send
    message: ConnectionLost
    messageType: Event
    payload:
      stationId: "{{stationId}}"
      reason: "UnexpectedDisconnect"
  - action: delay
    ms: 6000

  # ---- AWAY: the server marked the station offline, and that ended nothing. ----
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.isOnline: false
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"

  # --- Back: the station re-establishes the link without restarting - Reconnect, uptime
  #     running on. ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 90012
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "Reconnect"
      capabilities: { bleSupported: false, offlineModeSupported: false, meterValuesSupported: true }
      networkInfo: { connectionType: "Ethernet" }
  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000
  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # The post-boot report: the wash ran on, the bay is still Occupied.
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      programs: [ { programNumber: 1, available: false } ]
  - action: delay
    ms: 1500

  # ---- BACK: online again, and the boot ended nothing either. Nothing has been charged
  #      or refunded: 1000 authorized for 600 s at 100 cr/min, none of it settled. ----
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    expect_body:
      data.isOnline: true
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"
      data.credits_charged: 0
      data.refund_amount: 1000

  # --- THE END RECORD. The customer stops the wash at the bay, 18 s in: SessionEnded
  #     `Local`, pro-rata on the seconds it ran. ---
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "Local"
      actualDurationSeconds: 18
      creditsCharged: 30
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Finishing"
      previousStatus: "Occupied"
      programs: [ { programNumber: 1, available: true } ]
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Finishing"
      programs: [ { programNumber: 1, available: true } ]
  - action: delay
    ms: 1500

  # THE ASSERTION — the station's record ended it, and decided the money: ceil(18/60 x 100)
  # = 30 charged of the 1000 authorized, 970 refunded. `Local` settles pro-rata with no
  # low-delivery floor (sessions/session-fault-during-service.yaml contrasts it with Fault).
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "completed"
      data.credits_charged: 30
      data.refund_amount: 970
