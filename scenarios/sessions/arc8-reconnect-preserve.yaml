# ARC 8 — reconnect-as-reconciliation, LIVE UAT proof.
# A station that stays UP across a network blip (uptime CONTINUES) must NOT have
# its active session force-failed/refunded — not on the reconnect Boot (Layer 1
# uptime-continuity preserve), and not when the offline-recovery timer fires past
# the 300s deadline (Layer 3 skip-at-execution, because the station is back online).
#
# THE ConnectionLost BELOW IS FABRICATED BY THE STATION. THIS FILE IS NOT LWT
# COVERAGE, AND ANYONE COUNTING IT AS SUCH IS COUNTING A MESSAGE THE SIMULATOR
# WROTE. It is a `send` step (steps, ~line 106) publishing onto
# `toServerTopic(stationId)` over the LIVE connection — the same topic the real
# will uses — so at the topic level it is indistinguishable from a broker-published
# will. Two things do distinguish it, and both are absent here: `messageId` has no
# `lwt-` prefix (MqttConnection stamps that at CONNECT, MqttConnection.ts:366) and
# `source` is the station's, not `Server`. The linter permits it because
# ConnectionLost is whitelisted station->server (MessageDirectionCheck.ts:18-21) and
# it is MAC-exempt (MessageSender.ts:197). Nothing about the BROKER's will path is
# exercised. That path is owned by core/connection-lost-lwt.yaml, which drives it
# with `fault: sever` under a persistent session and reads the `lwt-` prefix back
# out of the consumer log.
#
# THE INJECTION IS STILL THE RIGHT CHOICE HERE — but not for the reason this header
# used to give. It claimed "the sim's fixed 5s auto-reconnect cancels the real
# 10s-delayed will". That diagnosis was measured false on 2026-08-14 (see
# core/connection-lost-lwt.yaml): under this file's default `clean_session: true`
# the reconnect arrives with Clean Start 1, which ENDS the old session, and MQTT 5
# §3.1.3.2.2 publishes the will when the session ends OR the delay elapses,
# whichever is first. A real `fault: disconnect` here would therefore PUBLISH the
# will, not cancel it. The actual reason to inject is that this file's subject is
# what happens AFTER the server is told the link died — Layer 1 uptime-continuity
# preserve and the Layer 3 skip past the 300s deadline — and it needs that message
# at a controlled instant with the connection still usable for the steps that
# follow. A genuine sever would take the link with it.
# Deliberately the slowest file in the corpus: it holds a connection past the server's
# 300s offline-recovery deadline, and measured 347.8s on the 2026-08-10 run. That is
# well over the 90s default budget (ScenarioRunner.DEFAULT_SCENARIO_TIMEOUT_MS), so it
# declares its own. This is the ONLY legitimate reason to raise it.
scenario_timeout_ms: 600000
name: "ARC8 reconnect preserve (uptime continuity, past 300s)"
description: "Boot(uptime huge) -> start session -> inject ConnectionLost -> reconnect Boot(uptime huge) -> hold connected past the 300s recovery deadline. Session must stay ACTIVE, no refund."
tls:
  min_version: "TLSv1.2"
  max_version: "TLSv1.2"
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 150]
steps:
  # --- Boot: station has been UP for ~25h (network blip, not a reboot) ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 90000
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities: { bleSupported: false, offlineModeSupported: false, meterValuesSupported: true }
      networkInfo: { connectionType: "Ethernet" }
  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000
  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay available, then start a long (30-min) session so its own timer can't expire during the test ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs: [ { programNumber: 1, available: true } ]

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body: { bay_id: "{{bayId_1}}", service_id: "{{serviceId_1}}", duration_seconds: 600 }
    expect_status: 201
  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"
      serviceId: "payload.serviceId"
  - action: send
    message: StartService
    messageType: Response
    payload: { status: "Accepted" }
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs: [ { programNumber: 1, available: false } ]

  # ---- MARKER: session is now ACTIVE (external DB snapshot #1) ----
  - action: delay
    ms: 3000

  # --- FABRICATED WILL (see header). The STATION publishes this, on the live
  # connection, onto the server topic. The broker is not involved and no will path
  # is under test here; this only arms the server side — markOffline +
  # FailOfflineSessionJob(300s) — which is what the steps below are about.
  - action: send
    message: ConnectionLost
    messageType: Event
    payload:
      stationId: "{{stationId}}"
      reason: "UnexpectedDisconnect"
  - action: delay
    ms: 6000

  # --- Reconnect: station still UP (uptime continues) -> Layer 1 PRESERVE, not reboot-fail ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 90120
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities: { bleSupported: false, offlineModeSupported: false, meterValuesSupported: true }
      networkInfo: { connectionType: "Ethernet" }
  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000
  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # ---- MARKER: reconnected, session must still be ACTIVE (external DB snapshot #2) ----
  # Hold the connection open AND HEARTBEATING (every 28s < the 3.5x30=105s stale
  # threshold) PAST the 300s recovery deadline, so the station stays genuinely
  # is_online=true and the armed FailOfflineSessionJob SKIPS at execution (Layer 3).
  - { action: send, message: Heartbeat, messageType: Request }
  - { action: delay, ms: 28000 }
  - { action: send, message: Heartbeat, messageType: Request }
  - { action: delay, ms: 28000 }
  - { action: send, message: Heartbeat, messageType: Request }
  - { action: delay, ms: 28000 }
  - { action: send, message: Heartbeat, messageType: Request }
  - { action: delay, ms: 28000 }
  - { action: send, message: Heartbeat, messageType: Request }
  - { action: delay, ms: 28000 }
  - { action: send, message: Heartbeat, messageType: Request }
  - { action: delay, ms: 28000 }
  - { action: send, message: Heartbeat, messageType: Request }
  - { action: delay, ms: 28000 }
  - { action: send, message: Heartbeat, messageType: Request }
  - { action: delay, ms: 28000 }
  - { action: send, message: Heartbeat, messageType: Request }
  - { action: delay, ms: 28000 }
  - { action: send, message: Heartbeat, messageType: Request }
  - { action: delay, ms: 28000 }
  - { action: send, message: Heartbeat, messageType: Request }
  - { action: delay, ms: 28000 }
  - { action: send, message: Heartbeat, messageType: Request }
  - { action: delay, ms: 28000 }

  - action: delay
    ms: 1000

  # THE ASSERTION — its own description, finally checked: "Session must stay
  # ACTIVE, no refund."
  #
  # This file was previously recorded as being at its limit. That was WRONG, and
  # the mistake is worth naming: it is the slowest and most elaborate file in the
  # corpus (347.8s, its own 600s budget, three preserve layers), and the effort
  # visible in its header read as thoroughness. It held a connection past the
  # server's 300s offline-recovery deadline and then asserted nothing about what
  # the server did with the session — which is the entire point of holding it.
  #
  #   data.status active — the session survived BOTH layers. Layer 1 is the
  #       reconnect Boot's uptime-continuity preserve; Layer 3 is the
  #       offline-recovery timer declining to fail a station that is back online
  #       when it fires. Between them sits the injected ConnectionLost that arms
  #       that timer. A failure at either layer lands here as `failed`.
  #   data.credits_charged 0 / refund_amount 1000 — "no refund" is the claim, and
  #       it means the customer has not yet been billed OR refunded: the session
  #       is still running, so nothing is settled. 1000 authorized on a 600s
  #       booking — ten minutes at 100 cr/min — none of it charged. (Measured:
  #       written as 600 first, from reading the duration as if it were credits.) A force-fail would have
  #       settled it, so these two are what distinguish "still active" from
  #       "failed and refunded" — which is exactly the harm ARC 8 exists to
  #       prevent, and the shape a bare status assertion would miss if the server
  #       ever settled a session it left nominally active.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"
      data.credits_charged: 0
      data.refund_amount: 1000
