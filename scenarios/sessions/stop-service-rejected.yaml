# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/sessions/stop-service-rejected.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Stop Service Rejected - Session Not Found"
description: "POST /api/v1/sessions/{id}/stop with an unknown sessionId returns HTTP 404 SESSION_NOT_FOUND server-side without dispatching to the station. Original station-rejection test (errorCode 3006) is no longer reachable: server pre-validates the session ID; the station never sees a StopService Request for an unknown session."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # --- Trigger StopService for nonexistent session via API ---
  # New endpoint pre-validates sessionId server-side. Unknown sessions return
  # HTTP 404 SESSION_NOT_FOUND directly; no MQTT dispatch to the station occurs,
  # so the previous wait_for StopService + send Rejected Response is no longer
  # exercised. Sprint B3 follow-up: rewrite test to use a real (active) session
  # then call /stop with a DIFFERENT session's id to test SESSION_MISMATCH (403),
  # or add a station-direct chaos scenario for the missing coverage.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/sess_00000099/stop"
    expect_status: 404
    # This file is NOT a settlement scenario despite living in sessions/ — nothing
    # here ever starts a session, so there is no terminal state to read back. It
    # belongs to the rejection pattern, and gets the rejection pattern's assertion.
    #
    # 404 alone is weaker than it looks on this endpoint. SessionController::stop
    # answers 404 SESSION_NOT_FOUND (:119-125) for an unknown id, and the same
    # controller answers 403 SESSION_MISMATCH for a session owned by someone else —
    # but a MISSING route, a typo'd path segment, or a station id that fails route
    # binding would also surface as a 404 carrying no ospp_code at all. Pinning
    # 3006 proves the request reached the controller and was refused for the
    # documented reason, rather than never arriving.
    #
    # The nuance this file's own header raises, now pinned rather than only
    # described: 3006 used to be the STATION's rejection code, reached over MQTT.
    # It is now produced SERVER-SIDE, pre-dispatch, and the station never sees a
    # StopService Request. Same number, different origin — so the assertion
    # confirms the pre-validation path, not the station one. The absence of any
    # StopService on the wire is what distinguishes them, and that absence is not
    # assertable here (there is no "no message arrived" step); it is a documented
    # consequence, not a proof.
    expect_body:
      error.ospp_code: 3006
