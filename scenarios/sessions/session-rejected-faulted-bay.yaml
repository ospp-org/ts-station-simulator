# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/sessions/session-rejected-faulted-bay.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Session Rejected - Faulted Bay"
description: "Bay reports a hardware fault (PUMP_SYSTEM), then trigger StartService via API on faulted bay. Station rejects with error 3002 BAY_NOT_READY."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay 1 goes Faulted ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Faulted"
      previousStatus: "Available"
      errorCode: 5001
      errorText: "PUMP_SYSTEM"
      programs:
        - programNumber: 1
          available: false
  # --- Trigger StartService on faulted bay via API ---
  # FOREGROUND deliberately — the rejection is pre-dispatch, so there is no
  # station Response for a background call to overlap with, and background mode
  # downgrades an expect_status mismatch to a console.warn.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 409
    # HONEST LIMIT, stated rather than papered over: 3002 does NOT prove the bay
    # is Faulted. SessionStateMachine.php:74-81 returns 3002 BAY_NOT_READY for
    # FAULTED, FINISHING *and* UNKNOWN alike, so this scenario still cannot
    # distinguish "the Faulted report landed and refused the start" from "the
    # report never landed and the bay is simply unknown". Pinning 3002 is
    # therefore an improvement on asserting nothing — it rules out 3001/3011/3004
    # and any unrelated 409 — but it is NOT a positive proof of the faulted path.
    # Closing that gap needs either a code the server does not currently
    # distinguish, or an out-of-band read of bays.status. Recorded, not invented.
    expect_body:
      errorCode: 3002
  # Per C-006: server returns 409 BAY_NOT_READY pre-MQTT-dispatch; no
  # StartService Request is published.
