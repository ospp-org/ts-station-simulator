# Placeholders: {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}} — all hydrated by
# the pooled bootstrap, which this file requires (see `requires_pool`). Run alone with:
#   simulator run --scenario scenarios/sessions/session-deauthorized-revocation-epoch.yaml \
#     --target uat --bootstrap-pool --pool-size 1
name: "Session Deauthorized via RevocationEpoch Bump"
description: "Mid-session, the tenant revokes its offline-pass epoch (POST /admin/offline-passes/epochs/revoke) and the server pushes the new RevocationEpoch to the station as ChangeConfiguration. The station ends the session Deauthorized; the server settles it failed with a full refund (creditsCharged 0) and a reason that names the revocation."
# ── THE BUMP GOES THROUGH THE EPOCH REVOKE ROUTE, since csms-server b0235a9f (2026-09-25) ──────
#
# This file used to bump the epoch by WRITING the key: POST /api/v1/testing/trigger-command with
# ChangeConfiguration RevocationEpoch=1. b0235a9f made RevocationEpoch server-managed
# (ConfigRegistry.php:637, `serverManaged: true`), and WriteConfigurationAction.php:73-84 now
# refuses an OPERATOR-origin write of such a key on every door that reaches it — console POST,
# admin PUT and the testing route — with 5108 CONFIGURATION_KEY_READONLY, which the testing route
# answers as 403. MEASURED on UAT: the corpus run results/uat-25a89fd7-20260928T055130Z and a
# single re-run (results/reaudit-red-revocation-20260928T094554Z) both stopped at that step with
#   403 {"error_code":"CONFIGURATION_KEY_READONLY","ospp_error_code":5108,
#        "reason":"Configuration key 'RevocationEpoch' is managed by the server ..."}
#
# The key is the server's to push, from two places: PushEpochToStationsListener on every
# revocation (EpochRevoked, from RevokeEpochAction) and IncludeEpochInBootListener on every boot.
# So the bump is now what an operator really does to revoke: POST
# /api/v1/admin/offline-passes/epochs/revoke {reason} (dashboard.php:223-224), which increments
# the tenant's epoch, pushes ChangeConfiguration RevocationEpoch=<new epoch> to every ONLINE
# station of that organization, and revokes the organization's passes issued under an older epoch.
#
# ── WHO CALLS IT: the run's tenant_owner ──────────────────────────────────────────────────────
#
# The route asks `permission:offline_passes.revoke` in the organization context and
# OfflinePassPolicy::revokeEpoch asks it again (permissionForActiveOrganization). tenant_owner
# and tenant_admin hold it (RolesAndPermissionsSeeder.php:501 and :547);
# tenant_operator, the pool's per-scenario identity, does not (:559-581). The one tenant_owner a
# pooled run mints is its ephemeral owner, published as SIM_POOL_OWNER_* — hence `auth:` and
# `requires_pool` below.
#
# `auth:` is file-wide, so the owner also STARTS the session, and the owner's wallet is the one
# RegisterAction opened at 0: a card-free start is refused 402 / 4001 when the balance is below
# the authorization (StartSessionAction). The `fund_wallet` step below funds it once, by the
# owner's own uuid, with the amount derived from the station's catalog. Two alternatives were
# measured and refused:
#   - a customer this file registers (`creates: user`, as start-refused-binding-uncovered.yaml
#     does) on a POOL station: the settled session's refund is written by the settlement relay
#     every 30 s (routes/console.php:165-168) as a `refunds` row plus a wallet bookkeeping intent
#     (ProcessRefundAction::getOrCreatePaymentIntentId), and the scenario-level teardown of a
#     created user deletes by user_id without the station-scoped `refunds` sweep, so whether it
#     FK-aborts would depend on whether the relay ran in the last two seconds of the file;
#   - the platform admin: not a member of the run's organization and not funded either.
# The owner's session sits on a pool bay, so the POOL teardown removes it exactly as it removed the
# tenant_operator's before: refunds and sessions by bay, then the owner's intents, wallet entries
# and wallet in the identity sweep. `fundWalletByUserId` funds only a wallet still at
# RegisterAction's 0 and throws otherwise, so this is the one file that may fund the run's owner;
# a second one would be refused loudly rather than overwrite.
#
# ── WHAT THE BUMP REACHES BESIDES THIS FILE ──────────────────────────────────────────────────
#
# The epoch is per organization, and a pooled run is ONE organization. So in a `--parallel` run
# the push also reaches every other pool station online at that instant, and every offline pass
# of the run's organization issued before it is revoked. MEASURED over the 159 files on
# 2026-09-28: 6 issue offline passes (all security/offline-*), 3 wait for a ChangeConfiguration
# Request (device-management/change-configuration-*), 0 assert its silence. In sorted order the
# nearest of them is 20 files before this one and the change-configuration trio 85; in the corpus
# run of that day this file ran 05:58:59-05:59:04 and the last of the nine had ended at 05:58:26.
# An unsolicited ChangeConfiguration is already what every station declaring device management
# receives at each boot (the replay drained below), and no scenario answers or waits for it. A new
# file that waits for ChangeConfiguration or holds a pass, placed near this one, would share the
# organization's epoch with it — that is the dependency to keep in view.
requires_pool: >-
  The epoch revoke route asks offline_passes.revoke, which the pool's per-scenario tenant_operator
  does not hold; the only identity that does is the ephemeral tenant_owner a bootstrapped run mints
  and deletes.
auth:
  email_env: SIM_POOL_OWNER_EMAIL
  password_env: SIM_POOL_OWNER_PASSWORD
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: true
        meterValuesSupported: true
        # LOAD-BEARING, and now for the push rather than for a write. The server delivers the
        # epoch as ChangeConfiguration through WriteConfigurationAction, whose capability gate
        # (:128-137) refuses a station whose device_management_supported is not true before
        # anything is published; PushEpochToStationsListener logs that and moves on. Without this
        # declaration the revocation below would never reach the wire.
        #
        # It was first added for the testing route this file used to call, which refused with
        # 422 COMMAND_NOT_SUPPORTED 2007 "Station does not support device management" unless it
        # was declared. The flag is STICKY per station (BootNotificationHandler §5.1 rule 2 leaves
        # an unstated capability OUT of the update), so on a long-lived reused station this file
        # once inherited `true` from a sibling; declaring it keeps the file independent of order.
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- The boot REPLAY of the organization's current epoch, drained here on purpose.
  # IncludeEpochInBootListener pushes RevocationEpoch=<current> at every boot, unconditionally
  # (measured: 52 ms after the Boot Response on the re-run above). `wait_for` resolves with the
  # NEWEST buffered match and drains the rest (MessageRouter.drainBuffered), so if this replay were
  # still buffered when the revocation's push is awaited below, that wait could resolve on the
  # replay whenever the push had not landed yet. Taking it here leaves the later wait only the push.
  - action: wait_for
    message: ChangeConfiguration
    messageType: Request
    timeout_ms: 15000

  - action: assert
    field: "payload.keys.0.key"
    equals: "RevocationEpoch"

  # --- Bay Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  # --- The owner's wallet, funded once (see the header). `GET /me` names the uuid the wallet is
  # keyed on; `fund_wallet` derives the amount from this station's published catalog.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/me"
    expect_status: 200
    capture:
      owner_id: "data.id"

  - action: fund_wallet
    user_id: "{{captured.owner_id}}"

  # --- Trigger StartService via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"
      serviceId: "payload.serviceId"

  # --- Accept StartService ---
  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  # --- StatusNotification Occupied ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false

  # --- Mid-session: the tenant revokes its epoch. OSPP spec ch.08 §5 defines the station-side
  # config key as `RevocationEpoch` (PascalCase); the OfflinePass JSON field is the lowercase
  # `revocationEpoch` — a different identifier. The answer carries the new epoch
  # (DashboardOfflinePassController::revokeEpoch). NOTE: no ChangeConfigurationHandler runs in
  # scenario mode, so nothing persists the pushed value onto the station's currentRevocationEpoch
  # and no ChangeConfiguration RESPONSE is ever sent — the server's command for it stays pending.
  # The push is observed on the wire, not round-tripped.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/offline-passes/epochs/revoke"
    body:
      reason: "sim revocation-epoch deauthorization on {{stationId}}"
    expect_status: 200
    expect_body:
      success: true
    capture:
      new_epoch: "newEpoch"

  - action: wait_for
    message: ChangeConfiguration
    messageType: Request
    timeout_ms: 15000
    capture:
      pushed_epoch: "payload.keys.0.value"

  - action: assert
    field: "payload.keys.0.key"
    equals: "RevocationEpoch"

  # THE PUSH IS THIS REVOCATION'S, not a replay: the value on the wire names the epoch row this
  # file's revocation wrote, and that row's epoch is the one the revoke answered with. The
  # selector matches the pushed STRING against the row's number textually (getNestedValue compares
  # String(field)), and the whole-token `{{captured.new_epoch}}` keeps the answer's number, so the
  # one line ties the wire, the record and the response together. The reason ties the row to this
  # file. The boot replay's value (the epoch before the bump) has no row with this reason.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/offline-passes/epochs"
    expect_status: 200
    expect_body:
      "data[epoch={{captured.pushed_epoch}}].epoch": "{{captured.new_epoch}}"
      "data[epoch={{captured.pushed_epoch}}].reason": "sim revocation-epoch deauthorization on {{stationId}}"

  # Nothing auto-accepts: no ChangeConfiguration RESPONSE is sent and the
  # station's currentRevocationEpoch is never updated. Plain wait.
  - action: delay
    ms: 500

  # --- SessionEnded (Deauthorized) — full refund per spec.
  # NO seqNo/finalSeqNo is published: injectSeqNoFields early-returns because
  # station.sessions is empty in scenario mode (SendStep.ts:236). Both fields are
  # optional in session-ended-event.schema.json, so this validates and passes with
  # neither present — the server's sequence block is skipped entirely.
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "Deauthorized"
      actualDurationSeconds: 2
      creditsCharged: 0

  # --- StatusNotification Finishing → Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Finishing"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 500

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Finishing"
      programs:
        - programNumber: 1
          available: true

  # THE ASSERTION — the spec mandate this file is named for, finally read back.
  #
  # Its description has always claimed "spec v0.4.0 mandates creditsCharged: 0",
  # and until now the only evidence for that was the literal this scenario sends
  # in its own SessionEnded. The server's number is what the mandate is about.
  #
  #   credits_charged 0 / refund_amount 500 — UserDurationStrategy:42-46 groups
  #       Deauthorized with LocalOutOfCredit and NeverStarted under
  #       fullRefund($authorized): "not billable regardless of elapsed". Two
  #       delivered seconds are charged NOTHING. refund_amount is derived
  #       (SessionResource:53-56) and appears in no message this scenario sends,
  #       so it is the non-echoed half — credits_charged 0 coincides with the
  #       literal above and cannot prove the server computed anything on its own.
  #
  #   status failed — this is a FIFTH settlement arm, not a repeat of
  #       LocalOutOfCredit. Both are fullRefund, but Deauthorized lands in
  #       `failed` while LocalOutOfCredit completes. Revocation is a security
  #       event, not a clean end.
  #
  #   fail_reason — THE discriminator, and the only one available. Deauthorized
  #       and Fault are otherwise byte-identical on every asserted field:
  #       failed / 0 / 500. The strings differ, and nothing else does, so
  #       dropping this line would collapse a revoked pass and a hardware fault
  #       into one indistinguishable assertion. Server-composed: the station
  #       sends `reason: "Deauthorized"`, the row stores the sentence below.
  #
  # NOT asserted: fail_error_code, which is present-but-null here (status IS
  # failed so SessionResource:64-67 includes the key, but this path sets a reason
  # string and no code). Asserting null would pass and prove nothing about
  # revocation. Also not asserted: the security audit record the description
  # mentions — it is not exposed on this endpoint, and no assertion here reaches
  # it. Measured on UAT 2026-08-10.
  #
  # Read as the session's own user — the owner that started it. GET /api/v1/sessions/{id} is
  # self-only (SessionController.php:199-205 answers 403 SESSION_MISMATCH to anyone else).
  - action: delay
    ms: 1000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "failed"
      data.credits_charged: 0
      data.refund_amount: 500
      data.fail_reason: "SessionEnded: deauthorized (offline pass revoked)"
