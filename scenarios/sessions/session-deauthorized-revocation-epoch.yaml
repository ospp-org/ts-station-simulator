# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/sessions/session-deauthorized-revocation-epoch.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Session Deauthorized via RevocationEpoch Bump"
description: "Mid-session RevocationEpoch bump (via ChangeConfiguration) invalidates the offline pass under which session was authorized. Station emits SessionEnded with reason Deauthorized; spec v0.4.0 mandates creditsCharged: 0 + security audit on csms-server."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: true
        meterValuesSupported: true
        # THE REASON THIS FILE WAS FAILING, and it was never a server defect.
        #
        # Step 8 drives the RevocationEpoch bump through
        # POST /testing/trigger-command with command ChangeConfiguration. That
        # endpoint refuses with 422 COMMAND_NOT_SUPPORTED 2007 "Station does not
        # support device management" unless the station has declared the
        # capability — so the scenario died three steps before the SessionEnded
        # it exists to test, and the failure named device management rather than
        # anything about revocation.
        #
        # The flag is STICKY per station (BootNotificationHandler §5.1 rule 2
        # leaves an unstated capability OUT of the update, so a prior value
        # survives). On a long-lived reused station this file inherited `true`
        # from a sibling and passed; on a fresh pool station it starts NULL and
        # the latent gap surfaces. Declaring it here is what makes the file
        # independent of run order. Same fix as get-configuration.yaml.
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # --- Trigger StartService via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"
      serviceId: "payload.serviceId"

  # --- Accept StartService ---
  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  # --- StatusNotification Occupied ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  # --- Mid-session: trigger RevocationEpoch bump via ChangeConfiguration.
  # OSPP spec ch.08 §5 defines the station-side config key as
  # `RevocationEpoch` (PascalCase). The OfflinePass JSON field is the
  # lowercase `revocationEpoch` — different identifier. Server pushes
  # the new epoch. NOTE: no ChangeConfigurationHandler runs in scenario mode
  # (ScenarioRunner.ts:766-769), so nothing persists it onto the station's
  # currentRevocationEpoch and no ChangeConfiguration RESPONSE is ever sent —
  # the server's pendingCommand for it stays unresolved. The epoch push is
  # observed on the wire, not round-tripped. ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/testing/trigger-command/{{stationId}}"
    body:
      command: "ChangeConfiguration"
      payload:
        key: "RevocationEpoch"
        value: "1"
    expect_status: 202

  - action: wait_for
    message: ChangeConfiguration
    messageType: Request
    timeout_ms: 15000

  # Nothing auto-accepts: no ChangeConfiguration RESPONSE is sent and the
  # station's currentRevocationEpoch is never updated. Plain wait.
  - action: delay
    ms: 500

  # --- SessionEnded (Deauthorized) — full refund per spec.
  # NO seqNo/finalSeqNo is published: injectSeqNoFields early-returns because
  # station.sessions is empty in scenario mode (SendStep.ts:236). Both fields are
  # optional in session-ended-event.schema.json, so this validates and passes with
  # neither present — the server's sequence block is skipped entirely.
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "Deauthorized"
      actualDurationSeconds: 2
      creditsCharged: 0

  # --- StatusNotification Finishing → Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Finishing"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 500

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Finishing"
      programs:
        - programNumber: 1
          available: true

  # THE ASSERTION — the spec mandate this file is named for, finally read back.
  #
  # Its description has always claimed "spec v0.4.0 mandates creditsCharged: 0",
  # and until now the only evidence for that was the literal this scenario sends
  # in its own SessionEnded. The server's number is what the mandate is about.
  #
  #   credits_charged 0 / refund_amount 500 — UserDurationStrategy:42-46 groups
  #       Deauthorized with LocalOutOfCredit and NeverStarted under
  #       fullRefund($authorized): "not billable regardless of elapsed". Two
  #       delivered seconds are charged NOTHING. refund_amount is derived
  #       (SessionResource:53-56) and appears in no message this scenario sends,
  #       so it is the non-echoed half — credits_charged 0 coincides with the
  #       literal above and cannot prove the server computed anything on its own.
  #
  #   status failed — this is a FIFTH settlement arm, not a repeat of
  #       LocalOutOfCredit. Both are fullRefund, but Deauthorized lands in
  #       `failed` while LocalOutOfCredit completes. Revocation is a security
  #       event, not a clean end.
  #
  #   fail_reason — THE discriminator, and the only one available. Deauthorized
  #       and Fault are otherwise byte-identical on every asserted field:
  #       failed / 0 / 500. The strings differ, and nothing else does, so
  #       dropping this line would collapse a revoked pass and a hardware fault
  #       into one indistinguishable assertion. Server-composed: the station
  #       sends `reason: "Deauthorized"`, the row stores the sentence below.
  #
  # NOT asserted: fail_error_code, which is present-but-null here (status IS
  # failed so SessionResource:64-67 includes the key, but this path sets a reason
  # string and no code). Asserting null would pass and prove nothing about
  # revocation. Also not asserted: the security audit record the description
  # mentions — it is not exposed on this endpoint, and no assertion here reaches
  # it. Measured on UAT 2026-08-10.
  - action: delay
    ms: 1000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "failed"
      data.credits_charged: 0
      data.refund_amount: 500
      data.fail_reason: "SessionEnded: deauthorized (offline pass revoked)"
