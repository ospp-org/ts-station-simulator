# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/sessions/session-stop-local.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Session Stop - Local (User Pressed Stop Button)"
description: "User manually stops session at the station (physical Stop button). Station emits autonomous SessionEnded with reason Local; pro-rated charge allowed per spec v0.4.0."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # --- Trigger StartService via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"
      serviceId: "payload.serviceId"

  # --- Accept StartService ---
  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  # --- StatusNotification Occupied ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  # --- Simulate user pressing Stop button after 1.5s ---
  - action: delay
    ms: 1500

  # --- SessionEnded (Local) — autonomous emission, pro-rated charge.
  # NO seqNo/finalSeqNo published (SendStep.ts:236 early-return); both optional in schema.
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "Local"
      actualDurationSeconds: 2
      creditsCharged: 4

  # --- StatusNotification Finishing ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Finishing"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 500

  # --- StatusNotification Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Finishing"
      programs:
        - programNumber: 1
          available: true

  # THE ASSERTION — and this file is the CANONICAL member of a five-file cluster,
  # which is the more important thing it records.
  #
  # meter-values-streaming, session-web-payment, session-with-reservation and
  # start-service all end with reason `Local` exactly as this one does. `Local`
  # maps to TerminalReason::VoluntaryStop, which UserDurationStrategy:56-62
  # settles pro-rata with no low-delivery floor. There is no `end_reason` column
  # and no end-reason field on SessionResource, so on GET /sessions/{id} those
  # five sessions are DISTINGUISHABLE ONLY BY AMOUNT — and the amount follows
  # from duration_actual, which each scenario supplies itself.
  #
  # So the settlement rule is asserted ONCE, here, rather than copied five times.
  # The other four assert what is actually specific to them (their reservation
  # binding, their payment source, their meter values), not a fifth restatement
  # of this rule. Five identical assertions would look like five proofs and be
  # one.
  #
  # HONESTY ABOUT credits_charged 4. The server computes it —
  # RefundCalculator on 2 delivered seconds of 300 at 100 cr/min, ceil(2/60 * 100)
  # = 4 — but this scenario's SessionEnded also declares `creditsCharged: 4`, so
  # the two COINCIDE and this field alone cannot prove the server ignored the
  # station. It is asserted because it is the correct value, not because it
  # discriminates. The file that proves the settlement authority overrides the
  # station is session-timeout-timer-expired, where the station says 4 and the
  # server records 500.
  #
  # data.refund_amount 496 is derived (SessionResource:53-56,
  # credits_authorized - credits_charged) and appears in no message this scenario
  # sends, so it is genuinely server-produced. Measured on UAT 2026-08-10.
  - action: delay
    ms: 1000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "completed"
      data.credits_charged: 4
      data.refund_amount: 496
