# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/sessions/session-timeout-timer-expired.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Session Timeout - Timer Expired"
description: "Session auto-stops when durationSeconds elapses. Station sends SessionEnded with reason TimerExpired, transitions through Finishing to Available."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # --- Trigger StartService via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"
      serviceId: "payload.serviceId"
      durationSeconds: "payload.durationSeconds"

  # --- Accept StartService ---
  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  # --- StatusNotification Occupied ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  # --- Simulate timer expiring (short delay for test) ---
  - action: delay
    ms: 2000

  # --- SessionEnded - TimerExpired ---
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "TimerExpired"
      actualDurationSeconds: 2
      creditsCharged: 4

  # --- StatusNotification Finishing ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Finishing"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 500

  # --- StatusNotification Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Finishing"
      programs:
        - programNumber: 1
          available: true

  # THE ASSERTION, and the strongest non-echoed one in the sessions suite.
  #
  # This scenario's SessionEnded declares `creditsCharged: 4`. The server recorded
  # 500. It does not take the station's number: UserDurationStrategy:38-40 routes
  # TimerExpired to SettlementResult::fullCharge($authorized), so a session that
  # ran its booked window is billed the whole window — 300s at 100 cr/min = 500 —
  # no matter what the station claims or how little time actually elapsed
  # (duration_actual here is 2, and it changes nothing).
  #
  # That gap between 4 and 500 is what makes this assertion worth having. It is
  # impossible to satisfy by echoing the scenario's own literal, and it pins the
  # rule that decides real money on the full-charge path.
  #
  # data.refund_amount is derived, not stored — SessionResource:53-56 computes
  # credits_authorized - credits_charged. Pinning 0 says the customer was charged
  # in full with nothing returned, which is the whole meaning of TimerExpired.
  #
  # NOW ASSERTED — this was marked unassertable twice, and the runner grew the
  # form that closes it. expect_body_absent asserts the path is NOT THERE, which
  # is what a completed session owes: SessionResource:60-67 wraps fail_reason and
  # fail_error_code in $this->when(status === FAILED), so on this body neither
  # key exists.
  #
  # It is NOT the same as asserting null, and the difference is load-bearing here.
  # getNestedValue returns undefined for a missing key, a YAML null is JS null,
  # and the compare is ===, so `expect_body: {data.fail_error_code: null}` would
  # go RED against this correct response. The sibling that legitimately uses null
  # is reserve-cancel.yaml, where ReservationResource emits the timestamp
  # unconditionally and it is present-carrying-null.
  #
  # Measured on UAT 2026-08-10. The sibling rule arms are covered by
  # session-stop-local (pro-rata), session-local-out-of-credit (full refund) and
  # session-fault-during-service (fault -> failed); all four run identical inputs —
  # duration_requested 300, credits_authorized 500 — so the ONLY variable across
  # them is the settlement rule. That is deliberate and should be preserved.
  - action: delay
    ms: 1000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "completed"
      data.credits_charged: 500
      data.refund_amount: 0
    expect_body_absent:
      - data.fail_error_code
      - data.fail_reason
