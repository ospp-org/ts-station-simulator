# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/sessions/meter-values-streaming.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Meter Values Streaming"
description: "Boot, trigger StartService via API, accept, send StatusNotification Occupied, send 3 MeterValues EVENTs with increasing cumulative values and delays between them."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # --- Trigger StartService via canonical REST ---
  # background: true — /sessions/start is synchronous (blocks on
  # SessionReadySignal::wait until station Response arrives via MQTT).
  # The scenario must run its wait_for + send Response below while the
  # fetch is in flight; the server resolves the HTTP request after the
  # station Response (server-generated session id returned as data.id,
  # but we capture it from the MQTT StartService Request payload).
  - action: delay
    ms: 500

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"
      serviceId: "payload.serviceId"

  # --- Accept StartService ---
  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  # --- StatusNotification Occupied ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  # --- MeterValues 1 ---
  - action: delay
    ms: 500

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-01-30T12:01:00.000Z"
      values:
        liquidMl: 500
        consumableMl: 50
        energyWh: 100

  # --- MeterValues 2 ---
  - action: delay
    ms: 500

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-01-30T12:02:00.000Z"
      values:
        liquidMl: 1200
        consumableMl: 120
        energyWh: 250

  # --- MeterValues 3 ---
  - action: delay
    ms: 500

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-01-30T12:03:00.000Z"
      values:
        liquidMl: 1800
        consumableMl: 180
        energyWh: 400

  # --- Pool-hygiene teardown: end the session this scenario started so the reused
  #     pooled station is returned clean. Appended after all assertions — does not
  #     change what the scenario tests. (Class: session-leak.)
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "Local"
      actualDurationSeconds: 1
      creditsCharged: 0
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true

  # 1000ms: the MeterValues and SessionEnded above are EVENTS with no Response to
  # synchronise on, and 300ms was measured INSIDE the consumer race on UAT.
  - action: delay
    ms: 1000

  # THE ASSERTION — deliberately NOT a fifth copy of the settlement rule.
  #
  # This file ends with reason `Local`, exactly like session-stop-local,
  # session-web-payment, session-with-reservation and start-service. All five map
  # to TerminalReason::VoluntaryStop and settle pro-rata by the same rule, and
  # there is no end_reason column or field to tell them apart. The money is
  # asserted ONCE, in session-stop-local. Repeating it here would look like a
  # second proof and be the same one.
  #
  # What is specific to this file is INGESTION. It publishes three MeterValues
  # Events mid-session and, before this, asserted nothing about whether any of
  # them survived. MeterValues is an Event: no Response, and a rejected frame is
  # silent, so the file passed whether the server stored three rows or zero.
  # Reading them back off the session proves the ingest path ran.
  #
  # HONEST about strength: the energy figures are literals this scenario sent, so
  # matching them proves STORAGE AND RETRIEVAL, not computation. That is still
  # the thing this file exists to exercise, and it has a real failure mode — a
  # dropped frame, a wrong session binding, or a silent schema rejection all
  # break it.
  #
  # [sampled_at=...] selectors, never indices. SessionResource:73-77 does order
  # by sampled_at so an index would happen to work today, but the ordering is the
  # resource's choice and not part of any contract — and the sibling
  # meter-values-seqno-gap-still-ingested.yaml already pins .0/.1/.2 positionally,
  # which is the fragile form. Keyed selectors say what is meant.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.meter_values[sampled_at=2026-01-30T12:01:00.000Z].energy_wh: 100
      data.meter_values[sampled_at=2026-01-30T12:02:00.000Z].energy_wh: 250
      data.meter_values[sampled_at=2026-01-30T12:03:00.000Z].energy_wh: 400
