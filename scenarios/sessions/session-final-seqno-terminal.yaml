# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/sessions/session-final-seqno-terminal.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Session finalSeqNo Terminal Marker"
description: "3 MeterValues with EXPLICIT seqNo 0,1,2; the scenario itself sends StopService Response Accepted carrying finalSeqNo=3, which is what writes sessions.final_seq_no. A control frame at seqNo=3 is then INGESTED (proving a terminal session still accepts frames), and late frames at seqNo 99/100 are DISCARDED. Asserted on the server-written meter_values collection, not on silence."
#
# SERVER BRANCH REACHED
#   csms-server app/Modules/Session/Handlers/MeterValuesHandler.php:60-69
#     if ($session->final_seq_no !== null && $dto->seqNo !== null
#         && $dto->seqNo > $session->final_seq_no) { ...discard...; return null; }
#   The guard is a no-op unless final_seq_no is non-null. It is written by
#   CompleteSessionAction.php:137, reached from StopServiceResponseHandler.php:72-79
#   (handleAccepted -> completeSessionAction->execute(finalSeqNo: $dto->finalSeqNo)).
#   `finalSeqNo` is a declared member of stop-service-response.schema.json
#   (additionalProperties:false, so it must be declared to survive validation).
#
# WHY THIS FILE WAS REWRITTEN (2026-08-10)
#   The prior version asserted NOTHING after its two late frames, and rested on an
#   auto-responder that scenario mode does not register: ScenarioRunner.ts:756-769
#   registers ONLY BootNotificationHandler(autoReact=false). So no StopService Response
#   was ever sent, final_seq_no stayed NULL, the discard guard above was a no-op, and
#   the "late" seqNo 99/100 frames were INGESTED. Measured on UAT 2026-08-10:
#   final_seq_no NULL on every session in the run, last_seq_no=100 on this one. The file
#   passed while the exact opposite of its thesis happened. Its "auto-inject seqNo 0,1,2"
#   and "handler auto-emits StopServiceResponse" comments described mechanisms that do
#   not run — which is how it survived.
#
# WHY THE CONTROL FRAME IS LOAD-BEARING
#   "Nothing was appended after the terminal write" is ALSO what you would see if the
#   server dropped every frame on a completed session for any reason. MeterValuesHandler
#   has no such status guard (findBySessionId is unfiltered; the only status branch is an
#   AUTHORIZED->ACTIVE promotion at :77), so a frame at seqNo == finalSeqNo MUST still be
#   ingested. Step 5 proves that, which is what makes step 6's absence attributable to the
#   seqNo filter specifically rather than to the session having ended.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # --- Trigger StartService ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"
      serviceId: "payload.serviceId"

  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  # --- 3 MeterValues carrying EXPLICIT seqNo 0, 1, 2 ---
  # Explicit, not injected: SendStep::injectSeqNoFields (SendStep.ts:227-256) early-returns
  # because station.sessions is only written by StartServiceHandler.ts:161, which scenario
  # mode never registers. An explicit `seqNo:` here reaches the wire untouched — the
  # injector only ever fills a MISSING value (`payload.seqNo === undefined`, :242).
  - action: delay
    ms: 300

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-05-09T12:00:30.000Z"
      seqNo: 0
      values:
        liquidMl: 300
        energyWh: 75

  - action: delay
    ms: 300

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-05-09T12:01:00.000Z"
      seqNo: 1
      values:
        liquidMl: 600
        energyWh: 150

  - action: delay
    ms: 300

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-05-09T12:01:30.000Z"
      seqNo: 2
      values:
        liquidMl: 900
        energyWh: 225

  # --- Trigger StopService. The Response is sent BY THIS SCENARIO below;
  # nothing auto-emits it. ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}/stop"
    expect_status: 200

  - action: wait_for
    message: StopService
    messageType: Request
    timeout_ms: 15000

  # THE TERMINAL WRITE. finalSeqNo=3 is the whole point of the file: it is the
  # only thing that makes MeterValuesHandler.php:60 anything other than a no-op.
  # StopServiceResponseHandler::handleAccepted -> CompleteSessionAction:137.
  - action: send
    message: StopService
    messageType: Response
    payload:
      status: "Accepted"
      actualDurationSeconds: 90
      creditsCharged: 150
      finalSeqNo: 3

  - action: delay
    ms: 2000

  # --- BASELINE. Three frames written, session terminal, finalSeqNo recorded. ---
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "completed"
      data.meter_values.length: 3
      data.meter_values.2.energy_wh: 225

  # --- CONTROL: seqNo == finalSeqNo, so NOT `> finalSeqNo`, so NOT discarded.
  # This is the frame the terminal marker declares exists. It arrives after the
  # session went terminal and MUST still be ingested — that is what proves the
  # next step's absence is the seqNo filter and not a blanket post-terminal drop. ---
  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-05-09T12:02:00.000Z"
      seqNo: 3
      values:
        liquidMl: 1000
        energyWh: 333

  - action: delay
    ms: 2000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.meter_values.length: 4
      data.meter_values.3.energy_wh: 333

  # --- THE TEST: 2 late frames with seqNo > finalSeqNo=3. Both MUST be discarded. ---
  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-05-09T12:02:30.000Z"
      seqNo: 99
      values:
        liquidMl: 1100
        energyWh: 777

  - action: delay
    ms: 300

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-05-09T12:03:00.000Z"
      seqNo: 100
      values:
        liquidMl: 1200
        energyWh: 888

  - action: delay
    ms: 2000

  # THE ASSERTION. Still 4 rows, and index 3 is still the control frame — so
  # neither late frame was appended. Length alone would pass if a late frame had
  # REPLACED one; pinning index 3 closes that. energy_wh 777/888 exist nowhere else
  # in this file, so an ingested late frame could only show up here.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "completed"
      data.meter_values.length: 4
      data.meter_values.3.energy_wh: 333

  # --- Pool-hygiene teardown. (Class: bay-leak.) The session is already terminal;
  # only the bay needs returning to Available for the next scenario on this station. ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
