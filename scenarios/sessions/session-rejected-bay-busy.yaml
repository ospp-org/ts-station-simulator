# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/sessions/session-rejected-bay-busy.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Session Rejected - Bay Busy"
description: "First session accepted on bay, second StartService on same bay rejected with error 3001 BAY_BUSY."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # --- Trigger first StartService via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId1: "payload.sessionId"
      bayId: "payload.bayId"
      serviceId: "payload.serviceId"

  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  # --- StatusNotification Occupied ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  # --- Trigger second StartService on same bay via API ---
  # FOREGROUND deliberately, unlike the FIRST api_call in this file. That one
  # must stay background: it is a real session start, so the endpoint blocks on
  # the station's MQTT Response and the scenario's wait_for + send Response have
  # to run while the fetch is in flight. THIS one is refused pre-dispatch, so
  # nothing overlaps it — and background mode would downgrade the mismatch to a
  # console.warn, which is why "the 409 is the final assertion" was not one.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    body:
      bay_id: "{{captured.bayId}}"
      service_id: "{{captured.serviceId}}"
      duration_seconds: 300
    expect_status: 409
    # 3001 BAY_BUSY is reachable ONLY from OCCUPIED
    # (SessionStateMachine.php:74-81), so this proves the first session really
    # holds the bay — not that some unrelated 409 came back. Without it the bay
    # could have been `unknown` (3002) and the scenario would still have passed.
    expect_body:
      errorCode: 3001
  # Per C-005: server returns 409 BAY_BUSY pre-MQTT-dispatch; no StartService
  # Request is published.

  # --- Pool-hygiene teardown: end the (first) session this scenario started so the
  #     reused pooled station is returned clean. Appended after all assertions — does
  #     not change what the scenario tests. (Class: session-leak.)
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId1}}"
      bayId: "{{captured.bayId}}"
      reason: "Local"
      actualDurationSeconds: 1
      creditsCharged: 0
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
