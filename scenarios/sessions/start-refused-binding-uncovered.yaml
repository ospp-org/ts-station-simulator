name: "Start Refused — 3020 BINDING_UNCOVERED, the ordinal the bay stopped declaring"
description: >-
  Bind a service to a program ordinal the bay declares, re-provision the station with a
  topology that DROPS that ordinal, then start a session against the binding. The server
  answers 409 `3020 BINDING_UNCOVERED` and names, in `details`, both the offending ordinal
  and the ones the bay still declares — which is what makes the registry's recommended
  action executable rather than advice.

# WHY THIS FILE EXISTS, AND WHY IT IS THE ONLY SHAPE THAT REACHES THE CODE.
#
# `3020 BINDING_UNCOVERED` was minted in spec v0.42.0 and reached csms-server in 8fe20097.
# It is the third of three refusals that all mean "this (bay, service, program) will not
# start", and the server distinguishes them by three DIFFERENT questions — so a scenario
# that reaches the wrong one proves nothing about this code:
#
#   3019 SERVICE_NOT_BOUND    `resolve()` found no binding at all.
#   3003 SERVICE_UNAVAILABLE  the ordinal IS declared, and the station reported it
#                             `available: false`.
#   3020 BINDING_UNCOVERED    the binding names an ordinal that is no longer in the bay's
#                             declaration at all — `bay_programs` has no such row.
#
# csms-server's own `AnUncoveredBindingDoesNotStartTest.php` pins all three apart, and its
# `:286` control is the one that matters here: a declared-but-unavailable ordinal must stay
# 3003. So this file may not reach 3020 by marking a program unavailable.
#
# ── RE-PROVISIONING IS THE ONLY WAY TO DROP AN ORDINAL, MEASURED ────────────────────────
#
# A StatusNotification cannot do it. `StatusNotificationHandler::applyProgramAvailability`
# (`StatusNotificationHandler.php:639`) only flips the `available` column on rows that
# already exist — its single write is the UPDATE at `:653-657` and the file contains no
# DELETE at all — and the profile it implements says so in as many words
# (`profiles/core/status-notification.md:39`, quoted at `StatusNotificationHandler.php:664-668`):
# "A program that cannot run is reported present with `available: false`, never omitted —
# omission means the hardware changed, and that requires re-provisioning, not a status
# report."
#
# The writer that DOES remove rows is the provisioning path:
# `CertificateManager.php:490` deletes every `bay_programs` row for the bay and `:493`
# re-inserts the declared set. That is the whole reason the sequence below re-provisions.
#
# AND THE 4020 GATE DOES NOT STAND IN THE WAY, which is the fact that makes this file
# possible at all. `BayCountMismatchException` compares the declared bay NUMBER SET against
# the registered one — its own docblock spells out that the name says "count" and the
# comparison is a set. Both provisionings below declare bays {1, 2}. Only the PROGRAM list
# inside bay 1 narrows, from {1, 2} to {1}, and no gate reads that.
#
# ── WHAT THIS FILE NEEDS THAT NO OTHER FILE IN THE CORPUS NEEDS ─────────────────────────
#
# A SECOND `connect_mqtt`. Re-provisioning issues a new certificate and rebinds the
# station's keys, so the identity the first connection holds is stale from that moment —
# csms-server logs the rotation as "broker reconnect-bar lifted … re-provisioned,
# certificate N issued". `ConnectMqttStep` derives its key/cert paths from the `certs_dir`
# that `ProvisionStep` captures (`ConnectMqttStep.ts:42-61`), so the second connect picks
# up the rotated material by construction rather than by a new knob.
#
# IT MUST BE PRECEDED BY A TEARDOWN, and that is not a stylistic choice. `ConnectMqttStep`
# ends by calling `station.setTls()` (`ConnectMqttStep.ts:97`), and `MqttConnection.setTls`
# throws "cannot change TLS after connect(); disconnect first" while a client exists
# (`MqttConnection.ts:396-400`). There is no `disconnect` action in the step registry; the
# only two kinds that null the client are `fault: sever` (`FaultStep.ts:29-30` ->
# `severConnection()`, `MqttConnection.ts:751`) and `fault: planned_shutdown`
# (`FaultStep.ts:50-51` -> `disconnect({ announceDeparture: true })`, `:798`). The third,
# `fault: disconnect`, calls `destroyConnection()` and leaves the client in place to
# auto-reconnect, so it does NOT clear the way.
#
# `planned_shutdown` IS THE ONE THIS FILE MEANS, not `sever`. The station is going down
# because it has just been re-provisioned and must come back holding new key material —
# a departure it knows about in advance. `sever` is the unclean, final teardown that leaves
# the will armed, so the broker publishes it and the server records an
# `UnexpectedDisconnect` about a departure that was in fact planned. This file's deliverable
# is what the server journals, so writing a false cause into that journal to save a line
# would corrupt the evidence it exists to produce. `planned_shutdown` publishes
# ConnectionLost with `reason: "PlannedShutdown"` and then a clean DISCONNECT, which
# suppresses the will (MQTT 5 §3.14.4).
#
# It remains the only file in the corpus that connects twice: 5 of the 158 scenarios call
# `connect_mqtt`, all five declare `defer_mqtt_connect: true`, and only this one calls it
# more than once. `ConnectLifecycleCheck` is what now keeps a second connect from being
# written without its teardown.
#
# AND THE STATION MUST BE ONLINE FOR THE REFUSAL TO BE REACHABLE AT ALL.
# `StartSessionAction.php:101` refuses an offline station with `6003 STATION_OFFLINE`
# before any of the binding questions are asked — the 3020 guard is at `:507`. So a boot
# that does not land makes this file report the WRONG code rather than fail, which is why
# the second boot below is followed by an assertion on the station's own state rather than
# by a bare delay. (`3005` is a DIFFERENT code — `BAY_NOT_FOUND`, raised at `:96` when the
# bay id names no in-service bay. The two were conflated here until 2026-09-21.)

requires_pool: >-
  Minting a provisioning token authorizes `stations.manage_provisioning_tokens` and
  creating a station service authorizes `catalog.manage`; both live on tenant_owner, and
  the only tenant_owner that exists is the ephemeral one a bootstrapped run mints and
  deletes. Same constraint as provision-rejected-key-and-topology-rungs.yaml.
owns_station: >-
  This file RE-PROVISIONS mid-run, which issues a new certificate and rebinds the station's
  keys. Doing that to a pool station would rotate an identity four other scenarios are
  leasing. `owns_station` also resolves `{{stationId}}` to the fresh per-scenario id, so
  every step below — the Station object, both `connect_mqtt` calls and the cert-path
  templates — reads one name for one station.

auth:
  email_env: SIM_POOL_OWNER_EMAIL
  password_env: SIM_POOL_OWNER_PASSWORD

# The first connection is made by the `connect_mqtt` step below, AFTER provisioning — there
# is no certificate to connect with before it.
defer_mqtt_connect: true

# NO `scenario_timeout_ms` OVERRIDE, deliberately. Two provisionings sounds long, but
# `provision-rejected-key-and-topology-rungs.yaml` performs FIVE on the 90 s default and is
# not on the override list either. The list's own rule is that an override is argued for,
# and the assertion beside it requires the file's declared `delay:` sum to exceed the
# default — this file declares no delays at all. An override taken on a guess, by a file
# that has never been run end to end, is the guess this repository asks not to be made.

station:
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]

steps:
  # ── Operator: the org, a location, and a station of this file's own ────────────────────
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/organizations"
    expect_status: 200
    capture:
      org_id: "data.0.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/locations"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    body:
      name: "Uncovered binding {{stationId}}"
      address: "Strada Simulare 1, Bucuresti"
      latitude: 44.4268
      longitude: 26.1025
      city: "Bucharest"
      country: "RO"
    expect_status: 201
    creates:
      location: "data.id"
    capture:
      location_id: "data.id"

  # Registration writes the BAYS. It does not write programs — those arrive with the
  # provisioning declaration below, which is the only writer of `bay_programs`.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    body:
      stationId: "{{stationId}}"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      locationId: "{{captured.location_id}}"
      bays:
        - bayNumber: 1
        - bayNumber: 2
    expect_status: 201
    creates:
      station: "data.station_id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/provisioning-tokens"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    body:
      note: "uncovered binding — first provisioning, bay 1 declares {1,2}"
    expect_status: 201
    capture:
      provisioning_token_a: "data.rawToken"

  # ── FIRST PROVISIONING — bay 1 declares TWO ordinals ──────────────────────────────────
  # This is the declaration the binding below is legal against. Bay 2 exists only so the
  # bay SET has more than one member, which is what makes the re-provisioning below a
  # narrowing of PROGRAMS rather than of bays.
  - action: provision
    station_id: "{{stationId}}"
    token_var: "provisioning_token_a"
    serial_number: "{{serialNumber}}"
    bay_count: 2
    artifacts_dir: "tests/artifacts/uncovered-binding"
    bays:
      - bayNumber: 1
        programs:
          - programNumber: 1
            label: "Basic Wash"
          - programNumber: 2
            label: "Foam Wash"
      - bayNumber: 2
        programs:
          - programNumber: 1
            label: "Basic Wash"

  # `broker_ca_path` IS NAMED, and it has to be. `ProvisionStep` writes
  # `<stationId>-broker-ca.pem` only when the provisioning response carries `brokerRootCa`,
  # and the server emits that field ONLY in `private_ca` mode (`config/ospp.php:550-553`,
  # `OspConfigValidator.php:121-133`). The local stack declares no `OSPP_BROKER_DEPLOYMENT`,
  # so it runs the `public_ca` default and the field is always absent — measured: a
  # provisioning artifacts dir here holds key, cert, chain, mqtt.json and the receipt pair,
  # and no broker-ca. The local broker nevertheless presents a PRIVATELY issued leaf
  # (`CN = emqx`, issuer `CN = OneStopPay MQTT CA`) ALONE, with no intermediate, so a client
  # left on the system trust store fails it with "unable to verify the first certificate".
  #
  # This is the bundle `config/targets.yaml` already declares as `local-mtls`'s `ca:` —
  # MQTT CA + Root CA. `ConnectMqttStep` does not read the target's `ca:` itself
  # (`ScenarioContext` carries no target cert config), which is why it is named per step.
  # Absent — on any target whose broker uses a public CA — the step fs.access-checks it and
  # falls through to the system store (`ConnectMqttStep.ts:84-92`), so naming it costs a
  # non-local run nothing.
  - action: connect_mqtt
    broker_ca_path: "certs/local/broker-ca.pem"

  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1, 2]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        deviceManagementSupported: false
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  # A bay is `unknown` to the server after every accepted Boot, and only a StatusNotification
  # clears it — an unreported bay is refused `3002 BAY_NOT_READY` with
  # `details.reason: bay_never_reported` (`SessionStateMachine.php:106-109`, reached from
  # `StartSessionAction.php:240` and thrown at `:251`), which is ahead of the 3020 guard at
  # `:507`. Reporting BOTH ordinals here is CORE-013: the reported set must EQUAL the set
  # this bay just declared.
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
        - programNumber: 2
          available: true

  # ── Operator: a service, bound to the ordinal the bay DOES declare ────────────────────
  # `serviceId` is caller-supplied so the binding and the start below can name the same
  # service (`StationServiceCatalogController.php:379-382` honours it; a collision is a
  # named 422 `SERVICE_ID_TAKEN` at `:859-865`, not a silent substitution).
  #
  # THE FIELD NAMES AND ENUM VALUES ARE THE FORM REQUEST'S, not this file's earlier guesses.
  # `StoreStationServiceRequest::rules()` (`:30-68`) accepts `serviceName`, `serviceKind`
  # and `priceCreditsPerMinute`; it has no `prepareForValidation`, so `name`, `kind` and
  # `pricePerMinute` were simply ignored and the call 422'd on three missing required keys.
  # `serviceKind` is `UserDuration|FixedDuration|MultiUnit` (`ServiceKind.php:35-37`) and
  # `pricingType` is `PerMinute|Fixed` (`PricingType.php:9-10`) — `wash` and `per_minute`
  # are members of neither. `UserDuration` is also what keeps `fixedDurationSeconds` from
  # becoming required (`required_unless:serviceKind,UserDuration`, `:63`). This is the shape
  # the four other corpus files that create a service already send.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    body:
      serviceId: "svc_uncovered_{{stationId}}"
      serviceName: "Foam Wash"
      serviceKind: "UserDuration"
      pricingType: "PerMinute"
      priceCreditsPerMinute: 10
      available: true
    expect_status: 201
    expect_body:
      data.serviceId: "svc_uncovered_{{stationId}}"
    capture:
      station_service_id: "data.id"

  # PROGRAM 2, deliberately. Ordinal 1 would survive the re-provisioning below and the file
  # would then prove nothing — it would start a session.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services/{{captured.station_service_id}}/binding"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    body:
      bayId: "{{captured.bayId_1}}"
      programNumber: 2
    expect_status: 201
    expect_body:
      # Both echoed members, because a binding that landed on the wrong bay or the wrong
      # ordinal would still answer 201 and the refusal below would then be measuring
      # something else.
      binding.bayNumber: 1
      binding.programNumber: 2

  # ── SECOND PROVISIONING — the same bay SET, bay 1 declaring ONE ordinal ───────────────
  # {1, 2} against {1, 2}: the 4020 set comparison is satisfied and cannot fire. Bay 1's
  # program list narrows to {1}, `CertificateManager.php:490` deletes its `bay_programs`
  # rows and `:493` re-inserts only ordinal 1 — so the binding made above now names an
  # ordinal with no row behind it. That is the condition, and nothing else produces it.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/provisioning-tokens"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    body:
      note: "uncovered binding — second provisioning, bay 1 drops ordinal 2"
    expect_status: 201
    capture:
      provisioning_token_b: "data.rawToken"

  - action: provision
    station_id: "{{stationId}}"
    token_var: "provisioning_token_b"
    serial_number: "{{serialNumber}}"
    bay_count: 2
    artifacts_dir: "tests/artifacts/uncovered-binding-narrowed"
    bays:
      - bayNumber: 1
        programs:
          - programNumber: 1
            label: "Basic Wash"
      - bayNumber: 2
        programs:
          - programNumber: 1
            label: "Basic Wash"

  # THE ANNOUNCED DEPARTURE that makes the second connect legal — see the header. The
  # station is going down because it has just been re-provisioned, which is a departure it
  # knows about, so it says so on the wire rather than letting the broker publish a will.
  - action: fault
    type: planned_shutdown

  # The certificate rotated, so the first connection's identity is stale. This is the
  # second `connect_mqtt` no other file in the corpus performs; it reads the key material
  # the step above captured into `certs_dir`.
  - action: connect_mqtt
    broker_ca_path: "certs/local/broker-ca.pem"

  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        deviceManagementSupported: false
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  # ORDINAL 2 IS ABSENT HERE, AND THAT IS THE POINT. The re-provisioning narrowed bay 1's
  # declaration to {1}, and CORE-013 binds the report to the declaration — so a conforming
  # station reports ordinal 1 alone. It must NOT report ordinal 2 as `available: false`:
  # that is the 3003 SERVICE_UNAVAILABLE shape, a DECLARED program that cannot run, and
  # csms-server's own `AnUncoveredBindingDoesNotStartTest.php:286` pins it apart from 3020.
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  # ONLINE, ASSERTED RATHER THAN ASSUMED. `StartSessionAction.php:101` refuses an offline
  # station with 6003 long before it asks any binding question, so a boot that did not land
  # would make the step below report the wrong code instead of failing here.
  #
  # `data.isOnline`, a BOOLEAN — this route builds its body inline
  # (`StationManagementController.php:350-...`) and emits `isOnline` at `:380`. It has no
  # top-level `status` at all; the only `status` keys in the payload are the certificate's
  # (`:370`) and each bay's (`:432`). A `status` STRING does exist, on the UUID-keyed
  # dashboard route (`DashboardStationController.php:236`), which this `stn_`-shaped id
  # cannot address: `admin.php:99-100` constrains this route to `stn_[0-9a-f]+` and
  # `dashboard.php:57` constrains that one to a uuid, precisely so they do not shadow.
  #
  # `data.id` IS that uuid, and it is captured here because the sessions filter below needs
  # it — see that step.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    expect_status: 200
    expect_body:
      data.isOnline: true
    capture:
      station_uuid: "data.id"

  # ── The customer, because the money gate is asked before the binding gate ─────────────
  # `4001 INSUFFICIENT_BALANCE` is raised at `StartSessionAction.php:379-382` (HTTP 402),
  # ahead of the 3020 guard at `:507`, and it is only asked when the request carries a user
  # (`:375` — `paymentIntentId === null && userId !== null`). So this file needs a customer
  # with a funded wallet, or the start is refused for the wrong reason.
  #
  # Registration is unauthenticated and opens the wallet at 0 (`RegisterAction.php:49`).
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/auth/register"
    body:
      name: "Uncovered binding customer {{stationId}}"
      email: "uncovered-{{stationId}}@onestoppay.dev"
      password: "E2eTestPass123!"
      password_confirmation: "E2eTestPass123!"
    expect_status: 201
    capture:
      customer_id: "user.id"
      customer_email: "user.email"
    creates:
      user: "user.email"

  # `user_id` IS REQUIRED — the wallet is keyed on that uuid, and `FundWalletStep` throws
  # without it (`FundWalletStep.ts:46-53`). No REST route credits a wallet, so this runs
  # SQL against the target's database directly; against the local stack that is a plain
  # `docker exec`, with no ssh hop, when `UAT_SSH_HOST` names a local host
  # (`uatPrivileged.ts:143-148`, `runUatSql` at `:193-195`).
  - action: fund_wallet
    user_id: "{{captured.customer_id}}"
    credits: 500

  # The customer's own bearer, captured rather than installed. `set_auth_token` would
  # replace the run's token for good and the admin assertion at the end of this file — a
  # tenant-scoped route — would then 403 as the customer. `headers:` is spread LAST into the
  # request (`ApiCallStep.ts:844-852`), so naming Authorization on the one step that must be
  # the customer overrides the context token for that step alone.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/auth/login"
    body:
      email: "{{captured.customer_email}}"
      password: "E2eTestPass123!"
    expect_status: 200
    capture:
      customer_token: "data.access_token"

  # ── THE REFUSAL ───────────────────────────────────────────────────────────────────────
  # NOT `background: true`, unlike every other start in this corpus. A start that SUCCEEDS
  # blocks on SessionReadySignal::wait until the station answers StartService over MQTT; a
  # refused one never dispatches — csms-server's own test asserts 0 commands published —
  # so it answers immediately and a backgrounded call would only defer the assertion.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    headers:
      Authorization: "Bearer {{captured.customer_token}}"
    body:
      bay_id: "{{captured.bayId_1}}"
      service_id: "svc_uncovered_{{stationId}}"
      duration_seconds: 60
    expect_status: 409
    expect_body:
      # FLAT, not wrapped. This route carries the `OsppErrorSurface` marker
      # (`routes/api/v1/sessions.php:36-37`), so the renderer takes the covered branch at
      # `bootstrap/app.php:353-359` and `OsppErrorObject::make` writes `errorCode` at the
      # top level (`OsppErrorObject.php:66`). The `{error: {...}}` shape is the UNCOVERED
      # fallback and does not apply here.
      errorCode: 3020
      errorText: "BINDING_UNCOVERED"
      # ALL FOUR MEMBERS THE REGISTRY ROW NAMES — `StartSessionAction.php:516-521`. The last
      # two are the point of the file: `RECOMMENDED_ACTION[3020]` tells an operator to
      # "Re-bind the service to one of `details.declaredPrograms`", so an answer that
      # omitted that list would be telling them to choose from a set nobody gave them, and
      # `errorCode` alone cannot see that.
      details.bayId: "{{captured.bayId_1}}"
      # THE `station_services` UUID, NOT the `svc_…` wire id this request sent. Measured on
      # the wire: the start body carries `service_id: svc_uncovered_<stationId>` (the shape
      # `StartSessionRequest::rules()` enforces with `regex:/^svc_[a-z0-9_]+$/`), and the
      # refusal answers `details.serviceId: 40e0f1da-…` — `$dto->serviceId` has been resolved
      # to the row id by the time the 3020 guard builds `details`
      # (`StartSessionAction.php:518`). So this is asserted against the id the creation step
      # captured, which is the same row. Asserting the wire id here passed review and failed
      # the wire, which is the whole reason this file had to be run.
      details.serviceId: "{{captured.station_service_id}}"
      details.programNumber: 2
      # Ascending, and pinned: `ServiceProgramResolver.php:79` orders by `program_number`,
      # and csms-server's `AnUncoveredBindingDoesNotStartTest.php:218` declares [3,1] in
      # its fixture precisely to hold that sort in place.
      details.declaredPrograms: [1]

  # NOTHING WAS STARTED, asserted from the server rather than inferred from the 409. The
  # refusal's own wording says the customer has not been charged "because nothing was
  # started"; a 409 that had nevertheless written a session row would satisfy every
  # assertion above.
  #
  # THE FILTER TAKES THE UUID, NOT THE WIRE ID. `SessionListRequest::rules()` validates
  # `station_id` as `uuid` (`:63`) and the controller compares it to `stations.id`
  # (`DashboardSessionController.php:58-60`), so `stn_…` here was a 422, not a filter. The
  # filter is KEPT rather than dropped: unfiltered, `data: []` would assert that the whole
  # organization has no sessions at all — a claim any other scenario's row falsifies, which
  # would make this step fail for a reason that has nothing to do with 3020.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/sessions?station_id={{captured.station_uuid}}"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    expect_status: 200
    expect_body:
      data: []
