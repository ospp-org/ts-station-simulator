# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
#
# SERVER BRANCH REACHED
#   csms-server app/Modules/Session/Handlers/MeterValuesHandler.php:112 — the SAME
#   single inequality the gap scenario reaches:
#       if ($lastSeq !== null && $dto->seqNo !== $lastSeq + 1)
#   plus the watermark rule immediately below it, which is the only thing that
#   behaves differently for a BACKWARDS seqNo:
#       // Advance the watermark on forward progress ONLY
#       if ($lastSeq === null || $dto->seqNo > $lastSeq) {
#           $sessionUpdates['last_seq_no'] = $dto->seqNo;
#       }
#
# WHY THIS IS A SECOND FILE AND NOT DECORATION — and where it stops being one
#   It is the same branch. csms-server does NOT distinguish a forward gap, a
#   backwards arrival and a replay: all three are "not last+1", they produce
#   byte-identical log lines apart from receivedSeqNo, and they set the same
#   latch. If the only thing this file did were re-take that branch, it would be
#   decoration and should not exist.
#
#   What it adds is an input class the gap file cannot produce, and one the
#   server treats differently three lines later: seqNo 1 arriving after 2 does
#   NOT move the watermark. That is observable through its consequence — the
#   frame is still ingested as a NEW row rather than deduplicated. Deduplication
#   is on (session_id, sampled_at), not on seqNo (MeterValueCollector.php:49 +
#   the DB UNIQUE at :65-66), so a repeated ordinal with a fresh timestamp is a
#   fourth billable reading. That is the fact worth pinning: an out-of-order
#   ordinal neither drops the frame nor collapses it into the earlier one.
#
#   The gap branch's own effect remains unobservable for the reason given in
#   meter-values-seqno-gap-still-ingested.yaml: requires_reconciliation is
#   write-only across the whole server.
#
# SEQUENCE PROVENANCE — same as the gap file. `station.sessions` is never
#   populated in scenario mode (StartServiceHandler is not registered;
#   ScenarioRunner.ts:765 registers only BootNotificationHandler(false)), so
#   SendStep::injectSeqNoFields returns early and the explicit `seqNo:` values
#   below are what reach the wire.
name: "MeterValues seqNo Out Of Order Still Ingested"
description: "Four MeterValues: 0, 1, 2, then 1 again with a later timestamp. The server must ingest the out-of-order frame as a new reading rather than dropping or deduplicating it."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay available, then a live session ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 600
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"

  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false

  # --- Frames 0, 1, 2 in order. No branch taken; watermark climbs to 2. ---
  - action: delay
    ms: 400

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-08-07T13:00:00.000Z"
      seqNo: 0
      values:
        liquidMl: 100
        energyWh: 10

  - action: delay
    ms: 400

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-08-07T13:00:30.000Z"
      seqNo: 1
      values:
        liquidMl: 200
        energyWh: 20

  - action: delay
    ms: 400

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-08-07T13:01:00.000Z"
      seqNo: 2
      values:
        liquidMl: 300
        energyWh: 30

  # --- The out-of-order frame: ordinal 1 arriving AFTER 2.
  #     `1 !== 3` trips the branch; `1 > 2` is false so the watermark stays at 2.
  #     The timestamp is later than every frame above, both because that is what
  #     "arrived out of order" means on the wire and because dedup is keyed on it
  #     — a repeated timestamp would be skipped as a duplicate and would prove
  #     the dedup rule instead of the ordering one. ---
  - action: delay
    ms: 400

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-08-07T13:01:30.000Z"
      seqNo: 1
      values:
        liquidMl: 400
        energyWh: 44

  - action: delay
    ms: 2000

  # THE ASSERTION. Four server-written meter_values rows, ordered by sampled_at.
  # Index 3 existing proves the out-of-order frame was neither dropped nor folded
  # into the earlier seqNo 1; `energy_wh: 44` is unique to it, so a dedup that
  # kept the original would leave index 3 absent and fail here.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"
      data.meter_values.0.energy_wh: 10
      data.meter_values.1.energy_wh: 20
      data.meter_values.2.energy_wh: 30
      data.meter_values.3.energy_wh: 44

  # --- Pool-hygiene teardown. (Class: session-leak.)
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "Local"
      actualDurationSeconds: 4
      creditsCharged: 7
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
