# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
#
# A REFUSED STOP ENDS NOTHING (the session-end rule, 2026-10-13).
#   A session is ended only by the station's end record - its SessionEnded, or the
#   StopService RESPONSE `Accepted` of a stop the server asked for - and a StopService
#   RESPONSE `Rejected`, with any code, is not one. The server leaves the session live,
#   `stopping`, and waits for the station's SessionEnded or, failing it, for the sweep
#   (booked end + 60 s, closed `completed`, charged in full, with the anomaly mark).
#
#   UNTIL THAT RULE THIS FILE PROVED THE OPPOSITE, and it is kept to prove the new one on
#   the same bytes. The refusal used to SETTLE the wash: csms-server
#   StopServiceResponseHandler completed it as a delivered session of its kind
#   (TerminalReason::StopRefusedWhileRunning) and journalled `settledAs` beside the
#   refusal; the 3006 sibling settled it as StationLostSession. Both settlements are
#   removed. What is left of the refusal on the server is its journal row.
#
# WHY 3007 SESSION_MISMATCH. It is one of the refusals `stop-service.md` §6 requires of a
# conforming station (r3: the sessionId names a session on another bay). The station in
# this file refused the stop and went on running the wash, which is what a station that
# was running it does: the refusal stopped nothing.
#
# WHAT A CONFORMING STATION SENDS NEXT, AND WHY THE BOOKING IS THE 60 s MINIMUM. The wash
# runs to its timer and the station ends it with SessionEnded `TimerExpired` - the end
# record the server waits for. The booking is the shortest StartSessionRequest admits
# (`duration_seconds` min:60), so the timer's end lands inside this file, a minute after
# the start. `TimerExpired` is "full booked duration delivered": the whole authorization
# is charged, 100 of 100 credits for 60 s at 100 credits/minute (`svc_wash_basic`, seeded
# PerMinute, uatPrivileged.ts DEFAULT_SEED_SERVICES), refund 0.
#
# THE THREE READS, AND WHAT EACH ONE RULES OUT.
#   1. `stopping` after the refusal: the session is live. A server that still settled a
#      refused stop would read `completed` here; one that dropped the stop would read
#      `active`.
#   2. The refusal's journal row WITHOUT `settledAs`: the refusal was recorded and chose
#      no settlement.
#   3. `completed` 100/0 within seconds of the SessionEnded, and no anomaly mark: the
#      station's end record settled it, by TimerExpired's row. A server that refused a
#      TimerExpired on a `stopping` session (csms-server SessionEndedHandler did, while the
#      stop was the settlement) would leave it `stopping` here, for the sweep to close a
#      minute later with the anomaly mark - the same 100/0, so the money alone could not
#      tell them apart; the timing and the mark do.
#
# NEITHER ASSERTED NUMBER IS ECHOED FROM THIS FILE. The SessionEnded carries the station's
# advisory `creditsCharged`; the server settles from its own tariff (session-ended.md §5
# rule 5), and `refund_amount` is derived (SessionResource).
#
# HONESTY ABOUT WHAT IS PROVEN. The station in scenario mode is a byte source: it is
# scripted to refuse, not deciding to. This file is a proof about the SERVER's handling.
#
# NEEDS THE SERVER OF THE SESSION-END RULE. Against csms-server f413256f and earlier the
# refusal settles the session and read 1 fails.
name: "Stop Service Refused While Running - full delivery billed"
description: "Server dispatches StopService for an active session; the station refuses with 3007 SESSION_MISMATCH and runs the wash to its timer. The refusal ends nothing - the session stays stopping, the journal records the refusal with no settlement - and the station's SessionEnded TimerExpired settles it: the whole booking billed, nothing refunded, no anomaly."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  # --- Start a real, funded session: 60s at 100 cr/min = 100 authorized ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 60
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"

  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false

  # The StartService Response is processed asynchronously, so the session is read ACTIVE
  # before the stop is asked for: a stop against a session still `authorized` is a
  # different path.
  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"
      data.credits_authorized: 100

  # --- Operator asks for the stop. The server answers 200 and publishes StopService. ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}/stop"
    expect_status: 200

  - action: wait_for
    message: StopService
    messageType: Request
    timeout_ms: 15000

  # --- THE REFUSAL. Schema-required for a Rejected stop: errorCode AND errorText
  #     (stop-service-response.schema.json allOf[1]). ---
  - action: send
    message: StopService
    messageType: Response
    payload:
      status: "Rejected"
      errorCode: 3007
      errorText: "SESSION_MISMATCH"

  - action: delay
    ms: 2000

  # READ 1 - the refusal ended nothing. `stopping` is the state the stop request put the
  # session in, and nothing has taken it out: no settlement, no failure, no return to
  # `active`.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "stopping"

  # READ 2 - the refusal is on the record, and it chose no settlement. The row is written
  # by the server from this file's 3007; `settledAs` was the rule it settled the wash by,
  # and there is no rule to name any more.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/journal?kind=command_refused"
    expect_status: 200
    expect_body:
      data[kind=command_refused].effectedBy: "Station"
      data[kind=command_refused].details.action: "StopService"
      data[kind=command_refused].details.errorCode: 3007
    expect_body_absent:
      - "data[kind=command_refused].details.settledAs"

  # --- The wash runs on to its timer: the rest of the booked minute. ---
  - action: delay
    ms: 52000

  # --- THE END RECORD. The station's timer ran out: the whole booking delivered. ---
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "TimerExpired"
      actualDurationSeconds: 60
      creditsCharged: 100

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Finishing"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: false
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Finishing"
      programs:
        - programNumber: 1
          available: true

  - action: delay
    ms: 2000

  # READ 3 - the station's record settled it, by TimerExpired's row.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "completed"
      data.credits_charged: 100
      data.refund_amount: 0

  # And not the sweep: a sweep close carries `full_delivery_no_session_ended`, an end
  # record's settlement carries no mark (the station's sessions list serves `anomaly`).
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/sessions"
    expect_status: 200
    expect_body:
      data[sessionId={{captured.sessionId}}].status: "completed"
      data[sessionId={{captured.sessionId}}].anomaly: null
