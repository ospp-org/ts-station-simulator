# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/sessions/session-fault-during-service.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Session Fault During Service"
description: "Hardware fault occurs during an active session. Station sends SessionEnded with reason Fault, creditsCharged 0, and transitions bay to Faulted."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # --- Trigger StartService via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"
      serviceId: "payload.serviceId"

  # --- Accept StartService ---
  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  # --- StatusNotification Occupied ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  # --- Simulate service running briefly before fault ---
  - action: delay
    ms: 1000

  # --- SessionEnded - Fault ---
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "Fault"
      actualDurationSeconds: 1
      creditsCharged: 0

  # --- StatusNotification Faulted ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Faulted"
      previousStatus: "Occupied"
      errorCode: 5001
      errorText: "PUMP_SYSTEM"
      programs:
        - programNumber: 1
          available: false

  # THE ASSERTION. Fault is the only settlement arm that lands in a DIFFERENT
  # terminal STATE, and that is what separates it from its siblings.
  #
  #   status failed        — not `completed`. SessionEndedHandler:95-102 forks Fault
  #                          to TerminalReason::Fault down the fail path, while
  #                          LocalOutOfCredit reaches the same credits_charged 0 via
  #                          `completed`. Without this field the two are identical
  #                          on the wire; with it they are unambiguous.
  #   credits_charged 0    — Fault carries the low-delivery floor
  #                          (TerminalReason::appliesLowDeliveryFloor():100 lists
  #                          Fault, BayFault, ForceFailedReboot and nothing else).
  #                          1 delivered second out of 300 is below the floor, so
  #                          the pro-rata bill collapses to a full refund. The
  #                          identical-input sibling session-stop-local, whose
  #                          VoluntaryStop does NOT carry the floor, is charged 4
  #                          for 2 seconds — same strategy, same tariff, different
  #                          floor, visibly different money.
  #   fail_reason          — server-composed, not echoed: the station sends
  #                          `reason: "Fault"`, and the string persisted is
  #                          "SessionEnded: hardware fault".
  #
  # NOT asserted: fail_error_code. It is null here — present in the body because
  # SessionResource:64-67 wraps it in $this->when(status === FAILED) and the status
  # IS failed, but carrying no value, because this fail path sets a reason string
  # and no code. Asserting null would pass; it would just assert nothing about the
  # fault. Measured on UAT 2026-08-10.
  - action: delay
    ms: 1000

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "failed"
      data.credits_charged: 0
      data.refund_amount: 500
      data.fail_reason: "SessionEnded: hardware fault"
