# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
#
# A STATION THAT SAYS IT HAS NO SUCH SESSION SENDS NO END RECORD, SO ONLY THE SWEEP CAN
# CLOSE IT (the session-end rule, 2026-10-13).
#
#   3006 SESSION_NOT_FOUND: the station holds no record of a session the server took money
#   for. Under the rule a StopService RESPONSE `Rejected` ends nothing, whatever the code:
#   the session stays `stopping`, and waits for the station's SessionEnded or the sweep.
#   This station has said it holds no session, so no SessionEnded will come: the sweep is
#   the only thing that will ever close it. The sweep closes a session that has had no
#   end record by the end of its booked duration plus a 60 s margin
#   (`active_sweep_grace_seconds`, config/ospp.php) `completed`, charged IN FULL, with the
#   anomaly mark `full_delivery_no_session_ended` - "the station runs a started service to
#   its end" is the presumption, and the mark is what tells an operator nobody confirmed it.
#
#   UNTIL THAT RULE THE REFUSAL SETTLED IT, THE OTHER WAY. csms-server settled a 3006 at once
#   as TerminalReason::StationLostSession - unconfirmed delivery, pro-rata on the server's
#   own clock for UserDuration, a full refund for the all-or-nothing kinds - and journalled
#   `settledAs: StationLostSession`. Both are removed with the refused-stop settlements.
#   The money moves: a full charge with the mark, where the refusal used to charge the
#   seconds that had run. That is the rule's answer for a session with no end record
#   (Gabi, 2026-10-13), not a defect of this file.
#
# WHY THE BOOKING IS 60 s AND THE FILE WAITS UP TO FOUR MINUTES. 60 s is the shortest
# booking StartSessionRequest admits (`duration_seconds` min:60). The session is due to
# the sweep 60 s after its booked end, and `session:check-timeouts` runs every minute
# (routes/console.php) under `withoutOverlapping(10)`: so the close lands 120-180 s after
# the start, later if a tick is skipped under load. The poll below reads every 5 s for up
# to 240 s, so the common case returns as soon as the sweep has run, and the budget
# declared below covers the worst case. The station keeps heartbeating through the wait,
# so the station is connected and the grace period for an away station does not apply.
#
# THE READS. `stopping` after the refusal (not settled, not failed); the refusal's journal
# row with no `settledAs`; `completed` with the whole authorization charged; and the
# anomaly mark on the station's sessions list - which tells the sweep's close from an end
# record's. The credits are deterministic now: a full charge is the authorization, 100
# for 60 s at 100 credits/minute (`svc_wash_basic`, seeded PerMinute), not the elapsed-time
# pro-rata the old arm made unassertable.
#
# HONESTY. The station is scripted, not deciding. This proves the SERVER's handling.
#
# NEEDS THE SERVER OF THE SESSION-END RULE, and its scheduler (`schedule:work` on UAT).
# Against csms-server f413256f and earlier the refusal settles the session at once and
# the `stopping` read fails.
scenario_timeout_ms: 300000
name: "Stop Service Refused - Session Not Found desync"
description: "Server dispatches StopService for an active session; the station answers 3006 SESSION_NOT_FOUND, meaning it holds no such session, so no end record will come. The refusal ends nothing - the session stays stopping - and the sweep closes it after its booked end: completed, charged in full, marked full_delivery_no_session_ended."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Bay Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  # --- A real, funded session the server believes in: 60s at 100 cr/min = 100 ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 60
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"

  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false

  # The StartService Response is processed asynchronously: read the session ACTIVE before
  # the stop is asked for.
  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "active"
      data.credits_authorized: 100

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}/stop"
    expect_status: 200

  - action: wait_for
    message: StopService
    messageType: Request
    timeout_ms: 15000

  # --- THE REFUSAL. The station denies ever having had this session. ---
  - action: send
    message: StopService
    messageType: Response
    payload:
      status: "Rejected"
      errorCode: 3006
      errorText: "SESSION_NOT_FOUND"

  - action: delay
    ms: 2000

  # READ 1 - the refusal ended nothing. While it settled the wash, this read was `completed`.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "stopping"

  # READ 2 - the refusal is on the record, from this file's 3006, and chose no settlement:
  # `settledAs: StationLostSession` was the rule it used to settle by.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/journal?kind=command_refused"
    expect_status: 200
    expect_body:
      data[kind=command_refused].effectedBy: "Station"
      data[kind=command_refused].details.action: "StopService"
      data[kind=command_refused].details.errorCode: 3006
    expect_body_absent:
      - "data[kind=command_refused].details.settledAs"

  # READ 3 - THE SWEEP. No end record is coming; the session is closed when its booked end
  # plus the margin has passed: `completed`, the whole 100 charged, nothing refunded.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "completed"
      data.credits_charged: 100
      data.refund_amount: 0
    poll:
      timeout_ms: 240000
      interval_ms: 5000

  # And it is the sweep's close, not an end record's: the anomaly mark, served on the
  # station's sessions list.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/sessions"
    expect_status: 200
    expect_body:
      data[sessionId={{captured.sessionId}}].status: "completed"
      data[sessionId={{captured.sessionId}}].anomaly: "full_delivery_no_session_ended"

  # --- Pool hygiene: the session is closed; give the bay back. ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Finishing"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: false
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Finishing"
      programs:
        - programNumber: 1
          available: true
