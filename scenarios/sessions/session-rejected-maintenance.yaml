# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/sessions/session-rejected-maintenance.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Session Rejected - Bay Maintenance"
description: "Bay enters maintenance mode (Unavailable), then trigger StartService via API. Station rejects with error 3011 BAY_MAINTENANCE."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # THE SAME FACT, READ OFF THE WIRE INSTEAD OF OFF THE ROUTER BUFFER.
  #
  # The assertion above reads `context.receivedMessages` — what MessageRouter
  # ACCEPTED. The three below read the frame journal, which records at the
  # MqttConnection chokepoints, in FRONT of the router's parse, MAC and schema
  # gates. Both forms are kept deliberately: they draw the same conclusion from two
  # independent sources, so a disagreement between them turns this file red rather
  # than being invisible. That is the point of the pair, and it is why the old form
  # is not simply replaced.
  #
  # The two sources are NOT interchangeable, which is what makes the journal worth
  # having: a frame the router refuses is absent from `receivedMessages` entirely, so
  # the old form cannot distinguish "the server never answered" from "the server
  # answered and this station rejected it". The journal can.
  - action: assert
    field: "journal.in[action=BootNotification].envelope.payload.status"
    equals: "Accepted"

  # The round trip itself, in both directions — the denominator the assertion above
  # is read against. Without it, a path that silently resolved to undefined would be
  # indistinguishable from a matching value.
  - action: assert
    field: "journal.counts.out.BootNotification"
    equals: 1

  - action: assert
    field: "journal.counts.in.BootNotification"
    equals: 1

  # --- Bay enters Unavailable (maintenance) ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Unavailable"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  # --- Trigger StartService on maintenance bay via API ---
  # FOREGROUND deliberately — the rejection is pre-dispatch, so there is no
  # station Response for a background call to overlap with, and background mode
  # downgrades an expect_status mismatch to a console.warn.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 409
    # The status alone could NOT tell this scenario apart from its own
    # precondition failing. SessionStateMachine.php:74-81 maps UNAVAILABLE to
    # 3011 BAY_MAINTENANCE but UNKNOWN to 3002 BAY_NOT_READY — and both are 409.
    # So before the services[]->programs[] fix, when the Unavailable report was
    # schema-rejected and the bay stayed `unknown`, this scenario got its 409
    # from 3002 and passed while proving nothing about maintenance.
    # 3011 is reachable ONLY from UNAVAILABLE, so pinning it proves the report
    # landed AND that maintenance is what refused the start.
    expect_body:
      errorCode: 3011
  # Per C-008: server returns 409 BAY_MAINTENANCE pre-MQTT-dispatch; no
  # StartService Request is published.
