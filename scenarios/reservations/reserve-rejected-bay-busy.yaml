# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/reservations/reserve-rejected-bay-busy.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Reserve Rejected - Bay Busy"
description: "Attempt to reserve an occupied bay: the SERVER refuses the REST request with 409 + error.ospp_code 3001 BAY_BUSY. Despite what this description used to claim, no ReserveBay is put on the wire and the STATION is never asked."
# THE ACTOR NAMED HERE WAS WRONG UNTIL 2026-08-26, and the correction is the point of this
# comment rather than a tidy-up. The description said "verifies the STATION rejects with
# errorCode NNNN". It does not: what is asserted is the SERVER refusing a REST request, and
# the code is read off `error.ospp_code`, not off a wire payload.
#
# WHY IT MATTERED. `ReserveBay` has six codes the station may answer with
# (ErrorCodeRegistry.php:251-258) and the corpus exercises ZERO of them — every ReserveBay
# response in the corpus is `Accepted`. Three files whose names and descriptions said
# "the station rejects" made that empty area look covered, and `SCENARIOS.md` propagated it
# by listing `reserve-rejected-*` under `ReserveBay | Server->Station`.
#
# The scenarios themselves are good and are unchanged. Only the sentence describing them is,
# and the precedent is in this same directory: `reserve-cancel.yaml` was rewritten the same
# way — "despite what this description used to claim, the bay side is not verified here".
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # Trigger StartService to occupy the bay first
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"

  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      programs:
        - programNumber: 1
          available: false
  # Trigger ReserveBay on the same occupied bay - should be rejected.
  # Server propagates the station's Rejected MQTT Response as HTTP 422.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/reservations"
    body:
      bay_id: "{{bayId_1}}"
      duration_minutes: 5
      session_source: "MobileApp"
    expect_status: 409
    # The 409 alone cannot tell "the bay is busy" from "the bay never reported".
    # Four codes share 409 on this endpoint (ErrorCodeRegistry.php:107-111), and
    # the bay column defaults to 'unknown' (create_bays_table:18), which maps to
    # 3002 BAY_NOT_READY — also 409. This scenario's whole precondition is the
    # `Occupied` report above; without pinning the code, that report could fail
    # to land and the scenario would still pass.
    #
    # 3001 is reachable ONLY from BayStatus::OCCUPIED
    # (ReservationTransitions.php:55), so it proves the StartService round trip
    # completed AND that occupancy is what refused the reservation.
    expect_body:
      error.ospp_code: 3001
  # Per C-012: server returns 409 (resource state conflict) pre-MQTT-dispatch;
  # no ReserveBay Request is published. The 409 is the final assertion.

  # --- Pool-hygiene teardown: end the session this scenario started so the reused
  #     pooled station is returned clean. Appended after all assertions — does not
  #     change what the scenario tests. (Class: session-leak.)
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "Local"
      actualDurationSeconds: 1
      creditsCharged: 0
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
