# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/reservations/reserve-expire.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Reserve and Expire"
description: >
  Reserve a bay, let the TTL genuinely expire, and read the expiry back off the server.
  NOTE what is still not proven: the "Available" StatusNotification after the delay is sent
  BY THIS SCENARIO, not observed from the server, so this file does not verify that the bay
  auto-returns to Available — it asserts its own message. What IS now proven is the
  reservation's own terminal state, which is server-derived.
# 180s, raised from the 90s DEFAULT_SCENARIO_TIMEOUT_MS (ScenarioRunner.ts:44).
#
# This scenario is SLOW BY CONSTRUCTION and cannot be made fast. The floor is
# ReservationTransitions::MIN_TTL_MINUTES = 1, so the earliest any reservation can
# expire is creation + 60s. Expiry is not evaluated on read — it is a scheduled
# sweep, `Schedule::command('reservation:check-expiry')->everyMinute()`
# (routes/console.php:69) — so the row flips on the first tick strictly AFTER the
# expiration time, i.e. somewhere in creation+60s .. creation+120s. The 130s delay
# below is the worst case plus margin.
#
# The old file delayed 5000ms and called that "waits for that expiration". It could
# not have: at T+5s a 1-minute reservation has 55 seconds left. Nothing was expiring,
# and nothing was read back, so the file passed while its central claim was false.
scenario_timeout_ms: 180000
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # Trigger ReserveBay via CSMS API
  # Note: duration_minutes is the minimum (1) so the reservation expires
  # quickly. The delay below waits for that expiration.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/reservations"
    body:
      bay_id: "{{bayId_1}}"
      duration_minutes: 1
      session_source: "MobileApp"
    expect_status: 201

  - action: wait_for
    message: ReserveBay
    messageType: Request
    timeout_ms: 15000
    capture:
      reservationId: "payload.reservationId"
      bayId: "payload.bayId"

  - action: send
    message: ReserveBay
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Reserved"
      programs:
        - programNumber: 1
          available: true
  # Wait for the reservation to actually expire. See the scenario_timeout_ms note
  # at the top for why this is 130s and not 5s: TTL floor 60s + a sweep that runs
  # everyMinute means the flip lands in the 60-120s band after creation.
  - action: delay
    ms: 130000

  # THE ASSERTION, and the whole point of the wait. Both fields are server-written
  # by a path this scenario never touches — no API call, no MQTT message, nothing
  # in this file causes the transition. The scheduler does, on its own clock.
  #
  #   data.status       — reservations.status, set to EXPIRED by
  #                       ExpireReservationAction:50-51. Nothing this scenario
  #                       sends can produce it.
  #   data.cancelled_at — the DISCRIMINATOR, mirroring reserve-cancel.yaml.
  #                       `expired` and `cancelled` are both terminal states
  #                       reached by a background path. cancelled_at is written
  #                       ONLY by CancelReservationAction:81-83, so asserting it
  #                       is null proves this row reached its terminal state by
  #                       TTL EXPIRY and not by cancellation. Without it, a file
  #                       asserting only `status` would be one careless edit away
  #                       from being satisfied by the wrong terminal path.
  #
  # null is expressible here because ReservationResource:37-38 emits both
  # timestamps UNCONDITIONALLY — the key is always present, carrying JSON null.
  # Contrast `time_remaining_seconds`, wrapped in $this->when(CONFIRMED): on an
  # expired reservation that key is genuinely ABSENT, and expect_body cannot
  # express absence (an unmatched path yields undefined, which never equals null).
  # So its disappearance is NOT asserted, though it is a real consequence of the
  # transition.
  #
  # If this file ever fails on `status` while the reservation looks correct in the
  # database, suspect the scheduler before the scenario: `schedule:work` must be
  # running in csms-app-uat for the sweep to fire at all. Verified running
  # 2026-08-10, and 8 rows on UAT have reached `expired`, so the path is live.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/reservations/{{captured.reservationId}}"
    expect_status: 200
    expect_body:
      data.status: "expired"
      data.cancelled_at: null

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
