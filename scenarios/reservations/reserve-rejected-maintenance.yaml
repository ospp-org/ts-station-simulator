# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/reservations/reserve-rejected-maintenance.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Reserve Rejected - Bay Maintenance"
description: "Attempt to reserve a bay in maintenance mode - verifies the station rejects with errorCode 3011 BAY_MAINTENANCE."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Unavailable"
      programs:
        - programNumber: 1
          available: false
  # Trigger ReserveBay on a bay in maintenance - should be rejected.
  # Server propagates the station's Rejected MQTT Response as HTTP 422.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/reservations"
    body:
      bay_id: "{{bayId_1}}"
      duration_minutes: 5
      session_source: "MobileApp"
    expect_status: 409
    # This is the file in the triplet where the bare 409 was actively misleading,
    # and its sessions/ sibling (session-rejected-maintenance.yaml) already
    # documented and fixed the identical hole for itself.
    #
    # ReservationTransitions.php:58 maps UNAVAILABLE to 3011 BAY_MAINTENANCE,
    # but :59 maps UNKNOWN to 3002 BAY_NOT_READY — and ErrorCodeRegistry.php:107-108
    # renders BOTH as 409. A bay the server has never heard a status for sits at
    # 'unknown' by column default (create_bays_table:18). So if the `Unavailable`
    # report above were schema-rejected, this scenario took its 409 from 3002, on
    # a bay that was never in maintenance, and passed while proving the opposite
    # of its own name.
    #
    # 3011 is reachable ONLY from UNAVAILABLE, so pinning it proves the
    # maintenance report landed AND that maintenance is what refused the reserve.
    expect_body:
      error.ospp_code: 3011
  # Per C-013: server returns 409 (resource state conflict) pre-MQTT-dispatch;
  # no ReserveBay Request is published. The 409 is the final assertion.
