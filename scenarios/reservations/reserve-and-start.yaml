# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{bayId_2}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/reservations/reserve-and-start.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var bayId_2=bay_realbay002 \
#     --var serviceId_1=svc_wash_basic
name: "Reserve and Start"
description: "Reserve a bay, then start a session with matching reservationId - verifies the full reservation-to-session flow."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_2}}"
      bayNumber: 2
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # Trigger ReserveBay via CSMS API
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/reservations"
    body:
      bay_id: "{{bayId_1}}"
      duration_minutes: 5
      session_source: "MobileApp"
    expect_status: 201

  - action: wait_for
    message: ReserveBay
    messageType: Request
    timeout_ms: 15000
    capture:
      reservationId: "payload.reservationId"
      bayId: "payload.bayId"

  - action: send
    message: ReserveBay
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Reserved"
      programs:
        - programNumber: 1
          available: true
  # Trigger StartService with reservationId via CSMS API
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
      reservation_id: "{{captured.reservationId}}"
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"

  - action: assert
    field: "payload.reservationId"
    equals: "{{captured.reservationId}}"

  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      programs:
        - programNumber: 1
          available: false
  # --- Pool-hygiene teardown: end the session this scenario started so the reused
  #     pooled station is returned clean. Appended after all assertions — does not
  #     change what the scenario tests. (Class: session-leak.)
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "Local"
      actualDurationSeconds: 1
      creditsCharged: 0
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true

  - action: delay
    ms: 1000

  # THE ASSERTION — on the RESERVATION, because that is what this file adds.
  #
  # It ends with reason Local, so its settlement is the pro-rata arm already
  # asserted once in session-stop-local; restating it here would be a sixth copy
  # of the same rule. What is specific to reserve-and-start is the CONVERSION —
  # it is one of only two files that start a session from a reservation.
  #
  # data.converted_session_id resolves the stored uuid back to the PUBLIC session
  # id (ReservationResource:41-44 via resolveSessionPublicId), which is exactly
  # what this scenario captured off the StartService Request. Matching them proves
  # the server bound THIS session to THIS reservation — not merely that some
  # conversion happened.
  #
  # data.status active is the terminal reservation state, distinguishing a
  # converted reservation from one that expired or was cancelled — the two arms
  # its siblings reserve-expire and reserve-cancel assert.
  #
  # WHY THIS IS WORTH HAVING TWICE. session-with-reservation asserts the same
  # pair, and both matter: ConvertReservationAction had ZERO CALLERS until
  # csms-server b68b396, and the live harm was that reservation:check-expiry
  # expired reservations out from under running sessions every minute. Two
  # independent files now fail if that regresses, on a path where the failure is
  # silent — a reservation quietly expiring under a live wash produces no error
  # anywhere.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/reservations/{{captured.reservationId}}"
    expect_status: 200
    expect_body:
      data.status: "active"
      data.converted_session_id: "{{captured.sessionId}}"
