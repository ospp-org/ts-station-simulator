# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/reservations/reserve-rejected-already-reserved.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Reserve Rejected - Already Reserved"
description: "Reserve a bay, then attempt to reserve it again: the SERVER refuses the second REST request with 409 + error.ospp_code 3014 BAY_RESERVED. The FIRST reservation does go on the wire and the station ACCEPTS it; the station never refuses anything here, despite what this description used to claim."
# THE ACTOR NAMED HERE WAS WRONG UNTIL 2026-08-26, and the correction is the point of this
# comment rather than a tidy-up. The description said "verifies the STATION rejects with
# errorCode NNNN". It does not: what is asserted is the SERVER refusing a REST request, and
# the code is read off `error.ospp_code`, not off a wire payload.
#
# WHY IT MATTERED. `ReserveBay` has six codes the station may answer with
# (ErrorCodeRegistry.php:251-258) and the corpus exercises ZERO of them — every ReserveBay
# response in the corpus is `Accepted`. Three files whose names and descriptions said
# "the station rejects" made that empty area look covered, and `SCENARIOS.md` propagated it
# by listing `reserve-rejected-*` under `ReserveBay | Server->Station`.
#
# The scenarios themselves are good and are unchanged. Only the sentence describing them is,
# and the precedent is in this same directory: `reserve-cancel.yaml` was rewritten the same
# way — "despite what this description used to claim, the bay side is not verified here".
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # First ReserveBay - should succeed
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/reservations"
    body:
      bay_id: "{{bayId_1}}"
      duration_minutes: 5
      session_source: "MobileApp"
    expect_status: 201

  - action: wait_for
    message: ReserveBay
    messageType: Request
    timeout_ms: 15000
    capture:
      reservationId: "payload.reservationId"
      bayId: "payload.bayId"

  - action: send
    message: ReserveBay
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Reserved"
      programs:
        - programNumber: 1
          available: true
  # Second ReserveBay on the same bay - should be rejected.
  # Server propagates the station's Rejected MQTT Response as HTTP 422.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/reservations"
    body:
      bay_id: "{{bayId_1}}"
      duration_minutes: 5
      session_source: "MobileApp"
    expect_status: 409
    # The 409 alone does NOT name this scenario. FOUR codes share it on this
    # endpoint — ErrorCodeRegistry.php:107-111 puts BAY_NOT_READY and
    # BAY_MAINTENANCE in the same 409 family the vendor already gives BAY_BUSY
    # and BAY_RESERVED. So a bare 409 passes whether the bay is Reserved,
    # Occupied, Faulted, Finishing, in maintenance, or simply never reported.
    #
    # That last one is the live hazard here, not a hypothetical: the bay column
    # defaults to 'unknown' (create_bays_table:18), and UNKNOWN maps to 3002
    # BAY_NOT_READY — also 409. If the `Reserved` StatusNotification above were
    # schema-rejected, a bare-409 assertion would still pass, from a bay the
    # server has no status for, and would prove nothing about double-reservation.
    #
    # ── AND 3014 IS NO LONGER ENOUGH EITHER, 2026-08-30 ────────────────────────
    # This comment used to close with "3014 is reachable ONLY from RESERVED", on
    # the premise that "there is NO 'does this bay already have a reservation
    # row?' guard in this path: ReservationRepository::findActiveOnBay() exists
    # and is never called, and the reservations table has no unique constraint on
    # bay_id."
    #
    # BOTH HALVES OF THAT PREMISE ARE NOW FALSE, and neither died in the change
    # this file was last read for:
    #
    #   - `findActiveOnBay()` IS called — inside createClaimingBay's transaction,
    #     under a `lockForUpdate()` on the bay row (ReservationRepository:99-107),
    #     answering 3014 with `details.reason: live_reservation_row`;
    #   - the unique constraint EXISTS — `idx_reservations_one_live_per_bay`,
    #     migration 2026_08_12_000001 — and its 23505 is caught and re-answered as
    #     the same 3014 (ReservationRepository:143-149).
    #
    # So 3014 now has THREE emission sites and TWO meanings, and the ordering is
    # what decides which one this step meets: the `bays.status` branch runs first
    # (ReserveBayAction:117-133), so the `Reserved` report above still answers.
    # That is precisely the shape that makes a proof go VACUOUS rather than red —
    # the report could stop landing and the 409/3014 would arrive anyway, from the
    # reservations table, with nothing to say so.
    #
    # `bay_already_reserved` is written at exactly one site
    # (ReservationStateMachine::REFUSAL_REASONS['reserved']) and is reached only
    # from `bays.status`. Pinning it beside the code proves the report landed AND
    # that the STATION'S REPORT is what refused this one — which is what this
    # file's name claims and what the code alone stopped being able to show.
    expect_body:
      error.ospp_code: 3014
      error.details.reason: "bay_already_reserved"
  # Per C-011: server returns 409 (resource state conflict) pre-MQTT-dispatch;
  # no ReserveBay Request is published. The 409 above is the final ASSERTION.
  #
  # --- Everything below is CLEANUP, and it is not optional ---
  #
  # This file's subject requires leaving a bay RESERVED, and its first reservation runs for
  # `duration_minutes: 5`. Nothing here used to release it, so for five minutes afterwards the
  # bay stayed reserved — and in a pooled run the bays are SHARED. `sessions/session-with-
  # reservation` drew the same bay and was refused `409 BAY_RESERVED/3014` at its own
  # `POST /reservations`, reproducing across runs as a standing failure that belonged to this
  # file rather than to that one. A scenario must not leave state it does not own behind, and
  # a 5-minute TTL is not cleanup — it is a race the next scenario loses.
  #
  # The sequence mirrors `reservations/reserve-cancel.yaml` exactly, including answering the
  # CancelReservation Request: the server publishes one and a cancel left unanswered is a
  # different kind of residue from the one being removed.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/reservations/{{captured.reservationId}}/cancel"
    expect_status: 200

  - action: wait_for
    message: CancelReservation
    messageType: Request
    timeout_ms: 15000

  - action: send
    message: CancelReservation
    messageType: Response
    payload:
      status: "Accepted"

  # Returns the bay to Available for whoever draws it next. Note this is a report this
  # scenario SENDS, not an observation — the same honesty `reserve-cancel.yaml` states about
  # its own copy of this step.
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
