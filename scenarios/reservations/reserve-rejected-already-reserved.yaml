# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}, {{bayId_1}}, {{serviceId_1}}
# Example — bind to real CSMS state for Phase 3/4 coverage:
#   simulator run --scenario scenarios/reservations/reserve-rejected-already-reserved.yaml --target uat \
#     --station stn_realstation \
#     --var bayId_1=bay_realbay001 --var serviceId_1=svc_wash_basic
name: "Reserve Rejected - Already Reserved"
description: "Attempt to reserve a bay that is already reserved - verifies the station rejects with errorCode 3014 BAY_RESERVED."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [100, 300]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # First ReserveBay - should succeed
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/reservations"
    body:
      bay_id: "{{bayId_1}}"
      duration_minutes: 5
      session_source: "MobileApp"
    expect_status: 201

  - action: wait_for
    message: ReserveBay
    messageType: Request
    timeout_ms: 15000
    capture:
      reservationId: "payload.reservationId"
      bayId: "payload.bayId"

  - action: send
    message: ReserveBay
    messageType: Response
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Reserved"
      programs:
        - programNumber: 1
          available: true
  # Second ReserveBay on the same bay - should be rejected.
  # Server propagates the station's Rejected MQTT Response as HTTP 422.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/reservations"
    body:
      bay_id: "{{bayId_1}}"
      duration_minutes: 5
      session_source: "MobileApp"
    expect_status: 409
    # The 409 alone does NOT name this scenario. FOUR codes share it on this
    # endpoint — ErrorCodeRegistry.php:107-111 puts BAY_NOT_READY and
    # BAY_MAINTENANCE in the same 409 family the vendor already gives BAY_BUSY
    # and BAY_RESERVED. So a bare 409 passes whether the bay is Reserved,
    # Occupied, Faulted, Finishing, in maintenance, or simply never reported.
    #
    # That last one is the live hazard here, not a hypothetical. There is NO
    # "does this bay already have a reservation row?" guard in this path:
    # ReservationRepository::findActiveOnBay() exists and is never called, and
    # the reservations table has no unique constraint on bay_id. "Already
    # reserved" is represented ONLY as bay.status = RESERVED
    # (ReserveBayAction.php:56-66 -> ReservationTransitions.php:54). The bay
    # column defaults to 'unknown' (create_bays_table:18), and UNKNOWN maps to
    # 3002 BAY_NOT_READY — also 409.
    #
    # So if the `Reserved` StatusNotification above were schema-rejected, this
    # scenario would still get its 409, from a bay the server has no status for,
    # and would prove nothing about double-reservation. 3014 is reachable ONLY
    # from RESERVED, so pinning it proves the report landed AND that the prior
    # reservation is what refused this one.
    expect_body:
      error.ospp_code: 3014
  # Per C-011: server returns 409 (resource state conflict) pre-MQTT-dispatch;
  # no ReserveBay Request is published. The 409 is the final assertion.
