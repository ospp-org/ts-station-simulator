name: "SecurityEvent: TamperDetected"
description: >
  Report a physical tamper detection event and prove the server INGESTED and PERSISTED it,
  by reading it back off GET /api/v1/admin/security/events scoped to this station.
  Until 2026-08-10 this file asserted only that its BootNotification was Accepted, and its
  eventId was the literal sec_00000004 — already in security_events since 2026-06-15 and
  therefore deduped on every run since (SecurityAuditLogger.php:67 does
  INSERT INTO security_event_dedup ... ON CONFLICT (event_id) DO NOTHING, and skips the
  security_events insert on conflict). So for nearly two months the send wrote NOTHING and
  the file passed anyway. The id is now generated per run.

# WHAT THE ASSERTION IS AND IS NOT WORTH
#   eventId  — server-produced in the sense that it PROVES INGESTION: the row only exists
#              if the dedup insert won and the security_events insert followed. This is the
#              load-bearing part.
#   type / severity — ECHOED, not derived. SecurityEventHandler.php:41-43 takes both straight
#              off the payload ($severity = $payload['severity'] ?? Info), and an unknown
#              severity is only WARNED about (:65-71), never corrected. So asserting them
#              proves round-trip persistence, not server judgement. Said plainly here so the
#              assertion is not read as stronger than it is.
#   NOTE the case: the wire enum is Critical|Error|Warning|Info but the column stores
#              lowercase, and the endpoint returns the column verbatim
#              (DashboardSecurityController:94). Asserting "Critical" fails; it is "critical".
#   station scoping — ?station_id= takes the station UUID, not the stn_ id, hence the capture
#              below. It narrows the read to this station; it does NOT make the station's
#              event set a singleton, and the assertion must not assume that it does.
#
# WHY NOT data.length / data.0 — THE DEFECT THESE ELEVEN FILES CARRIED UNTIL 2026-08-12.
#   They asserted `data.length: 1` plus positional `data.0.*`, which says "this station has
#   had exactly one security event, ever". That is true only of a station no other scenario
#   has touched. StationPoolAllocator is pure mutual exclusion and does NOT reset station
#   state on release (RUNNING-AGAINST-UAT.md §5), so in a pooled run every scenario after the
#   first to land on a station inherits its neighbours' events, and the length line goes red
#   against a CORRECT server. Five stations, eleven scenarios: five find a fresh station, six
#   do not — which is exactly the six that failed.
#   `data.0` was the quieter half and did NOT fail: the endpoint sorts created_at DESC by
#   default (DashboardSecurityController:80-87), so this run's row — the newest — happened to
#   land at index 0. An assertion that holds by ordering luck is not a milder version of the
#   right one; it is the mistake the array selector was built to retire (ApiCallStep.ts:215-227,
#   which names asserting on "the most recent" row as the same class as asserting on index 0).
#   The read is now addressed by CONTENT — data[eventId=<the id this run sent>] — which needs
#   no exclusivity, no ordering and no count. It required teaching the runner to substitute
#   templates in mapping KEYS, not just values (ScenarioRunner.ts); until then a selector
#   could not carry a per-run id at all.
#
# WHAT DROPPING data.length COST, HONESTLY: nothing in addition. The length pinned the whole
#   station's event set — not this scenario's subject, and not something any scenario can own
#   in a shared pool. Its only working job was making `data.0` deterministic, and naming the
#   row by id removes that need. Ingestion is still proven: an unmatched selector resolves to
#   undefined, so every assertion below fails if the event never landed.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 5000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- SecurityEvent: TamperDetected ---
  - action: send
    message: SecurityEvent
    messageType: Event
    payload:
      eventId: "{{runSecurityEventId}}"
      type: "TamperDetected"
      severity: "Critical"
      timestamp: "2026-01-01T12:00:00.000Z"
      details:
        sensor: "enclosure"
        bayId: "{{bayId_1}}"

  # --- Read it back. The station UUID is what ?station_id= filters on
  #     (DashboardSecurityController:60 -> where('stations.id', ...)), and the admin
  #     station GET is the only place a scenario can obtain it. ---
  - action: delay
    ms: 1500

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}"
    expect_status: 200
    capture:
      stationUuid: "data.id"

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/security/events?station_id={{captured.stationUuid}}"
    expect_status: 200
    expect_body:
      # Addressed by the id THIS RUN sent — not by position, not by row count.
      data[eventId={{runSecurityEventId}}].type: "TamperDetected"
      data[eventId={{runSecurityEventId}}].severity: "critical"
      data[eventId={{runSecurityEventId}}].stationId: "{{stationId}}"
