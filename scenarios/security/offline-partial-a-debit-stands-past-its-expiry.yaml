name: "Partial-A Debit Stands Past Its Expiry, Its Late Receipt Refunds Only The Shortfall"
description: "A Partial-A authorization's issue-time debit stands past its expiresAt - nothing is refunded at the expiry; the receipt of a wash started before expiresAt that arrives afterwards settles it by the refund-only true-up - the 30 seconds of 60 it did not deliver given back, nothing debited - and its copy is a Duplicate (reconciliation.md 6.7, 8.2; D5, Gabi, 2026-10-23; freeze item 18)."
# --- D5 (Gabi, 2026-10-23; freeze item 18): the station is the only source, as online --------------------------------
# Until 2026-10-23 an authorization no receipt had reconciled was refunded in full AT its expiresAt
# (`offline:expire-stale-grants`), and a receipt arriving after that refund was debited once more by 8.1 (this file was
# offline-partial-a-refunded-at-expiry-then-its-late-receipt.yaml, which asserted both). Now the debit taken at issue
# stands until the receipt arrives, whenever it does, and the receipt can only give back what the wash did not deliver.
# A session no receipt reaches by the deadline the sweep gives a session whose station is away - expiresAt + its
# duration + 60 s + the station's ConnectionLostGracePeriod (300 s), here 720 s after issue - is closed charged in full
# with the anomaly mark (`offline:close-partial-a-sessions`); this file's receipt comes long before that.
#
# THIS FILE RUNS FOR ~7 MINUTES and REQUIRES A RUNNING SCHEDULER: the authorization lives 300 s
# (ServerSignedAuthSigner::TTL_SECONDS) and the file waits past it and a minute of `offline:close-partial-a-sessions`,
# which the scheduler runs every minute, before the receipt arrives - so a refund at the expiry, were there one, would
# have been made. On UAT the scheduler runs it; locally `docker exec -d csms-app php artisan schedule:work` - without it
# the absence asserted here says nothing about the server. Its budget covers its 400 s of delay and the requests
# around it (ScenarioRunner.scenarioTimeout.test.ts holds the argument).
#
# The pool's services are priced 100 credits a minute (uatPrivileged.ts DEFAULT_SEED_SERVICES): the 60 seconds
# authorized cost 100, the 30 delivered 50.
scenario_timeout_ms: 480000
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot, and declare the bay this file uses Available (a pooled run shares the bay's state) ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: true
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  # --- A customer of its own, who reads its own wallet (the pool's identities are tenant operators, who hold no
  #     self.wallet.view), funded and with offline use on; removed by the run's teardown ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/auth/register"
    body:
      name: "Partial-A Customer {{stationId}}"
      email: "partial-a-{{runOfflineTxId}}@onestoppay.dev"
      password: "PartialA-Expiry-1023!"
      password_confirmation: "PartialA-Expiry-1023!"
    expect_status: 201
    capture:
      user_email: "user.email"
      user_id: "user.id"
    creates:
      user: "user.email"
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/auth/login"
    body:
      email: "{{captured.user_email}}"
      password: "PartialA-Expiry-1023!"
    expect_status: 200
    set_auth_token: "data.access_token"
  - action: fund_wallet
    user_id: "{{captured.user_id}}"
    credits: 1000
  - action: api_call
    method: PUT
    url: "{{target_url}}/api/v1/offline/preference"
    body:
      enabled: true
    expect_status: 200

  # The TransactionEvent's `userId` is the customer's subject, which a pass publishes (offline-auth-transaction-
  # reconcile.yaml says why); the pass is swept with the customer.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/offline/attestation-challenges"
    expect_status: 200
    capture:
      attestationChallenge: "challenge"
  - action: attest_device
    challenge: "{{captured.attestationChallenge}}"
    capture:
      devicePublicKey: devicePublicKey
      deviceKeyAttestation: deviceKeyAttestation
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/offline/passes"
    body:
      deviceId: "{{runDeviceId}}"
      devicePublicKey: "{{captured.devicePublicKey}}"
      deviceKeyAttestation: "{{captured.deviceKeyAttestation}}"
    expect_status: 200
    capture:
      actingUserSub: "offlinePass.sub"

  # --- The phone is online, the station not: the app obtains the authorization, debited at issue ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/offline-auth"
    body:
      stationId: "{{stationId}}"
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"
      requestedDurationSeconds: 60
      appNonce: "{{runAppNonce}}"
      deviceId: "{{runDeviceId}}"
    expect_status: 201
    capture:
      authId: "data.authId"
      grantSessionId: "data.sessionId"
      grantExpiresAt: "data.expiresAt"
      grantCredits: "data.creditsAuthorized"

  # The issue-time debit, taken as the authorization was issued.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/wallet/transactions?reference_type=offline_auth_grant"
    expect_status: 200
    expect_body:
      "data[reference_id={{captured.authId}}].type": "debit"
      "data[reference_id={{captured.authId}}].amount": "{{captured.grantCredits}}"

  # The wash starts 30 seconds before the authorization expires and the customer stops it from the app 30 seconds in, at
  # expiresAt (ble-session.md 1 rule 2a: a start within the validity).
  - action: capture_time
    from: "{{captured.grantExpiresAt}}"
    capture:
      washStartedAt: -30
      washEndedAt: 0

  # --- No receipt by expiresAt, and a sweep minute after it: nothing refunded, the debit stands ---
  - action: delay
    ms: 400000
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/wallet/transactions?reference_type=offline_auth_settlement"
    expect_status: 200
    expect_body_absent:
      - "data[reference_id={{captured.authId}}]"

  # --- The station reconnects and reports the wash: the true-up gives back the 30 seconds it did not deliver ---
  - action: send
    message: TransactionEvent
    payload:
      offlineTxId: "{{runOfflineTxId}}"
      authId: "{{captured.authId}}"
      sessionId: "{{captured.grantSessionId}}"
      userId: "{{captured.actingUserSub}}"
      deviceId: "{{runDeviceId}}"
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"
      startedAt: "{{captured.washStartedAt}}"
      endedAt: "{{captured.washEndedAt}}"
      durationSeconds: 30
      bookedDurationSeconds: 60
      endReason: "Local"
      clockState: "Synchronized"
      creditsCharged: 50
      receipt:
        data: "placeholder-overwritten-by-SendStep-sign"
        signature: "placeholder-overwritten-by-SendStep-sign"
        signatureAlgorithm: "ECDSA-P256-SHA256"
      txCounter: 1

  - action: wait_for
    message: TransactionEvent
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/wallet/transactions?reference_type=offline_auth_settlement"
    expect_status: 200
    expect_body:
      "data[reference_id={{captured.authId}}].type": "credit"
      "data[reference_id={{captured.authId}}].amount": 50

  # Never a debit of its own: the issue-time debit was the charge (8.2 rule 2).
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/wallet/transactions?reference_type=offline_transaction"
    expect_status: 200
    expect_body_absent:
      - "data[reference_id={{runOfflineTxId}}]"

  # --- Its copy again: a Duplicate, nothing given back twice ---
  - action: send
    message: TransactionEvent
    payload:
      offlineTxId: "{{runOfflineTxId}}"
      authId: "{{captured.authId}}"
      sessionId: "{{captured.grantSessionId}}"
      userId: "{{captured.actingUserSub}}"
      deviceId: "{{runDeviceId}}"
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"
      startedAt: "{{captured.washStartedAt}}"
      endedAt: "{{captured.washEndedAt}}"
      durationSeconds: 30
      bookedDurationSeconds: 60
      endReason: "Local"
      clockState: "Synchronized"
      creditsCharged: 50
      receipt:
        data: "placeholder-overwritten-by-SendStep-sign"
        signature: "placeholder-overwritten-by-SendStep-sign"
        signatureAlgorithm: "ECDSA-P256-SHA256"
      txCounter: 1

  - action: wait_for
    message: TransactionEvent
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Duplicate"
