# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}
#
# SERVER BRANCH REACHED
#   csms-server app/Shared/Protocol/Middleware/VerifyIncomingMiddleware.php:82-95
#     $isValid = $signedContent !== null
#         && $this->macSigner->verify($signedContent, $receivedMac, $sessionKey);
#     if (! $isValid) {
#         Log::critical('VerifyIncomingMiddleware: HMAC verification FAILED', ...);
#         $this->emitSecurityEvent($stationId, $action, ..., 'MAC_VERIFICATION_FAILED');
#         return VerificationResult::rejected('HMAC-SHA256 verification failed');
#     }
#   then app/Shared/Protocol/MessageDispatcher.php:147-169, whose REQUEST arm is
#   a bare `return null` — no response is published.
#
#   Nothing in scenario mode could reach this before: MessageSender::send() always
#   signed correctly with the real session key, and the only other publish path
#   (sendEnvelope) has no caller. `tamper_mac: corrupt` exists for this.
#
# WHAT THIS SCENARIO CAN AND CANNOT DISTINGUISH — stated, not papered over
#   A mac with flipped bytes and a mac computed with the WRONG KEY are the same
#   server branch. MacSigner::verify() ends in one hash_equals, so both produce
#   the identical reason string, log line and event. There is no wrong-key
#   discriminator anywhere in csms-server. A second scenario for `wrong_key`
#   would therefore reach no additional branch — it is covered instead by
#   src/__tests__/mqtt/MessageSender.tamperMac.test.ts, which proves the two
#   produce different bytes and are both unverifiable under the real key.
#
#   This scenario also cannot distinguish MAC_VERIFICATION_FAILED from
#   MAC_MISSING (security/mac-missing-drops-request.yaml) ON THE WIRE, because
#   both answer with silence. The two files exist because they reach two
#   different server branches, not because the wire tells them apart.
#
# WHY THE PROOF IS SILENCE, AND WHY THE CONTROL IS NOT OPTIONAL
#   csms-server publishes NOTHING on any MAC failure — no error, no disconnect;
#   the worker even records outcome="ok". The only thing a station can observe is
#   that its REQUEST is never answered. Silence alone is a hollow proof — a dead
#   link, a wedged worker or a mistyped topic all produce it. The clean Heartbeat
#   at the end is what makes it attributable: the same link, the same action,
#   answered a moment later. Remove that step and this file proves nothing.
#
# REQUIRES the server to be running with OSPP_MESSAGE_SIGNING_MODE=All.
#   Under `None`, VerifyIncomingMiddleware.php:37 returns skipped() before any of
#   this and the tampered Heartbeat is ANSWERED — the scenario then fails at the
#   expect_silence step, which is the correct outcome: it is reporting that the
#   gate is off, not that the server is broken.
name: "MAC Verification Failed Drops Request"
description: "Publish a Heartbeat whose mac has one flipped bit. The server must refuse it silently; a clean Heartbeat on the same connection must still be answered."
# NO SERVER-STATE ASSERTION IS POSSIBLE — MAC FAILURES ARE WIRE-SILENT BY DESIGN.
# VerifyIncomingMiddleware ends in rejected() -> MessageDispatcher:169 `return
# null`: no error Response is published, the connection is not dropped, and the
# worker records the message as handled. A REQUEST or RESPONSE simply vanishes;
# an EVENT goes to the DLQ, also silently. There is nothing on the wire to
# wait_for and nothing in a table to read — the SILENCE is the behaviour, which
# is why this file asserts the absence of a reply rather than the presence of one.
#
# The one place the branch IS observable is Prometheus:
# csms_mqtt_mac_verification_failures_total, labelled by action and reason, which
# incremented first-ever on 2026-08-10 for exactly these two files.
# security_events stays 0 here and correctly so: spec 5.7 needs 3 failures per
# 60s per station, and one probe is under threshold.
#
# CORRECTED 2026-08-11 — the header title above is now wrong for this file and is
# kept only because the WIRE half of it still holds. This used to end "No api_call
# can assert on it — /metrics is Prometheus text and expect_body calls
# response.json()", and "Closing this needs a metrics-scrape step in the runner,
# not a scenario edit". The runner grew `expect_body_text`, the scrape was added
# to this very file at the api_call below, and nobody came back to this
# paragraph — so the file asserted the thing its own header said was impossible.
# A ceiling note outlives the ceiling unless something re-reads it.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot. Required: the BootNotification RESPONSE carries the session key,
  #     and without a key the sender refuses to publish at all (fail closed,
  #     06-security.md §5.7) — so there would be nothing to tamper WITH. ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # Prove the link answers a Heartbeat BEFORE the tamper. Without this, a station
  # whose Heartbeats were never answered for an unrelated reason would sail
  # through the expect_silence below.
  - action: send
    message: Heartbeat
    messageType: Request

  - action: wait_for
    message: Heartbeat
    messageType: Response
    timeout_ms: 15000

  # --- The tampered send. Heartbeat is NOT one of the three structural
  #     exemptions, so it owes a mac and the server verifies it. The envelope is
  #     otherwise perfect: the mac stays a base64 string of the same length, so
  #     schema validation (MessageDispatcher.php:109, which runs BEFORE the MAC
  #     gate at :146) passes and the refusal is attributable to the MAC gate
  #     alone. A malformed envelope would instead be answered with a Rejected
  #     RESPONSE on the wire — the opposite observable, from a different gate. ---
  - action: send
    message: Heartbeat
    messageType: Request
    tamper_mac: corrupt

  # THE ASSERTION: no Heartbeat Response correlated to the tampered Request, ever.
  # 6s is ~20x the observed round trip and well under the 15s the clean waits use.
  - action: wait_for
    message: Heartbeat
    messageType: Response
    timeout_ms: 6000
    expect_silence: true

  # --- THE CONTROL. Same station, same connection, same action, correct mac.
  #     This answering is what turns the silence above into a refusal rather
  #     than a broken link. ---
  - action: send
    message: Heartbeat
    messageType: Request

  - action: wait_for
    message: Heartbeat
    messageType: Response
    timeout_ms: 15000
    capture:
      serverTime: "payload.serverTime"

  # `serverTime` is minted by the server on the Heartbeat response and appears
  # nowhere in this scenario's payloads — asserting it exists pins that a real
  # server round trip completed, not that some buffered envelope was matched.
  - action: assert
    field: "payload.serverTime"
    exists: true

  # 1000ms: the probe above is dropped silently, so there is no Response to
  # synchronise on — the metric write races the consumer exactly as a DB write would.
  - action: delay
    ms: 1000

  # THE ASSERTION — the first this file has ever had about its own subject, and
  # it is honest about being a weak one.
  #
  # This branch is WIRE-SILENT by construction (see the note above): the
  # middleware drops the message, publishes nothing and does not disconnect, so
  # there is no Response to wait_for and no row to read. /metrics is the ONLY
  # surface on which it is observable at all, and it was unreachable until the
  # runner grew expect_body_text — response.json() was unconditional, and
  # Prometheus exposition format is text/plain.
  #
  # WHAT IT PROVES: the branch is wired and has fired — the series exists with a
  # nonzero value for reason="MAC_VERIFICATION_FAILED". Before this the file asserted only
  # SILENCE, which is indistinguishable from the probe never having been sent at
  # all: a scenario that failed to publish anything passed identically.
  #
  # WHAT IT DOES NOT PROVE: that THIS run incremented it. The counter carries
  # only action and reason labels — no station, no run — so it is global and
  # cumulative, and a series left behind by any earlier run satisfies this. A
  # per-run assertion would need capture-then-compare arithmetic the DSL does not
  # have; that is the honest next capability, not something to fake with a
  # tighter regex.
  #
  # Regex form (/…/) rather than a literal: a Prometheus line is full of regex
  # metacharacters and the label ORDER is not guaranteed, so matching on
  # reason= alone inside the brace group survives a label being added or reordered.
  - action: api_call
    method: GET
    url: "{{target_url}}/metrics"
    expect_status: 200
    expect_body_text:
      - /csms_mqtt_mac_verification_failures_total\{[^}]*reason="MAC_VERIFICATION_FAILED"[^}]*\} [1-9]/
