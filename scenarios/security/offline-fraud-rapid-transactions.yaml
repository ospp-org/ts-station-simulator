# SERVER BRANCH REACHED
#   csms-server app/Modules/Offline/Services/FraudScorer.php:138-148, signal 5
#     $rapidConsecutive = $this->checkRapidConsecutive($stationUuid, $tx);
#   which at :226-230 is
#     $intervalSeconds = $tx->startedAt - $previousTx->ended_at;
#     return $intervalSeconds < $pass->min_interval_seconds;
#   The five payload timestamps below leave a 30s gap between each endedAt and the next
#   startedAt, against a default min_interval_seconds of 60 (config/ospp.php,
#   ospp.offline.min_interval_seconds) — so the signal fires on transactions 2..5.
#   NOTE the gap is in the PAYLOAD timestamps, not in wall-clock arrival: the rule reads
#   startedAt/endedAt, never receipt time. The wait_for steps added between sends therefore
#   do not weaken the "rapid" pattern, and a reader should not "fix" them by removing the waits.
#
# WHAT IS ASSERTED, AND THE ONE THING THAT CANNOT BE
#   Asserted: all five TransactionEvent responses are Accepted. That is server-produced and
#   discriminating — see the note at each assert.
#   NOT asserted, and NOT assertable from any scenario: the fraud SCORE itself.
#     - it is computed and persisted (Reconciler.php:320-321 -> offline_transactions.fraud_score
#       and .fraud_signals);
#     - it is deliberately absent from the MQTT wire — transaction-event-response.schema.json is
#       {status, reason} with additionalProperties:false, and TransactionEventHandler.php:152-153
#       says so at the site: a station is never told it was scored;
#     - the ONE surface that returns it is the synchronous response of POST /v1/offline/reconcile
#       (ReconciliationResultResource:45-47, `fraudScore`), and a scenario cannot call it with a
#       valid receipt: signing lives only in SendStep (SendStep.ts:169-202, MQTT path) and
#       ApiCallStep has no signing hook. No scenario in the corpus calls that endpoint;
#     - no GET reads the score back afterwards (routes/api/v1/offline.php has index, issue,
#       reconcile, passes/{id}/status only).
#   So detection EXISTS and this file provokes it, but proving it requires reading
#   offline_transactions server-side, out of band. Measured doing exactly that on 2026-08-10 —
#   see the arc report. Making it assertable needs either a signing hook on api_call or a
#   csms-server read path for the score; until then this file's honest claim is the one below.
#
# HISTORY — this file asserted NOTHING about its own subject until 2026-08-10. Its only
#   assert was on the BootNotification response, and its five offlineTxIds were hardcoded
#   literals (otx_aa00000001..5) that the server had already reconciled on 2026-08-07, so it
#   answered Duplicate to all five and passed anyway. Ids are now generated per run.
name: "Offline Fraud: Rapid Transactions"
description: >
  Five offline TransactionEvents whose payload timestamps sit 30s apart against a 60s
  min_interval_seconds, provoking FraudScorer signal 5 (rapid_consecutive, weight 40). All
  five must be ACCEPTED — 40 is below the review threshold of 50, so the rapid pattern alone
  does not reject. The score itself is not visible to a station by design; see the header.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 5
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: true
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 5000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Obtain a real, server-signed offline pass (mirrors offline-pass-authorize.yaml:62-76) ---
  # Captured pass/sub used by all 5 rapid TransactionEvents below (the (α-bag)
  # boundary resolver requires real opass_/sub_ — hardcoded literals were
  # rejected by the resolver post-csms-server d106044).
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/offline/passes"
    body:
      deviceId: "dev_smoke_fraud01"
      serviceIds:
        - "{{serviceId_1}}"
      maxUses: 10
      maxTotalCredits: 5000
      durationHours: 24
    expect_status: 201
    capture:
      offlinePassId: "data.attributes.passId"
      offlineUserSub: "data.attributes.sub"
      passDeviceId: "data.attributes.deviceId"

  # --- Rapid TransactionEvent #1 ---
  - action: send
    message: TransactionEvent
    payload:
      offlineTxId: "{{runOfflineTxId_1}}"
      offlinePassId: "{{captured.offlinePassId}}"
      userId: "{{captured.offlineUserSub}}"
      deviceId: "{{captured.passDeviceId}}"
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"
      startedAt: "2026-01-01T10:00:00.000Z"
      endedAt: "2026-01-01T10:05:00.000Z"
      durationSeconds: 300
      creditsCharged: 150
      receipt:
        data: "eyJ0eENvdW50ZXIiOjF9"
        signature: "test_sig_1"
        signatureAlgorithm: "ECDSA-P256-SHA256"
      txCounter: 1
      passCounter: 1
      meterValues:
        liquidMl: 2500
        energyWh: 85

  - action: wait_for
    message: TransactionEvent
    messageType: Response
    timeout_ms: 10000

  # Accepted, deliberately. rapid_consecutive weighs 40 (config/ospp.php:499) against a
  # review threshold of 50 (:505), so the rapid pattern ALONE scores 40 -> determineAction
  # returns 'accept'. A Rejected here would mean a second signal also fired; a "Duplicate"
  # would mean the offlineTxId collided with an earlier run, which is exactly the state
  # this file sat in from 2026-08-07 to 2026-08-10 while asserting nothing.
  - action: assert
    field: "payload.status"
    equals: "Accepted"


  # --- Rapid TransactionEvent #2 ---
  - action: send
    message: TransactionEvent
    payload:
      offlineTxId: "{{runOfflineTxId_2}}"
      offlinePassId: "{{captured.offlinePassId}}"
      userId: "{{captured.offlineUserSub}}"
      deviceId: "{{captured.passDeviceId}}"
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"
      startedAt: "2026-01-01T10:05:30.000Z"
      endedAt: "2026-01-01T10:10:30.000Z"
      durationSeconds: 300
      creditsCharged: 150
      receipt:
        data: "eyJ0eENvdW50ZXIiOjJ9"
        signature: "test_sig_2"
        signatureAlgorithm: "ECDSA-P256-SHA256"
      txCounter: 2
      passCounter: 2
      meterValues:
        liquidMl: 2400
        energyWh: 80

  - action: wait_for
    message: TransactionEvent
    messageType: Response
    timeout_ms: 10000

  # Accepted, deliberately. rapid_consecutive weighs 40 (config/ospp.php:499) against a
  # review threshold of 50 (:505), so the rapid pattern ALONE scores 40 -> determineAction
  # returns 'accept'. A Rejected here would mean a second signal also fired; a "Duplicate"
  # would mean the offlineTxId collided with an earlier run, which is exactly the state
  # this file sat in from 2026-08-07 to 2026-08-10 while asserting nothing.
  - action: assert
    field: "payload.status"
    equals: "Accepted"


  # --- Rapid TransactionEvent #3 ---
  - action: send
    message: TransactionEvent
    payload:
      offlineTxId: "{{runOfflineTxId_3}}"
      offlinePassId: "{{captured.offlinePassId}}"
      userId: "{{captured.offlineUserSub}}"
      deviceId: "{{captured.passDeviceId}}"
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"
      startedAt: "2026-01-01T10:11:00.000Z"
      endedAt: "2026-01-01T10:16:00.000Z"
      durationSeconds: 300
      creditsCharged: 150
      receipt:
        data: "eyJ0eENvdW50ZXIiOjN9"
        signature: "test_sig_3"
        signatureAlgorithm: "ECDSA-P256-SHA256"
      txCounter: 3
      passCounter: 3
      meterValues:
        liquidMl: 2600
        energyWh: 90

  - action: wait_for
    message: TransactionEvent
    messageType: Response
    timeout_ms: 10000

  # Accepted, deliberately. rapid_consecutive weighs 40 (config/ospp.php:499) against a
  # review threshold of 50 (:505), so the rapid pattern ALONE scores 40 -> determineAction
  # returns 'accept'. A Rejected here would mean a second signal also fired; a "Duplicate"
  # would mean the offlineTxId collided with an earlier run, which is exactly the state
  # this file sat in from 2026-08-07 to 2026-08-10 while asserting nothing.
  - action: assert
    field: "payload.status"
    equals: "Accepted"


  # --- Rapid TransactionEvent #4 ---
  - action: send
    message: TransactionEvent
    payload:
      offlineTxId: "{{runOfflineTxId_4}}"
      offlinePassId: "{{captured.offlinePassId}}"
      userId: "{{captured.offlineUserSub}}"
      deviceId: "{{captured.passDeviceId}}"
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"
      startedAt: "2026-01-01T10:16:30.000Z"
      endedAt: "2026-01-01T10:21:30.000Z"
      durationSeconds: 300
      creditsCharged: 150
      receipt:
        data: "eyJ0eENvdW50ZXIiOjR9"
        signature: "test_sig_4"
        signatureAlgorithm: "ECDSA-P256-SHA256"
      txCounter: 4
      passCounter: 4
      meterValues:
        liquidMl: 2300
        energyWh: 75

  - action: wait_for
    message: TransactionEvent
    messageType: Response
    timeout_ms: 10000

  # Accepted, deliberately. rapid_consecutive weighs 40 (config/ospp.php:499) against a
  # review threshold of 50 (:505), so the rapid pattern ALONE scores 40 -> determineAction
  # returns 'accept'. A Rejected here would mean a second signal also fired; a "Duplicate"
  # would mean the offlineTxId collided with an earlier run, which is exactly the state
  # this file sat in from 2026-08-07 to 2026-08-10 while asserting nothing.
  - action: assert
    field: "payload.status"
    equals: "Accepted"


  # --- Rapid TransactionEvent #5 ---
  - action: send
    message: TransactionEvent
    payload:
      offlineTxId: "{{runOfflineTxId_5}}"
      offlinePassId: "{{captured.offlinePassId}}"
      userId: "{{captured.offlineUserSub}}"
      deviceId: "{{captured.passDeviceId}}"
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"
      startedAt: "2026-01-01T10:22:00.000Z"
      endedAt: "2026-01-01T10:27:00.000Z"
      durationSeconds: 300
      creditsCharged: 150
      receipt:
        data: "eyJ0eENvdW50ZXIiOjV9"
        signature: "test_sig_5"
        signatureAlgorithm: "ECDSA-P256-SHA256"
      txCounter: 5
      passCounter: 5
      meterValues:
        liquidMl: 2550
        energyWh: 88

  - action: wait_for
    message: TransactionEvent
    messageType: Response
    timeout_ms: 10000

  # The fifth and last. Same reasoning as the four above.
  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: delay
    ms: 1000

  # THE ASSERTION — added 2026-08-10, and it does NOT overturn the header note
  # above. The per-transaction fraud SCORE is still unreachable from a scenario
  # for exactly the reasons recorded there: it is absent from the wire by design,
  # the one endpoint returning it needs a signed receipt ApiCallStep cannot
  # produce, and no GET reads it back.
  #
  # What changed is that the runner grew expect_body_text, which reaches
  # /metrics — Prometheus exposition text, previously unparseable because
  # response.json() was unconditional. The scoring pipeline publishes a histogram
  # there, so its EXISTENCE is now assertable even though a specific row's score
  # is not.
  #
  # WHAT IT PROVES: the fraud scorer ran and recorded observations. Before this,
  # a scorer that had been disabled or was silently throwing looked identical to
  # one working perfectly — the five Accepted responses this file asserts are
  # produced either way, because 40 is below the review threshold of 50 and
  # Accepted is the correct answer whether or not anything was scored.
  #
  # WHAT IT DOES NOT PROVE: that THESE five transactions produced those
  # observations, or that any of them scored 40. The histogram carries no station,
  # no transaction and no run label, so it is global and cumulative and an earlier
  # run satisfies it. Proving the 40 still requires reading offline_transactions
  # out of band, as the header says. Same limitation, and same honest framing, as
  # the two MAC files.
  - action: api_call
    method: GET
    url: "{{target_url}}/metrics"
    expect_status: 200
    expect_body_text:
      - /csms_fraud_score_distribution_count [1-9]/
