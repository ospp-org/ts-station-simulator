# THE FROZEN FRAUD MODEL, SINCE csms-server's OFFLINE GROUP 2 (spec v0.45.0, 06-security.md 7.4)
#   A settled offline transaction is scored on nine factors, and RapidConsecutive (+0.15) fires on two transactions of
#   one pass accepted closer than its minIntervalSec - start to start, as the per-pass rate limit it backs up
#   measures, each start read through its station's clock offset (FraudScorer::closestAcceptanceGapMs). The pass's
#   minIntervalSec is the platform offline policy's, 60 s on UAT. The five washes below are 20 s long and START 30 s
#   apart, so RapidConsecutive fires on washes 2..5; wash 1 is this identity's first at the station
#   (FirstUseOfStation, +0.10). Every score stays in the Normal band, below 0.30: all five are Accepted, and no
#   FraudDetected record is written.
#
# WHAT IS ASSERTED
#   All five TransactionEvent responses are Accepted, and - since group 2 made it readable - what the scorer decided
#   for each, through the console's door GET /api/v1/admin/offline-passes/{id}/transactions: wash 1 FirstUseOfStation
#   at 0.10, washes 2..5 RapidConsecutive at 0.15, none in a band.
#
# WHY THE WASHES ARE SHORT (measured in the corpus of 2026-10-23, csms-server 416c7eca)
#   Until then the five were 300 s long and 30 s apart, END to start, against the end-to-start rule of the old model.
#   Dated from the pass's issuedAt, they reached 27 minutes past it: signed in the server's future, so InvalidTimestamps
#   (+0.50) fired from wash 2, and with the pass's total passed and the wallet below zero wash 3 scored 0.90 - the
#   Block band, which blocks the user and revokes every pass of theirs, so wash 4 was Rejected OFFLINE_PASS_REVOKED.
#   That is the model doing its job; the file was asking it something else. Five 20 s washes 30 s apart end 140 s
#   after the pass was issued, inside the 300 s the server allows a signed time ahead of it.
#
# HISTORY — this file asserted NOTHING about its own subject until 2026-08-10. Its only
#   assert was on the BootNotification response, and its five offlineTxIds were hardcoded
#   literals (otx_aa00000001..5) that the server had already reconciled on 2026-08-07, so it
#   answered Duplicate to all five and passed anyway. Ids are now generated per run.
name: "Offline Fraud: Rapid Transactions"
description: >
  Five offline TransactionEvents of one pass started 30 s apart against the platform's 60 s minIntervalSec:
  RapidConsecutive (+0.15) fires on washes 2..5 and FirstUseOfStation (+0.10) on wash 1, all in the Normal band, so
  all five are Accepted; the pass's transactions show each score and its factors (06-security.md 7.4, spec v0.45.0).
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 5
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: true
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 5000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Obtain a real, server-signed offline pass (mirrors offline-pass-authorize.yaml:62-76) ---
  # Captured pass/sub used by all 5 rapid TransactionEvents below (the (α-bag)
  # boundary resolver requires real opass_/sub_ — hardcoded literals were
  # rejected by the resolver post-csms-server d106044).
  # A pass is issued only to a device key the phone attested (app-contract.md 3, 3.6):
  # a challenge, the attestation over it, then the request with the key. The limits and the
  # lifetime are the platform offline policy's, and the answer is 200 {offlinePass, trustBundle}.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/offline/attestation-challenges"
    expect_status: 200
    capture:
      attestationChallenge: "challenge"
  - action: attest_device
    challenge: "{{captured.attestationChallenge}}"
    capture:
      devicePublicKey: devicePublicKey
      deviceKeyAttestation: deviceKeyAttestation
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/offline/passes"
    body:
      deviceId: "dev_smoke_fraud01"
      devicePublicKey: "{{captured.devicePublicKey}}"
      deviceKeyAttestation: "{{captured.deviceKeyAttestation}}"
    expect_status: 200
    capture:
      offlinePassId: "offlinePass.passId"
      offlineUserSub: "offlinePass.sub"
      passDeviceId: "offlinePass.deviceId"
      passIssuedAt: "offlinePass.issuedAt"

  # The five washes are dated from the pass's own issuedAt: check #9 judges a signed start against the pass's whole
  # validity window (reconciliation.md 6.1), and a pass issued a moment ago covers nothing before it. 20 s each,
  # started 30 s apart, the last ending 140 s after issuance (see the header).
  - action: capture_time
    from: "{{captured.passIssuedAt}}"
    capture:
      wash1StartedAt: 0
      wash1EndedAt: 20
      wash2StartedAt: 30
      wash2EndedAt: 50
      wash3StartedAt: 60
      wash3EndedAt: 80
      wash4StartedAt: 90
      wash4EndedAt: 110
      wash5StartedAt: 120
      wash5EndedAt: 140

  # --- Rapid TransactionEvent #1 ---
  - action: send
    message: TransactionEvent
    payload:
      offlineTxId: "{{runOfflineTxId_1}}"
      offlinePassId: "{{captured.offlinePassId}}"
      userId: "{{captured.offlineUserSub}}"
      deviceId: "{{captured.passDeviceId}}"
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"
      startedAt: "{{captured.wash1StartedAt}}"
      endedAt: "{{captured.wash1EndedAt}}"
      durationSeconds: 20
      bookedDurationSeconds: 20
      creditsCharged: 34
      receipt:
        data: "eyJ0eENvdW50ZXIiOjF9"
        signature: "test_sig_1"
        signatureAlgorithm: "ECDSA-P256-SHA256"
      txCounter: 1
      passCounter: 1
      meterValues:
        liquidMl: 2500
        energyWh: 85

  - action: wait_for
    message: TransactionEvent
    messageType: Response
    timeout_ms: 10000

  # Accepted, deliberately: a score below the Review band's 0.30 is settled silently (06-security.md 7.4), and
  # scoring never rejects. A Rejected here would be the gate's, not the scorer's; a Duplicate an offlineTxId that
  # collided with an earlier run, the state this file sat in from 2026-08-07 to 2026-08-10 while asserting nothing.
  - action: assert
    field: "payload.status"
    equals: "Accepted"


  # --- Rapid TransactionEvent #2 ---
  - action: send
    message: TransactionEvent
    payload:
      offlineTxId: "{{runOfflineTxId_2}}"
      offlinePassId: "{{captured.offlinePassId}}"
      userId: "{{captured.offlineUserSub}}"
      deviceId: "{{captured.passDeviceId}}"
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"
      startedAt: "{{captured.wash2StartedAt}}"
      endedAt: "{{captured.wash2EndedAt}}"
      durationSeconds: 20
      bookedDurationSeconds: 20
      creditsCharged: 34
      receipt:
        data: "eyJ0eENvdW50ZXIiOjJ9"
        signature: "test_sig_2"
        signatureAlgorithm: "ECDSA-P256-SHA256"
      txCounter: 2
      passCounter: 2
      meterValues:
        liquidMl: 2400
        energyWh: 80

  - action: wait_for
    message: TransactionEvent
    messageType: Response
    timeout_ms: 10000

  # Accepted, deliberately: a score below the Review band's 0.30 is settled silently (06-security.md 7.4), and
  # scoring never rejects. A Rejected here would be the gate's, not the scorer's; a Duplicate an offlineTxId that
  # collided with an earlier run, the state this file sat in from 2026-08-07 to 2026-08-10 while asserting nothing.
  - action: assert
    field: "payload.status"
    equals: "Accepted"


  # --- Rapid TransactionEvent #3 ---
  - action: send
    message: TransactionEvent
    payload:
      offlineTxId: "{{runOfflineTxId_3}}"
      offlinePassId: "{{captured.offlinePassId}}"
      userId: "{{captured.offlineUserSub}}"
      deviceId: "{{captured.passDeviceId}}"
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"
      startedAt: "{{captured.wash3StartedAt}}"
      endedAt: "{{captured.wash3EndedAt}}"
      durationSeconds: 20
      bookedDurationSeconds: 20
      creditsCharged: 34
      receipt:
        data: "eyJ0eENvdW50ZXIiOjN9"
        signature: "test_sig_3"
        signatureAlgorithm: "ECDSA-P256-SHA256"
      txCounter: 3
      passCounter: 3
      meterValues:
        liquidMl: 2600
        energyWh: 90

  - action: wait_for
    message: TransactionEvent
    messageType: Response
    timeout_ms: 10000

  # Accepted, deliberately: a score below the Review band's 0.30 is settled silently (06-security.md 7.4), and
  # scoring never rejects. A Rejected here would be the gate's, not the scorer's; a Duplicate an offlineTxId that
  # collided with an earlier run, the state this file sat in from 2026-08-07 to 2026-08-10 while asserting nothing.
  - action: assert
    field: "payload.status"
    equals: "Accepted"


  # --- Rapid TransactionEvent #4 ---
  - action: send
    message: TransactionEvent
    payload:
      offlineTxId: "{{runOfflineTxId_4}}"
      offlinePassId: "{{captured.offlinePassId}}"
      userId: "{{captured.offlineUserSub}}"
      deviceId: "{{captured.passDeviceId}}"
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"
      startedAt: "{{captured.wash4StartedAt}}"
      endedAt: "{{captured.wash4EndedAt}}"
      durationSeconds: 20
      bookedDurationSeconds: 20
      creditsCharged: 34
      receipt:
        data: "eyJ0eENvdW50ZXIiOjR9"
        signature: "test_sig_4"
        signatureAlgorithm: "ECDSA-P256-SHA256"
      txCounter: 4
      passCounter: 4
      meterValues:
        liquidMl: 2300
        energyWh: 75

  - action: wait_for
    message: TransactionEvent
    messageType: Response
    timeout_ms: 10000

  # Accepted, deliberately: a score below the Review band's 0.30 is settled silently (06-security.md 7.4), and
  # scoring never rejects. A Rejected here would be the gate's, not the scorer's; a Duplicate an offlineTxId that
  # collided with an earlier run, the state this file sat in from 2026-08-07 to 2026-08-10 while asserting nothing.
  - action: assert
    field: "payload.status"
    equals: "Accepted"


  # --- Rapid TransactionEvent #5 ---
  - action: send
    message: TransactionEvent
    payload:
      offlineTxId: "{{runOfflineTxId_5}}"
      offlinePassId: "{{captured.offlinePassId}}"
      userId: "{{captured.offlineUserSub}}"
      deviceId: "{{captured.passDeviceId}}"
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"
      startedAt: "{{captured.wash5StartedAt}}"
      endedAt: "{{captured.wash5EndedAt}}"
      durationSeconds: 20
      bookedDurationSeconds: 20
      creditsCharged: 34
      receipt:
        data: "eyJ0eENvdW50ZXIiOjV9"
        signature: "test_sig_5"
        signatureAlgorithm: "ECDSA-P256-SHA256"
      txCounter: 5
      passCounter: 5
      meterValues:
        liquidMl: 2550
        energyWh: 88

  - action: wait_for
    message: TransactionEvent
    messageType: Response
    timeout_ms: 10000

  # The fifth and last. Same reasoning as the four above.
  - action: assert
    field: "payload.status"
    equals: "Accepted"

  - action: delay
    ms: 1000

  # --- What the scorer decided, read where the platform reads it (csms-server offline group 2) ---
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/me"
    expect_status: 200
    capture:
      customerId: "data.id"
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/offline-passes?user_id={{captured.customerId}}"
    auth:
      email_env: UAT_E2E_PLATFORM_ADMIN_EMAIL
      password_env: UAT_E2E_PLATFORM_ADMIN_PASSWORD
    expect_status: 200
    capture:
      passUuid: "data[passId={{captured.offlinePassId}}].id"
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/admin/offline-passes/{{captured.passUuid}}/transactions"
    auth:
      email_env: UAT_E2E_PLATFORM_ADMIN_EMAIL
      password_env: UAT_E2E_PLATFORM_ADMIN_PASSWORD
    expect_status: 200
    expect_body:
      "data[offlineTxId={{runOfflineTxId_1}}].fraudFactors": ["FirstUseOfStation"]
      "data[offlineTxId={{runOfflineTxId_1}}].fraudScore": 0.1
      "data[offlineTxId={{runOfflineTxId_2}}].fraudFactors": ["RapidConsecutive"]
      "data[offlineTxId={{runOfflineTxId_2}}].fraudScore": 0.15
      "data[offlineTxId={{runOfflineTxId_3}}].fraudFactors": ["RapidConsecutive"]
      "data[offlineTxId={{runOfflineTxId_4}}].fraudFactors": ["RapidConsecutive"]
      "data[offlineTxId={{runOfflineTxId_5}}].fraudFactors": ["RapidConsecutive"]
      "data[offlineTxId={{runOfflineTxId_5}}].fraudScore": 0.15
      "data[offlineTxId={{runOfflineTxId_5}}].fraudBand": null

  # The histogram (added 2026-08-10, before any score was readable): since group 2 it observes the scores of the
  # Review, Alert and Block bands only, so these five, all Normal, add nothing to it; the step stays as the proof that
  # the scoring pipeline publishes, global and cumulative - an earlier run satisfies it, as it always did.
  - action: api_call
    method: GET
    url: "{{target_url}}/metrics"
    # /metrics is no longer open. csms-server 6c378e14 put MetricsAccessMiddleware in
    # front of it — it "served the platform's credit float to anyone" — so this step
    # answered 401 the moment that reached UAT (2026-09-06), asserting 200 against a
    # route that now fails closed. The bearer token is the deployed server's own
    # METRICS_SCRAPE_TOKEN, exported as OSPP_SIM_METRICS_SCRAPE_TOKEN; it is a secret
    # and is never stored here. With it unset the runner does not define
    # {{metricsScrapeToken}} at all and the preflight SKIPS this file by name, which is
    # deliberate: an empty token would send `Bearer ` and go red as though the server
    # were broken.
    headers:
      Authorization: "Bearer {{metricsScrapeToken}}"
    expect_status: 200
    expect_body_text:
      - /csms_fraud_score_distribution_count [1-9]/
