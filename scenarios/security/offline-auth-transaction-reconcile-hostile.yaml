name: "Offline Auth-Form Reconciliation HOSTILE (foreign-key receipt -> Rejected)"
skip: true
skip_reason: >-
  VERDICT SETTLED 2026-09-22: THIS FILE DOES NOT IMPLEMENT ITS OWN NAME, AND WAS PASSING ON
  ANOTHER FILE'S BUG.

  MEASURED, not read: ignoring comments and blank lines, this file and its twin
  security/offline-auth-transaction-reconcile.yaml differ in exactly FOUR lines — the `name:`
  and the expected `payload.status` (Accepted vs Rejected). Nothing else. There is no
  foreign-key receipt, no foreign station, no tampered field: it sends a byte-identical frame
  to the twin and asserts the opposite answer. Identical input cannot legitimately produce
  both, so one of the two was always wrong.

  WHY NOBODY NOTICED. Both files sourced the TransactionEvent's `userId` from
  `GET /api/v1/me` -> `data.id`, a user uuid, where the wire schema requires a subject
  `^sub_[a-zA-Z0-9]+$`. Every frame was refused on the pattern. The twin, expecting Accepted,
  went red on its first ever run; THIS file, expecting Rejected, went green — on a schema
  refusal that has nothing to do with a receipt. The single assertion it carries is
  `payload.status == Rejected` with no reason, so a refusal for any cause at all satisfied it.
  That is the shape this corpus keeps recording as a defect: a refusal without a discriminator
  proves only that the endpoint answers a refusal to something.

  WHAT WOULD MAKE IT RUNNABLE, stated so the cost is explicit rather than implied: a receipt
  signed with a DIFFERENT station's ECDSA receipt key, so `OfflineAuthReceiptGate` refuses the
  signature rather than the schema. The DSL cannot express that today — `SendStep:180-197`
  always signs with the acting station's own registered `receiptKeyPath` and takes no override
  — so it needs a signing-key seam in the runner plus a second provisioned station to borrow a
  key from, and then a reason assertion pinning the receipt refusal. Both are decisions for
  whoever owns the offline profile, not a side effect of repairing the twin.

  LEFT SKIPPED rather than deleted: the branch it names — a receipt whose signature belongs to
  another station — is real, is uncovered by anything else in the corpus, and is worth building
  properly.
description: >
  Boot, then send an auth-form TransactionEvent {authId, sessionId} that reconciles a
  server-signed offline-auth grant (B1) on the REAL UAT MQTT wire. The receipt body carries
  {authId, sessionId} (NOT offlinePassId); SendStep signs it with the station's ECDSA
  receipt key (<id>-receipt-key.pem). csms-server's OfflineAuthReceiptGate verifies the
  signature against the grant station's registered ecdsa_public_key, cross-checks
  offlineTxId/authId/sessionId/creditsCharged (envelope <-> signed body), then the
  settle-once true-up refunds (credits_authorized - creditsCharged).

  The grant is created out-of-band (the wallet pre-debit needs a funded user; no funding
  API on UAT) and its identifiers are injected via --var: offlineTxId, authId, sessionId,
  userId, deviceId, bayId, serviceId. creditsCharged is fixed at 30 (< credits_authorized
  so the true-up refunds a positive amount). The station must boot first so the engine
  captures the HMAC sessionKey (csms UAT SigningMode=Critical signs the TransactionEvent).
# Not auto-runnable in a pooled suite, and marked so it SKIPS rather than fails.
# This file needs --var offlineTxId/authId/sessionId naming an auth-form grant
# that was issued OUT OF BAND: there is no API on UAT that mints one, so a pooled
# run has nothing to substitute and template substitution THROWS. Before this
# line that surfaced as a hard failure whose message named a missing variable
# rather than a missing fixture — the exact attribution cost RUNNING-AGAINST-UAT
# was written about. Same treatment, same reason, as
# sessions/session-rejected-invalid-service-cross-station.yaml.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot (establishes the HMAC sessionKey for Critical message signing) ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 1
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: true
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # THE BAY AND ITS PROGRAM, REPORTED BEFORE THE GRANT IS ASKED FOR.
  #
  # `bay_programs.available` is a LATCH, and every clause of that is a writer: the column
  # defaults to true and `CertificateManager:493` omits it at provisioning;
  # `StatusNotificationHandler:656` is the only thing that ever sets it;
  # `BootNotificationHandler::resetBaysToUnknown` bumps `version`/`updated_at` (and `status`
  # on a cold boot) and does NOT touch it. So a pooled file that never reports inherits
  # whatever the PREVIOUS lessee of this shared bay left there, and
  # `ServiceProgramResolver::isReportedUnavailable` then refuses the grant at
  # `AuthorizeOfflineSessionAction:164` -- 409 3003, naming the bay and the service.
  #
  # Measured 2026-09-21: this file and its hostile twin both failed exactly that way on
  # their first ever run, on the same bay, in the same parallel run. The server was right
  # both times; the scenario had not declared its own state.
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true


  # The TransactionEvent's `userId` is schema-required (transaction-event-request.schema.json)
  # and it is a SUBJECT, `^sub_[a-zA-Z0-9]+$` (common/user-id.schema.json) — not a user uuid.
  #
  # THIS STEP USED TO READ `GET /api/v1/me` -> `data.id`, WHICH IS THE UUID. Measured
  # 2026-09-22 on the first run that got far enough to send the frame: the server answered
  # `Rejected`, reason `/userId: The string should match pattern: ^sub_[a-zA-Z0-9]+$`. The
  # `/me` resource (`UserResource.php:22-27`) exposes id/name/email/phone and no subject at
  # all, so the old capture could never have produced a conformant frame.
  #
  # A pass is the door that publishes one. The subject is derived from the user
  # (`UserSubject::fromUserId`, called by both `PassIssuer:93` and
  # `AuthorizeOfflineSessionAction:219`), so the pass minted here and the auth-form grant
  # minted below resolve to the SAME `sub_*` for this identity — which is why reading it off
  # the pass is not a detour. `security/offline-fraud-rapid-transactions.yaml` reaches it the
  # same way and has been passing on it. The grant's own response does not carry it:
  # `OfflineAuthResource` returns authId/sessionId/signedAuthorization and no `sub`.
  #
  # The pass is swept with this run's identity — `buildTeardownTestUsersSql` deletes
  # `offline_passes` by user_id — so it leaves nothing behind.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/offline/passes"
    body:
      deviceId: "{{runDeviceId}}"
      serviceIds:
        - "{{serviceId_1}}"
      maxUses: 1
      maxTotalCredits: 100
      durationHours: 1
    expect_status: 201
    capture:
      actingUserSub: "data.attributes.sub"

  # --- Mint the auth-form grant this file settles -------------------------------
  # THE PREMISE THAT KEPT THIS FILE SKIPPED WAS FALSE. It carried
  # `skip_when_pooled: "...no UAT API mints one..."`. Measured 2026-09-21 against the
  # deployed tree: POST /api/v1/sessions/offline-auth EXISTS — routes/api/v1/sessions.php:53
  # -> OfflineAuthController::store — and answers 201 carrying `authId` and `sessionId`
  # (app/Http/Resources/Offline/OfflineAuthResource.php). Those are exactly the two values
  # the TransactionEvent below was said to need out of band, so the file mints its own grant
  # and captures them instead of demanding a --var.
  #
  # The route is gated `feature:offline_mode_enabled` + `org.context` + `org.member` and it
  # DEBITS the wallet at signing time, so it needs the per-scenario identity the pool mints
  # (offline_enabled=true, funded) and that identity's organisation — which is why this works
  # in a pooled run and could not have worked from a bare --station run.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/organizations"
    expect_status: 200
    capture:
      org_id: "data.0.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/offline-auth"
    headers:
      X-Organization-Id: "{{captured.org_id}}"
    body:
      stationId: "{{stationId}}"
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"
      requestedDurationSeconds: 300
      appNonce: "{{runAppNonce}}"
      deviceId: "{{runDeviceId}}"
    expect_status: 201
    capture:
      authId: "data.authId"
      grantSessionId: "data.sessionId"

  # --- Auth-form TransactionEvent: settle the server-signed grant ---
  - action: send
    message: TransactionEvent
    payload:
      offlineTxId: "{{runOfflineTxId}}"
      authId: "{{captured.authId}}"
      sessionId: "{{captured.grantSessionId}}"
      userId: "{{captured.actingUserSub}}"
      deviceId: "{{runDeviceId}}"
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"
      startedAt: "2026-01-01T10:00:00.000Z"
      endedAt: "2026-01-01T10:05:00.000Z"
      durationSeconds: 300
      creditsCharged: 30
      receipt:
        data: "placeholder-overwritten-by-SendStep-sign"
        signature: "placeholder-overwritten-by-SendStep-sign"
        signatureAlgorithm: "ECDSA-P256-SHA256"
      txCounter: 1

  - action: wait_for
    message: TransactionEvent
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Rejected"
