# Placeholders overridable via --var KEY=VALUE on `simulator run`:
#   {{stationId}}, {{serialNumber}}
#
# SERVER BRANCH REACHED
#   csms-server app/Shared/Protocol/Middleware/VerifyIncomingMiddleware.php:51-65
#     if ($receivedMac === null || $receivedMac === '') {
#         Log::warning('VerifyIncomingMiddleware: MAC field missing on a message that must carry one', ...);
#         $this->emitSecurityEvent($stationId, $action, ..., 'MAC_MISSING');
#         return VerificationResult::rejected('MAC field missing on a message that must carry one');
#     }
#   A DIFFERENT branch from security/mac-verification-failed-drops-request.yaml:
#   different reason string, different event label, and a different log LEVEL
#   (warning here, critical there). It is reached earlier, before the session key
#   is even looked up (:69), so an absent mac is refused whether or not the server
#   still holds a key for this station.
#
#   `mac` is OPTIONAL in common/mqtt-envelope.schema.json (absent from `required`,
#   `minLength: 1`), which is why omitting it is schema-VALID and therefore
#   reaches the MAC gate at all. Sending `"mac": ""` would instead be a schema
#   rejection — a different gate, which answers on the wire.
#
# WHAT IT CANNOT SHOW
#   Nothing observable distinguishes this from MAC_VERIFICATION_FAILED at the
#   station: both end in `return null` at MessageDispatcher.php:169 and publish
#   nothing. The discriminating signals — reason string, log level, the
#   `security_events` audit row — are server-internal, and there is no REST
#   surface that exposes them (verified: no security-events route in routes/).
#   So this file proves the message was REFUSED, not WHY. The why is pinned by
#   the branch citation above and by the unit test on the tamper mode.
#
# WHY `omit` IS NOT THE SAME AS THE STATION HAVING NO KEY
#   MessageSender still requires a real session key before it will publish an
#   omitted-mac message (proved in MessageSender.tamperMac.test.ts). A keyless
#   station is a different server branch — SESSION_KEY_UNAVAILABLE at :69 — and
#   that one is reached by the SERVER's key expiring, not by anything a station
#   can send. See the COULD NOT section of the arc report.
#
# REQUIRES OSPP_MESSAGE_SIGNING_MODE=All on the server. Under `None` the gate is
#   skipped at :37 and the mac-less Heartbeat is answered; the scenario then fails
#   at expect_silence, which is it correctly reporting that the gate is off.
name: "MAC Missing Drops Request"
description: "Publish a Heartbeat with no mac field at all on a station that holds a session key. The server must refuse it silently; a clean Heartbeat on the same connection must still be answered."
# NO SERVER-STATE ASSERTION IS POSSIBLE — MAC FAILURES ARE WIRE-SILENT BY DESIGN.
# VerifyIncomingMiddleware ends in rejected() -> MessageDispatcher:169 `return
# null`: no error Response is published, the connection is not dropped, and the
# worker records the message as handled. A REQUEST or RESPONSE simply vanishes;
# an EVENT goes to the DLQ, also silently. There is nothing on the wire to
# wait_for and nothing in a table to read — the SILENCE is the behaviour, which
# is why this file asserts the absence of a reply rather than the presence of one.
#
# The one place the branch IS observable is Prometheus:
# csms_mqtt_mac_verification_failures_total, labelled by action and reason, which
# incremented first-ever on 2026-08-10 for exactly these two files. No api_call
# can assert on it — /metrics is Prometheus text and expect_body calls
# response.json(). security_events stays 0 here and correctly so: spec 5.7 needs
# 3 failures per 60s per station, and one probe is under threshold.
#
# Closing this needs a metrics-scrape step in the runner, not a scenario edit.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot. The RESPONSE carries the session key; the station must HOLD one for
  #     this to be "withheld the mac" rather than "had nothing to sign with". ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # Baseline: the link answers a signed Heartbeat.
  - action: send
    message: Heartbeat
    messageType: Request

  - action: wait_for
    message: Heartbeat
    messageType: Response
    timeout_ms: 15000

  # --- The mac-less send. ---
  - action: send
    message: Heartbeat
    messageType: Request
    tamper_mac: omit

  # THE ASSERTION: the mac-less Request is never answered.
  - action: wait_for
    message: Heartbeat
    messageType: Response
    timeout_ms: 6000
    expect_silence: true

  # --- THE CONTROL. The silence above is only attributable because this one
  #     comes back on the same connection immediately afterwards. ---
  - action: send
    message: Heartbeat
    messageType: Request

  - action: wait_for
    message: Heartbeat
    messageType: Response
    timeout_ms: 15000

  # Server-minted and REQUIRED on heartbeat-response.schema.json; nothing in this
  # scenario supplies it.
  - action: assert
    field: "payload.serverTime"
    exists: true

  # 1000ms: the probe above is dropped silently, so there is no Response to
  # synchronise on — the metric write races the consumer exactly as a DB write would.
  - action: delay
    ms: 1000

  # THE ASSERTION — the first this file has ever had about its own subject, and
  # it is honest about being a weak one.
  #
  # This branch is WIRE-SILENT by construction (see the note above): the
  # middleware drops the message, publishes nothing and does not disconnect, so
  # there is no Response to wait_for and no row to read. /metrics is the ONLY
  # surface on which it is observable at all, and it was unreachable until the
  # runner grew expect_body_text — response.json() was unconditional, and
  # Prometheus exposition format is text/plain.
  #
  # WHAT IT PROVES: the branch is wired and has fired — the series exists with a
  # nonzero value for reason="MAC_MISSING". Before this the file asserted only
  # SILENCE, which is indistinguishable from the probe never having been sent at
  # all: a scenario that failed to publish anything passed identically.
  #
  # WHAT IT DOES NOT PROVE: that THIS run incremented it. The counter carries
  # only action and reason labels — no station, no run — so it is global and
  # cumulative, and a series left behind by any earlier run satisfies this. A
  # per-run assertion would need capture-then-compare arithmetic the DSL does not
  # have; that is the honest next capability, not something to fake with a
  # tighter regex.
  #
  # Regex form (/…/) rather than a literal: a Prometheus line is full of regex
  # metacharacters and the label ORDER is not guaranteed, so matching on
  # reason= alone inside the brace group survives a label being added or reordered.
  - action: api_call
    method: GET
    url: "{{target_url}}/metrics"
    expect_status: 200
    expect_body_text:
      - /csms_mqtt_mac_verification_failures_total\{[^}]*reason="MAC_MISSING"[^}]*\} [1-9]/
