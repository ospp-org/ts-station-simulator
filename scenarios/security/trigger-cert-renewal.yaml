name: "Trigger Certificate Renewal"
description: >
  Boot station, trigger TriggerCertificateRenewal via API, observe the REQUEST on the wire.
  KNOWN GAP — no TriggerCertificateRenewal RESPONSE and no SignCertificate CSR are ever sent:
  scenario mode registers no TriggerCertificateRenewalHandler (ScenarioRunner.ts:766-769) and
  this file ENDS at the wait_for below. The renewal round-trip it is named for is unproven;
  only the server-to-station dispatch is.

# Platform-managed cert lifecycle — platform admin + omit_org_header (NULL team).
# See certificate-install.yaml for the full rationale.
auth:
  email_env: UAT_E2E_PLATFORM_ADMIN_EMAIL
  password_env: UAT_E2E_PLATFORM_ADMIN_PASSWORD
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Trigger TriggerCertificateRenewal via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/trigger-cert-renewal"
    omit_org_header: true
    body:
      certificateType: "StationCertificate"
    expect_status: 202

  # Nothing auto-responds. This file ends at this wait_for — see the KNOWN GAP above.
  - action: wait_for
    message: TriggerCertificateRenewal
    messageType: Request
    timeout_ms: 15000
