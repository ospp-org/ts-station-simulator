name: "Offline Pass Authorization Rejected"
description: "Boot station and send an AuthorizeOfflinePass request with an expired offline pass, then verify the server rejects it."
skip: true
skip_reason: >-
  RE-VERIFIED 2026-08-15 — the reason this file carried until today was FALSE, and its true status
  is UNKNOWN. It said "Requires sandbox to have invalid/expired offline pass data". It does not:
  the expired pass is a LITERAL in this file (expiresAt 2024-06-01, long past; issuedAt
  2024-01-01), so the scenario constructs its own fixture and depends on no seeded data at all.
  LEFT SKIPPED AND MARKED, deliberately, because whether it would pass cannot be settled by
  reading it — that needs deleting the skip and running, which is a decision for whoever owns the
  offline profile, not a side effect of a docs audit.
  Two things to fix BEFORE un-skipping, or its green will not mean anything.
  (1) THE ASSERTION IS TOO WEAK TO CARRY ITS OWN NAME — still true — BUT THE REMEDY THIS REASON
  NAMED IS IMPOSSIBLE, corrected 2026-09-05. It asserts only `status == Rejected`. The pass also
  carries `signature: "test_sig"`, which is not an ECDSA-P256 signature, so a refusal for the bad
  signature produces exactly the same green as a refusal for expiry — and this file is named for
  expiry. That half stands. What does not is the fix it asked for: "an errorCode assertion naming
  the expiry refusal". THERE IS NO SUCH FIELD. `authorize-offline-pass-response.schema.json` is
  `additionalProperties: false` and its properties are exactly `status`, `sessionId`,
  `durationSeconds`, `creditsAuthorized`, `reason` — measured identical at the pinned
  `@ospp/protocol` 0.26.0 AND at the 0.29.0 the server vendors, so this was never true and no
  version bump makes it true. csms-server `089fa56a` reached the same conclusion from the other
  side, excluding AuthorizeOfflinePassHandler from 3003's new `details.cause` requirement
  "by construction: it answers on a wire response with no Error Object at all".
  THE ACHIEVABLE FIX IS `reason`, and a sibling already does it:
  `offline-pass-refused-the-three-a-station-meets.yaml` discriminates three refusals on that one
  field, and since csms-server `WireRefusalReason::format()` the sentence carries a machine
  token in front of it. Assert the token here, not a code.
  A REASON THAT NAMES AN IMPOSSIBLE REMEDY IS WORSE THAN A BARE ONE: it reads as a small
  well-understood task and is unstartable, which is a good way to spend 163 days skipped. The
  age report is what surfaced it (audit A9-40, 2026-09-05).
  (2) ITS RUNTIME DEPENDENCIES ARE UNRESOLVED HERE. It takes {{bayId_1}} and {{serviceId_1}} from
  pool hydration, and AuthorizeOfflinePass may additionally require the identity to have offline
  enabled — pooled runs are commonly launched with --no-offline-enable. Neither is determinable
  from this file; both must be confirmed against the target before the skip comes off.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: true
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- AuthorizeOfflinePass with expired pass ---
  - action: send
    message: AuthorizeOfflinePass
    payload:
      offlinePassId: "opass_a000000002"
      offlinePass:
        passId: "opass_a000000002"
        sub: "sub_testuser01"
        deviceId: "dev_test001"
        issuedAt: "2024-01-01T00:00:00.000Z"
        expiresAt: "2024-06-01T00:00:00.000Z"
        policyVersion: 1
        revocationEpoch: 0
        offlineAllowance:
          maxTotalCredits: 5000
          maxUses: 10
          maxCreditsPerTx: 500
          allowedServiceTypes:
            - "svc_wash_basic"
        constraints:
          minIntervalSec: 60
          stationOfflineWindowHours: 24
          stationMaxOfflineTx: 100
        signatureAlgorithm: "ECDSA-P256-SHA256"
        signature: "test_sig"
      deviceId: "dev_test001"
      counter: 1
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"

  # --- Wait for response ---
  - action: wait_for
    message: AuthorizeOfflinePass
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Rejected"
