name: "Offline Pass Authorization Rejected"
description: "Boot station and send an AuthorizeOfflinePass request with an expired offline pass, then verify the server rejects it."
skip: true
skip_reason: >-
  RE-VERIFIED 2026-08-15 — the reason this file carried until today was FALSE, and its true status
  is UNKNOWN. It said "Requires sandbox to have invalid/expired offline pass data". It does not:
  the expired pass is a LITERAL in this file (expiresAt 2024-06-01, long past; issuedAt
  2024-01-01), so the scenario constructs its own fixture and depends on no seeded data at all.
  LEFT SKIPPED AND MARKED, deliberately, because whether it would pass cannot be settled by
  reading it — that needs deleting the skip and running, which is a decision for whoever owns the
  offline profile, not a side effect of a docs audit.
  MEASURED 2026-09-05 AGAINST THE SERVER, and the answer is worse than "too weak": THIS FILE
  CANNOT PROVE WHAT IT IS NAMED FOR, and no assertion fixes that.
  (1) THE EXPIRY BRANCH IS UNREACHABLE FROM THIS FIXTURE. PassValidator.php runs ECDSA
  signature verification as CHECK 1 (:60-118) and expiry as CHECK 2 (:124-148). This file's
  pass carries `signature: "test_sig"`, which is not an ECDSA-P256 signature, so it refuses at
  check 1 with OFFLINE_PASS_INVALID and never reaches the expiry test. The `expiresAt
  2024-06-01` literal is inert.
  (2) NOR CAN THE FIXTURE BE FIXED HERE. Reaching check 2 needs a pass SERVER-SIGNED over a
  past expiry, and nothing mints one: POST /api/v1/offline/passes derives
  `expiresAt = issuedAt + durationHours` (PassIssuer.php:71-74) and the request bounds
  durationHours to `min:1, max:24` (IssueOfflinePassRequest.php:66-71), so the earliest
  obtainable expiry is ONE HOUR IN THE FUTURE. The signing key is the server's. A scenario
  would have to wait out a real hour; the corpus's longest file runs ~16 minutes.
  (3) THE PREVIOUS REASON ASKED FOR SOMETHING THAT CANNOT EXIST — corrected here. It said the
  file "needs an errorCode assertion naming the expiry refusal".
  `authorize-offline-pass-response.schema.json` is `additionalProperties: false` with exactly
  status / sessionId / durationSeconds / creditsAuthorized / reason — measured identical at
  the pinned 0.29.0 and at 0.26.0 before it, so no bump makes it true. csms-server `089fa56a`
  reached the same conclusion from the other side, excluding AuthorizeOfflinePassHandler from
  3003's new `details.cause` "by construction: it answers on a wire response with no Error
  Object at all". A reason naming an impossible remedy reads as a small task and is
  unstartable; that is how this file spent 163 days.
  WHAT IS BUILDABLE, and it is the only thing that is: assert the `reason` TOKEN and RENAME the
  file to what it actually exercises — a SIGNATURE refusal. `payload.reason` would read
  `OFFLINE_PASS_INVALID: Offline pass signature verification failed`, matched the way
  offline-pass-refused-the-three-a-station-meets.yaml matches its three (token prefix primary,
  exact bytes secondary). That is a real proof of a real branch.
  NOT DONE HERE, deliberately: that sibling already covers OFFLINE_PASS_INVALID via device
  binding, so a fourth signature file buys one arm of check 1 and costs the corpus a file whose
  name has meant "expiry" since it was written. Whoever owns the offline profile should decide
  between renaming this one and deleting it. WHAT IT MUST NOT BECOME is a file that asserts
  `status == Rejected` and is called an expiry test.
  (4) RUNTIME DEPENDENCIES, unchanged and still unresolved: it takes {{bayId_1}} and
  {{serviceId_1}} from pool hydration, and AuthorizeOfflinePass may require the identity to have
  offline enabled — pooled runs are commonly launched with --no-offline-enable.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: true
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- AuthorizeOfflinePass with expired pass ---
  - action: send
    message: AuthorizeOfflinePass
    payload:
      offlinePassId: "opass_a000000002"
      offlinePass:
        passId: "opass_a000000002"
        sub: "sub_testuser01"
        deviceId: "dev_test001"
        issuedAt: "2024-01-01T00:00:00.000Z"
        expiresAt: "2024-06-01T00:00:00.000Z"
        policyVersion: 1
        revocationEpoch: 0
        offlineAllowance:
          maxTotalCredits: 5000
          maxUses: 10
          maxCreditsPerTx: 500
          allowedServiceTypes:
            - "svc_wash_basic"
        constraints:
          minIntervalSec: 60
          stationOfflineWindowHours: 24
          stationMaxOfflineTx: 100
        signatureAlgorithm: "ECDSA-P256-SHA256"
        signature: "test_sig"
      deviceId: "dev_test001"
      counter: 1
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"

  # --- Wait for response ---
  - action: wait_for
    message: AuthorizeOfflinePass
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Rejected"
