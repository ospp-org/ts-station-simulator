name: "Offline Pass Authorization Accepted"
description: "Boot a station, obtain a genuine server-signed offline pass via POST /api/v1/offline/passes, then present it via AuthorizeOfflinePass and verify the server accepts it."
skip: true
skip_reason: >-
  BLOCKED ON THE SDK RELEASE (2026-10-22, csms-server offline group 1). Since group 1 the server
  issues the frozen pass of offline-pass.md - devicePublicKey and keyId in, the station limits
  out - and the released SDK pair (ospp/protocol and @ospp/protocol 0.41.0, schemas of spec
  v0.44.0) still validates AuthorizeOfflinePass against the pass it replaces, additionalProperties
  false at both levels: no pass is valid under both. This file presents an issued pass in that
  message, so this simulator's outbound check and the server's inbound one refuse it before any
  handler runs. It runs again when the release lands (csms-server TODO, offline group 2, step 1);
  the Partial-B proofs it leads to - an exact authorization, a refusal above the per-wash limit -
  are group 3's.
# --- C-015 (issue-then-present) -------------------------------------------
# OSPP offline passes are signed by the SERVER (the issuer) and verified
# against the server's own ECDSA P-256 key — the station never holds a pass
# signing key (spec/profiles/offline/offline-pass.md "Signing"; canonical form
# spec/06-security.md §4.8). A station that fabricated its own signature would
# be a forgery and is correctly rejected (error 2002 OFFLINE_PASS_INVALID) —
# which is exactly why the old `signature: "test_sig"` placeholder failed.
#
# So this scenario fetches a real, server-signed pass from the issuance API and
# presents it verbatim — just like a mobile app does (get a pass online, present
# it offline). The signed `offlinePass` object is forwarded byte-for-byte via
# typed capture injection ({{captured.offlinePass}} resolves to the captured
# object, not a stringified copy), so the server's canonical-form re-verification
# matches the original signature.
# --------------------------------------------------------------------------
#
# STATUS 2026-08-10: THIS FILE CANNOT PASS. THE SERVER ISSUES A PASS THE WIRE
# SCHEMA FORBIDS. No assertion was added, because a shape that has never been
# observed working cannot be asserted against.
#
# Measured, with the reason read off the wire rather than inferred:
#
#   AuthorizeOfflinePass -> Response {status: "Rejected", reason:
#     "/offlinePass: Additional object properties are not allowed: organization_id"}
#
# The two halves, each verified:
#   - The server PUTS it there. OfflinePassDto::toArray():38 and :65 emit
#     `'organization_id' => $this->organizationId`, and the comment at :54 cites
#     "Per OSPP v0.4.2 offline-pass.md §2, `organization_id` is a REQUIRED..."
#   - The schema FORBIDS it. common/offline-pass.schema.json (@ospp/protocol
#     0.13.0) is `additionalProperties: false` over exactly passId, sub, deviceId,
#     issuedAt, expiresAt, policyVersion, revocationEpoch, offlineAllowance,
#     constraints, signatureAlgorithm, signature. `organization_id` is not among
#     them.
#
# So this is a VERSION CONFLICT, not a scenario bug and not a forgery: the server
# implements the v0.4.2 pass shape while the deployed schema is the v0.11.x one.
# The consequence is not confined to this file — a real mobile app doing exactly
# what this scenario does (fetch a pass online, present it verbatim) is rejected
# too. Offline pass authorization is broken end to end on the money path, and it
# fails at schema validation BEFORE any wallet, signature or replay check runs.
#
# THIS CORRECTS A STANDING ATTRIBUTION. The offline-pass failures have been
# recorded as the wallet gap (pooled wallets seed at balance 0 and
# AuthorizeOfflineSessionAction pre-debits with allowNegative:false). That is a
# real gap, but it is NOT what fails here — the request never gets far enough to
# touch a wallet. Do not "fix" this by funding the fixture or by flipping
# allowNegative; neither would move this file.
#
# WHAT TO ASSERT ONCE THE CONFLICT IS RESOLVED — the surface exists and is good:
# GET /api/v1/offline/passes/{passId}/status returns OfflinePassStatusResource,
# whose usage block is SERVER-DERIVED, not echoed:
#     data.attributes.usage.usedCount        1   (after this one presentation)
#     data.attributes.usage.remainingUses    9   (maxUses 10 minus usedCount)
#     data.attributes.usage.remainingCredits     (maxTotalCredits minus spent)
# That is the assertion this file wants, and the only read-back surface in the
# whole offline block: routes/api/v1/offline.php exposes GET /passes, POST
# /passes, POST /reconcile and GET /passes/{passId}/status — and nothing that
# reads an offline_transactions row back at all.
# --------------------------------------------------------------------------
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: true
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 5000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- Declare the bay AVAILABLE before depending on it ---
  # MEASURED 2026-09-10, and this step is the repair for a 4-in-6 flake.
  #
  # This file used to go straight from boot to AuthorizeOfflinePass, depending on ambient bay
  # state it never established. In a pooled run that state is not ambient — it is SHARED. The
  # pool is 5 stations x 2 bays = 10 bays for 149 scenarios at 5 workers, and **37** scenarios
  # report a program unavailable (`available: false`) and run pooled. When one of them had just
  # marked the bay this scenario was allocated, the server refused with
  #
  #   reason="SERVICE_UNAVAILABLE: Program 1 on bay bay_... was reported unavailable by the
  #           station"
  #
  # — which is the SERVER BEING RIGHT. It must not authorize a program the station itself said
  # is unavailable. The race was in the fixture, not in the server, and the distinction matters:
  # nothing in `PassValidator`'s thirteen checks was ever involved, which is why reading them
  # found nothing.
  #
  # The refusal was invisible for six full runs because AssertStep reported only the compared
  # field and discarded `payload.reason`. It is quoted above because that is now fixed.
  #
  # Declaring the state this scenario depends on is the narrow fix: it makes the file
  # self-sufficient instead of ordering-dependent, and costs one frame.
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true

  # --- Obtain a real, server-signed offline pass (C-015) ---
  # api_call auto-authenticates with the target's credentials. We scope the pass
  # to the service we will request so it is in the pass's allowedServiceTypes.
  # The full signed pass (data.attributes) is captured for verbatim presentation.
  # A pass is issued only to a device key the phone attested (app-contract.md 3, 3.6):
  # a challenge, the attestation over it, then the request with the key. The limits and the
  # lifetime are the platform offline policy's, and the answer is 200 {offlinePass, trustBundle}.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/offline/attestation-challenges"
    expect_status: 200
    capture:
      attestationChallenge: "challenge"
  - action: attest_device
    challenge: "{{captured.attestationChallenge}}"
    capture:
      devicePublicKey: devicePublicKey
      deviceKeyAttestation: deviceKeyAttestation
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/offline/passes"
    body:
      deviceId: "dev_test001"
      devicePublicKey: "{{captured.devicePublicKey}}"
      deviceKeyAttestation: "{{captured.deviceKeyAttestation}}"
    expect_status: 200
    capture:
      offlinePass: "offlinePass"
      offlinePassId: "offlinePass.passId"
      passDeviceId: "offlinePass.deviceId"

  # --- Present the pass via AuthorizeOfflinePass ---
  # offlinePass is injected as a TYPED object (not String()-coerced), so the
  # server re-canonicalizes the exact bytes it signed and the ECDSA check passes.
  # deviceId mirrors the issued pass (check 4 device binding); counter=1 is the
  # first use of a freshly-issued pass (check 10 anti-replay).
  - action: send
    message: AuthorizeOfflinePass
    payload:
      offlinePassId: "{{captured.offlinePassId}}"
      offlinePass: "{{captured.offlinePass}}"
      deviceId: "{{captured.passDeviceId}}"
      counter: 1
      bayId: "{{bayId_1}}"
      serviceId: "{{serviceId_1}}"

  # --- Wait for response ---
  - action: wait_for
    message: AuthorizeOfflinePass
    messageType: Response
    timeout_ms: 10000
    capture:
      offlineSessionId: "payload.sessionId"

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- The station ends the session the pass opened (the session-end rule, 2026-10-13: a
  #     session is ended only by the station's end record), as
  #     offline-pass-refused-the-three-a-station-meets.yaml closes its control's. Until
  #     2026-10-13 this file stopped at the Accepted and left the session open, claiming the
  #     bay for the next scenario on this station until the sweep closed it. ---
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.offlineSessionId}}"
      bayId: "{{bayId_1}}"
      reason: "Local"
      actualDurationSeconds: 2
      creditsCharged: 0

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Finishing"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: false
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Finishing"
      programs:
        - programNumber: 1
          available: true
