name: "SignCertificate Rejected (malformed CSR) — correlation regression guard"
description: "Boot, then send SignCertificate Request with a truncated PEM CSR. Server's SignCertificateHandler throws RuntimeException → Rejected, and the Response MUST echo the inbound messageId. Regression guard for fix at csms-server@406925b — covers Rejected exception path (line 68) distinct from empty-csr scenario which covers Rejected early-return (line 52)."
# NO SERVER-STATE ASSERTION IS POSSIBLE — A REJECTED CSR WRITES NOTHING.
# The subject is that a MALFORMED (not empty) CSR is refused AND that the refusal
# is CORRELATED to the request that caused it.
#
# WHAT THIS FILE ACTUALLY ASSERTS — two things, both wire properties:
#   1. `payload.status == "Rejected"` on the SignCertificate Response;
#   2. the correlation itself, enforced by the runner: `wait_for ... Response`
#      auto-correlates on messageId, so a Response echoing the wrong one never
#      matches and the step times out instead of passing.
#
# It does NOT assert errorCode or errorText, and it must not: this header used to
# claim "the server-produced errorCode 1005 / errorText INVALID_MESSAGE_FORMAT on
# the Response ... are already asserted". Neither assert exists in this file, and
# the values named are the SIBLING's. sign-certificate-empty-csr-rejected-
# correlated.yaml carries this same header block verbatim and does assert both —
# the sentence was copied from it and left describing a file it no longer
# described.
#
# The values are wrong for this file even as an aspiration. 1005
# INVALID_MESSAGE_FORMAT is produced by the payload-schema gate BEFORE any
# SignCertificate handling runs, because `csr: ""` violates the schema's
# `^-----BEGIN CERTIFICATE REQUEST-----` — which is why the sibling's send
# carries `expect_invalid: true` and this one does not. The CSR below is
# schema-valid and truncated, so it reaches the handler and is refused there
# (RuntimeException -> Rejected). That path answers a different code, and pinning
# it is the discrimination arc's work, not this guard's.
#
# No certificate row exists for a CSR that was never signed — and no route reads
# the certificates table in any case; see trigger-cert-renewal.yaml for that
# survey.
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- SignCertificate Request with truncated PKCS#10 (per spec test vector) ---
  - action: send
    message: SignCertificate
    messageType: Request
    payload:
      certificateType: "StationCertificate"
      csr: "-----BEGIN CERTIFICATE REQUEST-----\nMIIBIjCByAIBADBmMQswCQYDVQQGEwJVUzELMAkGA1UECAwCQ0ExFDASBgNVBAcM\nC0xvcyBBbmdlbGVzMRIwEAYDVQQKDAlBY21lQ29ycDEgMB4GA1UEAwwXc3RuX2Ex\nYjJjM2Q0LmV4YW1wbGUuY29tMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE\n-----END CERTIFICATE REQUEST-----"

  # --- Wait for Response correlated by messageId (regression guard) ---
  - action: wait_for
    message: SignCertificate
    messageType: Response
    timeout_ms: 5000

  - action: assert
    field: "payload.status"
    equals: "Rejected"
