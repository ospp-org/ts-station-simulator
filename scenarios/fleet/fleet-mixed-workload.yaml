name: "Fleet Mixed Workload"
description: "Single station performing a full lifecycle (boot, bays available, start session, meter values, stop session, session ended, back to available). Designed to be run with many parallel workers to simulate fleet load."
station:
  stationId: "{{stationId}}"
  bayCount: 2
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
steps:
  # --- Boot ---
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 10000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # --- All Bays Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{bayId_2}}"
      bayNumber: 2
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # --- Trigger StartService via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 300
    expect_status: 201

  # --- Wait for StartService ---
  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      sessionId: "payload.sessionId"
      bayId: "payload.bayId"
      serviceId: "payload.serviceId"
      durationSeconds: "payload.durationSeconds"

  # --- Accept StartService ---
  - action: send
    message: StartService
    messageType: Response
    payload:
      status: "Accepted"

  # --- StatusNotification Occupied ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  # --- MeterValues 1 ---
  - action: delay
    ms: 500

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-03-22T10:01:00.000Z"
      values:
        liquidMl: 500
        energyWh: 100

  # --- MeterValues 2 ---
  - action: delay
    ms: 500

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-03-22T10:02:00.000Z"
      values:
        liquidMl: 1200
        energyWh: 250

  # --- MeterValues 3 ---
  - action: delay
    ms: 500

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      sessionId: "{{captured.sessionId}}"
      timestamp: "2026-03-22T10:03:00.000Z"
      values:
        liquidMl: 1800
        energyWh: 400

  # --- Trigger StopService via API ---
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}/stop"
    expect_status: 200

  # --- Wait for StopService ---
  - action: wait_for
    message: StopService
    messageType: Request
    timeout_ms: 15000

  # --- Accept StopService ---
  - action: send
    message: StopService
    messageType: Response
    payload:
      status: "Accepted"
      actualDurationSeconds: 60
      creditsCharged: 100
      meterValues:
        liquidMl: 1800
        energyWh: 400

  # --- SessionEnded ---
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.sessionId}}"
      bayId: "{{captured.bayId}}"
      reason: "TimerExpired"
      actualDurationSeconds: 60
      creditsCharged: 100
      meterValues:
        liquidMl: 1800
        energyWh: 400

  # --- StatusNotification Available ---
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true

  - action: delay
    ms: 1000

  # THE ASSERTION — two findings, one of them a correction.
  #
  # FIRST: this is not an aggregate or throughput file. One station, one full
  # lifecycle, DESIGNED to be run with many workers — so the observable is
  # ordinary session state, and *fleet* names the run mode, not the subject. The
  # same held for both its siblings, so the fleet suite was never a ceiling.
  #
  # SECOND, and measured rather than assumed: it settles PRO-RATA, not full.
  # This was written expecting 500 — it books duration_seconds 300, and its
  # trailing SessionEnded says TimerExpired, which is the fullCharge arm. The
  # server charged 100 and refunded 400.
  #
  # The cause is the same one stop-service.yaml records, and this is the second
  # independent file to show it: settlement happens on the STOP, not on the
  # SessionEnded. This scenario calls POST /sessions/{id}/stop (:156) and answers
  # with actualDurationSeconds 60, so the operator-stop path bills delivered time
  # — ceil(60/60 * 100) = 100 against 500 authorized, refund 400. By the time the
  # SessionEnded arrives the session is already terminal and its reason never
  # chooses an arm. The wire says TimerExpired; the money says voluntary stop.
  #
  # So a file that looked like a duplicate of the fullCharge arm is actually a
  # second witness for the operator-stop arm — which is worth more, because that
  # arm had exactly one file until now.
  #
  # refund_amount 400 is derived (SessionResource:53-56) and appears in no
  # message this scenario sends: the non-echoed half, since 100 coincides with
  # what the StopService Response declares.
  - action: api_call
    method: GET
    url: "{{target_url}}/api/v1/sessions/{{captured.sessionId}}"
    expect_status: 200
    expect_body:
      data.status: "completed"
      data.credits_charged: 100
      data.refund_amount: 400
