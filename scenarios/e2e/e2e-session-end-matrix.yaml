name: "E2E — Session-End Reason Matrix (v0.4.0 §25)"
skip_when_pooled: "Self-provisions its own org + fresh station (action: provision) — collides with --bootstrap-pool's shared pool (409 Station already exists). Proven standalone in the gate; run with --scenario <file> --target uat."
description: |
  Verifies the v0.4.0 SessionEndedHandler match arms by running four
  autonomous-stop variants against a single freshly-onboarded 4-bay
  station, one per bay. Each variant emits SessionEnded as a station-
  initiated EVENT (not via the server's POST /sessions/{id}/stop API),
  which is the production reality for: user pressed Stop button, credit
  pool exhausted, offline-pass revocation, and seqNo / finalSeqNo edge
  cases.

  Variants:
    Bay 1 — LocalOutOfCredit  → CompleteSessionAction with creditsChargedOverride=0
    Bay 2 — Deauthorized       → SecurityEvent + FailSessionAction with creditsChargedOverride=0
    Bay 3 — TimerExpired (multi MeterValues, seqNo monotonic)
                                → CompleteSessionAction; verify meter_values rows seq_no 0..N-1
    Bay 4 — TimerExpired + late MeterValues (finalSeqNo terminal marker)
                                → CompleteSessionAction; verify late MeterValues with
                                  seqNo > finalSeqNo are discarded

  The 'Local' variant is intentionally omitted — E2E B
  (e2e-returning-customer-session.yaml) already covers the equivalent
  end-state via the server-initiated POST /stop → StopService Response
  Accepted path; SessionEnded(Local) lands in the same
  CompleteSessionAction match arm so the persistence semantics are
  identical.

  Pre-conditions: clean UAT (no user with e2e-matrix-{{stationId}}@onestoppay.dev)
  AND the permanent platform admin user seeded (E2EBootstrapSeeder, see
  scenario A doc). Each run uses a fresh stn_<random> station — re-running
  is safe; the platform admin is never touched. Everything it creates is
  torn down per-run (see `creates:` below).

  ---------------------------------------------------------------------
  THE CATALOG PATH THIS FILE NOW TAKES, AND WHAT IS NOT YET PROVEN ON IT
  ---------------------------------------------------------------------
  From 2026-08-06 to 2026-08-14 this file stopped at `PUT …/catalog` on a
  closed loop — the push demanded a (bay, program) binding, the only route
  that wrote one minted its own serviceId and stamped a kind the push then
  refused. None of the four SessionEnded arms this file exists to verify
  was reached; the blocker sat upstream of every one of them. See
  e2e-new-customer-onboarding.yaml for the full note and
  docs/MEASURED-catalog-unreachable-on-new-station-20260813T110000Z.md for
  the request-by-request measurement.

  Neither gate was relaxed. csms-server added a third door — `POST
  …/catalog/publish` (bb8c28f), no body, carrying the catalog the SERVER
  holds — and made `POST …/services` honour a caller-supplied `serviceId`
  (99cab60). Registration now REFUSES `bays[].services` outright (dbc45f7,
  422), which it had been accepting and dropping; that block is gone below.

  This file is the one with FOUR services actually in use — one arm per bay,
  each started by `service_id`. So it is also the file where the honoured
  identifier does the most work: every one of the four `/sessions/start`
  calls below names an id this scenario chose, not one the server emitted.

  The publish reports `withheld` — services the server holds but could not
  put on the wire for want of a binding — and this file asserts it is
  EMPTY. All four bays are sold to here, so a missing binding would
  eventually surface as a failed start; it would surface FOUR arms later,
  as an INVALID_SERVICE naming a bay, rather than at the step that caused
  it. The assertion moves that failure back to where it belongs.

  NOT PROVEN YET. Every claim above was read at source in csms-server
  99cab60. The route is not deployed to UAT as of 2026-08-15 (404 there),
  and no arm of this matrix has run since 2026-08-06. The first full
  post-deploy run is the measurement, and it is the first time these four
  arms will have been exercised at all in over a week.

  Do not seed the binding with privileged SQL to force a green: that 202
  is one the production API cannot produce.

# C-018: platform admin (ambient, permanent) creates the org. The
# customer (registered fresh per run) becomes tenant_owner on org-create
# and drives every tenant op via the identity switch below.
auth:
  email_env: UAT_E2E_PLATFORM_ADMIN_EMAIL
  password_env: UAT_E2E_PLATFORM_ADMIN_PASSWORD

defer_mqtt_connect: true

# THIS FILE COULD NOT HAVE PASSED WITHOUT THIS LINE, whatever the catalog did.
# It declares 166.6 s of `delay:` — nearly twice the 90 s
# DEFAULT_SCENARIO_TIMEOUT_MS, before a single request is sent. The bound landed
# 2026-08-10 (57063cc), four days after the catalog gate started failing this file
# at step 16, so the two have never met: the file always died upstream of the
# delays. Fixing the catalog is what would have made the runner's own timeout the
# next failure — reported as "exceeded its 90000ms budget", the RUNNER giving up,
# naming none of the four arms this file exists for.
#
# 300 s is an ESTIMATE, and the only one of the three e2e budgets that is: this
# file has no measured end-to-end duration (it last completed before the
# 2026-08-06 gate, and no duration was recorded). Derived from its siblings, whose
# non-delay overhead measured 30.5 s and 32.0 s for 30 and 42 steps — 63 steps
# here puts it near 45 s, so ~215 s expected. Replace with the real number after
# the first post-deploy run rather than leaving a guess in place.
scenario_timeout_ms: 300000

station:
  bayCount: 4
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
    auto_retry_boot: false

steps:
  # =========================================================================
  # Setup (mirrors scenarios A + B)
  # =========================================================================

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/auth/register"
    body:
      name: "E2E Matrix User {{stationId}}"
      email: "e2e-matrix-{{stationId}}@onestoppay.dev"
      password: "E2eTestPass123!"
      password_confirmation: "E2eTestPass123!"
    expect_status: 201
    capture:
      user_email: "user.email"
    # `creates:` is what makes this run cleanable. Cleanup used to live only inside
    # `--bootstrap-pool`, which this file is `skip_when_pooled`-excluded from by design —
    # so every standalone run left its customer, org, location and station on UAT. The
    # value comes from the response: teardown deletes the id the SERVER answered with.
    creates:
      user: "user.email"

  # Platform admin (auto-auth from `auth:`) creates the org with the
  # customer as owner_email — CreateOrganizationAction inserts the
  # Member row and MemberObserver syncs the Spatie tenant_owner pivot.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/organizations"
    body:
      name: "E2E Org {{stationId}}"
      owner_email: "{{captured.user_email}}"
    expect_status: 201
    capture:
      organization_id: "data.organization.id"
    # The org this run CREATED, and the only one teardown may delete. That delete
    # CASCADEs (cloned Spatie roles, members, service definitions, any remaining
    # station), which is why it is declared here from the 201 rather than matched by
    # name later.
    creates:
      organization: "data.organization.id"

  # Identity switch — log in as the customer (now tenant_owner). All
  # subsequent api_calls use the customer's JWT, not the platform
  # admin's (whose NULL-scoped role would be Spatie-filtered once
  # X-Organization-Id is set).
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/auth/login"
    body:
      email: "{{captured.user_email}}"
      password: "E2eTestPass123!"
    expect_status: 200
    set_auth_token: "data.access_token"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/locations"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      name: "E2E Location {{stationId}}"
      address: "Strada Test 1, Bucuresti"
      latitude: 44.4268
      longitude: 26.1025
      city: "Bucharest"
      country: "RO"
    expect_status: 201
    capture:
      location_id: "data.id"
    creates:
      location: "data.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      stationId: "{{stationId}}"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      locationId: "{{captured.location_id}}"
      # No `services:` under a bay. Registration writes NOTHING into the services
      # tier (RegisterStationAction.php:16-21) and never did; csms-server dbc45f7
      # stopped accepting the field it was not going to write — `'bays.*.services'
      # => ['prohibited']`, 422. The services are created below, after provisioning.
      bays:
        - bayNumber: 1
        - bayNumber: 2
        - bayNumber: 3
        - bayNumber: 4
    expect_status: 201
    # Recorded here, at registration, rather than at `provision` — the row exists from
    # this 201 onward, so a run that dies before provisioning still has it cleaned up.
    creates:
      station: "data.station_id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/provisioning-tokens"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      note: "E2E session-end-matrix scenario run"
    expect_status: 201
    capture:
      provisioning_token: "data.rawToken"

  - action: provision
    token_var: "provisioning_token"
    serial_number: "{{serialNumber}}"
    bay_count: 4

  - action: connect_mqtt

  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
        - bayNumber: 3
          programNumbers: [1]
        - bayNumber: 4
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      # deviceManagementSupported — see e2e-new-customer-onboarding.yaml for the full
      # note. Short form: `POST …/catalog/publish` below dispatches UpdateServiceCatalog,
      # a Device Management action, and a station that never declared the profile is
      # pre-empted with 409 / 6008 COMMAND_PRE_EMPTED (details.wouldBe 2007, reason
      # device_management_not_declared) before anything is published. The check is shared
      # by both catalog entry points (UpdateServiceCatalogAction.php:215-233), so this is
      # as required now as it was for the old push. Measured on UAT 2026-08-13.
      capabilities:
        bleSupported: false
        offlineModeSupported: true
        meterValuesSupported: true
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # Heartbeat keep-alive. Scenario-mode stations don't auto-heartbeat
  # (BootNotificationHandler autoReact=false), but a real station would. This
  # run (~357s) far outlives the csms 3.5x30=105s application-silence window:
  # only an actual Heartbeat refreshes the server's HeartbeatTracker
  # (Status/MeterValues/SessionEnded do NOT), so without this the
  # station:check-heartbeats sweep marks the station offline mid-run and Bay 4's
  # POST /sessions/start (after the 60s Bay3->Bay4 drain) fails STATION_OFFLINE.
  # Heartbeat at the server's advertised 30s interval; torn down on disconnect.
  - action: start_heartbeat
    interval_sec: 30

  # No clock-skew delay here any more (see scenarios A/B). Proven on UAT
  # 2026-07-31 with the delay removed: stn_a05d0979, all 4 bays `available`,
  # watermark populated.

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_2}}"
      bayNumber: 2
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_3}}"
      bayNumber: 3
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_4}}"
      bayNumber: 4
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # =========================================================================
  # Operator: configure the catalog on the server, then publish it to the
  # device — create x4, bind x4, publish. Replaces the single `PUT …/catalog`
  # this file carried until 2026-08-15. Only the publish touches the wire; the
  # first eight calls are synchronous and need no device. Prices are
  # 10/15/20/25 credits/minute, unchanged from the old push.
  #
  # ALL FOUR MATTER HERE. Each arm below starts on its own bay with its own
  # service_id, so unlike its two sibling files this one has no service it
  # could leave unbound and still finish.
  # =========================================================================

  # `serviceId` is honoured as of csms-server 99cab60 — it used to be discarded
  # unread, so the caller bound one id and pushed another. The `expect_body` is
  # what goes red if that is reverted, and all four arms depend on it.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      serviceId: "{{serviceId_1}}"
      serviceName: "Basic Wash"
      serviceKind: "UserDuration"
      pricingType: "PerMinute"
      priceCreditsPerMinute: 10
      available: true
    expect_status: 201
    expect_body:
      data.serviceId: "{{serviceId_1}}"
    # The station_services UUID, NOT the serviceId — the binding route is keyed
    # by it and nothing else in the response identifies the row.
    capture:
      station_service_1: "data.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      serviceId: "{{serviceId_2}}"
      serviceName: "Premium Wash"
      serviceKind: "UserDuration"
      pricingType: "PerMinute"
      priceCreditsPerMinute: 15
      available: true
    expect_status: 201
    expect_body:
      data.serviceId: "{{serviceId_2}}"
    capture:
      station_service_2: "data.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      serviceId: "{{serviceId_3}}"
      serviceName: "Dry"
      serviceKind: "UserDuration"
      pricingType: "PerMinute"
      priceCreditsPerMinute: 20
      available: true
    expect_status: 201
    expect_body:
      data.serviceId: "{{serviceId_3}}"
    capture:
      station_service_3: "data.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      serviceId: "{{serviceId_4}}"
      serviceName: "Vacuum"
      serviceKind: "UserDuration"
      pricingType: "PerMinute"
      priceCreditsPerMinute: 25
      available: true
    expect_status: 201
    expect_body:
      data.serviceId: "{{serviceId_4}}"
    capture:
      station_service_4: "data.id"

  # ---------- Operator: bind each service to the program it runs ----------
  # `bayId` is the SERVER-assigned wire id captured by ProvisionStep.
  # `programNumber: 1` is checked against `bay_programs` as the station declared
  # them at provisioning; an undeclared ordinal is refused 422 / 3017 here rather
  # than at every wash. The echoed `bayNumber` pins service N to bay N — and in
  # THIS file a crossed binding is not hypothetical damage: bay 3's arm asserts
  # meter_values seq_no 0..N-1 for the session it started, so a service bound to
  # the wrong bay would corrupt which arm is being measured, not merely fail it.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services/{{captured.station_service_1}}/binding"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      bayId: "{{captured.bayId_1}}"
      programNumber: 1
    expect_status: 201
    expect_body:
      binding.bayNumber: 1
      binding.programNumber: 1

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services/{{captured.station_service_2}}/binding"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      bayId: "{{captured.bayId_2}}"
      programNumber: 1
    expect_status: 201
    expect_body:
      binding.bayNumber: 2
      binding.programNumber: 1

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services/{{captured.station_service_3}}/binding"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      bayId: "{{captured.bayId_3}}"
      programNumber: 1
    expect_status: 201
    expect_body:
      binding.bayNumber: 3
      binding.programNumber: 1

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services/{{captured.station_service_4}}/binding"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      bayId: "{{captured.bayId_4}}"
      programNumber: 1
    expect_status: 201
    expect_body:
      binding.bayNumber: 4
      binding.programNumber: 1

  # ---------- Operator: publish the server's catalog to the device ----------
  # No body — the route takes none and ignores anything posted, which is exactly
  # why the legacy push's kind guard has nothing to refuse here.
  #
  # `withheld: []` is the assertion `expect_status: 202` cannot make. Publish
  # does not refuse a catalog over an unbound service — it ships what is sellable
  # and NAMES the rest — so without this, a missing binding would travel silently
  # through the publish, through the 35 s drain, and surface as a refused
  # /sessions/start up to four arms later, naming a bay instead of the step that
  # caused it. Inverting the verdict is one deleted binding step. `serviceCount:
  # 4` catches the other direction (a create deleted, not a binding), and counts
  # only rows this scenario created on a station and org it created.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/catalog/publish"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    expect_status: 202
    expect_body:
      serviceCount: 4
      withheld: []

  - action: wait_for
    message: UpdateServiceCatalog
    messageType: Request
    # Aligned with global default bump (5s → 15s, commit 9e57ce2). Sprint B2
    # timeout sweep — CSMS catalog-update issue during E2E onboarding can
    # exceed 5s; sister scenario from Sprint B P5.1/P5.11 fix (commit 3fdc7a6).
    timeout_ms: 15000
    capture:
      catalog_msg_id: "messageId"

  - action: send
    message: UpdateServiceCatalog
    messageType: Response
    correlationId: "{{captured.catalog_msg_id}}"
    payload:
      status: "Accepted"

  # 35 s drain — Path B consumer single-threaded latency (see audit §33).
  - action: delay
    ms: 35000

  # =========================================================================
  # Bay 1 — LocalOutOfCredit
  #
  # Server: SessionEndedHandler::LOCAL_OUT_OF_CREDIT → CompleteSessionAction
  # with creditsChargedOverride=0 (forceFullRefund). Expected DB state:
  #   sessions.status = completed
  #   sessions.credits_charged = 0 (server-forced regardless of payload)
  #   sessions.duration_actual = 2
  # =========================================================================

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{captured.bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 60
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      session_id_1: "payload.sessionId"
      start_msg_id_1: "messageId"

  - action: send
    message: StartService
    messageType: Response
    correlationId: "{{captured.start_msg_id_1}}"
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_1}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 500

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId_1}}"
      sessionId: "{{captured.session_id_1}}"
      timestamp: "2026-05-13T10:00:00.000Z"
      values:
        liquidMl: 300
        energyWh: 60

  # SessionEnded EVENT — station-autonomous, reason=LocalOutOfCredit.
  # NOTE: seqNo/finalSeqNo are NOT injected — injectSeqNoFields early-returns in
  # scenario mode (SendStep.ts:236, station.sessions is never populated), so this
  # SessionEnded goes out with neither field. The payload's creditsCharged
  # is informational only — server forces 0 via creditsChargedOverride.
  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.session_id_1}}"
      bayId: "{{captured.bayId_1}}"
      reason: "LocalOutOfCredit"
      actualDurationSeconds: 2
      creditsCharged: 0

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_1}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
  # 20 s drain — Path B latency before next variant.
  - action: delay
    ms: 20000

  # =========================================================================
  # Bay 2 — Deauthorized
  #
  # Server: SessionEndedHandler::DEAUTHORIZED → SecurityEventReceived
  # dispatched (type=SessionDeauthorized) AND FailSessionAction with
  # creditsChargedOverride=0. Expected DB state:
  #   sessions.status = failed
  #   sessions.credits_charged = 0
  #   sessions.fail_reason = 'SessionEnded: deauthorized (offline pass revoked)'
  #   security_events row with type=SessionDeauthorized, severity=Warning
  # =========================================================================

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{captured.bayId_2}}"
      service_id: "{{serviceId_2}}"
      duration_seconds: 60
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      session_id_2: "payload.sessionId"
      start_msg_id_2: "messageId"

  - action: send
    message: StartService
    messageType: Response
    correlationId: "{{captured.start_msg_id_2}}"
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_2}}"
      bayNumber: 2
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 500

  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.session_id_2}}"
      bayId: "{{captured.bayId_2}}"
      reason: "Deauthorized"
      actualDurationSeconds: 2
      creditsCharged: 0

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_2}}"
      bayNumber: 2
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
  - action: delay
    ms: 20000

  # =========================================================================
  # Bay 3 — TimerExpired with multiple MeterValues (seqNo monotonic)
  #
  # KNOWN GAP — 5 MeterValues with NO seqNo, then SessionEnded (TimerExpired) with
  # no seqNo/finalSeqNo: nothing is auto-injected in scenario mode (SendStep.ts:236).
  # The stated DB expectation below (meter_values rows with seq_no 0..4) therefore
  # CANNOT hold — the rows are written with a null seq_no. To make this real the
  # frames need explicit `seqNo:` values, as sessions/meter-values-seqno-*.yaml do.
  # Expected DB state:
  #   sessions.status = completed
  #   sessions.final_seq_no = 5
  #   meter_values rows for session_id_3 have seq_no = 0, 1, 2, 3, 4
  # =========================================================================

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{captured.bayId_3}}"
      service_id: "{{serviceId_3}}"
      duration_seconds: 60
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      session_id_3: "payload.sessionId"
      start_msg_id_3: "messageId"

  - action: send
    message: StartService
    messageType: Response
    correlationId: "{{captured.start_msg_id_3}}"
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_3}}"
      bayNumber: 3
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 300

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId_3}}"
      sessionId: "{{captured.session_id_3}}"
      timestamp: "2026-05-13T10:10:00.000Z"
      values:
        liquidMl: 200
        energyWh: 40

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId_3}}"
      sessionId: "{{captured.session_id_3}}"
      timestamp: "2026-05-13T10:10:10.000Z"
      values:
        liquidMl: 400
        energyWh: 80

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId_3}}"
      sessionId: "{{captured.session_id_3}}"
      timestamp: "2026-05-13T10:10:20.000Z"
      values:
        liquidMl: 600
        energyWh: 120

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId_3}}"
      sessionId: "{{captured.session_id_3}}"
      timestamp: "2026-05-13T10:10:30.000Z"
      values:
        liquidMl: 800
        energyWh: 160

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId_3}}"
      sessionId: "{{captured.session_id_3}}"
      timestamp: "2026-05-13T10:10:40.000Z"
      values:
        liquidMl: 1000
        energyWh: 200

  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.session_id_3}}"
      bayId: "{{captured.bayId_3}}"
      reason: "TimerExpired"
      actualDurationSeconds: 50
      creditsCharged: 17

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_3}}"
      bayNumber: 3
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
  # Larger drain before Bay 4 — by this point the consumer has 3 bays' worth
  # of inbound traffic (Start/Status/MV/SessionEnded × 3) accumulated in
  # mqtt:incoming. 60s gives the single-threaded worker (drift 11, ~5s/msg)
  # enough headroom that Bay 4's /sessions/start does not race a still-
  # draining queue and hit SessionReadySignal's 10s timeout.
  - action: delay
    ms: 60000

  # =========================================================================
  # Bay 4 — TimerExpired + late MeterValues (finalSeqNo terminal marker)
  #
  # KNOWN GAP — two false mechanisms in one paragraph, both corrected here:
  # (a) nothing is auto-injected (SendStep.ts:236), so the 3 MeterValues and the
  #     SessionEnded carry no seqNo/finalSeqNo at all; and
  # (b) SendStep NEVER removes a session from station.sessions — the only deletes are
  #     Station.ts:503 and StopServiceHandler.ts:71, neither reachable in scenario mode.
  # Consequence: sessions.final_seq_no stays NULL, so the server's discard guard
  # (MeterValuesHandler.php:60) is a no-op and the 'late' seqNo 99/100 frames below are
  # INGESTED, not discarded. The working version of this proof is
  # sessions/session-final-seqno-terminal.yaml, which sends the StopService Response
  # carrying finalSeqNo and asserts on the server-written meter_values collection.
  # Left as written here rather than half-repaired. Two late MeterValues with
  # explicit seqNo=99 and 100 propagate to the broker. Server WOULD
  # discard them per spec v0.4.0 §3.2 (seqNo > finalSeqNo).
  # Expected DB state:
  #   sessions.status = completed
  #   sessions.final_seq_no = 3
  #   meter_values rows for session_id_4 have seq_no = 0, 1, 2 (NOT 99, 100)
  # =========================================================================

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{captured.bayId_4}}"
      service_id: "{{serviceId_4}}"
      duration_seconds: 60
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      session_id_4: "payload.sessionId"
      start_msg_id_4: "messageId"

  - action: send
    message: StartService
    messageType: Response
    correlationId: "{{captured.start_msg_id_4}}"
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_4}}"
      bayNumber: 4
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 300

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId_4}}"
      sessionId: "{{captured.session_id_4}}"
      timestamp: "2026-05-13T10:20:00.000Z"
      values:
        liquidMl: 300
        energyWh: 60

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId_4}}"
      sessionId: "{{captured.session_id_4}}"
      timestamp: "2026-05-13T10:20:10.000Z"
      values:
        liquidMl: 600
        energyWh: 120

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId_4}}"
      sessionId: "{{captured.session_id_4}}"
      timestamp: "2026-05-13T10:20:20.000Z"
      values:
        liquidMl: 900
        energyWh: 180

  - action: send
    message: SessionEnded
    messageType: Event
    payload:
      sessionId: "{{captured.session_id_4}}"
      bayId: "{{captured.bayId_4}}"
      reason: "TimerExpired"
      actualDurationSeconds: 30
      creditsCharged: 13

  # Late MeterValues with explicit seqNo. SendStep never auto-incremented and never
  # removed any session (see the KNOWN GAP above); the explicit YAML values propagate.
  # The server does NOT discard them here, because no finalSeqNo was ever recorded.
  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId_4}}"
      sessionId: "{{captured.session_id_4}}"
      timestamp: "2026-05-13T10:20:30.000Z"
      seqNo: 99
      values:
        liquidMl: 1200
        energyWh: 240

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId_4}}"
      sessionId: "{{captured.session_id_4}}"
      timestamp: "2026-05-13T10:20:40.000Z"
      seqNo: 100
      values:
        liquidMl: 1500
        energyWh: 300

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_4}}"
      bayNumber: 4
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
  # 30 s final drain — give consumer time to process all messages before
  # external DB verification.
  - action: delay
    ms: 30000
