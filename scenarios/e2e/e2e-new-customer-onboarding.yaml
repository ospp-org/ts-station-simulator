name: "E2E — New Customer Onboarding"
skip_when_pooled: "Self-provisions its own org + fresh station (action: provision) — collides with --bootstrap-pool's shared pool (409 Station already exists). Proven standalone in the gate; run with --scenario <file> --target uat."
description: |
  End-to-end production-like business journey with THREE real identities
  matching production RBAC (C-018):

    1. PLATFORM ADMIN (ambient, permanent in UAT — `e2e-platform-admin@
       onestoppay.ro`, role `platform_admin` NULL-scoped, seeded once via
       `php artisan db:seed --class=E2EBootstrapSeeder`) creates the org
       on behalf of the new customer. The scenario never creates or
       deletes this user — see `auth:` block below.

    2. CUSTOMER (`e2e-{{stationId}}@onestoppay.dev`, fresh per run): signs
       up via POST /v1/auth/register, then — after org-create — is
       auto-promoted to `tenant_owner` of the new org by
       CreateOrganizationAction (Member row with role=tenant_owner +
       MemberObserver sync to Spatie). The scenario switches identity to
       this user via `set_auth_token` and drives all tenant ops
       (location, station, provisioning-token, catalog, sessions).

    3. STATION (mTLS, fresh per run): identified by its `stn_<random>`
       station_id and the cert issued by /api/v1/stations/provision.
       Drives the MQTT wire — Boot, Status, MeterValues, Start/Stop.

  Pre-conditions: clean UAT (no user with the generated
  e2e-{{stationId}}@onestoppay.dev email) and the permanent platform
  admin user seeded. Each run uses a fresh stn_<random> station; the
  customer user, org, location, station, and cert are created and torn
  down per-run (see `creates:` below). The platform admin is never touched.

  ---------------------------------------------------------------------
  THE CATALOG PATH THIS FILE NOW TAKES, AND WHAT IS NOT YET PROVEN ON IT
  ---------------------------------------------------------------------
  From 2026-08-06 to 2026-08-14 this file stopped at `PUT
  /api/v1/admin/stations/{id}/catalog` on a closed loop: the push demanded
  a (bay, program) binding, and the only route that wrote one minted its
  OWN serviceId and stamped a `service_kind` the push then refused. The
  request-by-request measurement of both refusals is in
  docs/MEASURED-catalog-unreachable-on-new-station-20260813T110000Z.md.

  NEITHER GATE WAS RELAXED. csms-server added a THIRD door instead —
  `POST /api/v1/admin/stations/{id}/catalog/publish` (bb8c28f), which
  takes no body and sends the catalog as the SERVER holds it. With no
  caller prices in the request there is nothing for the kind guard to
  refuse, so both guards stay in force and both are now inapplicable to
  this sequence. Two smaller server changes make the sequence writable
  from a scenario at all:

    - `POST …/services` HONOURS a caller-supplied `serviceId`
      (StationServiceCatalogController.php:186-192). It used to discard it
      unread, which is precisely why the binding and the push could never
      name the same service. A collision is a named 422, `code:
      SERVICE_ID_TAKEN` — not a 500, and not a silent substitution.
    - registration REFUSES `bays[].services` (dbc45f7 —
      `'bays.*.services' => ['prohibited']`, 422). Registration never
      wrote the services tier (RegisterStationAction.php:16-21); the field
      was accepted and dropped, and this file sent one at every
      registration. The block is gone from the step below — keeping it
      would now 422 the registration itself.

  So the catalog steps below are: create four services carrying the ids
  this file names, bind each to program 1 of its own bay, then publish.
  The publish answers 202 and reports `withheld` — the services the server
  holds but could not put on the wire for want of a binding. All four are
  bound here, so `withheld` must be EMPTY, and this file asserts that: a
  run that bound only half would publish 202 just the same.

  NOT PROVEN YET — the honest half. Every claim above was read at source
  in csms-server 99cab60; none of it has been exercised from this file.
  The route is not deployed to UAT as of 2026-08-15, where it answers 404,
  so running this file there today would measure the deploy, not the
  sequence. The first full run after the deploy is the measurement; until
  then this file is a prepared claim.

  Do NOT make this file green by seeding the binding with privileged SQL
  (the way PoolBootstrap does for the pooled suite) — a 202 the production
  API cannot produce would stop this file describing a journey a real
  operator can take. That was true of the old path and is why the new one
  had to be a route rather than a fixture.

# C-018 sim-side: resolve `context.apiCredentials` from these env vars
# (source `~/.config/osp-e2e-secrets.env` before running). target.credentials
# (UAT_EMAIL = tenant_owner per PoolBootstrap doctrine) is preserved for
# every other scenario in the suite — this override is scenario-local.
auth:
  email_env: UAT_E2E_PLATFORM_ADMIN_EMAIL
  password_env: UAT_E2E_PLATFORM_ADMIN_PASSWORD

defer_mqtt_connect: true

# MEASURED 72.6 s end to end (UAT 2026-08-14, csms-server 99cab60), against 55.5 s of
# declared `delay:` — so 17.1 s of real work. Supersedes the 86 s of UAT 2026-07-31.
#
# That comparison answers the worry this comment used to carry. The old note said the nine
# api_calls the new catalog sequence adds would "spend that margin" against the 90 s
# default. They do not: this run has MORE steps than the 86 s one and finished 13 s FASTER,
# because the same deploy removed a 15 s bay-status delay this file no longer needs. The
# sequence is not what threatens the budget.
#
# The bound still matters and is still not an assertion — exceeding it makes the runner
# abandon the scenario and report "exceeded its 90000ms budget", naming itself rather than
# whatever the file was doing. 150 s is ~2x the measured run.
scenario_timeout_ms: 150000

station:
  bayCount: 4
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
    auto_retry_boot: false

steps:
  # ---------- Identity #2 self-registers (unauthenticated endpoint).
  # The customer is created with the global `customer` role. They are NOT
  # yet a tenant_owner — that happens at the next step when the platform
  # admin creates the org with `owner_email` pointing here.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/auth/register"
    body:
      name: "E2E SMB Owner {{stationId}}"
      email: "e2e-{{stationId}}@onestoppay.dev"
      password: "E2eTestPass123!"
      password_confirmation: "E2eTestPass123!"
    expect_status: 201
    capture:
      user_id: "user.id"
      user_email: "user.email"
    # `creates:` is what makes this run cleanable. Cleanup used to live only inside
    # `--bootstrap-pool`, which this file is `skip_when_pooled`-excluded from by design —
    # so every standalone run left its customer, org, location and station on UAT (eight
    # `E2E Org …` orgs were still there on 2026-08-13). The value comes from the response,
    # not from the request body: teardown deletes the id the SERVER answered with.
    creates:
      user: "user.email"

  # ---------- Identity #1 (platform admin, auto-auth from `auth:` block)
  # creates the organization on behalf of the customer. Server-side:
  # CreateOrganizationAction.execute (line 91-106) finds the existing
  # customer via firstOrCreate(email=owner_email), inserts a Member row
  # with role=tenant_owner, and MemberObserver:78 syncs the Spatie pivot
  # so the customer holds the `tenant_owner` Spatie role on the new org
  # immediately after this 201 lands.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/organizations"
    body:
      name: "E2E Org {{stationId}}"
      owner_email: "{{captured.user_email}}"
    expect_status: 201
    capture:
      organization_id: "data.organization.id"
    # The org this run CREATED, and the only one teardown may delete. That delete
    # CASCADEs (cloned Spatie roles, members, service definitions, any remaining
    # station), which is exactly why it is declared here from the 201 rather than
    # matched by name later.
    creates:
      organization: "data.organization.id"

  # ---------- Identity switch: log in as the customer (now a
  # tenant_owner of the org just created) and replace the context JWT.
  # set_auth_token writes `context.authToken` directly; every subsequent
  # api_call in this scenario carries the customer's Authorization
  # header, NOT the platform admin's. The platform admin's role is
  # NULL-scoped and would be filtered out by Spatie once the next call
  # carries X-Organization-Id — running tenant ops as the platform admin
  # would 403 even though the platform admin is omnipotent at the
  # platform layer.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/auth/login"
    body:
      email: "{{captured.user_email}}"
      password: "E2eTestPass123!"
    expect_status: 200
    set_auth_token: "data.access_token"

  # ---------- Identity #2 (now tenant_owner): create location ----------
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/locations"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      name: "E2E Location {{stationId}}"
      address: "Strada Test 1, Bucuresti"
      latitude: 44.4268
      longitude: 26.1025
      city: "Bucharest"
      country: "RO"
    expect_status: 201
    capture:
      location_id: "data.id"
    creates:
      location: "data.id"

  # ---------- Operator: register station with 4 bays ----------
  # No `services:` under a bay. Registration writes NOTHING into the services tier
  # (RegisterStationAction.php:16-21) and never did — the array this file used to send
  # was read for `bayNumber` and dropped, so four service names travelled at every
  # registration and reached no table. csms-server dbc45f7 stopped accepting a field it
  # was not going to write: `'bays.*.services' => ['prohibited']`, answered 422 with
  # `errors["bays.0.services"]` naming the three routes that DO create a service. The
  # services are created below, after provisioning, where the bays they bind to exist.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      stationId: "{{stationId}}"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      locationId: "{{captured.location_id}}"
      bays:
        - bayNumber: 1
        - bayNumber: 2
        - bayNumber: 3
        - bayNumber: 4
    expect_status: 201
    # Recorded here, at registration, rather than at `provision` — the row exists from
    # this 201 onward, so a run that dies before provisioning still has it cleaned up.
    creates:
      station: "data.station_id"

  # ---------- Operator: issue provisioning token ----------
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/provisioning-tokens"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      note: "E2E new-customer-onboarding scenario run"
    expect_status: 201
    capture:
      provisioning_token: "data.rawToken"

  # ---------- Station: provision (CSR + receipt key + POST /stations/provision) ----------
  # Server returns 4 server-assigned 32-hex bayIds; ProvisionStep captures
  # them into bayId_1..4 (overriding the locally-generated values).
  - action: provision
    token_var: "provisioning_token"
    serial_number: "{{serialNumber}}"
    bay_count: 4

  # ---------- Station: MQTT-connect using the freshly-issued cert ----------
  - action: connect_mqtt

  # ---------- Station: BootNotification ----------
  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
        - bayNumber: 3
          programNumbers: [1]
        - bayNumber: 4
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      # deviceManagementSupported is what makes `POST …/catalog/publish` below reachable.
      # STILL REQUIRED after the catalog path changed, and worth stating because the route
      # it guards is no longer the one this note was written about: the profile check is
      # `requireDispatchableStation` (UpdateServiceCatalogAction.php:215-233), which BOTH
      # entry points go through — the capability is a fact about the DEVICE, identical
      # however the payload was built. UpdateServiceCatalog is one of the atomic Device
      # Management actions and the server MUST NOT dispatch one to a station that never
      # declared the profile (spec profiles/device-management §1; OSPP §5.1 rule 3 makes
      # NOT-STATED count as not-declared). Omitting the member leaves the column SQL NULL,
      # which `!== true` treats as not-declared.
      #
      # Measured on UAT 2026-08-13 with the member absent, stn_d26ebb76 — against the old
      # route, but the refusal is emitted from the shared pre-dispatch check, so publish
      # answers the same:
      #
      #   HTTP 409  {"error":{"code":"COMMAND_PRE_EMPTED","ospp_code":6008,
      #              "message":"Station does not support device management",
      #              "details":{"wouldBe":2007,"reason":"device_management_not_declared"}}}
      #
      # A station that publishes a catalog has the profile, so it says so.
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # Heartbeat keep-alive. Scenario-mode stations don't auto-heartbeat
  # (BootNotificationHandler autoReact=false), but a real station running a live
  # session would. This run measured 86s on 2026-07-31, ~19s under the csms
  # 3.5x30=105s application-silence window — a margin the nine api_calls of the
  # new catalog sequence have since eaten into, and which was incidental to begin
  # with (only an actual Heartbeat refreshes the server's HeartbeatTracker;
  # Status/MeterValues don't). This step is what makes the window a non-question
  # rather than a race the file happens to win. Torn down on disconnect.
  - action: start_heartbeat
    interval_sec: 30

  # No delay here, deliberately — and this note records why one used to be.
  #
  # A 15 s delay sat here from 2026-05-12 until 2026-07-31. `resetBaysToUnknown`
  # stamped `bay.updated_at` with the SERVER clock on every boot, and the
  # out-of-order guard then compared the next StatusNotification's envelope
  # timestamp (station clock) against it. A station whose clock trailed the
  # server's lost that comparison, its post-boot report was dropped, and the bay
  # stayed `unknown` — where /sessions/start answers BAY_NOT_READY. The delay
  # bought enough wall-clock for the station timestamp to clear the bar.
  #
  # csms-server 21f18c4 fixed it properly: the ordering floor moved off
  # `bays.updated_at` onto `bays.last_status_reported_at`, which only an ACCEPTED
  # report writes, which no server-internal reset advances, and which is NULL for
  # a never-reported bay — admitting its first report by construction.
  #
  # Proven on UAT 2026-07-31, after deploying that fix, rather than assumed:
  # this scenario ran with the delay removed and all four bays reached
  # `status = available` with `last_status_reported_at` populated. Same for
  # e2e-returning-customer-session (stn_764ec888) and e2e-session-end-matrix
  # (stn_a05d0979). Scenario duration fell 18.2 s -> 2.8 s.

  # ---------- Station: StatusNotification (4 bays Available) ----------
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_2}}"
      bayNumber: 2
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_3}}"
      bayNumber: 3
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_4}}"
      bayNumber: 4
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # =========================================================================
  # Operator: configure the catalog on the server, then publish it to the
  # device. Three routes, in this order, replacing the single `PUT …/catalog`
  # this file carried until 2026-08-15:
  #
  #   1. POST …/services                          — create, one call each
  #   2. POST …/services/{stationServiceId}/binding — where it physically runs
  #   3. POST …/catalog/publish                    — send the server's own catalog
  #
  # Only step 3 touches the wire; 1 and 2 are synchronous and need no device.
  # They sit here rather than immediately after `provision` because that is
  # where the old push sat and the narrative order is the same one an operator
  # follows — the station is up and reporting before its prices are set.
  #
  # Prices are 10/15/20/25 credits per minute, unchanged from the old push.
  # They now reach `station_services` at CREATE time (synchronously) instead of
  # at the end of the MQTT round-trip, so the 35 s drain below is no longer what
  # stands between the catalog and a sellable service — the StatusNotifications
  # still need it, so it stays.
  # =========================================================================

  # `serviceKind: UserDuration` — the customer names the duration
  # (`/sessions/start` sends `duration_seconds`), which is what this file does
  # below. It is REQUIRED on this route, and it is create-only: a later PUT that
  # names a different kind is refused 422 SERVICE_KIND_IMMUTABLE, because the kind
  # selects the settlement policy already snapshotted onto live sessions.
  #
  # `serviceId` is the whole reason this sequence exists. Until csms-server
  # 99cab60 the request had no `serviceId` rule, `validated()` dropped it, and the
  # server minted `svc_<16 hex>` of its own — so the caller bound one id and pushed
  # another, and the two doors could never name the same service. It is honoured
  # now, and the `expect_body` below is what would go red if that were reverted:
  # every `service_id` this file sends afterwards depends on it.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      serviceId: "{{serviceId_1}}"
      serviceName: "Basic Wash"
      serviceKind: "UserDuration"
      pricingType: "PerMinute"
      priceCreditsPerMinute: 10
      available: true
    expect_status: 201
    expect_body:
      data.serviceId: "{{serviceId_1}}"
    # `data.id` is the station_services UUID, and it is NOT the serviceId — the
    # binding route is keyed by it (`{stationServiceId}`, route-constrained to 36
    # chars of hex+dash). Capturing it is the only way to bind: nothing else in the
    # response identifies the row.
    capture:
      station_service_1: "data.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      serviceId: "{{serviceId_2}}"
      serviceName: "Premium Wash"
      serviceKind: "UserDuration"
      pricingType: "PerMinute"
      priceCreditsPerMinute: 15
      available: true
    expect_status: 201
    expect_body:
      data.serviceId: "{{serviceId_2}}"
    capture:
      station_service_2: "data.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      serviceId: "{{serviceId_3}}"
      serviceName: "Dry"
      serviceKind: "UserDuration"
      pricingType: "PerMinute"
      priceCreditsPerMinute: 20
      available: true
    expect_status: 201
    expect_body:
      data.serviceId: "{{serviceId_3}}"
    capture:
      station_service_3: "data.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      serviceId: "{{serviceId_4}}"
      serviceName: "Vacuum"
      serviceKind: "UserDuration"
      pricingType: "PerMinute"
      priceCreditsPerMinute: 25
      available: true
    expect_status: 201
    expect_body:
      data.serviceId: "{{serviceId_4}}"
    capture:
      station_service_4: "data.id"

  # ---------- Operator: bind each service to the program it runs ----------
  # `bayId` is the WIRE id the SERVER assigned at provisioning and ProvisionStep
  # captured — not the locally-generated one. `programNumber: 1` is checked
  # against `bay_programs`, which the station declared at provisioning; an
  # ordinal it never declared is refused 422 / 3017 PROGRAM_NOT_DECLARED at
  # binding time rather than at every wash.
  #
  # The response echoes bayNumber, so the assertion below pins that service N
  # landed on bay N. Without it a binding that named the wrong bay would still
  # answer 201, `withheld` would still be empty, and the file would still pass —
  # while /sessions/start on bay 1 asked for a service bound to bay 3.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services/{{captured.station_service_1}}/binding"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      bayId: "{{captured.bayId_1}}"
      programNumber: 1
    expect_status: 201
    expect_body:
      binding.bayNumber: 1
      binding.programNumber: 1

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services/{{captured.station_service_2}}/binding"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      bayId: "{{captured.bayId_2}}"
      programNumber: 1
    expect_status: 201
    expect_body:
      binding.bayNumber: 2
      binding.programNumber: 1

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services/{{captured.station_service_3}}/binding"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      bayId: "{{captured.bayId_3}}"
      programNumber: 1
    expect_status: 201
    expect_body:
      binding.bayNumber: 3
      binding.programNumber: 1

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services/{{captured.station_service_4}}/binding"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      bayId: "{{captured.bayId_4}}"
      programNumber: 1
    expect_status: 201
    expect_body:
      binding.bayNumber: 4
      binding.programNumber: 1

  # ---------- Operator: publish the server's catalog to the device ----------
  # No body. The route takes none, and anything posted is ignored — the payload
  # is built from `station_services` joined to `service_definitions`, which is
  # exactly why the kind guard on the legacy push has nothing to refuse here.
  # 202, then the same UpdateServiceCatalog Request over MQTT as before.
  #
  # WHAT THE TWO ASSERTIONS ARE FOR. `expect_status: 202` alone would pass on a
  # station where only one of the four services made it onto the wire: publish
  # does NOT refuse a catalog over an unbound service (v1 has no way to retire
  # one, so refusing would deadlock the station) — it ships what is sellable and
  # NAMES the rest in `withheld`. So:
  #
  #   withheld: []     — every service this file created reached the device.
  #                      Drop any one of the four binding steps above and this
  #                      goes red with `[{serviceId: svc_…, reason: "no (bay,
  #                      program) binding"}]`. Nothing else in this file would
  #                      notice: bays 2-4 are never sold to below.
  #   serviceCount: 4  — and there were four of them. This counts only what was
  #                      PUBLISHED, so it catches the other direction: a create
  #                      step deleted rather than a binding step. The count is
  #                      the scenario's own — fresh org, fresh station, and every
  #                      row on it was created by the four steps above — so it is
  #                      not a claim about state this file does not own.
  #
  # A renamed key fails too: `withheld` resolving to undefined is not equal to
  # `[]`, so this assertion cannot be satisfied by the field going missing.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/catalog/publish"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    expect_status: 202
    expect_body:
      serviceCount: 4
      withheld: []

  - action: wait_for
    message: UpdateServiceCatalog
    messageType: Request
    # Aligned with global default bump (5s → 15s, commit 9e57ce2). Sprint B2
    # timeout sweep — CSMS catalog-update issue during E2E onboarding can
    # exceed 5s; sister scenario from Sprint B P5.1/P5.11 fix (commit 3fdc7a6).
    timeout_ms: 15000
    capture:
      catalog_msg_id: "messageId"

  # Response messageId MUST equal request messageId so the server's
  # UpdateServiceCatalogResponseHandler can resolve the pendingCommands
  # entry (UpdateServiceCatalogResponseHandler.php:32).
  #
  # What an uncorrelated Response costs is now SMALLER than it was, and the
  # difference is worth stating rather than leaving the old warning to rot: the
  # handler skips persistence, but the prices already landed in
  # `station_services` when each service was CREATED above, so /sessions/start
  # would still quote correctly. What is lost is the station's acknowledgement
  # of the catalog it was sent — `current_catalog_version` and the row the
  # station itself confirmed. Still a real failure, no longer the pricing one.
  - action: send
    message: UpdateServiceCatalog
    messageType: Response
    correlationId: "{{captured.catalog_msg_id}}"
    payload:
      status: "Accepted"

  # Give Path B time to persist:
  #  - the StatusNotifications (bay rows transition unknown → available)
  #  - the catalog Response (UpdateServiceCatalogResponseHandler upserts services)
  # Empirical (2026-05-12 13:33 UTC): with a 20s delay the catalog persisted 23s
  # after the Response was published — the Path B consumer is single-threaded
  # (MqttConsume.php:67-87) and processes Boot + 4xStatusNotifications + catalog
  # Response sequentially at ~3-4s each. 35s = 6 messages * 5s/msg + 5s margin.
  #
  # ONE OF THE TWO REASONS FOR THIS DELAY IS GONE, and shrinking it is a change
  # this file must not make blind. Pricing no longer waits on the round-trip:
  # `price_credits_per_minute` was written synchronously by each `POST …/services`
  # above, so /sessions/start can no longer read NULL and answer 422
  # INVALID_SERVICE. What remains is the bay-status half — /sessions/start still
  # answers 3002 BAY_NOT_READY on a bay whose StatusNotification has not drained —
  # and that is unchanged and still needs most of this. Measure the drain on the
  # first post-deploy run before touching the number.
  - action: delay
    ms: 35000

  # ---------- Fund the customer this scenario registered ----------
  # `POST /v1/auth/register` opens every wallet at 0 (`RegisterAction.php:49`) and
  # `StartSessionAction.php:241-250` refuses a card-free start when balance <
  # creditsAuthorized — 402 / ospp_code 4001. The start below authorizes
  # ceil(60/60 × 10) = 10 credits, and before this step existed it got exactly that
  # refusal: "Wallet balance 0 does not cover 10 credits".
  #
  # Nothing else could have funded it. The pool's `wallet_balance:` declaration seeds a
  # POOL identity, and this file is `skip_when_pooled` — it never takes one. The funding
  # was wired where the bootstrap creates users; the path where a scenario creates its
  # own was missed.
  #
  # No amount here on purpose. The step reads the catalog this file just published and
  # applies the same rule that sizes the pool's default — the largest single
  # authorization the server can accept against it. Re-price a service above and the
  # funding follows with nothing to remember.
  - action: fund_wallet
    user_id: "{{captured.user_id}}"

  # ---------- Driver (same user): start session on bay 1 ----------
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{captured.bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 60
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      session_id: "payload.sessionId"
      start_msg_id: "messageId"

  - action: send
    message: StartService
    messageType: Response
    correlationId: "{{captured.start_msg_id}}"
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_1}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 500

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId_1}}"
      sessionId: "{{captured.session_id}}"
      timestamp: "2026-05-12T16:00:00.000Z"
      values:
        liquidMl: 500
        energyWh: 100

  # Wait for Path B to drain StartService Response (→ session.status=active),
  # StatusNotification Occupied, and MeterValues. /sessions/{id}/stop requires
  # session.status=active in DB; consumer single-threaded at ~5s/msg means
  # 3 messages need ~15s. Empirical (2026-05-12 13:39 UTC): with 500ms
  # delay the StartService Response was still pending → 409 SESSION_GENERIC
  # "cannot be stopped in current state: pending".
  - action: delay
    ms: 20000

  # ---------- Driver: stop session ----------
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/{{captured.session_id}}/stop"
    expect_status: 200

  - action: wait_for
    message: StopService
    messageType: Request
    timeout_ms: 10000
    capture:
      stop_msg_id: "messageId"

  - action: send
    message: StopService
    messageType: Response
    correlationId: "{{captured.stop_msg_id}}"
    payload:
      status: "Accepted"
      actualDurationSeconds: 60
      creditsCharged: 10
      meterValues:
        liquidMl: 500
        energyWh: 100
