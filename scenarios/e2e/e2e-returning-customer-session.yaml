name: "E2E — Returning Customer Session"
skip_when_pooled: "Self-provisions its own org + fresh station (action: provision) — collides with --bootstrap-pool's shared pool (409 Station already exists). Proven standalone in the gate; run with --scenario <file> --target uat."
description: |
  Validates the production-realistic "returning customer" loop: an SMB
  owner finishes the first wash, the station settles back to Available,
  the customer (or a new customer) immediately starts a second wash on
  the same bay, and that completes too. Exercises the same lifecycle
  primitives as scenario A but specifically checks the state-machine
  closure: session.completed → bay.Available → bay.Occupied → session
  #2 completes.

  Why two sessions and not one: scenario A already covers the first
  session. The discriminating signal here is that the SECOND session
  must be able to read the bay status, service pricing, and station
  state that the FIRST session left behind — without re-registration,
  re-provisioning, or re-pushing the catalog. If anything in the
  K1.C-server's persistence is non-idempotent (e.g. catalog overwrite
  on second PUT, bay status reset on session end, service price wipe),
  this scenario surfaces it.

  Pre-conditions: clean UAT (no user with the generated
  e2e-returning-{{stationId}}@onestoppay.dev email) AND the permanent
  platform admin user seeded (E2EBootstrapSeeder, see scenario A doc).
  Re-running the scenario is safe — each run uses a fresh stn_<random>;
  the platform admin is never touched. Everything it creates is torn
  down per-run (see `creates:` below).

  ---------------------------------------------------------------------
  THE CATALOG PATH THIS FILE NOW TAKES, AND WHAT IS NOT YET PROVEN ON IT
  ---------------------------------------------------------------------
  From 2026-08-06 to 2026-08-14 this file stopped at `PUT …/catalog` on a
  closed loop — the push demanded a (bay, program) binding, the only route
  that wrote one minted its own serviceId and stamped a kind the push then
  refused. See e2e-new-customer-onboarding.yaml for the full note and
  docs/MEASURED-catalog-unreachable-on-new-station-20260813T110000Z.md for
  the request-by-request measurement.

  Neither gate was relaxed. csms-server added a third door — `POST
  …/catalog/publish` (bb8c28f), no body, carrying the catalog the SERVER
  holds — and made `POST …/services` honour a caller-supplied `serviceId`
  (99cab60). Registration now REFUSES `bays[].services` outright (dbc45f7,
  422), which it had been accepting and dropping; that block is gone below.

  So the steps below create four services with the ids this file names,
  bind each to program 1 of its own bay, and publish. The publish reports
  `withheld` — services the server holds but could not put on the wire for
  want of a binding — and this file asserts it is EMPTY, because all four
  are bound. A run that bound only half would answer 202 just the same.

  WHAT THIS FILE'S OWN SUBJECT NOW RESTS ON. Its claim is that the SECOND
  session reads the bay status, pricing and station state the first left
  behind, "without re-registration, re-provisioning, or re-pushing the
  catalog". That is unchanged and now stronger: prices land in
  `station_services` at CREATE time rather than at the end of the catalog
  round-trip, so the second session reads a row written once, by a
  synchronous call, six steps earlier.

  NOT PROVEN YET. Every claim above was read at source in csms-server
  99cab60. The route is not deployed to UAT as of 2026-08-15 (404 there),
  and nothing below has been run end to end since the loop closed. The
  first full post-deploy run is the measurement.

  Do not seed the binding with privileged SQL to force a green: that 202
  is one the production API cannot produce.

# C-018: platform admin (ambient, permanent) creates the org. The
# customer (registered fresh per run) becomes tenant_owner on org-create
# and drives every tenant op via the identity switch below.
auth:
  email_env: UAT_E2E_PLATFORM_ADMIN_EMAIL
  password_env: UAT_E2E_PLATFORM_ADMIN_PASSWORD

defer_mqtt_connect: true

# THIS FILE COULD NOT HAVE PASSED WITHOUT THIS LINE, whatever the catalog did.
# It declares 91.0 s of `delay:` — more than the 90 s DEFAULT_SCENARIO_TIMEOUT_MS
# on its own, before a single request is sent — and last measured 123 s end to end
# (UAT 2026-07-31). The bound landed 2026-08-10 (57063cc), four days after the
# catalog gate started failing this file at step 16, so the two have never met: the
# file always died upstream of the delays. Fixing the catalog is what would have
# made the runner's own timeout the next failure, reported as "exceeded its
# 90000ms budget" — the RUNNER giving up, naming nothing about this file. Sized
# ~1.7x the measured run; replace with the real number after a post-deploy run.
scenario_timeout_ms: 210000

station:
  bayCount: 4
  stationModel: "WashPro X200"
  stationVendor: "SimCorp"
  behavior:
    accept_rate: 1.0
    response_delay_ms: [50, 200]
    auto_retry_boot: false

steps:
  # ---------- Setup (mirrors scenario A) ----------
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/auth/register"
    body:
      name: "E2E Returning Customer {{stationId}}"
      email: "e2e-returning-{{stationId}}@onestoppay.dev"
      password: "E2eTestPass123!"
      password_confirmation: "E2eTestPass123!"
    expect_status: 201
    capture:
      user_email: "user.email"
    # `creates:` is what makes this run cleanable. Cleanup used to live only inside
    # `--bootstrap-pool`, which this file is `skip_when_pooled`-excluded from by design —
    # so every standalone run left its customer, org, location and station on UAT. The
    # value comes from the response: teardown deletes the id the SERVER answered with.
    creates:
      user: "user.email"

  # Platform admin (auto-auth from `auth:`) creates the org with the
  # customer as owner_email — CreateOrganizationAction inserts the
  # Member row and MemberObserver syncs the Spatie tenant_owner pivot.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/organizations"
    body:
      name: "E2E Org {{stationId}}"
      owner_email: "{{captured.user_email}}"
    expect_status: 201
    capture:
      organization_id: "data.organization.id"
    # The org this run CREATED, and the only one teardown may delete. That delete
    # CASCADEs (cloned Spatie roles, members, service definitions, any remaining
    # station), which is why it is declared here from the 201 rather than matched by
    # name later.
    creates:
      organization: "data.organization.id"

  # Identity switch — log in as the customer (now tenant_owner). All
  # subsequent api_calls use the customer's JWT, not the platform
  # admin's (whose NULL-scoped role would be Spatie-filtered once
  # X-Organization-Id is set).
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/auth/login"
    body:
      email: "{{captured.user_email}}"
      password: "E2eTestPass123!"
    expect_status: 200
    set_auth_token: "data.access_token"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/locations"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      name: "E2E Location {{stationId}}"
      address: "Strada Test 1, Bucuresti"
      latitude: 44.4268
      longitude: 26.1025
      city: "Bucharest"
      country: "RO"
    expect_status: 201
    capture:
      location_id: "data.id"
    creates:
      location: "data.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      stationId: "{{stationId}}"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      locationId: "{{captured.location_id}}"
      # No `services:` under a bay. Registration writes NOTHING into the services
      # tier (RegisterStationAction.php:16-21) and never did; csms-server dbc45f7
      # stopped accepting the field it was not going to write — `'bays.*.services'
      # => ['prohibited']`, 422. The services are created below, after provisioning.
      bays:
        - bayNumber: 1
        - bayNumber: 2
        - bayNumber: 3
        - bayNumber: 4
    expect_status: 201
    # Recorded here, at registration, rather than at `provision` — the row exists from
    # this 201 onward, so a run that dies before provisioning still has it cleaned up.
    creates:
      station: "data.station_id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/provisioning-tokens"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      note: "E2E returning-customer-session scenario run"
    expect_status: 201
    capture:
      provisioning_token: "data.rawToken"

  - action: provision
    token_var: "provisioning_token"
    serial_number: "{{serialNumber}}"
    bay_count: 4

  - action: connect_mqtt

  - action: send
    message: BootNotification
    payload:
      stationId: "{{stationId}}"
      firmwareVersion: "1.0.0"
      stationModel: "WashPro X200"
      stationVendor: "SimCorp"
      serialNumber: "{{serialNumber}}"
      bays:
        - bayNumber: 1
          programNumbers: [1]
        - bayNumber: 2
          programNumbers: [1]
        - bayNumber: 3
          programNumbers: [1]
        - bayNumber: 4
          programNumbers: [1]
      uptimeSeconds: 0
      pendingOfflineTransactions: 0
      timezone: "Europe/Bucharest"
      bootReason: "PowerOn"
      # deviceManagementSupported — see e2e-new-customer-onboarding.yaml for the full
      # note. Short form: `POST …/catalog/publish` below dispatches UpdateServiceCatalog,
      # a Device Management action, and a station that never declared the profile is
      # pre-empted with 409 / 6008 COMMAND_PRE_EMPTED (details.wouldBe 2007, reason
      # device_management_not_declared) before anything is published. The check is shared
      # by both catalog entry points (UpdateServiceCatalogAction.php:215-233), so this is
      # as required now as it was for the old push. Measured on UAT 2026-08-13.
      capabilities:
        bleSupported: false
        offlineModeSupported: false
        meterValuesSupported: true
        deviceManagementSupported: true
      networkInfo:
        connectionType: "Ethernet"

  - action: wait_for
    message: BootNotification
    messageType: Response
    timeout_ms: 15000

  - action: assert
    field: "payload.status"
    equals: "Accepted"

  # Heartbeat keep-alive. Scenario-mode stations don't auto-heartbeat
  # (BootNotificationHandler autoReact=false), but a real station would. This
  # run (~123s) outlives the csms 3.5x30=105s application-silence window: only an
  # actual Heartbeat refreshes the server's HeartbeatTracker
  # (Status/MeterValues/SessionEnded do NOT), so without this the
  # station:check-heartbeats sweep marks the station offline mid-run — the
  # second session's start sits only ~4s under the threshold (latently flaky) and
  # its stop lands past it. Heartbeat at the server's 30s interval; torn down on
  # disconnect.
  - action: start_heartbeat
    interval_sec: 30

  # No clock-skew delay here any more — csms-server 21f18c4 moved the ordering
  # floor onto `last_status_reported_at`; see scenario A for the full note.
  # Proven on UAT 2026-07-31 with the delay removed: stn_764ec888, all 4 bays
  # `available`, watermark populated.

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_1}}"
      bayNumber: 1
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_2}}"
      bayNumber: 2
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_3}}"
      bayNumber: 3
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_4}}"
      bayNumber: 4
      status: "Available"
      programs:
        - programNumber: 1
          available: true
  # =========================================================================
  # Operator: configure the catalog on the server, then publish it to the
  # device — create x4, bind x4, publish. Replaces the single `PUT …/catalog`
  # this file carried until 2026-08-15. Only the publish touches the wire; the
  # first eight calls are synchronous and need no device. Prices are
  # 10/15/20/25 credits/minute, unchanged from the old push.
  #
  # THIS FILE IS THE ONE THAT CARES WHERE THE PRICE IS WRITTEN. Its subject is
  # that the second session reads what the first left behind — and pricing now
  # arrives synchronously at create, not at the end of the MQTT round-trip. If
  # persistence were non-idempotent across the two sessions, this is still where
  # it would show: same rows, read twice, an entire wash apart.
  # =========================================================================

  # `serviceId` is honoured as of csms-server 99cab60 — it used to be discarded
  # unread, which is why the binding and the push could never name the same
  # service. The `expect_body` is what goes red if that is ever reverted; every
  # `service_id` this file sends afterwards, twice, depends on it.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      serviceId: "{{serviceId_1}}"
      serviceName: "Basic Wash"
      serviceKind: "UserDuration"
      pricingType: "PerMinute"
      priceCreditsPerMinute: 10
      available: true
    expect_status: 201
    expect_body:
      data.serviceId: "{{serviceId_1}}"
    # The station_services UUID, NOT the serviceId — the binding route is keyed
    # by it and nothing else in the response identifies the row.
    capture:
      station_service_1: "data.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      serviceId: "{{serviceId_2}}"
      serviceName: "Premium Wash"
      serviceKind: "UserDuration"
      pricingType: "PerMinute"
      priceCreditsPerMinute: 15
      available: true
    expect_status: 201
    expect_body:
      data.serviceId: "{{serviceId_2}}"
    capture:
      station_service_2: "data.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      serviceId: "{{serviceId_3}}"
      serviceName: "Dry"
      serviceKind: "UserDuration"
      pricingType: "PerMinute"
      priceCreditsPerMinute: 20
      available: true
    expect_status: 201
    expect_body:
      data.serviceId: "{{serviceId_3}}"
    capture:
      station_service_3: "data.id"

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      serviceId: "{{serviceId_4}}"
      serviceName: "Vacuum"
      serviceKind: "UserDuration"
      pricingType: "PerMinute"
      priceCreditsPerMinute: 25
      available: true
    expect_status: 201
    expect_body:
      data.serviceId: "{{serviceId_4}}"
    capture:
      station_service_4: "data.id"

  # ---------- Operator: bind each service to the program it runs ----------
  # `bayId` is the SERVER-assigned wire id captured by ProvisionStep.
  # `programNumber: 1` is checked against `bay_programs` as the station declared
  # them at provisioning; an undeclared ordinal is refused 422 / 3017 here rather
  # than at every wash. The echoed `bayNumber` is what pins service N to bay N —
  # a binding naming the wrong bay would answer 201 and leave `withheld` empty.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services/{{captured.station_service_1}}/binding"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      bayId: "{{captured.bayId_1}}"
      programNumber: 1
    expect_status: 201
    expect_body:
      binding.bayNumber: 1
      binding.programNumber: 1

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services/{{captured.station_service_2}}/binding"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      bayId: "{{captured.bayId_2}}"
      programNumber: 1
    expect_status: 201
    expect_body:
      binding.bayNumber: 2
      binding.programNumber: 1

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services/{{captured.station_service_3}}/binding"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      bayId: "{{captured.bayId_3}}"
      programNumber: 1
    expect_status: 201
    expect_body:
      binding.bayNumber: 3
      binding.programNumber: 1

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/services/{{captured.station_service_4}}/binding"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    body:
      bayId: "{{captured.bayId_4}}"
      programNumber: 1
    expect_status: 201
    expect_body:
      binding.bayNumber: 4
      binding.programNumber: 1

  # ---------- Operator: publish the server's catalog to the device ----------
  # No body — the route takes none and ignores anything posted, which is exactly
  # why the legacy push's kind guard has nothing to refuse here.
  #
  # `withheld: []` is the assertion `expect_status: 202` cannot make. Publish
  # does not refuse a catalog over an unbound service — it ships what is sellable
  # and NAMES the rest — so dropping any one binding step above leaves this the
  # ONLY red in the file: bays 2, 3 and 4 are never sold to below, and this
  # scenario would run both its sessions on bay 1 without noticing. Inverting the
  # verdict is one deleted binding step. `serviceCount: 4` catches the other
  # direction (a create deleted, not a binding), and counts only rows this
  # scenario created on a station and org it created.
  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/admin/stations/{{stationId}}/catalog/publish"
    headers:
      X-Organization-Id: "{{captured.organization_id}}"
    expect_status: 202
    expect_body:
      serviceCount: 4
      withheld: []

  - action: wait_for
    message: UpdateServiceCatalog
    messageType: Request
    # Aligned with global default bump (5s → 15s, commit 9e57ce2). Sprint B2
    # timeout sweep — CSMS catalog-update issue during E2E onboarding can
    # exceed 5s; sister scenario from Sprint B P5.1/P5.11 fix (commit 3fdc7a6).
    timeout_ms: 15000
    capture:
      catalog_msg_id: "messageId"

  - action: send
    message: UpdateServiceCatalog
    messageType: Response
    correlationId: "{{captured.catalog_msg_id}}"
    payload:
      status: "Accepted"

  # Drain Boot + 4 StatusNotifications + catalog Response — see scenario A
  # for the empirical timing (single-threaded MqttConsume at ~5s/msg).
  - action: delay
    ms: 35000

  # ========== FIRST SESSION ==========

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{captured.bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 60
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      session_id_1: "payload.sessionId"
      start_msg_id_1: "messageId"

  - action: send
    message: StartService
    messageType: Response
    correlationId: "{{captured.start_msg_id_1}}"
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_1}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 500

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId_1}}"
      sessionId: "{{captured.session_id_1}}"
      timestamp: "2026-05-12T16:00:00.000Z"
      values:
        liquidMl: 500
        energyWh: 100

  # 20s drain — see scenario A for timing.
  - action: delay
    ms: 20000

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/{{captured.session_id_1}}/stop"
    expect_status: 200

  - action: wait_for
    message: StopService
    messageType: Request
    timeout_ms: 10000
    capture:
      stop_msg_id_1: "messageId"

  - action: send
    message: StopService
    messageType: Response
    correlationId: "{{captured.stop_msg_id_1}}"
    payload:
      status: "Accepted"
      actualDurationSeconds: 60
      creditsCharged: 10
      meterValues:
        liquidMl: 500
        energyWh: 100

  # Station reports the bay returning to Available after session #1 completes.
  # Without this, /sessions/start #2 will see bay.status=Occupied → 409.
  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_1}}"
      bayNumber: 1
      status: "Available"
      previousStatus: "Occupied"
      programs:
        - programNumber: 1
          available: true
  # Drain StopService Response (→ session.status=completed) +
  # StatusNotification Available (→ bay.status=available).
  - action: delay
    ms: 15000

  # ========== SECOND SESSION (returning customer) ==========

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/start"
    background: true
    body:
      bay_id: "{{captured.bayId_1}}"
      service_id: "{{serviceId_1}}"
      duration_seconds: 60
    expect_status: 201

  - action: wait_for
    message: StartService
    messageType: Request
    timeout_ms: 15000
    capture:
      session_id_2: "payload.sessionId"
      start_msg_id_2: "messageId"

  - action: send
    message: StartService
    messageType: Response
    correlationId: "{{captured.start_msg_id_2}}"
    payload:
      status: "Accepted"

  - action: send
    message: StatusNotification
    messageType: Event
    payload:
      bayId: "{{captured.bayId_1}}"
      bayNumber: 1
      status: "Occupied"
      previousStatus: "Available"
      programs:
        - programNumber: 1
          available: false
  - action: delay
    ms: 500

  - action: send
    message: MeterValues
    messageType: Event
    payload:
      bayId: "{{captured.bayId_1}}"
      sessionId: "{{captured.session_id_2}}"
      timestamp: "2026-05-12T16:10:00.000Z"
      values:
        liquidMl: 750
        energyWh: 150

  - action: delay
    ms: 20000

  - action: api_call
    method: POST
    url: "{{target_url}}/api/v1/sessions/{{captured.session_id_2}}/stop"
    expect_status: 200

  - action: wait_for
    message: StopService
    messageType: Request
    timeout_ms: 10000
    capture:
      stop_msg_id_2: "messageId"

  - action: send
    message: StopService
    messageType: Response
    correlationId: "{{captured.stop_msg_id_2}}"
    payload:
      status: "Accepted"
      actualDurationSeconds: 60
      creditsCharged: 10
      meterValues:
        liquidMl: 750
        energyWh: 150
